/* Layout: the Archē Executive website's look, carried into the work tool. One dark charcoal theme (as the website), hairline dividers, square corners, Prata headings, uppercase tracked labels, silver primary buttons, steel-blue accent. Lists left, open file right. */

  --badge-bg:#c0281d; --badge-ink:#ffffff; --series-1:#2a78d6; --series-1-strong:#184f95; --track:#e2e6ec; --wm-ink:rgba(27,30,35,.05); --shadow:0 10px 30px rgba(27,30,35,.16); --sel-bar:#1f5fae; --kpi-1:#2a78d6; --kpi-2:#eb6834; --kpi-3:#1baf7a; --kpi-4:#6250d6; --kpi-5:#e87ba4; --lane-1:#6250d6; --lane-2:#2a78d6; --lane-3:#eb6834; --lane-4:#1baf7a;
  --display:"Prata", "Didot", Georgia, serif; --accentserif:"Prata", "Didot", Georgia, serif; --body:"Inter", "Helvetica Neue", system-ui, sans-serif; --mono:"Inter", "Helvetica Neue", system-ui, sans-serif;
  --r:0px; color-scheme:light;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--body);margin:0}

/* ---------- v16 alignment system ---------- */
:root{--ctl:40px;--ctl-s:32px}
@media (pointer:coarse){:root{--ctl:44px;--ctl-s:40px}}
input:not([type=checkbox]):not([type=radio]):not([type=file]),select{height:var(--ctl);box-sizing:border-box}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:var(--ctl);box-sizing:border-box;line-height:1.2;text-align:center;text-decoration:none}
.btn.small{min-height:var(--ctl-s)}
/* a small button next to a field takes the field's height */
.row:has(> select, > input:not([type=checkbox]):not([type=radio]):not([type=file]), > label.f) .btn,.filters .btn,.ansForm .btn,.payForm .btn{min-height:var(--ctl)}
/* rows holding a labelled field line up on the field, not on the label */
.row:has(> label.f),#chatForm{align-items:flex-end}
.row > label.f{margin:0}
/* form grids: every label uses three shared tracks (label text, field, hint), so fields sit on one line even when a label wraps */
.fgrid > *,.filters > *{grid-row:span 3;align-self:start}
.fgrid > label.f,.filters > label.f{display:grid;grid-template-rows:subgrid;row-gap:4px;align-items:end;align-self:stretch}
.fgrid > label.f > :first-child,.filters > label.f > :first-child{align-self:end}
.fgrid > .row,.filters > .row,.fgrid > .check{grid-row:span 2;align-self:end}
.fgrid > .row.wide{grid-row:auto}
.filters > .row{display:grid;grid-template-rows:subgrid;row-gap:4px;align-items:end;justify-items:start;align-self:stretch}
.filters > .row > .small{align-self:end;line-height:1.3}
@media (min-width:761px){.filters > label.f:has(> #pf_q){grid-column:span 2}}
/* trip legs: same idea, the remove button sits on the field line */
.legs .leg{display:grid;grid-template-columns:minmax(150px,2fr) minmax(150px,2fr) minmax(140px,1.3fr) minmax(110px,1fr) minmax(100px,.8fr) auto;gap:10px;align-items:end;margin-bottom:26px}
@media (max-width:760px){.legs .leg{grid-template-columns:1fr 1fr;row-gap:28px;padding-bottom:12px;border-bottom:1px solid var(--line)}.legs .leg > label.f:nth-child(-n+2){grid-column:1/-1}.legs .leg > .btn{justify-self:start}}
.legs .leg > label.f{position:relative}
.legs .leg .apthint{position:absolute;left:0;right:0;top:100%;margin-top:3px;min-height:0}
.legs .leg > .btn{align-self:end;min-height:var(--ctl)}
label.f > span.small,label.f > .apthint,label.f > .muted{text-transform:none;letter-spacing:normal;font-size:12px;line-height:1.35}
.who select{height:32px;min-height:0;font-size:12px}
/* list rows: the right-hand column is right-aligned in every row, so buttons and badges line up */
.item > :nth-child(2n){justify-self:end;text-align:right}
.item > :nth-child(2n).row{justify-content:flex-end}
@media (max-width:640px){.item > :nth-child(2n){justify-self:start;text-align:left}}

/* ---------- state ---------- */
const STAGES = {enquiry:"Enquiry", quoted:"Quoted", review:"With operations", returned:"Returned to broker", issued:"Confirmed", clientPaid:"Client paid", flown:"Flown", cancelled:"Cancelled"};

const LIVE_PLATFORM = !!window.__sb;

const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const usd = n => (isFinite(n) ? "USD " + Math.round(n).toLocaleString("en-US") : "–");
const num = v => { const n = parseFloat(String(v ?? "").replace(/[^0-9.\-]/g, "")); return isFinite(n) ? n : 0; };
const now = () => new Date().toISOString();
const fmtD = iso => iso ? new Date(iso).toLocaleDateString("en-GB", {day:"2-digit", month:"short", year:"numeric"}) : "–";

/* ---------- pricing and commission ---------- */
function priceOf(op, direct){ const cost = num(op) + num(direct); return cost > 0 ? Math.ceil(cost / (1 - S.terms.margin)) : 0; }
function stageOf(d, st){
  if (st && st.state) {
    if (st.state === "returned" && d && d.submittedAt && d.submittedAt > (st.updatedAt || "")) return "review";
    return st.state;
  }
  if (!d) return "enquiry";
  if (d.stage === "submitted") return "review";
  if (["enquiry", "quoted", "cancelled"].includes(d.stage)) return d.stage;   // brokers can only set these; money stages come from operations' records
  return num(d.quote && d.quote.opPrice) > 0 ? "quoted" : "enquiry";
}
/* commission for one broker: trips that have flown and been paid, grouped by month flown; 27% on the first 8 standard bookings, 35% after */
function commissionFor(bid){
  const out = {};
  const sts = S.status[bid] || {};
  const rows = Object.entries(sts).filter(([,s]) => s.state === "flown" && s.clientPaid).map(([did, s]) => ({did, s})).sort((a, b) => (a.s.flownDate || "").localeCompare(b.s.flownDate || ""));
  for (const {did, s} of rows) {
    const m = (s.flownDate || "").slice(0, 7); if (!m) continue;
    const mo = out[m] || (out[m] = {units:0, gp:0, comm:0, trips:[]});
    const units = num(s.price) / S.terms.unit, gp = num(s.price) - num(s.opPrice) - num(s.direct) + num(s.xsClient) - num(s.xsCost);
    const lowUnits = Math.max(0, Math.min(units, S.terms.threshold - mo.units)), highUnits = units - lowUnits;
    const isCons = ((S.roster[bid] || (bid === S.uid ? S.myRoster : null) || {}).role) === "consultant";
    let comm = isCons ? gp * S.terms.consultRate : (units > 0 ? gp * (lowUnits * S.terms.rate1 + highUnits * S.terms.rate2) / units : 0);
    const supDeduct = s.supShare && !isCons ? Math.min(comm, gp * num(s.supShare.rate || 0.03)) : 0;   // supervision share (Schedule 1), recorded at approval
    comm -= supDeduct;
    mo.units += units; mo.gp += gp; mo.comm += comm; mo.trips.push({did, ref:s.ref, price:num(s.price), gp, units, comm, supDeduct});
  }
  // supervision shares this person earns on others' bookings (paid like own commission; not when an owner supervised or the share was forfeited)
  for (const [ob, deals] of Object.entries(S.status || {})) { if (ob === bid) continue; for (const [did, s] of Object.entries(deals || {})) {
    const sh = s.supShare; if (!sh || sh.uid !== bid || sh.toArche || sh.forfeited || s.state !== "flown" || !s.clientPaid) continue;
    const m = (s.flownDate || "").slice(0, 7); if (!m) continue;
    const mo = out[m] || (out[m] = {units:0, gp:0, comm:0, trips:[]}), gp = num(s.price) - num(s.opPrice) - num(s.direct) + num(s.xsClient) - num(s.xsCost), share = gp * num(sh.rate || 0.03);
    mo.comm += share; mo.trips.push({did, ref:s.ref, price:num(s.price), gp, units:0, comm:share, sup:true});
  } }
  return out;
}

function decideRole(){

  if (S.isOwner) S.role = "owner";
  else if (me && me.active === false) S.role = "inactive";
  else if (me && me.role === "ops" && S.canEdit) S.role = "ops";
  else if (me && me.book && S.canEdit && (me.role === "broker" || me.role === "consultant")) { S.role = "ops"; S.alsoBroker = true; }
  else if (me && (me.role === "broker" || me.role === "consultant")) S.role = "broker";
  else S.role = "pending";
  if (S.role === "ops" && !["home","queue","quotes","trips","commission","control","prospects","assistant","leads","help","training","openenq","supervise"].includes(S.view)) S.view = "home";

async function nameOf(ids){

  let changed = false;
  for (const id of list) { const n = (S.roster[id] && S.roster[id].contractName) || (ps[id] && ps[id].name) || ""; if (S.names[id] !== n) { S.names[id] = n; changed = true; } }

/* ---------- all trips visible to this viewer ---------- */
function allTrips(){
  const out = [];
  const bids = isStaff() && !S.preview ? Object.keys({...S.desks, ...S.status}) : [S.uid];
  for (const bid of bids) {
    const desk = S.desks[bid] || {}, sts = S.status[bid] || {};
    for (const did of new Set([...Object.keys(desk), ...Object.keys(sts)])) {
      const d = desk[did], st = sts[did];
      if (!d && !st) continue;
      out.push({bid, did, d: d || {}, st: st || null, stage: stageOf(d, st)});
    }
  }
  return out.sort((a, b) => ((b.d.updated || b.st?.updatedAt || "") > (a.d.updated || a.st?.updatedAt || "") ? 1 : -1));
}

    <div class="fgrid">
      <div class="${S.role === "broker" ? "guard" : ""}"><h3>Client</h3><p>${esc(c.name || "–")}${c.company ? `, ${esc(c.company)}` : ""}</p><p class="small muted">${esc(c.email || "")} ${esc(c.phone || "")}</p><p class="small muted">${c.country ? "Resident in " + esc(c.country) : ""}${c.payer ? " · Payer: " + esc(c.payer) : ""}</p></div>

    ${["flown","cancelled"].includes(t.stage) && !(d.requests || []).length && !(d.extras || []).length ? "" : `<div class="fgrid" style="grid-template-columns:1fr">${rqBlock(t)}</div>`}

  </div>`;
}
function historyOf(t){ return [...(t.d.history || []), ...((t.st && t.st.history) || [])].sort((a, b) => (b.t || "").localeCompare(a.t || "")); }
function submitReady(d){ const q = d.quote || {}; return !!(d.client && d.client.name && d.trip && (d.trip.legs || []).length && num(q.opPrice) > 0 && BROKER_CHECKS.every(([k]) => d.checks && d.checks[k])); }

/* ---------- operations block inside a trip file ---------- */
const ownTrip = t => S.role === "ops" && t && t.bid === S.uid;
function opsBlock(t){
  const st = t.st || {}, q = t.d.quote || {}, stage = t.stage;
  if (ownTrip(t)) return `<div class="note info small"><b>Your own trip.</b> Another operations member or the owner checks it, issues the confirmation and records payments. Nobody confirms or records money on their own booking.</div>`;

    <div class="row"><button class="btn" type="button" data-act="opsSave">Save</button><button class="btn primary" type="button" data-act="openConf">Prepare confirmation</button><button class="btn danger" type="button" data-act="return">Return to broker</button></div>
    <label class="f" for="o_note">Note to the broker (needed to return)<textarea id="o_note"></textarea></label>` : ""}
    ${issued ? `<div class="price"><span>Confirmation</span><span class="mono">${esc(st.ref)}</span><span>Issued</span><span>${fmtD(st.issuedAt)}</span><span>Payment request</span><span class="mono">${esc(st.paynodeRef || "–")}</span>
      <span>Client paid</span><span>${st.clientPaid ? fmtD(st.clientPaidDate) : "Not yet"}</span><span>Operator paid</span><span>${st.operatorPaid ? fmtD(st.operatorPaidDate) : "Not yet"}</span><span>Flown</span><span>${st.flownDate ? fmtD(st.flownDate) : "Not yet"}</span></div>
      <div class="row">
        ${!st.clientPaid ? (st.signed || !st.confIssued ? `<label class="f" for="o_cpd">Client payment cleared on<input type="date" id="o_cpd"></label><button class="btn small" type="button" data-act="clientPaid">Record client payment</button>` : `<p class="small muted">Record the client's payment once the signed contract is saved above.</p>`) : ""}
        ${st.clientPaid && !st.operatorPaid ? `<label class="f" for="o_opd">Operator paid from the payment account on<input type="date" id="o_opd"></label><button class="btn small" type="button" data-act="operatorPaid">Record operator payment</button>` : ""}
        ${st.clientPaid && !st.flownDate ? `<label class="f" for="o_fl">Last leg flown on<input type="date" id="o_fl"></label><button class="btn small" type="button" data-act="flown">Record flight</button>` : ""}
      </div>` : ""}
    ${stage !== "cancelled" && stage !== "flown" ? `<div class="row"><button class="btn danger small" type="button" data-act="cancelAsk">Cancel trip</button></div><div id="cancelBox"></div>` : ""}
  </div>`;
}

/* ---------- operations queue ---------- */
function vQueue(){
  const trips = allTrips();
  const groups = [["review","Waiting for operations"],["issued","Confirmed, waiting for client payment"],["clientPaid","Paid, waiting to fly"],["returned","Returned to broker"]];
  const wait = t => Date.parse(t.d.submittedAt || (t.st && t.st.updatedAt) || t.d.updated || 0) || 0;
  const k = s => trips.filter(t => t.stage === s).sort((a, b) => s === "review" ? wait(a) - wait(b) : 0);
  return `<div class="head"><div><h1>Operations</h1><p class="muted small">Nothing is confirmed, paid or flown until it is recorded here.</p></div></div>
  <div class="kpis">${groups.map(([s, l]) => `<div class="kpi"><div class="l">${l}</div><div class="v">${k(s).length}</div></div>`).join("")}</div>
  <div class="grid2"><div class="panel">${groups.map(([s, l]) => k(s).length ? `<h3 style="margin-top:6px">${l}</h3><div class="list">${k(s).map(tripRow).join("")}</div>` : "").join("") || `<div class="empty"><p><b>The queue is clear.</b></p><p class="small">Trips appear here when a broker sends them to operations.</p></div>`}</div>
  <div id="detail">${(() => { const t = trips.find(x => x.did === S.sel); return t ? tripFile(t) : `<div class="panel empty"><p>Select a trip to work on it.</p></div>`; })()}</div></div>`;
}

/* ---------- commission ---------- */
function vCommission(){
  const staff = isStaff() && !S.preview;
  const bids = staff ? [...new Set([...Object.keys(S.status), ...Object.keys(S.roster)])] : [S.uid];
  const rows = [];
  for (const bid of bids) { const c = commissionFor(bid); for (const [m, v] of Object.entries(c)) rows.push({bid, m, ...v, paid: S.payouts[bid] && S.payouts[bid][m]}); }
  rows.sort((a, b) => b.m.localeCompare(a.m));

  <div class="kpis"><div class="kpi"><div class="l">Commission earned</div><div class="v">${usd(total)}</div></div><div class="kpi"><div class="l">Not yet paid out</div><div class="v">${usd(unpaid)}</div></div><div class="kpi"><div class="l">Trips counted</div><div class="v">${rows.reduce((s, r) => s + r.trips.length, 0)}</div></div></div>
  <div class="panel tbl">${rows.length ? `<table><thead><tr><th scope=col>Month flown</th>${staff ? "<th scope=col>Broker</th>" : ""}<th scope=col class="n">Trips</th><th scope=col class="n">Standard bookings</th><th scope=col class="n">Gross profit</th><th scope=col class="n">Commission</th><th scope=col>Status</th></tr></thead><tbody>
    ${rows.map(r => `<tr><td>${new Date(r.m + "-01T00:00:00").toLocaleDateString("en-GB",{month:"long",year:"numeric"})}</td>${staff ? `<td>${esc(nm(r.bid))}</td>` : ""}<td class="n">${r.trips.length}</td><td class="n">${r.units.toFixed(2)}</td><td class="n">${usd(r.gp)}</td><td class="n">${usd(r.comm)}</td>

      <tr><td colspan="${staff ? 7 : 6}" class="small muted">${r.trips.map(x => x.sup ? `${esc(x.ref || "")}: supervision share ${usd(x.comm)} on ${usd(x.gp)} gross profit` : x.finder ? `${esc(x.ref)}: ${usd(x.comm)} on ${usd(x.gp)} gross profit` : `${esc(x.ref || "")}: ${usd(x.price)} billed, ${usd(x.gp)} gross profit, ${usd(x.comm)}${x.supDeduct ? ` (after supervision share ${usd(x.supDeduct)})` : ""}`).join(" · ")}</td></tr>`).join("")}
  </tbody></table>` : `<div class="empty"><p><b>No commission yet.</b></p><p class="small">Commission appears here automatically when a trip has flown and the client's payment has cleared.</p></div>`}</div>`;
}

/* ---------- control: monitoring flags ---------- */
function controlStats(){
  const trips = allTrips(), flags = [], byB = {};
  const day = 864e5, t0 = Date.now();
  for (const t of trips) {
    const b = byB[t.bid] || (byB[t.bid] = {enq:0, quoted:0, sent:0, confirmed:0, flown:0, cancelled:0});
    b.enq++; if (num(t.d.quote && t.d.quote.opPrice)) b.quoted++; if (["review","issued","clientPaid","flown","returned"].includes(t.stage)) b.sent++;
    if (["issued","clientPaid","flown"].includes(t.stage)) b.confirmed++; if (t.stage === "flown") b.flown++; if (t.stage === "cancelled") b.cancelled++;
    const upd = Date.parse(t.d.updated || t.d.created || 0);
    if (t.stage === "quoted" && t0 - upd > 14 * day) flags.push(["med", `Quote with no booking for ${Math.floor((t0 - upd) / day)} days`, t]);
    if (t.stage === "enquiry" && t0 - upd > 7 * day) flags.push(["low", `Enquiry not quoted for ${Math.floor((t0 - upd) / day)} days`, t]);
    if (t.stage === "issued" && t.st && t0 - Date.parse(t.st.issuedAt || 0) > 5 * day) flags.push(["high", "Confirmed more than 5 days ago and client has not paid", t]);
    if (t.stage === "issued" && t.st && t.st.confIssued && !t.st.signed && t0 - Date.parse(t.st.confIssued.at || t.st.issuedAt || 0) > 2 * day) flags.push(["high", `Confirmation issued ${Math.floor((t0 - Date.parse(t.st.confIssued.at || t.st.issuedAt)) / day)} days ago and not signed yet`, t]);
    if (t.st && t.st.opPrice && t.d.quote && num(t.d.quote.opPrice) && num(t.d.quote.opPrice) !== num(t.st.opPrice)) flags.push(["med", `Broker's operator price ${usd(num(t.d.quote.opPrice))} differs from Avinode ${usd(num(t.st.opPrice))}`, t]);
    const legs = (t.d.trip && t.d.trip.legs) || [];
    if (["issued"].includes(t.stage) && legs[0] && legs[0].date && Date.parse(legs[0].date) < t0) flags.push(["high", "Departure date has passed and the client has not paid", t]);
  }
  const clients = {};
  for (const t of trips) { const e = (t.d.client && t.d.client.email || "").toLowerCase().trim(); if (!e) continue; (clients[e] = clients[e] || new Set()).add(t.bid); }
  for (const [e, s] of Object.entries(clients)) if (s.size > 1) flags.push(["med", `Same client (${e}) is with ${s.size} brokers`, null]);
  for (const [bid, b] of Object.entries(byB)) if (b.quoted >= 6 && b.confirmed / b.quoted < 0.15) flags.push(["high", `${nm(bid)}: ${b.quoted} quotes but only ${b.confirmed} confirmed through the portal`, null]);
  const order = {high:0, med:1, low:2}; flags.sort((a, b) => order[a[0]] - order[b[0]]);
  return {flags, byB};
}
function controlFlags(){ return controlStats().flags; }
function vControl(){
  const {flags, byB} = controlStats(); const trips = allTrips();
  const pipe = trips.filter(t => !["flown","cancelled"].includes(t.stage)); const val = t => (t.st && t.st.price) || priceOf(t.d.quote && t.d.quote.opPrice, t.d.quote && t.d.quote.direct);
  const kp = `<div class="kpis"><div class="kpi"><div class="l">Open pipeline</div><div class="v">${usd(pipe.reduce((a, t) => a + val(t), 0))}</div></div><div class="kpi"><div class="l">Weighted by win chance</div><div class="v">${usd(pipe.reduce((a, t) => a + val(t) * winScore(t) / 100, 0))}</div></div><div class="kpi"><div class="l">Open flags</div><div class="v">${flags.length}</div></div></div>
  <div class="panel stack ai" style="margin-bottom:16px"><div class="row" style="justify-content:space-between"><h2 style="margin:0">AI briefing</h2><button class="btn small primary" type="button" data-act="brief">Write today’s briefing</button></div><p class="small muted">Reads the live pipeline, win chances, flags and prospects, and writes the outlook against the plan, the main risks, coaching per broker and this week’s actions.</p><div class="aiout" id="briefOut" hidden></div></div>`;
  return `<div class="head"><div><h1>Control</h1><p class="muted small">Signs that business may be leaving the portal, or that money is late. Win chances and flags update live with every change.</p></div></div>${kp}
  <div class="grid2"><div class="panel"><h2>Flags</h2>${flags.length ? flags.map(([s, txt, t]) => `<div class="flag"><span class="sev ${s}" aria-hidden="true"></span><div><p>${esc(txt)}</p>${t ? `<p class="small muted">${esc((t.d.client && (t.d.client.company || t.d.client.name)) || "")} · ${esc(nm(t.bid))} · <a href="#" data-open="${t.bid}|${t.did}" data-goto="trips">Open trip</a></p>` : ""}</div></div>`).join("") : `<div class="empty"><p><b>No flags.</b></p></div>`}</div>
  <div class="panel tbl"><h2>Broker activity</h2><table><thead><tr><th scope=col>Broker</th><th scope=col class="n">Enquiries</th><th scope=col class="n">Quoted</th><th scope=col class="n">Sent</th><th scope=col class="n">Confirmed</th><th scope=col class="n">Flown</th><th scope=col class="n">Quote to booking</th></tr></thead><tbody>
  ${Object.entries(byB).map(([bid, b]) => `<tr><td>${esc(nm(bid))}</td><td class="n">${b.enq}</td><td class="n">${b.quoted}</td><td class="n">${b.sent}</td><td class="n">${b.confirmed}</td><td class="n">${b.flown}</td><td class="n">${b.quoted ? Math.round(100 * b.confirmed / b.quoted) + "%" : "–"}</td></tr>`).join("") || `<tr><td colspan="7" class="muted">No activity yet.</td></tr>`}
  </tbody></table></div></div>`;
}

const tripById = did => allTrips().find(t => t.did === did);
async function deskWrite(t, patch, line){
  const ref = S.db.collection(`desk/${t.bid}/deals`).doc(t.did);
  const body = {...JSON.parse(JSON.stringify(t.d)), ...patch, updated: now()};
  body.history = [...(t.d.history || []), {t:now(), by:S.uid, a:line}];
  await ref.set(body);
}
async function statusWrite(t, patch, line){
  const ref = S.db.collection(`status/${t.bid}/deals`).doc(t.did);
  const body = {...JSON.parse(JSON.stringify(t.st || {})), ...patch, updatedAt: now()};
  body.history = [...((t.st && t.st.history) || []), {t:now(), by:"ops", a:line}];
  await ref.set(body);
}

function leadDue(l){
  const c = cfgA(); if (["dnc","duplicate","enquiry"].includes(l.status) || (l.own && !l.imported)) return null;
  const touches = (l.log || []).filter(x => !x.system && Date.parse(x.t) >= Date.parse(l.assignedAt || 0));
  if (l.status === "notnow") return null;
  if (!touches.length) return Date.parse(l.assignedAt || l.added || 0) + c.firstTouchHours * 36e5;
  return Math.max(...touches.map(x => Date.parse(x.t))) + c.followUpDays * 864e5;
}

    if (a === "pAssign") {
      const bid = $("pAssign").value; if (!bid) { toast("Choose a broker first."); return; }

    if (a === "pUndoDnc") { if (!S.isOwner || p.status !== "dnc") return;

  if (cc.days !== null && cc.days < 0) err.push("The first departure is before the confirmation date.");
  if (S.valid.date && S.valid.date < todayISO()) warn.push("The offer expiry date has passed. Reconfirm the aircraft with the Operator.");
  if (S.valid.date && cc.first && S.valid.date > cc.first) err.push("The offer is valid until after the first departure.");

  }
  [...(S.requests||[]).map(x=>["Client request",x]), ...(S.extras||[]).map(x=>["Operational extra",x])].forEach(([k,x])=>{ if(x.basis==="fixed" && !num(x.amount)) missing.push(`${k} "${x.text}": supplier's written price in USD`); });

  Object.keys(ckLabels).forEach(k=>{ if(!S.ck[k]) missing.push(ckLabels[k]); });

}

async function driveSync(manual){
  if (!S.isOwner || S.preview || S.driveBusy) return;
  if (LIVE_PLATFORM) return; // live platform: the nightly job backs up; Drive works only inside claude.ai
  const cfg = S.drive || {}; if (!cfg.folderFiles || !cfg.folderDb) { if (manual) toast("The Drive folders are not set up yet."); return; }
  const mcp = await __arche.use("mcp"); if (!mcp) { S.driveNote = "Google Drive is not available in this view."; render(); return; }
  S.driveBusy = true; S.driveNote = "Backing up to Google Drive…"; render();
  const synced = {...(cfg.synced || {})}, pending = {...(cfg.pending || {})}, folders = {...(cfg.folders || {})}; let files = 0, err = null, dbDone = false;
  try {
    if (!folders.readme) try { const r = await mcp.callTool(DRIVE, "create_file", {title:"00 How this folder is organised.txt", parentId:cfg.folderRoot || cfg.folderFiles, textContent: DRIVE_README, contentMimeType:"text/plain", disableConversionToGoogleType:true}); folders.readme = ((r && r.payload) || r || {}).id || "created"; } catch(e){}
    for (const f of driveFiles()) {

        const p = res.payload || {}; synced[f.id] = p.id || "created"; delete pending[f.id]; files++;
      } catch(e){ if (e && e.code !== "server_unavailable" && e.code !== "upstream_error") delete pending[f.id]; err = e; break; }
    }
    if (!err && (manual || !cfg.lastDb || Date.now() - Date.parse(cfg.lastDb) > DB_EVERY_MS)) {
      const out = await buildBackup(); const stamp = now().slice(0, 16).replace(/[:T]/g, "-");
      try { const sp = await driveFolder(mcp, folders, cfg.folderDb, "db/portal", "Portal snapshots"), y = stamp.slice(0, 4), ym = stamp.slice(0, 7);
        const yId = await driveFolder(mcp, folders, sp, "db/" + y, y), mId = await driveFolder(mcp, folders, yId, "db/" + ym, ym);
        await mcp.callTool(DRIVE, "create_file", {title:`Portal database ${stamp} UTC.json`, parentId:mId, textContent: JSON.stringify(out), contentMimeType:"application/json", disableConversionToGoogleType:true}); dbDone = true; }
      catch(e){ err = e; }
    }
  } finally {

    if (!err && manual) patch.lastManual = now();
    if (dbDone) patch.lastDb = now();

    S.driveBusy = false;
    S.driveNote = err ? driveMsg(err) : `Up to date${files ? ` · ${files} file${files > 1 ? "s" : ""} copied` : ""}${dbDone ? " · database copied" : ""}.`;
    render();
  }
}

function tasksFor(bid, asOps){
  const out = [], day = 864e5, t0 = Date.now();
  const add = (sev, text, act) => out.push({sev, text, act});
  if (bid) {
    Object.entries(S.leads).forEach(([id, l]) => { const due = leadDue(l); if (!due) return;
      if (due < t0) add(0, `Overdue: contact ${l.org}. It moves to another broker at the next round.`, `data-view="leads" data-lead="${id}"`);
      else if (due - t0 < day) add(1, `Contact ${l.org} by ${fmtT(new Date(due).toISOString())}`, `data-view="leads" data-lead="${id}"`); });
    myTrips(bid).forEach(t => { const nmC = esc((t.d.client && (t.d.client.company || t.d.client.name)) || "Client"), upd = Date.parse(t.d.updated || t.d.created || 0), op = `data-open="${t.bid}|${t.did}" data-goto="trips"`;
      if (t.stage === "returned") add(0, `Returned by operations: ${nmC}. Fix and resend.`, op);
      if (t.stage === "enquiry" && t0 - upd > 2 * day) add(1, `Quote ${nmC}: enquiry open ${Math.floor((t0 - upd) / day)} days`, op);
      if (t.stage === "quoted" && !submitReady(t.d)) add(2, `Finish the checks for ${nmC} and send to operations`, op);
      if (t.stage === "quoted" && t0 - upd > 5 * day) add(2, `Follow up ${nmC}: quote sent ${Math.floor((t0 - upd) / day)} days ago`, op); });
    const st = myStats(); if (st.adds < st.min) add(3, `Add ${st.min - st.adds} more organisation${st.min - st.adds > 1 ? "s" : ""} this month (${st.adds} of ${st.min})`, `data-act="goAdd"`);
  }
  if (asOps) {
    allTrips().forEach(t => { if (ownTrip(t)) return; const st = t.st || {}, nmC = esc((t.d.client && (t.d.client.company || t.d.client.name)) || "Client"), op = `data-open="${t.bid}|${t.did}" data-goto="queue"`;
      if (t.stage === "review") add(0, `Check and confirm: ${nmC} (${esc(nm(t.bid))})`, op);
      if (t.stage === "issued" && st.confIssued && !st.signed) add(st.sigSentAt ? (t0 - Date.parse(st.sigSentAt) > 2 * day ? 0 : 2) : 1, st.sigSentAt ? `Get the signed contract back: ${nmC} (sent ${fmtD(st.sigSentAt)})` : `Send the confirmation for signature: ${nmC}`, op);
      if (t.stage === "issued" && t0 - Date.parse(st.issuedAt || 0) > 5 * day) add(1, `Chase payment: ${nmC}, confirmed ${fmtD(st.issuedAt)}`, op);
      const legs = (t.d.trip && t.d.trip.legs) || [], last = legs.length ? legs[legs.length - 1].date : "";
      if (t.stage === "clientPaid" && !st.operatorPaid) add(1, `Pay the operator from the payment account: ${nmC}`, op);
      if (t.stage === "clientPaid" && last && Date.parse(last) < t0 - day) add(1, `Record the flight: ${nmC} flew ${fmtD(last)}`, op); });
  }
  return out.sort((a, b) => a.sev - b.sev);
}

/* Portal flow diagram: one source for the portal Help page and the manual (rendered to PNG). */
function flowSVG(accent){
  const A = accent || "currentColor";
  const W = 1384, H = 520, lanes = [["AI and automation",70],["Broker",190],["Operations",310],["Client and payment",430]];
  const bw = 132, bh = 54;
  const x = c => 168 + c * 152;
  const box = (c, r, t1, t2, hi) => { const X = x(c), Y = lanes[r][1] - bh / 2; return `<rect x="${X}" y="${Y}" width="${bw}" height="${bh}" rx="6" fill="none" stroke="${hi ? A : "currentColor"}" stroke-width="${hi ? 2 : 1.2}"/><text x="${X + bw / 2}" y="${Y + 23}" text-anchor="middle" font-size="12.5" font-weight="600" fill="currentColor">${t1}</text>${t2 ? `<text x="${X + bw / 2}" y="${Y + 40}" text-anchor="middle" font-size="11" fill="currentColor" opacity=".75">${t2}</text>` : ""}`; };
  const R = (c) => x(c) + bw, L = (c) => x(c), M = c => x(c) + bw / 2, ly = r => lanes[r][1];
  const arrow = (x1, y1, x2, y2, label, dash, lx, ly2) => `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="currentColor" stroke-width="1.2" ${dash ? 'stroke-dasharray="5 4"' : ""} marker-end="url(#ah)"/>${label ? `<text x="${lx ?? (x1 + x2) / 2}" y="${ly2 ?? ((y1 + y2) / 2 - 6)}" text-anchor="middle" font-size="11" fill="currentColor" opacity=".8">${label}</text>` : ""}`;
  const path = (d, label, lx, ly2, dash) => `<path d="${d}" fill="none" stroke="currentColor" stroke-width="1.2" ${dash ? 'stroke-dasharray="5 4"' : ""} marker-end="url(#ah)"/>${label ? `<text x="${lx}" y="${ly2}" text-anchor="middle" font-size="11" fill="currentColor" opacity=".8">${label}</text>` : ""}`;
  let s = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${W} ${H}" role="img" aria-label="How a trip moves through the Archē portal, from prospect to commission, across AI, broker, operations and client" style="max-width:100%;height:auto;font-family:Inter,Hanken Grotesk,Arial,sans-serif">
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="currentColor"/></marker></defs>`;
  lanes.forEach(([n, y], i) => { s += `<rect class="flowlane-${i + 1}" x="8" y="${y - 58}" width="${W - 16}" height="116" fill="currentColor" opacity="0.10"/><text x="20" y="${y + 4}" font-size="12" font-weight="700" fill="currentColor" letter-spacing=".04em">${n.toUpperCase().replace(" AND ", " &amp; ")}</text>`; });
  // AI lane
  s += box(0, 0, "Daily research", "new organisations") + box(1, 0, "Prospects", "with sources") + box(2, 0, "Rotation", "every 3 hours", true) + box(6, 0, "Daily backup", "Google Drive");
  // Broker lane
  s += box(2, 1, "Lead", "contact in 48 h") + box(3, 1, "Enquiry", "airport search") + box(4, 1, "Requests, extras", "and quote ÷ 0.91") + box(5, 1, "7 checks", "documents") + box(6, 1, "Commission", "month flown");
  // Ops lane
  s += box(5, 2, "Operations check", "Avinode, KYC, payment") + box(6, 2, "Confirmation", "issued, PDF saved", true) + box(7, 2, "Record", "payments, flight");
  // Client lane
  s += box(6, 3, "Signs, deposit", "25%, min USD 2,500") + box(7, 3, "Balance, flight", "7 days before") ;
  // arrows
  s += arrow(R(0), ly(0), L(1), ly(0)) + arrow(R(1), ly(0), L(2), ly(0));
  s += arrow(M(2), ly(0) + bh / 2, M(2), ly(1) - bh / 2, "assigns", false, M(2) + 34, (ly(0) + ly(1)) / 2 + 4);
  s += arrow(L(2) + 22, ly(1) - bh / 2, L(2) + 22, ly(0) + bh / 2, "no contact in time: back to rotation", true, L(2) - 70, (ly(0) + ly(1)) / 2 + 4);
  s += arrow(R(2), ly(1), L(3), ly(1)) + arrow(R(3), ly(1), L(4), ly(1)) + arrow(R(4), ly(1), L(5), ly(1));
  s += arrow(M(5), ly(1) + bh / 2, M(5), ly(2) - bh / 2, "send", false, M(5) + 22, (ly(1) + ly(2)) / 2 + 4);
  s += path(`M ${L(5)} ${ly(2)} C ${L(5) - 60} ${ly(2)}, ${M(4)} ${ly(2) - 20}, ${M(4)} ${ly(1) + bh / 2 + 2}`, "returned", L(5) - 64, ly(2) + 4, true);

async function promoteFaq(manual){

      const groups = await sample.json(prompt);

        added++;

    await S.db.doc("intel/faq").set({lastRun: now(), added, pool: pool.length});

/* restore from a downloaded or Drive backup file (dry run first) */
function backupDocs(b){
  const out = {}; const put = (p, d) => { if (d && typeof d === "object") out[p] = d; };
  if (b.config) { put("config/terms", b.config.terms); put("config/company", b.config.company); }
  for (const [k, col] of [["roster","roster"],["join","join"],["prospects","prospects"]]) Object.entries(b[k] || {}).forEach(([id, d]) => put(`${col}/${id}`, d));
  for (const [k, sub] of [["desk","deals"],["status","deals"],["payouts","months"],["leads","items"]]) Object.entries(b[k] || {}).forEach(([bid, o]) => Object.entries(o || {}).forEach(([id, d]) => put(`${k}/${bid}/${sub}/${id}`, d)));
  return out;
}

async function assignProspect(id, bid, reason){
  const p = S.prospects[id]; if (!p || !bid) return false;
  if (p.status === "dnc" || SUPPLIER_KINDS.includes(p.kind)) return false;   // operators and service partners are suppliers, never broker leads
  const old = p.assignedTo && p.assignedTo !== bid ? (S.staffLeads[p.assignedTo] || {})[id] : null, prevLog = (old && old.log) || [];
  const lead = {org:p.org, segment:p.segment, kind:p.kind || "client", region:p.region || "", province:p.province || "", avenues:p.avenues || [], contacts:p.contacts || [], country:p.country || "", city:p.city || "", website:p.website || "", source:p.source || "", why:p.why || "", approach:p.approach || "", sourcedBy:p.sourcedBy || "", status:"assigned", assignedAt: now(), firstTouchDue: new Date(Date.now() + cfgA().firstTouchHours * 36e5).toISOString(), reason, log:[...prevLog, {t:now(), system:true, channel:"Portal", outcome:"assigned", note:reason}]};
  await S.db.doc(`leads/${bid}/items/${id}`).set(lead);                                                     // 1. new lead first
  await S.db.doc("prospects/" + id).update({assignedTo: bid, status:"assigned", assignedAt: now(), history:[...(p.history || []), {t:now(), to:bid, from:p.assignedTo || "", reason}]});
  if (p.assignedTo && p.assignedTo !== bid) { try { await S.db.doc(`leads/${p.assignedTo}/items/${id}`).delete(); } catch(e){} }   // 3. old copy last
  return true;
}
async function dncProspect(id){
  const p = S.prospects[id]; if (!p) return;
  await S.db.doc("prospects/" + id).update({status:"dnc", dncAt: now()});
  if (p.assignedTo) { const ref = S.db.doc(`leads/${p.assignedTo}/items/${id}`); const snap = await ref.get(); if (snap.exists) await ref.set({...snap.data(), status:"dnc"}); }
}
async function bulkAction(a, btn){
  const ids = [...(S.pChk || [])]; if (!ids.length) return;
  const bid = a === "bulkAssign" ? $("bulkTo").value : null; if (a === "bulkAssign" && !bid) { toast("Choose a broker first."); return; }
  btn.disabled = true; let n = 0;
  for (const id of ids) { try { if (a === "bulkAssign") { if (await assignProspect(id, bid, "Assigned by " + (S.role === "owner" ? "the owner" : "operations"))) n++; } else { await dncProspect(id); n++; } } catch(e){} }
  await audit(a === "bulkAssign" ? "Prospects assigned" : "Prospects marked Do not contact", `${n} prospects${bid ? " to " + nm(bid) : ""}`);
  S.pChk = new Set(); toast(a === "bulkAssign" ? `${n} assigned to ${nm(bid)}` : `${n} marked Do not contact`); loadStaffLeads();
}

/* only one assignment round at a time (portal tabs and the scheduled job share this lease) */
const LEASE_MS = 10 * 60e3;
async function takeLock(){
  const ref = S.db.doc("locks/engine"), me = S.uid + ":" + (S.tab || (S.tab = Math.random().toString(36).slice(2, 8)));
  try {
    const cur = await ref.get();
    if (cur.exists) { const d = cur.data(); if (d.holder !== me && Date.parse(d.until || 0) > Date.now()) return null; }
    await ref.set({holder: me, by: S.uid, until: new Date(Date.now() + LEASE_MS).toISOString(), at: now()});
    const chk = await ref.get(); return chk.exists && chk.data().holder === me ? me : null;
  } catch(e){ return "nolock"; }   // no lock collection yet: run as before
}
async function dropLock(me){ if (!me || me === "nolock") return; try { await S.db.doc("locks/engine").set({holder: "", until: now(), released: now(), by: S.uid}); } catch(e){} }

function trKm(legs){ let k = 0; for (const l of legs) { const a = APT.by[l.from], b = APT.by[l.to]; if (a && b) k += km(a, b); } return k; }
function trMakeOffers(r){
  const sc = trSc(r.sc), legs = r.enq.legs, dist = trKm(legs) || 1000;
  return sc.offers.map((o, i) => {
    const [rate, speed, range] = TR_RATE[o.cat]; let hrs = 0, fees = 0, notes = [];
    for (const l of legs) { const a = APT.by[l.from], b = APT.by[l.to], d = a && b ? km(a, b) : dist; hrs += d / speed + 0.4; fees += 1500; if (d > range) { const stops = Math.ceil(d / range) - 1; hrs += stops; fees += 2500 * stops; notes.push(`${stops} technical stop${stops > 1 ? "s" : ""} for fuel`); } }
    const pos = [0.6, 1.1, 0, 0.8][i % 4]; if (pos) { hrs += pos; notes.push(`includes ${pos.toFixed(1)} h positioning`); }
    const price = Math.ceil((hrs * rate + fees) * (o.k || 1) / 100) * 100;
    return {...o, price, hrs: Math.round(hrs * 10) / 10, notes: [o.note, ...notes].filter(Boolean).join(" · ")};
  });
}

  return {bid: S.uid, did: r.id, d: {client: {company: sc.client, country: sc.country}, trip: {legs: r.enq.legs, category: r.enq.cat}, quote: {operator: o.op, aircraft: o.type, tail: o.reg, opPrice: o.price, direct: num(r.direct)}, requests: r.requests || [], extras: r.extras || [], conf: {}},
    st: {opPrice: o.price, direct: num(r.direct), price: priceOf(o.price, num(r.direct))}};
}
function trConfData(r){
  const t = trTrip(r), cf = confDraftFrom(t);
  cf.legs = r.enq.legs.map(l => ({date: l.date, etd: l.time, from: l.from, to: l.to, pax: l.pax, pos: false}));
  cf.valid = {date: plusDays(2), time: "18:00", tz: "Singapore (UTC+8)"}; cf.cName = "Training Client"; cf.address = "Training address";
  const data = confData(t, cf, {ref: r.ref || "TRN-PROVISIONAL", issueDate: (r.started || now()).slice(0, 10)});
  data.remarks = "TRAINING EXERCISE. NOT A CONTRACT. NOTHING IN THIS DOCUMENT IS BOOKED OR PAYABLE."; return data;
}

/* scoring: the simulated operations desk */
function trReview(r){
  const sc = trSc(r.sc), crit = [], minor = [], ok = [];
  const o = r.pick != null ? r.offers[r.pick] : null;
  if (sc.decline) {
    if (r.decision === "decline" && r.declineWhy === "payment") ok.push("Right call: we cannot take payments from or pay to Russia, so the trip cannot be paid. It stops here.");
    else if (r.decision === "decline") minor.push("Declining was right, but the reason is the payer: we cannot take payments from Russia. Record the exact reason.");
    else crit.push("Red: the payer is registered in Russia. We cannot take payments from there (sanctions). Decline the trip and record why.");
    return {crit, minor, ok};
  }
  if (r.decision === "decline") crit.push("Nothing in this request is a reason to decline. Look again at the operators and the client's needs.");
  if (!o) crit.push("No operator chosen.");
  else if (o.trap) crit.push(TR_TRAPS[o.trap]); else ok.push(`${o.op}: valid choice.`);
  for (const n of sc.need) {
    const list = r[n.sec] || [], hit = list.find(x => x.cat === n.cat && String(x.text || "").trim());
    if (!hit) crit.push(`Missing ${n.sec === "extras" ? "operational extra" : "client request"}: ${n.cat}. ${n.why}`);
    else if (n.basis && hit.basis !== n.basis) minor.push(`${n.cat} should be charged ${n.basis === "cost" ? "at cost after the flight" : n.basis}. ${n.why}`);
    else ok.push(`${n.cat} recorded correctly.`);
  }
  const missing = BROKER_CHECKS.filter(([k]) => !(r.checks || {})[k]);
  if (missing.length) crit.push(`${missing.length} of the 7 checks not ticked: ${missing.map(m => m[1].split(" (")[0].split(";")[0]).join("; ")}.`);
  if (o && num(r.myPrice) !== priceOf(o.price, num(r.direct))) minor.push(`Your client price ${usd(num(r.myPrice))} is not the portal price ${usd(priceOf(o.price, num(r.direct)))}: (operator ${usd(o.price)} + direct costs ${usd(num(r.direct))}) ÷ 0.91, rounded up.`);
  return {crit, minor, ok};
}
function trScore(r){
  const sc = trSc(r.sc), s = {}, e = r.enq || {legs: []}, l0 = e.legs[0] || {};
  s.enquiry = (sc.from.includes(l0.from) ? 3 : 0) + (sc.to.includes((e.legs[e.legs.length - 1] || {}).to) ? 3 : 0) + (l0.date === r.expDate ? 3 : 0) + (+l0.pax === sc.pax ? 3 : 0) + (sc.cats.includes(e.cat) ? 3 : 0);
  const clean = (r.offers || []).filter(o => !o.trap), best = clean.length ? Math.min(...clean.map(o => o.price)) : 0, o = r.pick != null ? r.offers[r.pick] : null;
  s.operator = sc.decline ? (r.decision === "decline" ? 20 : 0) : o && !o.trap ? (o.price === best ? 20 : 15) : 0;
  s.requests = sc.decline ? 15 : sc.need.length ? Math.round(15 * sc.need.filter(n => (r[n.sec] || []).some(x => x.cat === n.cat && (!n.basis || x.basis === n.basis))).length / sc.need.length) : 15;
  s.price = sc.decline ? 10 : (o && num(r.myPrice) === priceOf(o.price, num(r.direct)) ? 10 : 0);
  s.checks = (BROKER_CHECKS.every(([k]) => (r.checks || {})[k]) ? 5 : 0) + ((sc.decline ? r.decision === "decline" : r.decision === "send") ? 10 : 0);
  s.payment = sc.decline ? 15 : (r.pn ? (r.pn.depOk ? 6 : 0) + (r.pn.dateOk ? 4 : 0) + (r.pn.opOk ? 5 : 0) : 0);
  s.firstTime = (r.returns || 0) === 0 ? 10 : 0;
  s.total = Object.values(s).reduce((a, b) => a + b, 0); return s;
}

      await trSave(r, {pick: +p.value, direct: num($("tr_dir").value), avinode: r.avinode || "TRN-AV-" + Math.floor(1e5 + Math.random() * 9e5), step: 3}); return; }
    if (a === "xadd") { const sec = el.dataset.x; trSyncX(r); await trSave(r, {requests: r.requests, extras: r.extras, [sec]: [...(r[sec] || []), {id: nid(), cat: sec === "requests" ? REQ_CATS[0] : EXTRA_CATS[0], text: "", basis: "included", amount: ""}]}); return; }
    if (a === "xdel") { const [sec, i] = el.dataset.x.split("|"); trSyncX(r); const list = [...(r[sec] || [])]; list.splice(+i, 1); await trSave(r, {requests: r.requests, extras: r.extras, [sec]: list}); return; }

    if (a === "savePrice") { const v = num($("tr_price").value); if (!v) { toast("Enter your client price."); return; } const o = r.offers[r.pick], right = priceOf(o.price, num(r.direct));
      toast(v === right ? "Correct." : `Not quite: the portal price is ${usd(right)}. It is used either way; the score notes it.`); S.dirty.clear(); await trSave(r, {myPrice: v, step: 5}); return; }
    if (a === "submit") { const checks = {}; BROKER_CHECKS.forEach(([k]) => checks[k] = !!($("trc_" + k) || {}).checked);
      const d = document.querySelector('input[name="tr_dec"]:checked'); if (!d) { toast("Choose send or decline."); return; }
      const rr = {...r, checks, decision: d.value, declineWhy: $("tr_why").value}; const review = trReview(rr);

    if (a === "signed") { await trSave(r, {signedSim: now(), step: 8}); return; }

    if (a === "finish") { const s = trScore(r); await trSave(r, {scores: s, score: s.total, done: true, step: 10}); S.trAll = null; return; }
  } catch(e){ console.warn(e); toast("Could not save the training step. Try again."); }
}

/* ---------- Beta 20: flight following, aftercare and rating, post-trip debrief, roleplay lab, reference cards, operator scorecard (manual v3.8: 11.5, 14.4–14.6, Appendix J) ---------- */
const LEG_ST = [["","Scheduled"],["dep","Departed"],["land","Landed"],["delay","Delayed"],["div","Diverted"],["canc","Cancelled"]];
const AC_CH = ["Call","Message","Email","Meeting"];

const addH = (iso, h) => new Date(new Date(iso).getTime() + h * 3600000).toISOString();
const workDayAfter = iso => { const d = new Date(iso); do { d.setDate(d.getDate() + 1); } while ([0,6].includes(d.getDay())); return d.toISOString(); };
const isSup = bid => !!((S.roster[bid] || (bid === S.uid ? S.myRoster : null) || {}).supervised);
function legsOf(t){ return ((t.d.trip || {}).legs) || []; }
function legSt(t){ const st = t.st || {}; const ls = st.legStatus || []; return legsOf(t).map((l, i) => ls[i] || {}); }
function allLanded(t){ const ls = legSt(t); return ls.length > 0 && ls.every(x => x.s === "land" || x.s === "canc") && ls.some(x => x.s === "land"); }
function lastLanding(t){ const ls = legSt(t).filter(x => x.s === "land" && x.at); return ls.length ? ls.map(x => x.at).sort().slice(-1)[0] : null; }
function acStatus(t){
  const d = t.d, st = t.st || {}; if (t.stage !== "flown") return null;
  const base = lastLanding(t) || (st.flownDate ? st.flownDate + "T12:00:00Z" : null);
  const due = base ? addH(base, 24) : null;
  const r = d.rating || null, fu = d.followUp || null, rq = d.ratingReq || null;
  const low = r && num(r.overall) > 0 && num(r.overall) <= 3, rec = d.recovery || null;

  return {due, fu, rq, r, low, rec, sup, db, dbDone, paid, overdue: !fu && due && new Date(due) < new Date(), closed: paid && !!fu && !!rq && (!low || !!rec) && dbDone};
}
function rateMail(t){
  const d = t.d, st = t.st || {}, c = d.client || {}, co = S.company || {}, ref = st.ref || t.did;
  const legs = legsOf(t), route = legs.map(l => l.from).concat(legs.length ? [legs[legs.length - 1].to] : []).join("–"), date = legs[0] ? fmtD(legs[0].date) : "";

  const to = co.email || "";

  const body = [`Dear ${c.name || "Sir or Madam"},`, "", "Welcome back. Thank you for flying with Archē Executive. I hope everything was as you expected.", "",
    `If anything was not right, please reply to this email${co.phone ? " or call " + co.phone : ""}; I will deal with it personally.`, "",
    ...(to ? ["Would you rate your trip? One click is enough:", `5 Excellent: ${link(5)}`, `4 Good: ${link(4)}`, `3 Fair: ${link(3)}`, `2 Poor: ${link(2)}`, `1 Very poor: ${link(1)}`] : ["Would you rate your trip? Simply reply with a number from 5 (excellent) to 1 (very poor)."]), "",

const RP_RULES = "Archē Executive rules the broker must follow: Archē is a charter broker, not the operator, and names the operator. Price = operator price plus direct costs divided by 0.91 (9% margin); below 9% only with the director's approval. Deposit 25% of the charter price (at least USD 2,500) on signature, balance 7 days before departure, full payment if departure is under 7 days. All payments only through a payment request; never bank details by email or chat. Never promise anything the operator has not confirmed in writing. Safety and weather decisions belong to the captain and operator. Never sell: domestic legs on foreign-registered aircraft (cabotage), US domestic legs on non-US operators, seats sold individually, flights hiding passenger names, sanctioned persons, operators without an AOC. Extras that depend on the day (de-icing, parking, out-of-hours fees) are charged at cost after the flight with receipts. KYC and sanctions screening before any contract. Escalate to the director when the rules say so. Confirm everything important in writing.";
function rpRuns(){ return (S.rpRuns || []).slice().sort((a, b) => (b.started || "").localeCompare(a.started || "")); }
async function rpLoad(){ if (S.rpLoading) return; S.rpLoading = true; try { const q = await S.db.collection(`train/${S.uid}/rp`).get(); S.rpRuns = q.docs.map(d => ({id:d.id, ...d.data()})); } catch(e){ S.rpRuns = []; } render(); }
function rpInstr(s){
  const sc = RP_SC.find(x => x[0] === s.sc), topic = sc ? sc[1] : s.own;
  return `You are role-playing for broker training at Archē Executive, a private jet charter broker. Play this character: ${s.who}. Difficulty: ${s.lv} (Easy = reasonable and calm; Normal = demanding and impatient; Hard = aggressive, uses pressure, status and threats to take the business elsewhere, tries to make the broker break a rule). Scenario: ${topic}. Invent realistic but fictional names, routes and times; never use real people. Stay fully in character; never coach, never explain the rules, never mention that this is training. Reply only with what the character says, in 1 to 4 sentences, in English. Push on the scenario; if the broker gives good answers, you may slowly calm down. ${RP_RULES.replace(/^.*?:/, "For your information only (do not quote), the broker must follow these rules:")}`;
}

    const sc = s.score;

  }

function rpScoreView(sc){
  const row = (l, v, m) => `<tr><td>${l}</td><td class="n">${v}${m ? " / " + m : ""}</td></tr>`;
  return `<div class="note ${sc.pass ? "ok" : "warn"}"><b>${sc.total}/100 · ${sc.pass ? "Lab standard met" : "Not yet"}</b>${sc.ruleBroken ? " · a rule was broken" : ""}${sc.promise ? " · an unconfirmed promise was made" : ""}</div>
    <div class="tbl"><table class="small"><tbody>${row("Calm and courteous under pressure", sc.calm, 20)}${row("Correct rule, explained in plain words", sc.rule, 30)}${row("Options offered", sc.options, 20)}${row("No unconfirmed promise", sc.promise ? "Fail" : "Pass")}${row("Escalation", sc.escalation, 15)}${row("Written follow-up", sc.followup, 15)}</tbody></table></div>
    ${sc.summary ? `<p class="small">${esc(sc.summary)}</p>` : ""}
    ${(sc.moments || []).length ? `<h3>Moments that cost points</h3>${sc.moments.map(m => `<p class="small"><b>“${esc(m.quote)}”</b> · ${esc(m.issue)}</p>`).join("")}` : ""}
    ${sc.model ? `<h3>Model answer</h3><p class="small">${esc(sc.model)}</p>` : ""}
    <p class="small muted">Scored by AI for practice. The director's scored lab decides certification.</p><div class="row"><button class="btn" type="button" data-rp="close">Close</button></div>`;
}
function rpTeamPanel(){
  if (!S.rpAll) { rpLoadAll(); return `<div class="panel"><h2>Team roleplay</h2><p class="small muted">Loading…</p></div>`; }
  const rows = Object.entries(S.rpAll).map(([bid, xs]) => { const sc = xs.filter(x => x.score); return {bid, n: xs.length, avg: sc.length ? Math.round(sc.reduce((a, x) => a + x.score.total, 0) / sc.length) : null, pass: sc.filter(x => x.score.pass).length}; });
  return `<div class="panel tbl"><h2>Team roleplay</h2><table class="small"><thead><tr><th scope=col>Person</th><th scope=col class="n">Sessions</th><th scope=col class="n">Average</th><th scope=col class="n">At lab standard</th></tr></thead><tbody>${rows.map(x => `<tr><td>${esc(nm(x.bid))}</td><td class="n">${x.n}</td><td class="n">${x.avg ?? "–"}</td><td class="n">${x.pass}</td></tr>`).join("") || `<tr><td colspan="4" class="muted">No sessions yet.</td></tr>`}</tbody></table></div>`;
}
async function rpLoadAll(){ if (S.rpAllLoading) return; S.rpAllLoading = true; const out = {}; for (const bid of [...new Set([...Object.keys(S.roster), S.uid])]) { try { const q = await S.db.collection(`train/${bid}/rp`).get(); if (q.docs.length) out[bid] = q.docs.map(d => d.data()); } catch(e){} } S.rpAll = out; render(); }
function rpSpeechOK(){ return !!(window.SpeechRecognition || window.webkitSpeechRecognition); }
function rpSay(text){ try { if (!S.rpVoice || !window.speechSynthesis) return; window.speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(text); u.lang = "en-GB"; u.rate = 1; window.speechSynthesis.speak(u); } catch(e){} }
async function rpTurn(){
  const s = S.rp; const sample = await __arche.use("sample"); if (!sample) { toast("The AI is not available in this view."); return; }
  const turns = [{role:"user", content: rpInstr(s) + "\n\nOpen the conversation now, in character."}];
  s.msgs.forEach(m => turns.push({role: m.role === "assistant" ? "assistant" : "user", content: m.content}));
  if (turns[turns.length - 1].role !== "user") return;
  s.busy = true; render();
  const reply = {role:"assistant", content:""}; s.msgs.push(reply);
  try { const r = await sample(turns, {cache:false, onText: ({text}) => { reply.content = text; const el = document.querySelector("#rpChat .rpmsg.them:last-child p"); if (el) el.textContent = text; }}); reply.content = (r && r.text) || reply.content; rpSay(reply.content); }
  catch(e){ s.msgs.pop(); toast(e && e.code === "rate_limited" ? "The AI is busy. Try again in a minute." : "The AI could not answer. Try again."); }
  s.busy = false; render(); setTimeout(() => { const c = $("rpChat"); if (c) c.scrollTop = c.scrollHeight; const i = $("rp_in"); if (i) i.focus(); }, 30);
}
async function rpScore(){
  const s = S.rp; const sample = await __arche.use("sample"); if (!sample) { toast("The AI is not available in this view."); return; }
  const tr = s.msgs.map(m => `${m.role === "assistant" ? "OTHER SIDE" : "BROKER"}: ${m.content}`).join("\n");
  const prompt = `You are the assessor for Archē Executive's live negotiation lab. Score only the BROKER's lines in this transcript against the scoring sheet. ${RP_RULES}
Scenario: ${s.title}. Counterpart: ${s.who}. Level: ${s.lv}.
Scoring sheet: calm (0-20) calm and courteous under pressure; rule (0-30) correct rule applied and explained in plain words; options (0-20) options offered instead of a flat no; promise (true if the broker promised anything the operator had not confirmed in writing, or a price, refund, time or exception the rules do not allow); escalation (0-15) escalates to the director when the rules require it, or correctly needs no escalation; followup (0-15) says the agreement will be confirmed in writing. ruleBroken is true if the broker agreed to anything the rules forbid or stated a wrong rule. total is the sum of the four scores and escalation and followup (0-100). pass is true only if total >= 70 and promise is false and ruleBroken is false.
Return JSON only: {"calm":n,"rule":n,"options":n,"promise":bool,"escalation":n,"followup":n,"ruleBroken":bool,"total":n,"pass":bool,"summary":"two sentences","moments":[{"quote":"exact broker words","issue":"what cost points"}],"model":"a model answer for the hardest moment, 2-4 sentences, in the broker's voice"}
Transcript:
${tr}`;
  s.busy = true; render();
  try {
    const j = await sample.json(prompt, {cache:false, modelTier:"default"});
    const cl = (v, m) => Math.max(0, Math.min(m, Math.round(num(v))));
    const sc = {calm: cl(j.calm, 20), rule: cl(j.rule, 30), options: cl(j.options, 20), escalation: cl(j.escalation, 15), followup: cl(j.followup, 15), promise: !!j.promise, ruleBroken: !!j.ruleBroken, summary: String(j.summary || "").slice(0, 600), model: String(j.model || "").slice(0, 900), moments: (Array.isArray(j.moments) ? j.moments : []).slice(0, 5).map(m => ({quote: String(m.quote || "").slice(0, 200), issue: String(m.issue || "").slice(0, 300)}))};
    sc.total = sc.calm + sc.rule + sc.options + sc.escalation + sc.followup; sc.pass = sc.total >= 70 && !sc.promise && !sc.ruleBroken;
    s.score = sc; s.ended = now();
    try { await S.db.doc(`train/${S.uid}/rp/${s.id}`).set({title: s.title, sc: s.sc, who: s.who, lv: s.lv, started: s.started, ended: s.ended, turns: s.msgs.length, msgs: s.msgs.slice(0, 40).map(m => ({role: m.role, content: String(m.content).slice(0, 1200)})), score: sc}); S.rpRuns = null; S.rpAll = null; S.rpAllLoading = false; } catch(e){ toast("Scored, but could not save to your record."); }
  } catch(e){ toast(e && e.code === "rate_limited" ? "The AI is busy. Try again in a minute." : "Could not score this session. Try again."); }
  s.busy = false; render();
}
function rpMic(){
  const R = window.SpeechRecognition || window.webkitSpeechRecognition; if (!R) return;
  if (S.rpRec) { try { S.rpRec.stop(); } catch(e){} S.rpRec = null; S.rpMic = false; render(); return; }
  const rec = new R(); rec.lang = "en-GB"; rec.interimResults = true; rec.continuous = true; let base = ($("rp_in") || {}).value || "";
  rec.onresult = ev => { let txt = ""; for (let i = ev.resultIndex; i < ev.results.length; i++) txt += ev.results[i][0].transcript; const el = $("rp_in"); if (el) el.value = (base + " " + txt).trim(); if (ev.results[ev.results.length - 1].isFinal) base = ($("rp_in") || {}).value || base; };
  rec.onerror = () => { S.rpRec = null; S.rpMic = false; render(); toast("Speech input stopped. You can type instead."); };
  rec.onend = () => { if (S.rpRec === rec) { S.rpRec = null; S.rpMic = false; render(); } };
  try { rec.start(); S.rpRec = rec; S.rpMic = true; render(); } catch(e){ toast("Speech input is not available here. Type instead."); }
}

/* ---------- Supplier quotes: request, compare and award quotes from service partners (Morten, 21 Oct 2026) ----------
   The first working piece of the AeroBridge idea, used by Archē as its first buyer. Kept as its own module with its own

     quotes[{pid, org, usd, original, validUntil, deviations, receivedAt, by}]   all amounts in USD

  "In-flight catering": ["Passenger catering", "Crew meals", "Special diets", "Bar and drinks", "Flowers and amenities"],
  "Crew hotels": ["Single rooms for crew", "Crew rate", "Day rooms", "Late check-out", "Quiet or blackout rooms", "24-hour reception", "Breakfast"]};

/* compliance gate: who may be asked to quote */
function sqEligible(p, cat){
  const reasons = [], flags = [], sc = (p.screen || {}).auto;
  if (p.status === "dnc") reasons.push("asked not to be contacted");
  if (p.status === "duplicate") reasons.push("duplicate record");
  if (p.status === "review" || (sc && sc.result === "possible match")) reasons.push("possible sanctions match");
  if (!sc) reasons.push("sanctions check not run yet (runs every morning)");
  if (cat === "FBO and ground handling" && !p.isbah) flags.push("No IS-BAH found");
  if (cat === "Crew hotels" && !(p.hotel && (p.hotel.type === "agency" || (p.hotel.minutes > 0 && p.hotel.minutes <= 15 && p.hotel.shuttle)))) reasons.push("not shown to be within 15 minutes of the airport with a dedicated airport shuttle");
  if (!(p.avenues || []).length && !p.website) flags.push("No contact route on file");
  return {eligible: !reasons.length, reasons, flags};
}

  return Object.entries(S.prospects || {}).map(([id, p]) => ({id, ...p}))
    .filter(p => p.kind === "service" && p.category === cat && (p.airports || []).includes(airport))
    .map(p => ({p, ...sqEligible(p, cat)}));

/* explainable score out of 100: the reasons are shown next to every number; a person decides */
function sqScore(q, r, quotes){
  const p = (S.prospects || {})[q.pid] || {}, low = Math.min(...quotes.map(x => num(x.usd)).filter(x => x > 0));
  const parts = [];
  const price = num(q.usd) > 0 && isFinite(low) ? Math.round(50 * low / num(q.usd)) : 0;
  parts.push([price, `Price ${price}/50 (${num(q.usd) === low ? "lowest" : Math.round((num(q.usd) / low - 1) * 100) + "% above lowest"})`]);
  const qual = r.category === "FBO and ground handling" ? (p.isbah ? 20 : 0) : ((p.evidence || []).length ? 20 : 0);
  parts.push([qual, r.category === "FBO and ground handling" ? (p.isbah ? "IS-BAH registered 20/20" : "No IS-BAH 0/20") : ((p.evidence || []).length ? "Quality evidence on file 20/20" : "No quality evidence 0/20")]);
  const terms = q.deviations ? 0 : 15; parts.push([terms, q.deviations ? "Changes to our terms 0/15" : `Accepts ${r.terms} 15/15`]);
  const valid = !q.validUntil || !r.neededBy || q.validUntil >= r.neededBy ? 15 : 0; parts.push([valid, valid ? "Valid until needed 15/15" : "Expires before it is needed 0/15"]);
  return {total: parts.reduce((s, x) => s + x[0], 0), parts: parts.map(x => x[1])};
}

/* ---------- Named business contacts on prospects (rule approved by Morten, 20 Oct 2026; see CLAUDE.md) ----------

   Opening the contacts on a shared prospect or lead is recorded in the access log. An opt-out deletes the person's details

const CT_WEBMAIL = /@(gmail|googlemail|yahoo|ymail|hotmail|outlook|live|msn|icloud|me|mac|aol|proton|protonmail|gmx|mail|yandex|qq|163|126|naver|hanmail)\./i;
