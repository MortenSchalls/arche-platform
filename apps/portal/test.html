const AGR_MAIN = "<h2>1. Parties and definitions</h2>\n<p>This agreement is made on the date of the last signature in Schedule 3 between:</p>\n<ol><li><b>Arche Executive Pte. Ltd.</b>, a company incorporated in Singapore (UEN {{UEN}}), whose registered office is at {{OFFICE}}, trading as “Archē Executive” (<b>Archē</b>); and</li><li><b>the person or company named in Schedule 2</b> (the <b>Consultant</b>).</li></ol>\n<p><b>Background.</b> Archē arranges private jet charter flights for clients as their broker, using licensed aircraft operators. Archē wishes to engage the Consultant, on a commission-only and independent basis, to find and look after clients, and the Consultant wishes to provide those services from outside Singapore and Thailand.</p>\n<p><b>Definitions.</b> In this agreement:</p>\n<ul><li><b>Booking</b> means one charter transaction for a client under a charter agreement that Archē has approved and issued, covering every flight in it, whether a single flight, a multi-leg trip or a long-term charter, together with all the work in clause 3.1 from first enquiry to final settlement.</li><li><b>Completed Booking</b> means a Booking in which every flight has been operated and landed, the client has paid in full and the payment has cleared in Archē’s account, all extras and items at cost have been invoiced and settled, the operator and suppliers have been paid, and the Consultant has finished the after-flight follow-up and recorded everything in the Portal.</li><li><b>Client Price</b> means the total price the client pays Archē for a Booking, excluding taxes, items invoiced at cost and refunds.</li><li><b>Gross Profit</b> means the Client Price less the amount Archē pays the aircraft operator and the direct costs of the trip.</li><li><b>Standard Booking</b> means a Booking value of USD 45,000 of Client Price; Bookings are counted by value as set out in Schedule 1.</li><li><b>Portal</b> means Archē’s online broker portal, or any system that replaces it.</li><li><b>Registered Client</b> means a client or prospect recorded in the Portal as the Consultant’s lead, in line with clause 7.3.</li><li><b>Operating Rules</b> means the Archē Broker Academy, the Portal guide and the written rules Archē issues for brokers, as updated from time to time.</li><li><b>Territory</b> means the countries in which the Consultant lives and works, as stated in Schedule 2.</li></ul>\n<h2>2. Appointment and independent status</h2>\n<p><b>2.1 Appointment.</b> Archē engages the Consultant on a non-exclusive basis to introduce clients to Archē and to support those clients through their Bookings, on the terms of this agreement.</p>\n<p><b>2.2 Independent contractor.</b> The Consultant is an independent contractor and not an employee, worker, partner or joint venturer of Archē. Nothing in this agreement creates an employment relationship. The Consultant decides their own working hours, methods and place of work (within clause 2.5), provides their own equipment, phone and internet, and bears their own business costs.</p>\n<p><b>2.3 No authority to bind.</b> The Consultant has no authority to conclude, sign, amend or cancel any contract on Archē’s behalf, or to accept any order, set or agree any price, grant any discount, or make any commitment that binds Archē. Every quote, charter agreement, confirmation, invoice and payment request is issued by Archē through the Portal after Archē’s own review and approval. The Consultant must not hold themselves out as having such authority.</p>\n<p><b>2.4 How the Consultant presents themselves.</b> The Consultant may use the title “Independent Broker, Archē Executive” and an Archē email address provided for that purpose, and must make clear when asked that they act as an independent consultant to Archē. The Consultant must never present themselves or Archē as an aircraft operator.</p>\n<p><b>2.5 Place of work.</b> The Consultant provides the services from the Territory only. The Consultant will not perform the services while physically in Singapore or Thailand, other than for short business visits agreed in writing in advance, and will tell Archē at least 30 days before moving their residence to another country.</p>\n<p><b>2.6 Other work.</b> The Consultant may carry on other business, provided that during this agreement they do not arrange private aviation charter for, or introduce charter clients to, any other broker, operator or platform without Archē’s written consent.</p>\n<p><b>2.7 Consultant’s promises.</b> The Consultant confirms that they are free to enter into this agreement, that doing so breaks no other contract or restriction binding on them, and that the details in Schedule 2 are true.</p>\n<h2>3. Services and how we work</h2>\n<p><b>3.1 Responsibility for each Booking.</b> The Consultant is responsible for each of their Bookings from first enquiry to completion, including every leg of a multi-leg trip and the whole period of a long-term charter. For each Booking the Consultant does everything the Booking needs, including but not limited to the following:</p>\n<ol><li>finds the client and takes the client’s full trip requirements;</li><li>sources suitable aircraft and operator options through the Portal, for Archē’s review and approval;</li><li>creates the booking in the Portal and keeps it fully updated at every stage;</li><li>takes and arranges the client’s special requests, such as catering, pets, special equipment or onboard needs;</li><li>makes sure ground handling is in place at every airport on the trip;</li><li>arranges the client’s transport to and from the airport, and access to the terminal or aircraft;</li><li>gathers the passenger, crew-related and client documents the chartered operator requires (such as passports, visas and passenger details) and sends them to the operator on time;</li><li>follows each flight from departure to the last landing and stays reachable for the client and Archē’s operations team while the trip runs, dealing with delays and changes as they arise;</li><li>completes the follow-up with the client within 24 hours of the last landing and the client’s rating request; and</li><li>makes sure all extras are recorded and invoiced, and the Booking is closed in the Portal.</li></ol>\n<p>All arrangements with operators, handlers and other suppliers are made in Archē’s name through the Portal, within clause 2.3.</p>\n<p><b>3.2 Portal only.</b> Every enquiry, quote, booking, document and payment for a client introduced under this agreement must go through the Portal. The Consultant must not arrange, quote or take a booking outside the Portal, or move a client’s business to any other party.</p>\n<p><b>3.3 Archē’s decisions.</b> Archē decides in its sole discretion whether to accept a client or a trip, which operator to use, the Client Price and the terms. Archē may decline any trip, including for safety, compliance or credit reasons, and no commission is due on a trip Archē declines.</p>\n<p><b>3.4 Client money.</b> Clients pay Archē directly through Archē’s payment request. The Consultant must never receive, hold or forward client money, and must never give a client any bank details.</p>\n<p><b>3.5 Status changes.</b> In the Portal the Consultant may move a trip only to the stages enquiry, quoted, submitted or cancelled. Stages involving money and confirmation are set by Archē’s operations team.</p>\n<p><b>3.6 Training and standards.</b> Before handling a first trip, the Consultant completes the Archē Broker Academy. The Consultant follows the Operating Rules, which Archē may update by notice in the Portal or by email. A change to the Operating Rules does not change the commission in Schedule 1.</p>\n<p><b>3.7 Tools.</b> Archē gives the Consultant a personal Portal login and a dedicated Archē email address. The Consultant uses only that address, with the signature and disclaimer in Schedule 5, for all email about Archē business, and never a personal or other business address. For messaging, the Consultant uses only the Archē company accounts on WhatsApp, LINE, WeChat and any other channel Archē provides for clients, and the dedicated WhatsApp groups Archē creates for internal communication. All these accounts and groups belong to Archē, and the Consultant’s access ends with this agreement. The login is personal and must not be shared. Access ends when this agreement ends.</p>\n<p><b>3.8 Standards of conduct.</b> Archē serves the most demanding private clients, and every contact with a client, operator or supplier must meet that standard. The Consultant always acts in Archē’s name and in its interest (within clause 2.3), and follows the Standards of Conduct in Schedule 4 at all times.</p>\n<p><b>3.9 Enquiries received by Archē.</b> Enquiries that reach Archē directly, through its website, its charter email or any other channel, go first to Archē, which decides whether to release them. Released enquiries are offered to all brokers in the Portal on a first-come, first-served basis: the first broker to take an enquiry in the Portal receives it, and the client becomes that broker’s Registered Client. Archē may instead assign any enquiry, or reassign it at any time, to the broker it considers most suitable. A broker who takes or is given an enquiry contacts the client within 15 minutes.</p>\n<p><b>3.10 Booking cycle target.</b> The Consultant aims to complete each Booking from first enquiry to signed confirmation and the client’s payment within 5 days, or within any other target Archē sets in the Portal from time to time. Archē may reassign an enquiry or Booking that is not progressing, and clause 4.5 then applies to any commission.</p>\n<h2>4. Commission, payment and taxes</h2>\n<p><b>4.1 Commission.</b> Archē pays the Consultant commission on the Gross Profit of each Booking for a Registered Client, at the rates in Schedule 1. Commission is the Consultant’s only payment under this agreement. There is no salary, retainer, draw or minimum.</p>\n<p><b>4.2 When commission is earned.</b> Commission is calculated and earned only on a Completed Booking, once the whole transaction is finalised. No commission is earned on a Booking, or any flight or leg in it, before then, including for multi-leg trips and long-term charters. A Completed Booking counts in the calendar month in which it becomes complete.</p>\n<p><b>4.3 Statement and payment.</b> By the 15th of each month, Archē issues a statement showing each Booking earned in the previous month, its Client Price, Gross Profit and the commission. Archē pays the commission in USD by the same date, by bank transfer to an account in the Consultant’s own name that the Consultant registers with Archē’s payment provider. The statement serves as the Consultant’s invoice unless the Consultant’s local law requires them to issue their own.</p>\n<p><b>4.4 Refunds and chargebacks.</b> If Archē refunds a client, or a payment is reversed, for a Booking on which commission was paid, the commission on the refunded part is deducted from the next payments.</p>\n<p><b>4.5 Shared bookings.</b> If two brokers worked on one Booking, Archē decides the split fairly based on the Portal record, and the total commission does not exceed one broker’s commission.</p>\n<p><b>4.6 Disputes about a statement.</b> The Consultant raises any query within 30 days of a statement. Archē will show the Consultant the Portal records for the Bookings concerned.</p>\n<p><b>4.7 Expenses.</b> Each party bears its own costs. Archē reimburses an expense only if it approved it in writing in advance.</p>\n<p><b>4.8 Taxes.</b> The Consultant is solely responsible for their own income tax, social security, registration and any sales tax or VAT on their commission in the Territory, and indemnifies Archē against any such amount claimed from Archē. Commission is stated exclusive of any VAT or similar tax the Consultant must charge. If Archē is required by law to withhold tax from a payment, it will pay the net amount and give the Consultant evidence of the tax paid.</p>\n<p><b>4.9 Work done in Singapore.</b> If any part of the services is performed in Singapore, the Consultant tells Archē in advance, and Archē may withhold from the commission for that part any Singapore tax it is required to withhold.</p>\n<h2>5. Compliance</h2>\n<p><b>5.1 Laws.</b> The Consultant complies with all laws that apply to their work, including the laws of the Territory and of Singapore, and holds any registration or licence the Territory requires for their business.</p>\n<p><b>5.2 Anti-bribery.</b> The Consultant must not offer, give, ask for or accept any bribe, kickback or improper payment or benefit, in money or otherwise, in connection with Archē’s business, and complies with Singapore’s Prevention of Corruption Act 1960 and the anti-bribery law of the Territory. This includes payments to client staff, operator staff or public officials. The Consultant tells Archē at once of any such request.</p>\n<p><b>5.3 Sanctions and checks.</b> The Consultant must not introduce, or deal on Archē’s behalf with, any person or company on a sanctions list of the United Nations, United States, European Union or United Kingdom, or any trip to a sanctioned destination. The Consultant gives Archē the client information it asks for to complete its checks, and tells Archē of anything that suggests money laundering, sanctions evasion or unlawful carriage.</p>\n<p><b>5.4 Aviation.</b> Flights are operated by licensed operators chosen by Archē. The Consultant makes no statement about an aircraft, operator, safety standard or flight time that Archē has not confirmed in writing, and passes any client safety concern to Archē at once.</p>\n<p><b>5.5 Data protection.</b> The Consultant handles personal data only for this agreement and in line with Singapore’s Personal Data Protection Act 2012, the data protection law of the Territory and the Operating Rules. In particular the Consultant:</p>\n<ol><li>keeps client and contact data in the Portal only and does not export, copy or keep it elsewhere;</li><li>records named prospect contacts only as business contacts acting for an organisation, using details the organisation publishes itself or a licensed database Archē approves, and never guessed emails or phone numbers, personal addresses or wealth or family details;</li><li>does not scrape websites, LinkedIn or marketplace boards, and does not copy data out of Avinode or similar systems;</li><li>says in each first message where the contact’s details were found and offers an opt-out, and records any opt-out in the Portal at once; and</li><li>tells Archē within 24 hours of any loss or misuse of personal data.</li></ol>\n<p><b>5.6 Reviews and marketing.</b> The Consultant must never write, buy, reward or ask for false reviews, and may quote a client publicly only with the client’s written consent obtained through Archē. Marketing that uses the Archē name or logo must follow Archē’s brand rules and be approved by Archē in advance.</p>\n<p><b>5.7 Personal data sent outside Singapore.</b> Archē makes client and prospect personal data available to the Consultant only in the Territory, through the Portal. For that data the Consultant must, to a standard at least comparable to Singapore’s Personal Data Protection Act 2012:</p>\n<ol><li>use and disclose it only to perform this agreement, and not pass it to anyone else without Archē’s written consent;</li><li>keep it accurate and complete through the Portal;</li><li>protect it with reasonable security, including a secured device, a strong password and no shared logins;</li><li>keep it no longer than needed, and delete any copy when this agreement ends;</li><li>follow Archē’s data protection policy as part of the Operating Rules; and</li><li>pass any request from a person to access or correct their data to Archē within 2 business days, and help Archē answer it.</li></ol>\n<p>The Consultant may not access the data from any country other than the Territory without Archē’s written consent.</p>\n<h2>6. Confidentiality and intellectual property</h2>\n<p><b>6.1 Confidentiality.</b> The Consultant keeps confidential, during and after this agreement, all information about Archē’s clients, prospects, operators, prices, margins, Portal, methods and finances, and uses it only to perform this agreement. This does not apply to information that is public through no fault of the Consultant, or that the law requires to be disclosed (after telling Archē where allowed).</p>\n<p><b>6.2 Intellectual property.</b> The Portal, the Archē Broker Academy, the Archē name and logo, and all material Archē provides remain Archē’s property. Anything the Consultant creates for Archē’s business under this agreement, including client records and marketing material, belongs to Archē, and the Consultant assigns it to Archē on creation.</p>\n<h2>7. Clients and non-solicitation</h2>\n<p><b>7.1 Clients are Archē’s.</b> Clients and prospects introduced under this agreement are clients of Archē. The Consultant’s reward for introducing and looking after them is the commission in Schedule 1.</p>\n<p><b>7.2 Repeat bookings.</b> While this agreement continues, the Consultant earns commission on every Booking for a Registered Client, including repeat bookings.</p>\n<p><b>7.3 Registration of leads.</b> A client or prospect becomes a Registered Client of the Consultant when the Consultant first records it in the Portal, unless it is already registered to another broker or to Archē. A registration lapses if no Booking is made for that client within 12 months of the last Booking or, for a prospect, within 12 months of registration. Archē decides any conflict between brokers based on the Portal record.</p>\n<p><b>7.4 Non-solicitation.</b> During this agreement and for 12 months after it ends, the Consultant must not, for themselves or for any other person, solicit or accept private aviation charter business from any client the Consultant dealt with under this agreement in the last 12 months before it ended, or encourage any Archē broker, staff member or operator partner to end or reduce their work with Archē.</p>\n<h2>8. Term, termination and liability</h2>\n<p><b>8.1 Term.</b> This agreement starts on the start date in Schedule 2 and continues until ended under this clause.</p>\n<p><b>8.2 Ending on notice.</b> Either party may end this agreement for any reason by giving the other 30 days’ written notice.</p>\n<p><b>8.3 Ending at once.</b> Archē may end this agreement at once by written notice if the Consultant breaches clause 2.3, 3.2, 3.4, 5 or 6, commits any other material breach not put right within 14 days of notice, acts dishonestly, brings Archē into disrepute, or seriously or repeatedly falls short of the Standards of Conduct in Schedule 4, including through poor client feedback as set out in that schedule.</p>\n<p><b>8.4 Commission after the end.</b> After this agreement ends, Archē pays commission on Bookings that were approved before the end date and become Completed Bookings within 6 months after it. Where Archē or another broker has to finish the work in clause 3.1 on such a Booking, Archē reduces the commission fairly to reflect that work. No commission is due on any other Booking. If the agreement ended under clause 8.3, Archē may withhold commission on Bookings affected by the breach.</p>\n<p><b>8.5 On ending.</b> Portal access ends on the end date. The Consultant returns or deletes all Archē information and client data and confirms this in writing within 7 days. Clauses 4.4, 4.8, 5.5, 6, 7.4, 8 and 9 continue after the end.</p>\n<p><b>8.6 No compensation.</b> Except for commission due under clause 8.4, no compensation, indemnity or goodwill payment is due to the Consultant when this agreement ends, to the extent the applicable law allows.</p>\n<p><b>8.7 Liability.</b> Neither party is liable to the other for loss of profit or indirect loss. Archē’s total liability under this agreement is limited to the commission due to the Consultant under it. Nothing limits liability for fraud or for anything the law does not allow to be limited.</p>\n<p><b>8.8 Indemnity.</b> The Consultant indemnifies Archē against loss, fines and reasonable legal costs arising from the Consultant’s breach of clause 2.3, 3.2, 3.4, 4.8, 5 or 6.</p>\n<p><b>8.9 Insurance.</b> Archē is arranging insurance for its charter brokerage business and will confirm to the Consultant in writing when it is in place. The Consultant arranges any insurance their own business or local law requires.</p>\n<h2>9. General</h2>\n<p><b>9.1 Whole agreement.</b> This agreement and its schedules are the whole agreement between the parties about its subject and replace any earlier offer or discussion.</p>\n<p><b>9.2 Changes.</b> A change to this agreement or to Schedule 1 is valid only in writing signed by both parties. Archē may update the Operating Rules under clause 3.6.</p>\n<p><b>9.3 Assignment.</b> The Consultant may not assign or subcontract this agreement. If the Consultant is a company, the services are performed personally by the individual named in Schedule 2. Archē may assign this agreement to a company in its group or to a buyer of its business, on notice.</p>\n<p><b>9.4 Notices.</b> Notices are given in writing by email to the addresses in Schedule 2 (for Archē, the address stated there), and take effect on the next business day in Singapore.</p>\n<p><b>9.5 Third parties.</b> No person other than the parties has any right under the Contracts (Rights of Third Parties) Act 2001 to enforce any term of this agreement.</p>\n<p><b>9.6 Severability.</b> If any term is invalid or unenforceable in any place, it is limited to the extent needed there and the rest of the agreement continues.</p>\n<p><b>9.7 Counterparts and signature.</b> This agreement may be signed in counterparts and by electronic signature, each of which is an original.</p>\n<p><b>9.8 Language.</b> This agreement is in English. Any translation is for convenience only.</p>\n<p><b>9.9 Governing law.</b> This agreement and any dispute arising from it are governed by the laws of Singapore.</p>\n<p><b>9.10 Disputes.</b> The parties first try to settle any dispute by discussion between the Consultant and an Archē director for 30 days. Any dispute arising out of or in connection with this agreement, including any question about its existence, validity or termination, that is not settled in that time shall be referred to and finally resolved by arbitration administered by the Singapore International Arbitration Centre (SIAC) under the Arbitration Rules of the SIAC for the time being in force. The seat of arbitration is Singapore, the tribunal consists of one arbitrator, and the language is English. Either party may still seek urgent interim relief from any competent court.</p>\n<h2>Schedule 1: Commission</h2>\n<p>Commission is a share of the Gross Profit on the Consultant’s Bookings, with a higher rate once the Consultant passes 8 Standard Bookings in a calendar month.</p>\n<table><tr><th>Standard Bookings in the calendar month</th><th>Share of Gross Profit</th></tr><tr><td>1 to 8</td><td>27%</td></tr><tr><td>9 and every one after</td><td>35%</td></tr></table>\n<ul><li>Bookings are counted by Client Price: USD 45,000 of Client Price is one Standard Booking. A smaller Booking counts as part of one and a larger Booking as more than one. The 35% rate applies to the Gross Profit above the first 8 Standard Bookings in the month.</li><li>The count starts again on the first day of each calendar month.</li><li>There is no cap on commission.</li><li>Example: a USD 45,000 Booking with USD 4,050 Gross Profit earns USD 1,093.50 at 27%, or USD 1,417.50 at 35%.</li></ul>\n<p><b>Supervision share.</b> While the Consultant is supervised under the Operating Rules and Archē has named a supervisor for them, 3 percentage points of the Gross Profit on each Booking approved in that time go to the supervisor instead of the Consultant (24% instead of 27%, or 32% instead of 35%; USD 121.50 on the example above). This continues until Archē ends the Consultant’s supervision. Where an owner of Archē is the supervisor, those 3 points stay with Archē.</p>\n<p>A Consultant whom Archē names as supervisor earns 3 percentage points of the Gross Profit on each such Booking of the person they supervise, on the same terms as their own commission (clauses 4.2 to 4.4). If Archē finds that the supervisor approved a step on that Booking that broke the Operating Rules, the share on that Booking stays with Archē.</p>\n";

se, or equivalent formal business dress.</li><li>A quiet, well-lit place, a good headset and a stable connection; join a few minutes early.</li><li>Display name: First name Last name · Archē Executive. No eating, smoking or other tasks during the meeting.</li><li>Host client meetings only on the Archē company Teams account. Never host them on a personal Zoom, Google Meet or other account; joining a link that a client or operator sends is fine.</li><li>Never record a meeting without the client’s clear consent.</li></ul>\n<p><b>5. Discretion</b></p>\n<ul><li>Never disclose who our clients are, where they fly or with whom, to anyone outside Archē.</li><li>Never post about clients, flights or aircraft on social media, and never take photos of clients.</li><li>Never use a client relationship for your own benefit.</li></ul>\n<p><b>6. Personal conduct</b></p>\n<ul><li>Never deal with a client or a live trip under the influence of alcohol or drugs.</li><li>Do not accept a gift or hospitality worth more than USD 100 without Archē’s written approval.</li></ul>\n<p><b>7. Feedback and consequences</b></p>\n<ul><li>Every client is asked to rate their trip. A rating of 3 or less out of 5, or a complaint, starts service recovery led by Archē and a review with the Consultant.</li><li>A first shortfall leads to a written warning and coaching.</li><li>Two ratings of 3 or less within 6 months, one serious complaint that Archē upholds, or any breach of the discretion rules may lead Archē to end this agreement at once under clause 8.3.</li></ul>\n<h2>Schedule 5: Email signature and disclaimer</h2>\n<p>Every email sent for Archē ends with this signature and disclaimer, as issued by Archē. The Consultant fills in only their name and phone number, and changes nothing else.</p>\n<p><b>Signature</b></p>\n<p class=\"sig\">[First name Last name]<br>Independent Broker · Archē Executive<br>M [+country code direct number] · E [name]@archeaviation.com<br>archeaviation.com</p>\n<p><b>Disclaimer</b></p>\n<p><i>Arche Executive Pte. Ltd. is registered in Singapore, UEN {{UEN}}, registered office {{OFFICE}}.</i></p>\n<p><i>Confidential: this email and any attachments are intended only for the named recipient and may be confidential. If you received it in error, please tell the sender and delete it; do not copy, use or disclose it.</i></p>\n<p><i>Payments: Archē Executive never sends bank details by email and never asks you to change payment details. Pay only through the secure payment request issued by Archē Executive. If in doubt, call us on a number you already know.</i></p>\n<p><i>Flights: Archē Executive arranges charter flights as agent for its clients and is not an aircraft operator. Flights are operated by licensed air operators, which keep operational control. Nothing in this email is a binding offer or confirmation; a charter is confirmed only by a charter agreement and confirmation issued by Archē Executive.</i></p>\n<p><i>Privacy: we handle personal data under Singapore’s Personal Data Protection Act 2012 and, where they apply, the EU and UK General Data Protection Regulations. Read our privacy notice at archeaviation.com/privacy.html or contact our Data Protection Officer at {{PRIVACY}}. To stop receiving emails from us, reply “unsubscribe”.</i></p>";

const OFFER_HTML = `<p class="lead"><b>Build your own private aviation business with the backing of a full charter brokerage, and keep up to 35% of the profit on every trip you sell.</b> There is no cap on what you can earn.</p>

<h3>About Archē Executive</h3><p>Archē Executive is an independent private jet charter brokerage based in Singapore, serving clients worldwide with Asia as its home market. We serve business leaders, family offices, private travellers, public figures, corporate groups and government delegations.</p><p>We own no aircraft, so our advice stays honest: our only job is to find the right aircraft and the right operator for each trip. Before we recommend an aircraft, we know who flies it, how it is maintained and what the client is paying for. Every quote names the operator, every trip has one all-in price, and our clients' privacy is absolute.</p><p>As an Archē broker, that is the promise you carry to every client.</p>

const AGR_S2 = [["consultant","Consultant (name, or company name and registration number)"],["individual","Individual performing the services (if a company)"],["address","Address"],["territory","Territory (country of residence and work)"],["email","Email for notices"],["taxReg","Tax registration in the Territory (if any)"]];

async function agrHash(text){ const b = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(text)); return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2, "0")).join(""); }

async function obSave(filename, blob){   /* through the platform's download helper (inside claude.ai: the viewer's own) */
  try { const d = await __arche.use("downloads"); if (d) { await d.save({filename, data: blob}); return; } } catch(e) { if (e && e.code === "declined") return; }
  const a = Object.assign(document.createElement("a"), {href: URL.createObjectURL(blob), download: filename}); document.body.appendChild(a); a.click(); a.remove();
}

/* ---------- Enquiry pool and booking cycle target (Morten, 24 Oct 2026) ----------
   Every charter enquiry (website form, charter email, phone) reaches the owner first. The owner releases it to all
   brokers (first come, first served) or assigns it to the most suitable person, and can reassign at any time.
   Brokers see the trip summary of open enquiries; the client's details open only for the broker who has it.
   Booking cycle target: each booking should go from enquiry to signed confirmation and client payment within
   S.terms.cycleDays days (default 5, set by the owner in Settings). Database rules: migration 0008. */
const POOL_SRC = {website: "Website", email: "Charter email", phone: "Phone", other: "Other"};
const cycleDays = () => Math.max(1, Math.round(num((S.terms || {}).cycleDays) || 5));
function cycleDay(fromIso){ const t = Date.parse(fromIso || ""); return isNaN(t) ? 0 : Math.floor((Date.now() - t) / 86400000) + 1; }
function cycleChip(t){
  if (!t || !t.d || ["clientPaid","flown","cancelled"].includes(t.stage)) return "";
  const n = cycleDay(t.d.enquiryAt || t.d.created), max = cycleDays(); if (!n) return "";
  return `<span class="chip ${n > max ? "c-returned" : n === max ? "c-review" : "c-quoted"}" title="Booking cycle target: enquiry to signed and paid within ${max} days">Day ${n} of ${max}</span>`;
}
function poolLegs(e){ return (e.legs || []).map(l => `${esc(l.from || "?")} → ${esc(l.to || "?")}${l.date ? " " + esc(fmtD(l.date)) : ""}`).join(" · ") || "Route to be confirmed"; }
function poolAgo(iso){ const m = Math.max(0, Math.round((Date.now() - Date.parse(iso || 0)) / 60000)); return m < 60 ? `${m} min` : m < 1440 ? `${Math.round(m / 60)} h` : `${Math.round(m / 1440)} days`; }
function poolWatch(){
  if (S.poolOn || !window.__sb && !S.db) return; S.poolOn = true;
  watchCol("pool", snap => { S.pool = {}; snap.docs.forEach(d => S.pool[d.id] = d.data()); render(); });
}
function poolPeople(){ return Object.entries(S.roster || {}).filter(([, p]) => p.active !== false && ["broker","consultant","ops"].includes(p.role)); }
function poolAssignSel(id, cur){ return `<select id="pa_${id}" aria-label="Assign to" style="width:auto">${[`<option value="">Assign to…</option>`, ...poolPeople().map(([uid, p]) => `<option value="${uid}" ${cur === uid ? "selected" : ""}>${esc(p.contractName || nm(uid))}</option>`)].join("")}</select>`; }

/* owner: everything that came in, waiting, taken */
function vPool(){
  poolWatch(); if (isStaff() && !S.subs["enquiries"]) watchCol("enquiries", snap => { S.enq = snap.docs.map(d => ({id: d.id, ...d.data()})); render(); });
  const all = Object.entries(S.pool || {}), webNew = (S.enq || []).filter(e => !e.handled && e.type !== "callback");
  const fresh = all.filter(([, e]) => e.status === "new"), open = all.filter(([, e]) => e.status === "released"), taken = all.filter(([, e]) => e.status === "claimed").sort((a, b) => (b[1].receivedAt || "").localeCompare(a[1].receivedAt || ""));
  const card = (id, e, actions) => `<div class="flag"><span class="sev low" aria-hidden="true"></span><div style="flex:1;min-width:0"><p><b>${poolLegs(e)}</b> · ${esc(e.pax || "?")} pax</p><p class="small muted">${esc(POOL_SRC[e.source] || e.source || "")} · received ${fmtT(e.receivedAt)}${e.note ? " · " + esc(e.note) : ""}</p>${actions}</div></div>`;

  return `<div class="head"><div><h1>Enquiries</h1><p class="muted small">Every charter enquiry comes here first. Release it to all brokers (the first to take it gets it) or assign it to the most suitable person. You can reassign at any time. Booking cycle target: ${cycleDays()} days from enquiry to signed and paid (change it in Settings).</p></div><div class="row"><button class="btn" type="button" data-pool="add">Add an enquiry from email or phone</button></div></div>
  ${S.poolAdd ? `<form id="poolForm" class="panel stack" style="max-width:820px;margin-bottom:16px"><h2>New enquiry</h2><div class="fgrid">
    <label class="f" for="pf_src">Came in by<select id="pf_src"><option value="email">Charter email</option><option value="phone">Phone</option><option value="other">Other</option></select></label>
    <label class="f" for="pf_pax">Passengers<input id="pf_pax" inputmode="numeric"></label>
    <label class="f" for="pf_from">From (airport or city)<input id="pf_from" required></label><label class="f" for="pf_to">To (airport or city)<input id="pf_to" required></label>
    <label class="f" for="pf_date">Date<input id="pf_date" type="date"></label><label class="f" for="pf_note">Trip notes<input id="pf_note"></label>
    <label class="f" for="pf_name">Client name<input id="pf_name" required></label><label class="f" for="pf_co">Company<input id="pf_co"></label>
    <label class="f" for="pf_mail">Client email<input id="pf_mail" type="email"></label><label class="f" for="pf_ph">Client phone<input id="pf_ph"></label>
    <label class="f wide" for="pf_msg">Their message<textarea id="pf_msg"></textarea></label></div>
    <div class="row"><button class="btn primary" type="submit">Save</button><button class="btn" type="button" data-pool="cancelAdd">Cancel</button></div></form>` : ""}
  <div class="grid2"><div class="stack">
    <div class="panel"><h2>New, waiting for you (${webNew.length + fresh.length})</h2>
      ${webNew.map(e => card("w:" + e.id, {legs: e.legs, pax: e.pax, source: "website", receivedAt: e.at, note: e.type === "quote" ? "" : e.type}, newActs("w:" + e.id))).join("")}
      ${fresh.map(([id, e]) => card(id, e, newActs(id))).join("")}
      ${webNew.length + fresh.length ? "" : `<p class="small muted">Nothing new.</p>`}</div>
    <div class="panel"><h2>Released, not taken yet (${open.length})</h2>
      ${open.map(([id, e]) => card(id, e, `<p class="small">Open for ${poolAgo(e.releasedAt)}</p><div class="row" style="margin-top:6px;gap:6px">${poolAssignSel(id, "")}<button class="btn small" type="button" data-pool="assign|${id}">Assign instead</button></div>`)).join("") || `<p class="small muted">None open.</p>`}</div></div>
    <div class="panel"><h2>Taken (${taken.length})</h2>
      ${taken.map(([id, e]) => { const n = cycleDay(e.receivedAt), max = cycleDays(), trip = allTrips().find(t => t.d.poolId === id);

}

/* ---------- Supervised steps (Morten, 26 Oct 2026) ----------
   While a member is supervised, each gated step waits for the owner's OK before it moves on. The owner releases
   each step separately per member in Team once satisfied ("let loose"); supervision can be switched back on at any
   time. Requests live in step_requests (SQL 0011): the member can ask and amend while pending; only an owner decides.
   Until the SQL has run, nothing is gated and the owner's task list shows the SQL step. */
const GATES = {
  quote:    {who:"broker", label:"Quote to client", desc:"Each quote waits for your OK before it goes to the client, and cannot go to operations until approved."},
  take:     {who:"broker", label:"Taking an enquiry", desc:"Taking an enquiry from the pool waits for your OK. Your OK assigns it to them."},
  contact:  {who:"broker", label:"First contact with a new prospect", desc:"The planned first contact with each new lead (channel and message) waits for your OK."},
  pay:      {who:"ops", label:"Recording payments", desc:"Client and operator payments are recorded only after your OK."},
  supplier: {who:"ops", label:"Supplier quotes", desc:"Sending a quote request to a supplier, and awarding a quote, wait for your OK."}

const GATE_KEYS = Object.keys(GATES);
if (!S.reqs) S.reqs = {};

function rosterOf(uid){ return (S.roster || {})[uid] || (uid === S.uid ? S.myRoster : null) || {}; }
function gateApplies(key, uid){ const r = rosterOf(uid), g = GATES[key]; return g.who === "ops" ? r.role === "ops" : (r.role === "broker" || r.role === "consultant" || !!r.book); }
function gated(key, uid = S.uid){
  if (!S.reqReady || S.preview) return false;
  const r = rosterOf(uid); if (r.role === "owner" || (uid === S.uid && S.isOwner)) return false;
  return !!r.supervised && !(r.released || {})[key] && gateApplies(key, uid);
}
function reqList(uid){ return Object.entries(S.reqs[uid] || {}).map(([id, d]) => ({id, uid, ...d})).sort((a, b) => (a.at < b.at ? 1 : -1)); }
function gateReq(uid, key, ref){ return reqList(uid).find(r => r.key === key && (r.ref === ref || (r.refs || []).includes(ref))) || null; }

/* subscribe: members to their own requests, owners to everyone's */
function gateWatch(){
  if (!S.db || !S.uid || !S.role || S.role === "loading" || S.role === "pending") return;
  const ids = S.isOwner ? Object.keys(S.roster || {}).filter(id => id !== S.uid) : [S.uid];
  ids.forEach(uid => { const path = `req/${uid}/items`; if (S.subs[path]) return;
    S.subs[path] = S.db.collection(path).onSnapshot(snap => { const o = {}; snap.docs.forEach(d => o[d.id] = d.data()); S.reqs[uid] = o; if (!S.reqReady) S.reqReady = true; render(); }, e => { S.reqErr = e && e.code; }); });
}
setInterval(() => gateWatch(), 2000);

async function gateAsk(key, ref, fp, title, detail, extra = {}){
  const cur = gateReq(S.uid, key, ref), id = cur && cur.status === "pending" ? cur.id : `${key}-${String(ref).replace(/[^\w-]/g, "").slice(0, 40)}-${Date.now().toString(36)}`;
  const body = {key, ref, fp, title, detail, status: "pending", at: now(), by: S.uid, ...extra};
  await S.db.doc(`req/${S.uid}/items/${id}`).set(body);
  S.reqs[S.uid] = {...(S.reqs[S.uid] || {}), [id]: body};
  audit("Asked for the director's OK", `${GATES[key].label}: ${title}`);
}
/* true = stop here (the step waits for the owner); false = go ahead */
async function gateHold(key, ref, fp, title, detail, extra){
  if (!gated(key)) return false;
  const r = gateReq(S.uid, key, ref);
  if (r && r.status === "approved" && r.fp === fp) return false;
  if (r && r.status === "pending" && r.fp === fp) { toast("Still waiting for the director's OK."); return true; }
  try { await gateAsk(key, ref, fp, title, detail, extra); toast("Sent to the director for OK. You will see the answer here."); } catch(e){ toast("Could not send the request. Try again."); }
  render(); return true;
}

/* member side: what the director said, shown where the work is */
function gateLine(r){
  if (!r) return "";
  if (r.status === "pending") return `<div class="note info small"><b>Waiting for the director's OK:</b> ${esc(GATES[r.key].label)}. ${r.key === "quote" ? "Do not send the quote to the client yet." : ""} Asked ${fmtT(r.at)}.</div>`;
  if (r.status === "approved") return `<div class="note ok small"><b>Approved</b> by the director ${fmtT(r.decidedAt)}${r.note ? `: ${esc(r.note)}` : "."}</div>`;
  return `<div class="note bad small"><b>Changes asked</b> by the director ${fmtT(r.decidedAt)}: ${esc(r.note || "")}. Make the change and ask again.</div>`;

const quoteFp = t => { const q = t.d.quote || {}; return `${num(q.opPrice)}|${num(q.direct)}`; };

  ["client", "operator"].forEach(w => { const r = gateReq(S.uid, "pay", t.did + "-" + w); if (r && r.status !== "approved") out.push(gateLine(r)); });
  return out.join("");
}

async function reqDecide(uid, id, ok){
  const r = (S.reqs[uid] || {})[id]; if (!r) return;

  if (!ok && note.length < 5) { toast("Write what should change, so they can fix it."); return; }
  const body = {...r, status: ok ? "approved" : "changes", decidedAt: now(), decidedBy: S.uid, note};
  try {
    if (ok && r.key === "take") {
      let e = (S.pool || {})[r.ref]; if (!e) { try { const d = await S.db.doc("pool/" + r.ref).get(); e = d.exists ? d.data() : null; } catch(x){} }
      if (!e || e.status !== "released") { toast("That enquiry is no longer open. Asking for changes instead is clearer for them."); return; }
      await S.db.doc("pool/" + r.ref).set({...e, status: "claimed", claimedBy: uid, claimedAt: now(), how: "approved", assignedBy: S.uid});

    await S.db.doc(`req/${uid}/items/${id}`).set(body);

}

/* ---------- Supervisor rights (Morten, 26 Oct 2026) ----------

    const days = (s.byDay || []).length ? `<div class="panel"><h2>Visits per day</h2><div style="display:flex;align-items:flex-end;gap:2px;height:120px" role="img" aria-label="Visits per day">${s.byDay.map(x => `<div title="${esc(fmtD(x.d))}: ${x.n}" style="flex:1;min-width:2px;background:var(--accent,#4e6584);height:${Math.max(2, Math.round(100 * x.n / max))}%"></div>`).join("")}</div></div>` : "";
    const funnel = `<div class="panel"><h2>How far visitors get</h2>${tbl(Object.keys(SEC).map(k => ({k, n: ((s.sections || []).find(x => x.k === k) || {}).n || 0})), ["Section", "Visits", "Share"], x => `<tr><td>${SEC[x.k]}</td><td>${x.n}</td><td>${pct(x.n, v)}</td></tr>`)}
      <h3>What they used</h3>${tbl(["quote_start","quote_sent","callback_start","callback_sent","call","whatsapp","email","finder","language","portal"].map(k => ({k, n: a[k] || 0})), ["Action", "Visits"], x => `<tr><td>${KIND[x.k]}</td><td>${x.n}</td></tr>`)}</div>`;
    const src = `<div class="panel"><h2>Where they came from</h2>${tbl(s.sources, ["Source", "Visits"], x => `<tr><td>${esc(x.k === "direct" ? "Typed the address or a saved link" : x.k)}</td><td>${x.n}</td></tr>`)}
      <h3>Campaigns</h3><p class="small muted">Add ?utm_source=linkedin&amp;utm_campaign=name to links you post, so each post or mailing shows here.</p>${tbl(s.campaigns, ["Campaign", "Visits", "Enquiries"], x => `<tr><td>${esc(x.k)}</td><td>${x.n}</td><td>${x.sent || 0}</td></tr>`)}</div>`;
    const geo = `<div class="panel"><h2>Countries and cities</h2>${tbl(s.countries, ["Country", "Visits"], x => `<tr><td>${esc(CTRY(x.k))}</td><td>${x.n}</td></tr>`)}<h3>Cities</h3>${tbl(s.cities, ["City", "Visits"], x => `<tr><td>${esc(x.k)}</td><td>${x.n}</td></tr>`)}
      <h3>Pages and devices</h3>${tbl(s.pages, ["Page", "Visits"], x => `<tr><td>${esc(x.k)}</td><td>${x.n}</td></tr>`)}${tbl(s.devices, ["Device", "Visits"], x => `<tr><td>${esc(x.k)}</td><td>${x.n}</td></tr>`)}</div>`;
    const links = `<div class="panel"><h2>Organisation links opened</h2><p class="small muted">Brokers make a link for each lead in My leads. Here you see which organisations opened theirs and what they did.</p>${tbl(s.links, ["Organisation", "Broker", "Visits", "Last", "Did"], x => `<tr><td>${esc(x.org)}</td><td>${esc(nm(x.by))}</td><td>${x.visits}</td><td>${esc(fmtT(x.last))}</td><td>${esc((x.acts || []).map(k => KIND[k] || k).join(", ") || "Read")}</td></tr>`)}</div>`;
    const tips = `<div class="panel"><h2>Suggestions</h2>${ideas(s).map(t => `<div class="flag"><span class="sev low" aria-hidden="true"></span><div><p>${esc(t)}</p></div></div>`).join("")}</div>`;
    return head + kpis + `<div class="grid2"><div class="stack">${tips}${days}${funnel}</div><div class="stack">${src}${geo}${links}</div></div>`;
  };
  const _nav = navItems;
  navItems = function(){ const items = _nav(); if (S.isOwner && acting() === "owner" && !items.some(x => x[0] === "website")) { const i = items.findIndex(x => x[0] === "prospects"); items.splice(i < 0 ? items.length : i + 1, 0, ["website", "Website"]); } return items; };

  /* ---- links per lead ---- */
  function newCode(){ const c = "ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz23456789", a = new Uint8Array(8); crypto.getRandomValues(a); return [...a].map(x => c[x % c.length]).join(""); }
  async function makeLink(id){
    const l = S.leads[id]; if (!l || l.linkCode) return;
    for (let i = 0; i < 3; i++) {
      const code = newCode(), r = await sb().from("site_links").insert({code, lead_id: id, org: (l.org || "").slice(0, 120)});
      if (!r.error) { try { await S.db.doc(`leads/${S.uid}/items/${id}`).update({linkCode: code}); audit("Website link made", l.org || id); toast("Link ready. Use it in your first message."); } catch(e){ toast("Could not save the link on the lead."); } return; }
      if (!/duplicate|23505/.test(r.error.message || r.error.code || "")) { toast(/site_links|PGRST20/.test(r.error.message || r.error.code || "") ? "The owner must first run the database step for website statistics." : "Could not make the link."); return; }
    }
  }
  async function loadCode(code){
    if (S.web.byCode[code] && Date.now() - S.web.byCode[code].at < 60000) return;
    S.web.byCode[code] = {at: Date.now(), rows: (S.web.byCode[code] || {}).rows || null};
    const r = await sb().from("site_events").select("at,visit,kind,detail,path,country,city").eq("code", code).order("at", {ascending: false}).limit(200);
    S.web.byCode[code] = {at: Date.now(), rows: r.error ? [] : r.data}; render();
  }
  function linkBlock(l, id){
    if (l.status === "dnc" || l.status === "duplicate") return "";
    if (!l.linkCode) return `<div><h3>Website link</h3><p class="small muted">A link to archeaviation.com for this organisation only. When someone there opens it, Today tells you, so you can follow up while they are interested. It shows the organisation, never who the person is.</p><button class="btn small" type="button" data-web="mk|${esc(id)}">Make a website link</button></div>`;
    loadCode(l.linkCode);
    const rows = (S.web.byCode[l.linkCode] || {}).rows, visits = rows ? [...new Set(rows.filter(r => r.kind === "view").map(r => r.visit))] : [];
    const did = rows ? [...new Set(rows.filter(r => !["view","leave","section"].includes(r.kind)).map(r => KIND[r.kind] || r.kind))] : [];
    const secs = rows ? [...new Set(rows.filter(r => r.kind === "section").map(r => SEC[r.detail] || r.detail))] : [];
    const url = `${SITE}/?r=${l.linkCode}`, th = `${SITE}/th?r=${l.linkCode}`;
    return `<div><h3>Website link</h3><p class="small"><span class="mono">${esc(url)}</span> <button class="btn small" type="button" data-web="copy|${esc(url)}">Copy</button> <button class="btn small" type="button" data-web="copy|${esc(th)}">Copy Thai page</button></p>
      <p class="small muted">${rows === null ? "Checking…" : visits.length ? `Opened ${visits.length} time${visits.length > 1 ? "s" : ""}, last ${esc(fmtT(rows[0].at))}${rows[0].city ? " from " + esc(rows[0].city) : ""}. ${secs.length ? "Read: " + esc(secs.join(", ")) + ". " : ""}${did.length ? "Used: " + esc(did.join(", ")) + "." : ""}` : "Not opened yet."}</p></div>`;
  }
  const _vLeads = vLeads;
  vLeads = function(){
    const h = _vLeads(), id = S.pSel, l = id && S.leads[id]; if (!l) return h;
    const at = h.indexOf("<div><h3>Contact routes</h3>"); return at < 0 ? h : h.slice(0, at) + linkBlock(l, id) + h.slice(at);
  };

  /* ---- Today: organisations that opened their link (last 48 hours) ---- */
  async function loadOpens(){
    if (S.web.opensAt && Date.now() - S.web.opensAt < 120000) return; S.web.opensAt = Date.now();
    const since = new Date(Date.now() - 48 * 3600e3).toISOString();
    let ev, lk;
    try { [ev, lk] = await Promise.all([
      sb().from("site_events").select("code,at,kind,city").neq("code", "").gte("at", since).order("at", {ascending: false}).limit(500),
      sb().from("site_links").select("code,lead_id,org,owner_id").limit(2000)]); } catch(e){ S.web.opens = []; return; }
    if (!ev || !lk || ev.error || lk.error) { S.web.opens = []; return; }
    const links = Object.fromEntries((lk.data || []).map(x => [x.code, x])), by = {};
    (ev.data || []).forEach(e => { const L = links[e.code]; if (!L) return; const o = by[e.code] = by[e.code] || {L, last: e.at, city: e.city, acts: new Set()}; if (!["view","leave","section"].includes(e.kind)) o.acts.add(KIND[e.kind] || e.kind); });
    S.web.opens = Object.values(by).sort((a, b) => b.last.localeCompare(a.last)); render();
  }
  function opensPanel(){
    if (!["owner","broker","ops"].includes(acting())) return "";
    loadOpens(); const rows = S.web.opens || []; if (!rows.length) return "";
    return `<div class="panel" style="margin-bottom:16px"><h2>Opened their website link (48 hours)</h2><p class="small muted">Follow up today while they are interested. Say nothing about what they looked at.</p>${rows.slice(0, 12).map(o => `<div class="flag"><span class="sev ${o.acts.size ? "high" : "med"}" aria-hidden="true"></span><div><p>${o.L.owner_id === S.uid ? `<a href="#" data-view="leads" data-lead="${esc(o.L.lead_id)}">${esc(o.L.org)}</a>` : `${esc(o.L.org)} · ${esc(nm(o.L.owner_id))}`}</p><p class="small muted">${esc(fmtT(o.last))}${o.city ? " · " + esc(o.city) : ""}${o.acts.size ? " · " + esc([...o.acts].join(", ")) : ""}</p></div></div>`).join("")}</div>`;
  }
  const _vT = vToday; vToday = function(){ return afterHead(_vT(), opensPanel()); };

  /* ---- where a website enquiry came from (owner) ---- */
  window.enqSourceTag = function(e){
    if (!S.isOwner || !e || !e.visit) return "";
    const c = S.web.enqSrc = S.web.enqSrc || {};
    if (!(e.visit in c)) { c[e.visit] = null; sb().from("site_events").select("ref,utm,country,city,path,code").eq("visit", e.visit).eq("kind", "view").limit(1).then(r => { const x = r.data && r.data[0]; c[e.visit] = x ? [x.utm && x.utm.source ? x.utm.source + (x.utm.campaign ? " / " + x.utm.campaign : "") : x.ref || "direct", x.city || CTRY(x.country), x.path].filter(Boolean).join(" · ") : ""; render(); }); }
    return c[e.visit] ? ` <span class="tag">${esc(c[e.visit])}</span>` : "";
  };

  document.addEventListener("click", async ev => {
    const b = ev.target.closest("[data-web]"); if (!b) return; ev.preventDefault();

/* ---------- Owner to-do and trust / performance matrix on Today (Morten, 26 Oct 2026) ----------

const OWNER_SQL = {"0006": "-- Supplier quotes (Morten, 21 Oct 2026): quote requests to service partners, the quotes received and the award.\n-- Owner and operations only. Brokers get nothing back from this table. Kept as its own table so it can later\n-- move to a separate company (the AeroBridge idea) without touching the rest of the platform.\ncreate table if not exists public.rfqs (\n  id text primary key,\n  data jsonb not null default '{}'::jsonb,\n  created_at timestamptz not null default now(),\n  updated_at timestamptz not null default now()\n);\nalter table public.rfqs enable row level security;\nrevoke all on public.rfqs from anon;\ndrop policy if exists rfqs_staff on public.rfqs;\ncreate policy rfqs_staff on public.rfqs for all using (public.is_staff()) with check (public.is_staff());\n\n-- live updates in the portal (skipped if already added)\ndo $$ begin\n  if not exists (select 1 from pg_publication_tables where pubname = 'supabase_realtime' and schemaname = 'public' and tablename = 'rfqs') then\n    alter publication supabase_realtime add table public.rfqs;\n  end if;\nend $$;\n", "0007": "-- Archē Broker Academy on the portal sign-in (Morten, 23 Oct 2026).\n-- progress: each person reads and writes their own; owner and operations read everyone's; the owner can reset anyone's.\n-- records: the director's training records (owner writes, owner and operations read).\n-- certificates: the certificate register (owner writes; anyone can check a certificate number).\ncreate table if not exists public.academy_progress (id text primary key, data jsonb not null default '{}'::jsonb, created_at timestamptz not null default now(), updated_at timestamptz not null default now());\ncreate table if not exists public.academy_records  (id text primary key, data jsonb not null default '{}'::jsonb, created_at timestamptz not null default now(), updated_at timestamptz not null default now());\ncreate table if not exists public.certificates     (id text primary key, data jsonb not null default '{}'::jsonb, created_at timestamptz not null default now(), updated_at timestamptz not null default now());\nalter table public.academy_progress enable row level security;\nalter table public.academy_records enable row level security;\nalter table public.certificates enable row level security;\nrevoke all on public.academy_progress from anon;\nrevoke all on public.academy_records from anon;\n\ndrop policy if exists acad_progress_self on public.academy_progress;\ndrop policy if exists acad_progress_staff_read on public.academy_progress;\ndrop policy if exists acad_progress_owner on public.academy_progress;\ncreate policy acad_progress_self on public.academy_progress for all using (id = auth.uid()::text) with check (id = auth.uid()::text);\ncreate policy acad_progress_staff_read on public.academy_progress for select using (public.is_staff());\ncreate policy acad_progress_owner on public.academy_progress for all using (public.is_owner()) with check (public.is_owner());\n\ndrop policy if exists acad_records_owner on public.academy_records;\ndrop policy if exists acad_records_staff_read on public.academy_records;\ncreate policy acad_records_owner on public.academy_records for all using (public.is_owner()) with check (public.is_owner());\ncreate policy acad_records_staff_read on public.academy_records for select using (public.is_staff());\n\ndrop policy if exists certs_owner on public.certificates;\ndrop policy if exists certs_verify on public.certificates;\ncreate policy certs_owner on public.certificates for all using (public.is_owner()) with check (public.is_owner());\ncreate policy certs_verify on public.certificates for select using (true);\n\ndo $$ begin\n  if not exists (select 1 from pg_publication_tables where pubname = 'supabase_realtime' and schemaname = 'public' and tablename = 'academy_progress') then\n    alter publication supabase_realtime add table public.academy_progress;\n  end if;\n  if not exists (select 1 from pg_publication_tables where pubname = 'supabase_realtime' and schemaname = 'public' and tablename = 'academy_records') then\n    alter publication supabase_realtime add table public.academy_records;\n  end if;\nend $$;\n", "0008": "-- Enquiry pool (Morten, 24 Oct 2026): every charter enquiry (website, charter email, phone) reaches the owner first.\n-- The owner releases it to all brokers (first come, first served) or assigns it to one broker, and can reassign at any time.\n-- enquiry_pool: the trip summary everyone in the pool may see. enquiry_contacts: the client's details, only for\n-- the broker who has the enquiry, and for owner and operations.\ncreate table if not exists public.enquiry_pool     (id text primary key, data jsonb not null default '{}'::jsonb, created_at timestamptz not null default now(), updated_at timestamptz not null default now());\ncreate table if not exists public.enquiry_contacts (id text primary key, data jsonb not null default '{}'::jsonb, created_at timestamptz not null default now(), updated_at timestamptz not null default now());\nalter table public.enquiry_pool enable row level security;\nalter table public.enquiry_contacts enable row level security;\nrevoke all on public.enquiry_pool from anon;\nrevoke all on public.enquiry_contacts from anon;\n\ndrop policy if exists pool_owner on public.enquiry_pool;\ndrop policy if exists pool_staff_read on public.enquiry_pool;\ndrop policy if exists pool_member_read on public.enquiry_pool;\ndrop policy if exists pool_member_take on public.enquiry_pool;\ncreate policy pool_owner on public.enquiry_pool for all using (public.is_owner()) with check (public.is_owner());\ncreate policy pool_staff_read on public.enquiry_pool for select using (public.is_staff());\n-- brokers see enquiries that are open to everyone, and their own\ncreate policy pool_member_read on public.enquiry_pool for select using (public.is_member() and (data->>'status' = 'released' or data->>'claimedBy' = auth.uid()::text));\n-- first come, first served: a broker may only turn an open enquiry into one taken by themselves; the row lock makes the first one win\ncreate policy pool_member_take on public.enquiry_pool for update using (public.is_member() and data->>'status' = 'released') with check (data->>'status' = 'claimed' and data->>'claimedBy' = auth.uid()::text);\n\ndrop policy if exists poolc_owner on public.enquiry_contacts;\ndrop policy if exists poolc_staff_read on public.enquiry_contacts;\ndrop policy if exists poolc_taker_read on public.enquiry_contacts;\ncreate policy poolc_owner on public.enquiry_contacts for all using (public.is_owner()) with check (public.is_owner());\ncreate policy poolc_staff_read on public.enquiry_contacts for select using (public.is_staff());\ncreate policy poolc_taker_read on public.enquiry_contacts for select using (public.is_member() and exists (select 1 from public.enquiry_pool p where p.id = enquiry_contacts.id and p.data->>'claimedBy' = auth.uid()::text));\n\ndo $$ begin\n  if not exists (select 1 from pg_publication_tables where pubname = 'supabase_realtime' and schemaname = 'public' and tablename = 'enquiry_pool') then\n    alter publication supabase_realtime add table public.enquiry_pool;\n  end if;\nend $$;\n", "0009": "-- Agreements signed in the portal (Morten, 24 Oct 2026): nothing is sent as a file by email.\n-- The owner sends the agreement after a passed assessment; the person reads it, fills in their details and signs in the\n-- portal; the owner countersigns, which also opens the portal and issues the onboarding package.\n-- One row per person (id = their user id). The person can read their own row and can only turn \"sent\" into \"signed\".\ncreate table if not exists public.agreements (id text primary key, data jsonb not null default '{}'::jsonb, created_at timestamptz not null default now(), updated_at timestamptz not null default now());\nalter table public.agreements enable row level security;\nrevoke all on public.agreements from anon;\n\ndrop policy if exists agr_owner on public.agreements;\ndrop policy if exists agr_staff_read on public.agreements;\ndrop policy if exists agr_self_read on public.agreements;\ndrop policy if exists agr_self_sign on public.agreements;\ncreate policy agr_owner on public.agreements for all using (public.is_owner()) with check (public.is_owner());\ncreate policy agr_staff_read on public.agreements for select using (public.is_staff());\ncreate policy agr_self_read on public.agreements for select using (id = auth.uid()::text);\ncreate policy agr_self_sign on public.agreements for update using (id = auth.uid()::text and data->>'status' = 'sent') with check (id = auth.uid()::text and data->>'status' = 'signed');\n\ndo $$ begin\n  if not exists (select 1 from pg_publication_tables where pubname = 'supabase_realtime' and schemaname = 'public' and tablename = 'agreements') then\n    alter publication supabase_realtime add table public.agreements;\n  end if;\nend $$;\n", "0010": "-- Trust and performance history (Morten, 26 Oct 2026): one row per week, kept for good, never trimmed.\n-- Each row holds every member's trust and performance score that week. Owner only: members and operations cannot read it.\ncreate table if not exists public.member_scores (id text primary key, data jsonb not null default '{}'::jsonb, created_at timestamptz not null default now(), updated_at timestamptz not null default now());\nalter table public.member_scores enable row level security;\nrevoke all on public.member_scores from anon;\ndrop policy if exists scores_owner on public.member_scores;\ncreate policy scores_owner on public.member_scores for all using (public.is_owner()) with check (public.is_owner());\n", "0011": "-- Supervised steps (Morten, 26 Oct 2026): while a member is supervised, each gated step (quote to client, taking an\n-- enquiry, first contact with a new prospect, recording payments, supplier quotes) waits for the owner's OK.\n-- One row per request. The member can create and amend their own pending requests and read their own; only an owner\n-- can approve or ask for changes. Owners release each step per member in Team.\ncreate table if not exists public.step_requests (owner_id uuid not null references auth.users(id), id text not null, data jsonb not null default '{}'::jsonb, updated_at timestamptz default now(), primary key (owner_id, id));\nalter table public.step_requests enable row level security;\nrevoke all on public.step_requests from anon;\ndrop policy if exists req_owner on public.step_requests;\ndrop policy if exists req_self_read on public.step_requests;\ndrop policy if exists req_self_ask on public.step_requests;\ndrop policy if exists req_self_amend on public.step_requests;\ncreate policy req_owner on public.step_requests for all using (public.is_owner()) with check (public.is_owner());\ncreate policy req_self_read on public.step_requests for select using (public.is_member() and owner_id = auth.uid());\ncreate policy req_self_ask on public.step_requests for insert with check (public.is_member() and owner_id = auth.uid() and data->>'status' = 'pending');\ncreate policy req_self_amend on public.step_requests for update using (public.is_member() and owner_id = auth.uid() and data->>'status' = 'pending') with check (public.is_member() and owner_id = auth.uid() and data->>'status' = 'pending');\n\ndo $$ begin\n  if not exists (select 1 from pg_publication_tables where pubname = 'supabase_realtime' and schemaname = 'public' and tablename = 'step_requests') then\n    alter publication supabase_realtime add table public.step_requests;\n  end if;\nend $$;\n", "0012": "-- Supervisor rights (Morten, 26 Oct 2026): the owner can let experienced members supervise, assess and approve.\n-- Rights are kept on the member's profile (data.rights), which only an owner can change. Nobody acts on their own work:\n-- supervisors cannot decide their own requests, and assessors cannot send an agreement to themselves.\n--   supervise: read everyone's supervised-step requests, approve or ask for changes on others' requests, and hand an\n--              approved pool enquiry to the person who asked for it\n--   assess:    see requests to join and academy progress, and send the agreement after a passed assessment\n--              (countersigning stays with the owner as signatory)\n--   approve:   approve bookings (operations members; they can already update trip status)\ncreate or replace function public.has_right(r text) returns boolean language sql stable security definer set search_path = public as $$\n  select exists (select 1 from public.profiles p where p.id = auth.uid() and p.active and coalesce((p.data->'rights'->>r)::boolean, false))\n$$;\n\ndrop policy if exists profiles_supervisor_read on public.profiles;\ncreate policy profiles_supervisor_read on public.profiles for select using (public.has_right('supervise') or public.has_right('assess'));\n\ndrop policy if exists req_supervisor_read on public.step_requests;\ndrop policy if exists req_supervisor_decide on public.step_requests;\ncreate policy req_supervisor_read on public.step_requests for select using (public.has_right('supervise'));\ncreate policy req_supervisor_decide on public.step_requests for update\n  using (public.has_right('supervise') and owner_id <> auth.uid() and data->>'status' = 'pending')\n  with check (public.has_right('supervise') and owner_id <> auth.uid() and data->>'status' in ('approved', 'changes'));\n\ndrop policy if exists pool_supervisor_assign on public.enquiry_pool;\ncreate policy pool_supervisor_assign on public.enquiry_pool for update\n  using (public.has_right('supervise') and data->>'status' = 'released')\n  with check (public.has_right('supervise') and data->>'status' = 'claimed' and data->>'claimedBy' <> auth.uid()::text);\n\ndrop policy if exists join_assessor_read on public.join_requests;\ncreate policy join_assessor_read on public.join_requests for select using (public.has_right('assess'));\ndrop policy if exists acad_progress_assessor_read on public.academy_progress;\ncreate policy acad_progress_assessor_read on public.academy_progress for select using (public.has_right('assess'));\ndrop policy if exists agr_assessor_read on public.agreements;\ndrop policy if exists agr_assessor_send on public.agreements;\ncreate policy agr_assessor_read on public.agreements for select using (public.has_right('assess'));\ncreate policy agr_assessor_send on public.agreements for insert with check (public.has_right('assess') and id <> auth.uid()::text and data->>'status' = 'sent');\n", "0013": "-- Alerts (Morten, 26 Oct 2026): who receives portal alerts, on which channel, for which events, and the company's\n-- official WhatsApp sender once it is set up. Owner only: phone numbers and emails here are never visible to members.\ncreate table if not exists public.alert_settings (id text primary key, data jsonb not null default '{}'::jsonb, created_at timestamptz not null default now(), updated_at timestamptz not null default now());\nalter table public.alert_settings enable row level security;\nrevoke all on public.alert_settings from anon;\ndrop policy if exists alerts_owner on public.alert_settings;\ncreate policy alerts_owner on public.alert_settings for all using (public.is_owner()) with check (public.is_owner());\n", "0014": "-- Alerts that keep coming until someone acts (Morten, 26 Oct 2026).\n-- 1. push_subs: each phone or computer that receives alerts. A person adds and removes only their own; owners see all.\n-- 2. Every 2 minutes Supabase calls the portal's alert check (pg_cron + pg_net, both free on Supabase).\ncreate table if not exists public.push_subs (owner_id uuid not null references auth.users(id) on delete cascade, id text not null, data jsonb not null default '{}'::jsonb, updated_at timestamptz default now(), primary key (owner_id, id));\nalter table public.push_subs enable row level security;\nrevoke all on public.push_subs from anon;\ndrop policy if exists push_owner_read on public.push_subs;\ndrop policy if exists push_self on public.push_subs;\ncreate policy push_owner_read on public.push_subs for select using (public.is_owner());\ncreate policy push_self on public.push_subs for all using (owner_id = auth.uid()) with check (owner_id = auth.uid());\n\ncreate extension if not exists pg_cron;\ncreate extension if not exists pg_net with schema extensions;\nselect cron.schedule('arche-alerts', '*/2 * * * *', $$ select net.http_post(url := 'https://portal.archeaviation.com/api/alerts', body := '{}'::jsonb, headers := '{\"Content-Type\": \"application/json\"}'::jsonb) $$);\n", "0015": "-- Assessments (Morten, 26 Oct 2026): the qualification checklist for each candidate, ticked by the owner or an\n-- assessor (supervisor right \"assess\", SQL 0012). One row per candidate (id = their user id). Never visible to the\n-- candidate or other members. Assessors cannot assess themselves.\n-- the supervisor-rights check from 0012, repeated here so this file also works if 0012 has not run yet\ncreate or replace function public.has_right(r text) returns boolean language sql stable security definer set search_path = public as $$\n  select exists (select 1 from public.profiles p where p.id = auth.uid() and p.active and coalesce((p.data->'rights'->>r)::boolean, false))\n$$;\ncreate table if not exists public.assessments (id text primary key, data jsonb not null default '{}'::jsonb, created_at timestamptz not null default now(), updated_at timestamptz not null default now());\nalter table public.assessments enable row level security;\nrevoke all on public.assessments from anon;\ndrop policy if exists assess_owner on public.assessments;\ndrop policy if exists assess_assessor on public.assessments;\ncreate policy assess_owner on public.assessments for all using (public.is_owner()) with check (public.is_owner());\ncreate policy assess_assessor on public.assessments for all using (public.has_right('assess') and id <> auth.uid()::text) with check (public.has_right('assess') and id <> auth.uid()::text);\n", "0016": "-- Supervision share (Morten, 26 Oct 2026): a supervisor sees the trips that pay them a supervision share, so their\n-- commission page can show it. They see only those trips' status record (price, gross profit, reference), and only\n-- when the share is theirs.\ndrop policy if exists status_supervisor_read on public.trip_status;\ncreate policy status_supervisor_read on public.trip_status for select using (public.is_member() and data->'supShare'->>'uid' = auth.uid()::text);\n", "0017": "-- Website statistics and organisation links (Morten, 26 Oct 2026: \"all traffic is monitored and used for internal\n-- analytical improvements and sales push (prospects)\").\n-- First-party only: no cookies, no browser storage, no outside services. The IP address is never stored; Vercel gives\n-- the country and city. Rows older than 13 months are deleted every night.\n-- The website can only ADD rows through submit_visit(); it can never read anything.\n-- Owner: sees everything (portal → Website). Brokers: see only visits that came through their own organisation links.\n\ncreate table if not exists public.site_links (\n  code text primary key check (code ~ '^[A-Za-z0-9]{6,12}$'),\n  owner_id uuid not null default auth.uid() references auth.users(id) on delete cascade,\n  lead_id text not null,\n  org text not null default '',\n  created_at timestamptz not null default now()\n);\nalter table public.site_links enable row level security;\nrevoke all on public.site_links from anon;\ndrop policy if exists links_owner on public.site_links;\ncreate policy links_owner on public.site_links for all using (public.is_owner()) with check (public.is_owner());\ndrop policy if exists links_self on public.site_links;\ncreate policy links_self on public.site_links for all using (owner_id = auth.uid()) with check (owner_id = auth.uid() and public.is_member());\n\ncreate table if not exists public.site_events (\n  id bigint generated always as identity primary key,\n  at timestamptz not null default now(),\n  visit text not null,\n  kind text not null,\n  detail text not null default '',\n  path text not null default '',\n  lang text not null default '',\n  ref text not null default '',\n  utm jsonb not null default '{}'::jsonb,\n  code text not null default '',\n  device text not null default '',\n  secs int not null default 0,\n  country text not null default '',\n  city text not null default ''\n);\ncreate index if not exists site_events_at on public.site_events (at);\ncreate index if not exists site_events_code on public.site_events (code) where code <> '';\ncreate index if not exists site_events_visit on public.site_events (visit);\nalter table public.site_events enable row level security;\nrevoke all on public.site_events from anon;\ndrop policy if exists events_owner on public.site_events;\ncreate policy events_owner on public.site_events for select using (public.is_owner());\ndrop policy if exists events_link_owner on public.site_events;\ncreate policy events_link_owner on public.site_events for select using (\n  code <> '' and exists (select 1 from public.site_links l where l.code = site_events.code and l.owner_id = auth.uid()));\n\ncreate or replace function public.submit_visit(p jsonb) returns void\nlanguage plpgsql security definer set search_path = public as $$\ndeclare recent int;\nbegin\n  if p is null or jsonb_typeof(p) <> 'object' or length(p::text) > 2000 then raise exception 'bad request'; end if;\n  if coalesce(p->>'kind','') not in ('view','section','call','whatsapp','email','portal','language','finder',\n     'quote_start','callback_start','quote_sent','callback_sent','leave') then raise exception 'bad kind'; end if;\n  if coalesce(p->>'visit','') !~ '^[a-z0-9]{6,20}$' then raise exception 'bad visit'; end if;\n  select count(*) into recent from public.site_events where at > now() - interval '10 minutes';\n  if recent > 5000 then return; end if;                                   -- flood guard: drop quietly\n  insert into public.site_events (visit, kind, detail, path, lang, ref, utm, code, device, secs, country, city)\n  values (p->>'visit', p->>'kind', left(coalesce(p->>'detail',''),60), left(coalesce(p->>'path',''),60), left(coalesce(p->>'lang',''),5),\n          left(coalesce(p->>'ref',''),80), case when jsonb_typeof(p->'utm') = 'object' then p->'utm' else '{}'::jsonb end,\n          left(regexp_replace(coalesce(p->>'code',''),'[^A-Za-z0-9]','','g'),12), left(coalesce(p->>'device',''),8),\n          least(greatest(coalesce((p->>'secs')::int,0),0),86400), left(coalesce(p->>'country',''),2), left(coalesce(p->>'city',''),60));\nend $$;\nrevoke all on function public.submit_visit(jsonb) from public;\ngrant execute on function public.submit_visit(jsonb) to anon, authenticated;\n\n-- Owner summary for the portal (one call; only the owner gets an answer)\ncreate or replace function public.site_stats(days int default 30) returns jsonb\nlanguage plpgsql security definer set search_path = public stable as $$\ndeclare since timestamptz := now() - make_interval(days => greatest(1, least(days, 400))); out jsonb;\nbegin\n  if not public.is_owner() then raise exception 'owner only'; end if;\n  with e as (select * from public.site_events where at >= since),\n  v as (select visit, min(at) at, max(country) country, max(city) city, max(device) device, max(path) path, max(lang) lang,\n               coalesce(nullif(max(utm->>'source'),''), nullif(max(ref),''), 'direct') src, max(utm->>'campaign') campaign, max(code) code\n        from e where kind = 'view' group by visit),\n  act as (select kind, count(distinct visit) n from e group by kind)\n  select jsonb_build_object(\n    'since', since,\n    'visits', (select count(*) from v),\n    'byDay', (select coalesce(jsonb_agg(x order by x->>'d'), '[]') from (select jsonb_build_object('d', to_char(at::date,'YYYY-MM-DD'), 'n', count(*)) x from v group by at::date) t),\n    'sources', (select coalesce(jsonb_agg(x), '[]') from (select jsonb_build_object('k', src, 'n', count(*)) x from v group by src order by count(*) desc limit 15) t),\n    'campaigns', (select coalesce(jsonb_agg(x), '[]') from (select jsonb_build_object('k', campaign, 'n', count(*),\n        'sent', (select count(distinct e2.visit) from e e2 where e2.kind in ('quote_sent','callback_sent') and e2.visit in (select visit from v v2 where v2.campaign = v.campaign))) x\n        from v where coalesce(campaign,'') <> '' group by campaign order by count(*) desc limit 15) t),\n    'countries', (select coalesce(jsonb_agg(x), '[]') from (select jsonb_build_object('k', coalesce(nullif(country,''),'?'), 'n', count(*)) x from v group by country order by count(*) desc limit 15) t),\n    'cities', (select coalesce(jsonb_agg(x), '[]') from (select jsonb_build_object('k', coalesce(nullif(city,''),'?') || ', ' || coalesce(nullif(country,''),'?'), 'n', count(*)) x from v group by city, country order by count(*) desc limit 15) t),\n    'pages', (select coalesce(jsonb_agg(x), '[]') from (select jsonb_build_object('k', path, 'n', count(*)) x from v group by path order by count(*) desc limit 10) t),\n    'devices', (select coalesce(jsonb_agg(x), '[]') from (select jsonb_build_object('k', coalesce(nullif(device,''),'?'), 'n', count(*)) x from v group by device order by count(*) desc) t),\n    'sections', (select coalesce(jsonb_agg(x), '[]') from (select jsonb_build_object('k', detail, 'n', count(distinct visit)) x from e where kind = 'section' group by detail order by count(distinct visit) desc) t),\n    'finder', (select coalesce(jsonb_agg(x), '[]') from (select jsonb_build_object('k', detail, 'n', count(distinct visit)) x from e where kind = 'finder' group by detail order by count(distinct visit) desc limit 10) t),\n    'actions', (select coalesce(jsonb_object_agg(kind, n), '{}') from act),\n    'avgSecs', (select coalesce(round(avg(secs)),0) from e where kind = 'leave' and secs between 1 and 7200),\n    'links', (select coalesce(jsonb_agg(x), '[]') from (select jsonb_build_object('code', l.code, 'org', l.org, 'lead', l.lead_id, 'by', l.owner_id,\n        'visits', count(distinct ev.visit), 'last', max(ev.at),\n        'acts', (select coalesce(jsonb_agg(distinct e3.kind), '[]') from e e3 where e3.code = l.code and e3.kind not in ('view','leave','section'))) x\n        from public.site_links l join e ev on ev.code = l.code group by l.code, l.org, l.lead_id, l.owner_id order by max(ev.at) desc limit 50) t)\n  ) into out;\n  return out;\nend $$;\nrevoke all on function public.site_stats(int) from public;\ngrant execute on function public.site_stats(int) to authenticated;\n\n-- keep 13 months only\ndo $$ begin\n  if exists (select 1 from pg_extension where extname = 'pg_cron') then\n    perform cron.unschedule(jobid) from cron.job where jobname = 'arche-site-events-retention';\n    perform cron.schedule('arche-site-events-retention', '17 3 * * *', $c$delete from public.site_events where at < now() - interval '13 months'$c$);\n  end if;\nend $$;\n\n-- live updates for the owner's Website page and brokers' link alerts (skipped if already added)\ndo $$ begin\n  if not exists (select 1 from pg_publication_tables where pubname = 'supabase_realtime' and schemaname = 'public' and tablename = 'site_events') then\n    alter publication supabase_realtime add table public.site_events;\n  end if;\nend $$;\n\n-- after-check: the portal confirms this step by calling site_stats\n"};

      return `<tr><td>${esc(x.name)}${x.onb ? "" : ` <span class="chip c-review">Onboarding</span>`}</td><td class="n">${x.trust ?? "–"}</td><td class="n">${x.perf ?? "–"}</td><td>${esc(mxQuad(x))}</td><td>${weak ? `${esc(weak[0])} ${pct(weak[2])}%: <span class="muted">${esc(weak[3])}</span>` : `<span class="muted">No data yet</span>`}</td></tr>`; }).join("")}</tbody></table></div>
    <details class="small" style="margin-top:8px"><summary>Each member's measures</summary>${rows.map(x => `<p style="margin:8px 0 2px"><b>${esc(x.name)}</b> · ${x.trips} trips in 180 days</p><p class="muted" style="margin:0">Trust: ${x.T.map(c => `${esc(c[0])} ${pct(c[2])}`).join(" · ")}<br>Performance: ${x.P.map(c => `${esc(c[0])} ${pct(c[2])}`).join(" · ")}</p>`).join("")}</details>` : "";
  return `<div class="panel" style="margin-top:16px" id="trustMatrix"><div class="row" style="justify-content:space-between"><h2 style="margin:0">Trust and performance</h2><span class="small muted">${rows.length} member${rows.length === 1 ? "" : "s"} · last 180 days</span></div>
    <p class="small muted">Trust (up) measures the house rules each member keeps: follow-up within 24 hours of landing, rating requests, service recovery for scores of 3 or less, files right first time, contracts signed on time, notices confirmed within 3 days and lead follow-up. Performance (right) measures results: quotes booked, bookings against the monthly target, the booking-cycle target and client ratings. Recalculated from live data on every visit; the dotted line shows where each member stood a month ago. A snapshot is kept every week, for good${S.mxHist && S.mxHist.weeks.length ? ` (${S.mxHist.weeks.length} week${S.mxHist.weeks.length === 1 ? "" : "s"} since ${fmtD(S.mxHist.weeks[0].at)})` : ""}. Hollow dots have little data yet.</p>
    ${rows.length ? svg : `<div class="empty"><p><b>No active members yet.</b> Members appear here once their agreement is countersigned.</p></div>`}${table}</div>`;
}

(function(){
  const _vToday = vToday;
  vToday = function(){ const h = _vToday(), i = h.indexOf('<div class="kpis">'), top = (typeof awayBlock === "function" ? awayBlock() : "") + (typeof leaveTodayFlags === "function" && leaveTodayFlags().length ? `<div class="panel" style="margin-bottom:16px"><h2>Leaving files</h2>${leaveTodayFlags().map(x => `<div class="flag"><span class="sev high" aria-hidden="true"></span><div><p>${esc(x)}</p></div></div>`).join("")}</div>` : "") + ownerTodoPrompt() + (typeof noticePrompt === "function" ? noticePrompt() : "") + (typeof reqTodayPanel === "function" ? reqTodayPanel() : ""); const out = i < 0 ? top + h : h.slice(0, i) + top + h.slice(i); return out + trustMatrix(); };
  const _vTeam = vTeam;
  vTeam = function(){ const h = _vTeam(); if (!S.isOwner || S.preview) return h; const add = ownerTodoPanel() + (typeof supervisionPanel === "function" ? supervisionPanel() : "") + (typeof noticeTeamPanel === "function" ? noticeTeamPanel() : "") + (typeof alertsPanel === "function" ? alertsPanel() : ""), k = h.trimStart().startsWith('<div class="head">') ? h.indexOf('</div></div>') + 12 : 0; return h.slice(0, k) + add + h.slice(k); };
  document.addEventListener("click", e => { const b = e.target.closest("[data-todo]"); if (!b) return; e.preventDefault(); todoAct(b.dataset.todo, b.dataset.id); });
  document.addEventListener("toggle", e => { if (e.target.dataset && e.target.dataset.todoDet === "later") S.todoLater = e.target.open; }, true);
})();

</script>
