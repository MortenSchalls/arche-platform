/* Layout: the Archē Executive website's look, carried into the work tool. One dark charcoal theme (as the website), hairline dividers, square corners, Prata headings, uppercase tracked labels, silver primary buttons, steel-blue accent. Lists left, open file right. */
:root{
  --bg:#eef1f5; --surface:#fbfcfd; --raised:#f0f2f6; --field:#ffffff; --ink:#1b1e23; --text:#363b42; --muted:#5d636b; --line:#d8dde4; --line2:#8e959e;
  --brand:#2c2f34; --brand-ink:#e6ebf1; --steel:#1f5fae; --steel-soft:#dde9fb;
  --ok:#147a3c; --ok-soft:#dcf2e3; --warn:#985a00; --warn-soft:#fdebc6; --bad:#c0281d; --bad-soft:#fddfdb; --info:#1f5fae; --info-soft:#dde9fb; --confirmed:#6a3fc0; --confirmed-soft:#ece3fc;
  --silver:linear-gradient(180deg,#fafbfc 0%,#dfe4ea 45%,#c6cbd2 70%,#e6ebf1 100%); --on-silver:#2b2e33;
  --primary-bg:#1f5fae; --primary-ink:#ffffff; --primary-shadow:0 2px 8px rgba(31,95,174,.28); --toast-bg:#1b1e23; --toast-ink:#f6f7f9;
  --hdr-bg:#2c2f34; --hdr-ink:#d9dee5; --hdr-strong:#f6f7f9; --hdr-muted:#aab0b8; --hdr-line:#43464c; --hdr-accent:#7fb0ff;
  --badge-bg:#c0281d; --badge-ink:#ffffff; --series-1:#2a78d6; --series-1-strong:#184f95; --track:#e2e6ec; --wm-ink:rgba(27,30,35,.05); --shadow:0 10px 30px rgba(27,30,35,.16); --sel-bar:#1f5fae; --kpi-1:#2a78d6; --kpi-2:#eb6834; --kpi-3:#1baf7a; --kpi-4:#6250d6; --kpi-5:#e87ba4; --lane-1:#6250d6; --lane-2:#2a78d6; --lane-3:#eb6834; --lane-4:#1baf7a;
  --display:"Prata", "Didot", Georgia, serif; --accentserif:"Prata", "Didot", Georgia, serif; --body:"Inter", "Helvetica Neue", system-ui, sans-serif; --mono:"Inter", "Helvetica Neue", system-ui, sans-serif;
  --r:0px; color-scheme:light;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--body);margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--brand)}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--brand);color:var(--brand-ink)}
.bar .in{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:1400px;margin:0 auto}
.bar img{height:38px;width:auto}
.bar .pname{font-family:var(--display);letter-spacing:.14em;font-size:13px;opacity:.85}
.bar nav{display:flex;gap:4px;flex-wrap:wrap;margin-left:auto}
.bar nav button{background:transparent;color:var(--brand-ink);border:1px solid transparent;border-radius:999px;padding:6px 12px;font:600 13px var(--body);cursor:pointer;opacity:.8}
.bar nav button[aria-current="page"]{border-color:rgba(233,238,244,.45);opacity:1}
.bar nav button:hover{opacity:1}
.who{display:flex;align-items:center;gap:8px;font-size:12px}
.who img{width:24px;height:24px;border-radius:50%}
.rolechip{border:1px solid rgba(233,238,244,.4);border-radius:999px;padding:2px 9px;font-size:11px;letter-spacing:.06em;text-transform:uppercase}
.wrap{max-width:1400px;margin:0 auto;padding-block:18px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1{font:600 22px/1.25 var(--body);margin:0;text-wrap:balance}
h2{font:600 16px/1.3 var(--body);margin:0 0 8px}
h3{font:600 13px/1.3 var(--body);margin:0 0 6px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
p{margin:0}
.muted{color:var(--muted)}
a{color:var(--steel)}
.small{font-size:13px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:14px}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0}

.btn.primary{background:var(--steel);border-color:var(--steel);color:var(--surface)}

input,select,textarea{font:15px var(--body);color:var(--ink);background:var(--raised);border:1px solid var(--line);border-radius:6px;padding:8px 10px;width:100%;min-width:0}

.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}

.check{display:flex;gap:10px;align-items:flex-start;font-size:14px;padding:6px 0;border-bottom:1px solid var(--line)}

.chip::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.c-enquiry{background:var(--raised);color:var(--muted);border:1px solid var(--line)}
.c-quoted{background:var(--info-soft);color:var(--info)}
.c-review{background:var(--warn-soft);color:var(--warn)}
.c-returned{background:var(--bad-soft);color:var(--bad)}
.c-issued,.c-clientPaid{background:var(--steel-soft);color:var(--steel)}
.c-flown{background:var(--ok-soft);color:var(--ok)}
.c-cancelled{background:var(--raised);color:var(--muted);text-decoration:line-through}
.list{display:flex;flex-direction:column}
.item{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;padding:12px 10px;border-bottom:1px solid var(--line);cursor:pointer;border-radius:6px}
.item:hover{background:var(--raised)}
.item[aria-selected="true"]{background:var(--steel-soft)}
.item .t{font-weight:600;min-width:0;overflow-wrap:anywhere}
.item .s{font-size:13px;color:var(--muted);min-width:0}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:16px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.kpi .v{font:500 20px var(--mono);font-variant-numeric:tabular-nums}
.kpi .l{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th{text-align:left;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;padding:8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:8px;border-bottom:1px solid var(--line);vertical-align:top}
td.n,th.n{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.price{display:grid;grid-template-columns:1fr auto;gap:4px 16px;font-size:14px}
.price .tot{font-weight:700;border-top:1px solid var(--line);padding-top:6px}
.note{padding:10px 12px;border-radius:6px;font-size:14px}
.note.warn{background:var(--warn-soft);color:var(--warn)}
.note.bad{background:var(--bad-soft);color:var(--bad)}
.note.ok{background:var(--ok-soft);color:var(--ok)}
.note.info{background:var(--info-soft);color:var(--info)}
.legs .leg{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr)) auto;gap:8px;align-items:end;margin-bottom:8px}
.hist{font-size:13px;display:flex;flex-direction:column;gap:6px;max-height:260px;overflow:auto}
.hist div{display:grid;grid-template-columns:130px minmax(0,1fr);gap:8px}
.flag{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line)}
.flag .sev{flex:none;width:8px;align-self:stretch;border-radius:4px}
.sev.high{background:var(--bad)} .sev.med{background:var(--warn)} .sev.low{background:var(--info)}
.empty{padding:28px 16px;text-align:center;color:var(--muted)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--surface);padding:10px 16px;border-radius:6px;font-size:14px;z-index:20;max-width:calc(100% - 32px)}
.tag{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--warn);border:1px solid var(--warn);border-radius:4px;padding:0 5px}
.lock{font-size:12px;color:var(--muted)}
.confirm{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:10px;border:1px dashed var(--bad);border-radius:6px}
@media (min-width:981px){.grid2>#detail,.grid2>.pdetail{position:sticky;top:calc(var(--hdr,76px) + 12px);max-height:calc(100vh - var(--hdr,76px) - 24px);overflow:auto}.grid2>.panel>.list.scroll{max-height:calc(100vh - 220px);overflow:auto}}
.filters{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:16px}
.kbtn{text-align:left;cursor:pointer;font:inherit;color:inherit}
.kbtn[aria-pressed="true"]{border-color:var(--steel);background:var(--steel-soft)}
.avs{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:6px;font-size:14px}
.avt{display:inline-block;min-width:118px;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.wm{position:fixed;inset:0;pointer-events:none;z-index:4;background-repeat:repeat}
.guard{-webkit-user-select:none;user-select:none}
.ai{background:var(--info-soft);border-color:transparent}
.aiout{white-space:pre-wrap;font-size:14px;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:12px;max-height:420px;overflow:auto}
.chat{display:flex;flex-direction:column;gap:10px;max-height:56vh;overflow:auto}
.msg{white-space:pre-wrap;padding:10px 12px;border-radius:8px;font-size:14px;max-width:92%}
.msg.user{align-self:flex-end;background:var(--steel);color:var(--surface)}
.msg.assistant{align-self:flex-start;background:var(--raised);border:1px solid var(--line)}
@media (prefers-reduced-motion: no-preference){.item,.btn{transition:background .12s,border-color .12s}}


/* ---- charter confirmation sheets (same paper styles as the confirmation form) ---- */
.paper{--paper:#FFFFFF;--paper-ink:#1E2228;--paper-muted:#5C6672;--paper-rule:#CDD3DA;--paper-fill:#F1F3F6;--band:#34373D;--display:"Cinzel","Trajan Pro",Georgia,serif;--body:"Hanken Grotesk","Segoe UI",system-ui,sans-serif;display:flex;flex-direction:column;gap:16px;color:#1E2228;letter-spacing:normal;font-weight:400}

<script>
"use strict";
/* ---------- state ---------- */
const STAGES = {enquiry:"Enquiry", quoted:"Quoted", review:"With operations", returned:"Returned to broker", issued:"Confirmed", clientPaid:"Client paid", flown:"Flown", cancelled:"Cancelled"};
const BROKER_CHECKS = [
  ["never","Trip checked against the never-sell list (Module 2.4): no illegal charter, cabotage confirmed, US and EU rules met"],
  ["risk","Trip risk screen recorded; every amber point confirmed in writing; no red open"],
  ["aoc","Operator AOC and operations specifications on file, aircraft listed on them"],
  ["ins","Operator insurance certificate on file, including commercial passenger liability"],
  ["audit","Safety audit checked (ARGUS Gold Plus or higher, or Wyvern Wingman; Gold or unrated only with director approval)"],
  ["route","Routing, permits and continuous journey checked with the operator"],
  ["terms","Operator's cancellation and payment terms are no softer for Archē Executive than ours"]];
const OPS_CHECKS = [["kyc","Charterer KYC and sanctions screening done (operations)"],["pay","Paynode payment request created from the Avinode trip (operations)"]];
const DEFAULT_TERMS = {margin:0.07, unit:45000, threshold:8, rate1:0.27, rate2:0.35, consultRate:0.10};
const S = {db:null, user:null, uid:null, isOwner:false, canEdit:false, role:"loading", roster:{}, joins:{}, myJoin:null, myRoster:null,
  terms:{...DEFAULT_TERMS}, desks:{}, status:{}, payouts:{}, subs:{}, view:"trips", sel:null, preview:"", names:{}, filter:"open", editing:false, prospects:{}, leads:{}, staffLeads:{}, access:{}, chat:[], pSel:null, pFilter:"", pNew:false, pf:null, intel:null, company:{}, confDraft:null, confFor:null, confRevise:false, prevView:"trips", dirty:new Set(), assignCfg:{}, board:null, assignRun:null, finder:{}, alsoBroker:false, fromLead:null, engineBusy:false, enginePreview:null};
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const usd = n => (isFinite(n) ? "USD " + Math.round(n).toLocaleString("en-US") : "–");
const num = v => { const n = parseFloat(String(v ?? "").replace(/[^0-9.\-]/g, "")); return isFinite(n) ? n : 0; };
const now = () => new Date().toISOString();
const fmtD = iso => iso ? new Date(iso).toLocaleDateString("en-GB", {day:"2-digit", month:"short", year:"numeric"}) : "–";
const fmtT = iso => iso ? new Date(iso).toLocaleString("en-GB", {day:"2-digit", month:"short", hour:"2-digit", minute:"2-digit", timeZoneName:"short"}) : "–";
const newId = p => p + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
function toast(msg){ const t = $("toast"); t.textContent = msg; t.hidden = false; clearTimeout(toast.h); toast.h = setTimeout(() => t.hidden = true, 3200); }
const isStaff = () => S.role === "owner" || S.role === "ops";
const acting = () => S.preview || S.role;               // owner can preview the broker and operations screens

/* ---------- pricing and commission ---------- */
function priceOf(op, direct){ const cost = num(op) + num(direct); return cost > 0 ? Math.ceil(cost / (1 - S.terms.margin)) : 0; }
function stageOf(d, st){
  if (st && st.state) {
    if (st.state === "returned" && d && d.submittedAt && d.submittedAt > (st.updatedAt || "")) return "review";
    return st.state;
  }
  if (!d) return "enquiry";
  if (d.stage === "submitted") return "review";
  if (["enquiry", "quoted", "cancelled"].includes(d.stage)) return d.stage;   // brokers can only set these; money stages come from operations' records
  return num(d.quote && d.quote.opPrice) > 0 ? "quoted" : "enquiry";
}
/* commission for one broker: trips that have flown and been paid, grouped by month flown; 27% on the first 8 standard bookings, 35% after */
function commissionFor(bid){
  const out = {};
  const sts = S.status[bid] || {};
  const rows = Object.entries(sts).filter(([,s]) => s.state === "flown" && s.clientPaid).map(([did, s]) => ({did, s})).sort((a, b) => (a.s.flownDate || "").localeCompare(b.s.flownDate || ""));
  for (const {did, s} of rows) {
    const m = (s.flownDate || "").slice(0, 7); if (!m) continue;
    const mo = out[m] || (out[m] = {units:0, gp:0, comm:0, trips:[]});
    const units = num(s.price) / S.terms.unit, gp = num(s.price) - num(s.opPrice) - num(s.direct) + num(s.xsClient) - num(s.xsCost);
    const lowUnits = Math.max(0, Math.min(units, S.terms.threshold - mo.units)), highUnits = units - lowUnits;
    const isCons = ((S.roster[bid] || (bid === S.uid ? S.myRoster : null) || {}).role) === "consultant";
    const comm = isCons ? gp * S.terms.consultRate : (units > 0 ? gp * (lowUnits * S.terms.rate1 + highUnits * S.terms.rate2) / units : 0);
    mo.units += units; mo.gp += gp; mo.comm += comm; mo.trips.push({did, ref:s.ref, price:num(s.price), gp, units, comm});
  }
  return out;
}

/* ---------- boot ---------- */
async function boot(){
  if (!window.claude || !claude.use) { bootFail(); return; }
  const [db, user] = await Promise.all([claude.use("db"), claude.use("user")]);
  if (!db || !user) { bootFail(); return; }
  S.db = db; S.user = user; (window.requestIdleCallback || (f => setTimeout(f, 2500)))(() => loadAirports());
  S.uid = await user.id(); S.isOwner = await user.isOwner(); S.canEdit = await user.canEdit();
  if (S.uid) watchCol(`train/${S.uid}/runs`, snap => { S.trRuns = {}; snap.docs.forEach(d => S.trRuns[d.id] = d.data()); render(); });
  if (S.uid) watchCol(`asks/${S.uid}/items`, snap => { S.myAsks = {}; snap.docs.forEach(d => S.myAsks[d.id] = d.data()); render(); });
  if (!S.uid) { bootFail("Sign in to use the portal."); return; }
  const me = await user.me(); S.myName = me.name || "";
  watermark(`ARCHĒ EXECUTIVE · CONFIDENTIAL · ${S.myName || "Signed-in user"}`);
  watchDoc("config/company", snap => { S.company = snap.exists ? snap.data() : {}; render(); });
  watchCol("faq", snap => { S.faq = {}; snap.docs.forEach(d => S.faq[d.id] = d.data()); render(); });
  watchDoc("config/assign", snap => { S.assignCfg = snap.exists ? snap.data() : {}; render(); });
  watchDoc("config/board", snap => { S.board = snap.exists ? snap.data() : null; render(); });
  watchDoc("config/terms", snap => { S.terms = {...DEFAULT_TERMS, ...(snap.exists ? snap.data() : {})}; render(); });
  if (S.isOwner || S.canEdit) {
    watchCol("roster", snap => { S.roster = {}; snap.docs.forEach(d => S.roster[d.id] = d.data()); decideRole(); Object.keys(S.roster).forEach(watchBroker); render(); });
    watchCol("join", snap => { S.joins = {}; snap.docs.forEach(d => S.joins[d.id] = d.data()); render(); });
    watchBroker(S.uid);
    if (S.isOwner) watchDoc("config/backup", snap => { S.backup = snap.exists ? snap.data() : null; });
    if (S.isOwner) watchDoc("config/launch", snap => { S.launch = snap.exists ? snap.data() : {}; render(); });
    if (S.isOwner) watchDoc("intel/spend", snap => { S.spend = snap.exists ? snap.data() : null; render(); });
    if (S.isOwner) watchDoc("intel/logaudit", snap => { S.auditDone = snap.exists ? snap.data() : null; render(); });
    if (S.isOwner) watchDoc("intel/drive", snap => { const first = S.drive === undefined; S.drive = snap.exists ? snap.data() : null; if (first) setTimeout(() => driveSync(false), 4000); });
    if (S.isOwner) { watchDoc("intel/faq", snap => { S.faqRun = snap.exists ? snap.data() : null; }); setTimeout(() => autoFaq(), 12000); }
    watchDoc("intel/assign", snap => { S.assignRun = snap.exists ? snap.data() : null; render(); });
    watchCol(`leads/${S.uid}/items`, snap => { S.leads = {}; snap.docs.forEach(d => S.leads[d.id] = d.data()); render(); });
    watchCol("optouts", snap => { S.optouts = {}; snap.docs.forEach(d => S.optouts[d.id] = true); });
    setTimeout(() => autoEngine(), 7000);
    watchDoc("intel/status", snap => { S.intel = snap.exists ? snap.data() : null; render(); });
    watchCol("prospects", snap => { S.prospects = {}; snap.docs.forEach(d => S.prospects[d.id] = d.data()); render(); });
    watchCol("rfqs", snap => { S.rfqs = {}; snap.docs.forEach(d => S.rfqs[d.id] = d.data()); render(); });   // supplier quotes: staff only
    if (S.isOwner) watchCol("owner", snap => { S.inv = {}; snap.docs.forEach(d => S.inv[d.id] = d.data()); render(); });   // investors and partners: owner only
    if (S.isOwner) watchCol("access", snap => { S.access = {}; snap.docs.forEach(d => S.access[d.id] = d.data()); render(); });
    if (!S.isOwner) S.db.doc("access/" + S.uid).set({lastSeen: now(), role:"ops"}).catch(() => {});
  } else {
    watchCol(`leads/${S.uid}/items`, snap => { S.leads = {}; snap.docs.forEach(d => S.leads[d.id] = d.data()); render(); });
    watchCol("optouts", snap => { S.optouts = {}; snap.docs.forEach(d => S.optouts[d.id] = true); });
    S.db.doc("access/" + S.uid).set({lastSeen: now(), role:"broker"}).catch(() => {});
    watchDoc("roster/" + S.uid, snap => { S.myRoster = snap.exists ? snap.data() : null; decideRole(); if (S.myRoster && S.myRoster.active !== false) watchBroker(S.uid); render(); });
    watchDoc("join/" + S.uid, snap => { S.myJoin = snap.exists ? snap.data() : null; render(); });
  }
  decideRole(); render();
}
function bootFail(msg){ $("main").innerHTML = `<div class="panel empty"><p><b>The portal could not open here.</b></p><p class="small">${esc(msg || "Sign in again, or ask the owner to approve your access.")}</p></div>`; }
function decideRole(){
  const me = S.isOwner ? null : (S.roster[S.uid] || S.myRoster);
  if (S.isOwner) S.role = "owner";
  else if (me && me.active === false) S.role = "inactive";
  else if (me && me.role === "ops" && S.canEdit) S.role = "ops";
  else if (me && me.book && S.canEdit && (me.role === "broker" || me.role === "consultant")) { S.role = "ops"; S.alsoBroker = true; }
  else if (me && (me.role === "broker" || me.role === "consultant")) S.role = "broker";
  else S.role = "pending";
  if (S.role === "ops" && !["home","queue","quotes","trips","commission","control","prospects","assistant","leads","help","training"].includes(S.view)) S.view = "home";
  if ((S.role === "broker" || S.role === "ops") && S.view === "trips" && !S.viewSet) { S.view = "home"; S.viewSet = true; }
  if (S.role === "owner" && S.view === "trips" && !S.viewSet) { S.view = "today"; S.viewSet = true; }
}
const inSnap = fn => snap => { S.inSnap = true; try { fn(snap); } finally { S.inSnap = false; } };   // renders from live updates are batched into one frame
function watchDoc(path, fn){ if (S.subs[path]) return; S.subs[path] = S.db.doc(path).onSnapshot(inSnap(fn), e => console.warn(path, e.code)); }
function watchCol(path, fn){ if (S.subs[path]) return; S.subs[path] = S.db.collection(path).onSnapshot(inSnap(fn), e => console.warn(path, e.code)); }
function watchBroker(bid){
  watchCol(`desk/${bid}/deals`, snap => { const o = {}; snap.docs.forEach(d => o[d.id] = d.data()); S.desks[bid] = o; render(); });
  watchCol(`status/${bid}/deals`, snap => { const o = {}; snap.docs.forEach(d => o[d.id] = d.data()); S.status[bid] = o; render(); });
  watchCol(`payouts/${bid}/months`, snap => { const o = {}; snap.docs.forEach(d => o[d.id] = d.data()); S.payouts[bid] = o; render(); });
}

function allTrips(){
  const out = [];

  for (const bid of bids) {
    const desk = S.desks[bid] || {}, sts = S.status[bid] || {};

/* ---------- control: monitoring flags ---------- */
function controlStats(){
  const trips = allTrips(), flags = [], byB = {};
  const day = 864e5, t0 = Date.now();
  for (const t of trips) {
    const b = byB[t.bid] || (byB[t.bid] = {enq:0, quoted:0, sent:0, confirmed:0, flown:0, cancelled:0});
    b.enq++; if (num(t.d.quote && t.d.quote.opPrice)) b.quoted++; if (["review","issued","clientPaid","flown","returned"].includes(t.stage)) b.sent++;
    if (["issued","clientPaid","flown"].includes(t.stage)) b.confirmed++; if (t.stage === "flown") b.flown++; if (t.stage === "cancelled") b.cancelled++;
    const upd = Date.parse(t.d.updated || t.d.created || 0);
    if (t.stage === "quoted" && t0 - upd > 14 * day) flags.push(["med", `Quote with no booking for ${Math.floor((t0 - upd) / day)} days`, t]);
    if (t.stage === "enquiry" && t0 - upd > 7 * day) flags.push(["low", `Enquiry not quoted for ${Math.floor((t0 - upd) / day)} days`, t]);
    if (t.stage === "issued" && t.st && t0 - Date.parse(t.st.issuedAt || 0) > 5 * day) flags.push(["high", "Confirmed more than 5 days ago and client has not paid", t]);
    if (t.stage === "issued" && t.st && t.st.confIssued && !t.st.signed && t0 - Date.parse(t.st.confIssued.at || t.st.issuedAt || 0) > 2 * day) flags.push(["high", `Confirmation issued ${Math.floor((t0 - Date.parse(t.st.confIssued.at || t.st.issuedAt)) / day)} days ago and not signed yet`, t]);
    if (t.st && t.st.opPrice && t.d.quote && num(t.d.quote.opPrice) && num(t.d.quote.opPrice) !== num(t.st.opPrice)) flags.push(["med", `Broker's operator price ${usd(num(t.d.quote.opPrice))} differs from Avinode ${usd(num(t.st.opPrice))}`, t]);
    const legs = (t.d.trip && t.d.trip.legs) || [];
    if (["issued"].includes(t.stage) && legs[0] && legs[0].date && Date.parse(legs[0].date) < t0) flags.push(["high", "Departure date has passed and the client has not paid", t]);
  }
  const clients = {};
  for (const t of trips) { const e = (t.d.client && t.d.client.email || "").toLowerCase().trim(); if (!e) continue; (clients[e] = clients[e] || new Set()).add(t.bid); }
  for (const [e, s] of Object.entries(clients)) if (s.size > 1) flags.push(["med", `Same client (${e}) is with ${s.size} brokers`, null]);
  for (const [bid, b] of Object.entries(byB)) if (b.quoted >= 6 && b.confirmed / b.quoted < 0.15) flags.push(["high", `${nm(bid)}: ${b.quoted} quotes but only ${b.confirmed} confirmed through the portal`, null]);
  const order = {high:0, med:1, low:2}; flags.sort((a, b) => order[a[0]] - order[b[0]]);
  return {flags, byB};
}

/* ---------- AI layer ---------- */
const RULES_TEXT = `You support brokers of Archē Executive (said ar-KAY), a charter brokerage registered in Singapore that sells whole-aircraft private charters worldwide on third-party operators. It is the broker, never the operator.
House rules:
- Client price = (operator price + direct trip costs) / 0.93, rounded up (7% of the client price is Archē's margin). A lower price needs director approval through operations.
- Every booking runs through Avinode. The client pays only through the Paynode payment request operations sends from the Avinode trip. Never send or accept bank details by email, chat or messaging apps.
- Only operations issues a charter confirmation, after KYC and sanctions screening.
- Never sell: illegal charter (no valid AOC for commercial flights); cabotage (a foreign operator flying a domestic leg) unless the continuous journey is confirmed in writing by the operator; US domestic legs on non-US operators; intra-EU legs on non-EU operators without permission; per-seat sales; flights for sanctioned persons or embargoed places; operators on the EU Air Safety List; aircraft chartered or controlled by Russian nationals into the EU; medical or air-ambulance flights; travel packages without a licence; trips where passenger names are hidden.
- Paynode cannot send or receive funds for Belarus, occupied Ukrainian regions, Cuba, Iran, Kazakhstan, Libya, Myanmar, North Korea, Russia, South Sudan, Sudan, Syria and Venezuela: a payer or operator there is red.
- Safety standard: ARGUS Gold Plus or higher, or Wyvern Wingman; ARGUS Gold or unrated only with director approval.
- Disclose to the client: Archē is the broker, the operator's legal name as on its AOC, aircraft type and registration, the full price, and anything charged after the flight.
- Trip risk screen: green, amber or red; every amber point confirmed in writing; nothing red goes ahead.
- Marketing: never claim a fleet; business contacts only; honour every opt-out and do-not-call register; follow data-protection law (PDPA).
Write plainly in short sentences, as an experienced charter operations manager would. Do not invent facts such as permit lead times, prices or regulations you are not sure of: say what to check and with whom.`;
const STAGE_BASE = {enquiry:15, quoted:35, review:60, returned:40, issued:78, clientPaid:92, flown:100, cancelled:0};
function winScore(t){
  let s = STAGE_BASE[t.stage] ?? 10; const day = 864e5, now0 = Date.now();
  if (t.stage === "flown" || t.stage === "cancelled") return s;
  const upd = Date.parse(t.d.updated || t.d.created || 0) || now0, age = (now0 - upd) / day;
  if (t.stage === "quoted" && age > 3) s -= Math.min(25, Math.round(age - 3));
  if (t.stage === "enquiry" && age > 2) s -= Math.min(12, Math.round(2 * (age - 2)));
  const c = t.d.client || {}; if (!c.email && !c.phone) s -= 5;
  const ck = t.d.checks || {}; const done = BROKER_CHECKS.filter(([k]) => ck[k]).length;
  if (["quoted","enquiry"].includes(t.stage)) s += Math.round(done * 1.5);
  const legs = (t.d.trip && t.d.trip.legs) || []; const dep = legs[0] && legs[0].date ? Date.parse(legs[0].date) : 0;
  if (dep && ["enquiry","quoted","review"].includes(t.stage) && dep - now0 < 3 * day) s -= 10;
  if (dep && dep < now0 && !["clientPaid","flown"].includes(t.stage)) s = Math.min(s, 5);
  return Math.max(1, Math.min(99, s));
}
const scoreChip = n => `<span class="chip ${n >= 70 ? "c-flown" : n >= 40 ? "c-quoted" : "c-returned"}" title="Chance this trip books and flies, updated live">Win ${n}%</span>`;
function tripForAI(t){
  const d = t.d, st = t.st || {}, q = d.quote || {}, c = d.client || {}, tr = d.trip || {};
  return {stage: STAGES[t.stage], client:{company:c.company, residence:c.country, payerSameAsClient: !c.payer, contactOnFile: !!(c.email || c.phone)}, legs: tr.legs || [], category: tr.category, notes: tr.notes,
    quote:{operator:q.operator, aircraft:q.aircraft, registration:q.tail, avinodeTrip:q.avinode, operatorPrice:q.opPrice, directCosts:q.direct, clientPrice: st.price || priceOf(q.opPrice, q.direct)},
    checksTicked: BROKER_CHECKS.filter(([k]) => (d.checks || {})[k]).map(x => x[1].split(" (")[0]), checksMissing: BROKER_CHECKS.filter(([k]) => !(d.checks || {})[k]).map(x => x[1].split(" (")[0]),

async function suggestApproach(l, outEl, btn){
  const sample = await claude.use("sample"); if (!sample) { outEl.textContent = "Not available in this view."; return; }

  const lead = {organisation:l.org, segment:l.segment, country:l.country, why:l.why, approach:l.approach, namedBusinessContacts:(l.contacts || []).map(c => ({role: c.role, foundOn: c.sourceType})), contactSoFar:(l.log || []).map(x => `${x.channel}: ${LEAD_STATUS[x.outcome] || x.outcome}${x.note ? " (" + x.note + ")" : ""}`)};
  const prompt = `${RULES_TEXT}\n\nSuggest how this broker should approach the organisation below: the best first contact (by role; if named business contacts are on file, address one of them as [contact name], never invent a name), a short first message of under 120 words that says where we found their details ("We found your details on [source].") and ends with an easy opt-out line, two questions to qualify their charter needs, and the follow-up timing. Do not claim we own aircraft. Use only business channels.\n\nLead (JSON):\n${JSON.stringify(lead, null, 1)}`;

async function prospectAction(a, el){
  const id = S.pSel, p = S.prospects[id]; if (!p) return;
  try {
    if (a === "pAssign") {
      const bid = $("pAssign").value; if (!bid) { toast("Choose a broker first."); return; }
      if (p.status === "dnc") { toast("This organisation is Do not contact."); return; }
      await assignProspect(id, bid, "Assigned by " + (S.role === "owner" ? "the owner" : "operations"));
      toast("Assigned to " + nm(bid)); loadStaffLeads(); return;
    }
    if (a === "pDnc") { await dncProspect(id); audit("Prospect marked Do not contact", p.org); toast("Marked Do not contact"); loadStaffLeads(); return; }
    if (a === "pKind") { if (!S.isOwner) return; const k = ["partner", "operator"].includes($("pKind").value) ? $("pKind").value : "client"; if (k === (p.kind || "client")) { toast("No change."); return; }
      const label = {client: "potential client", partner: "referral partner", operator: "charter operator"}[k];
      await S.db.doc("prospects/" + id).update(k === "operator" ? {kind: k, segment: "Operator"} : {kind: k}); audit("Prospect type changed", `${p.org} · ${label}`); toast("Now a " + label + "."); return; }
    if (a === "opScreen") { if (!S.isOwner) return; const hit = el && el.dataset.res === "hit";
      const screen = Object.assign({}, (p.ops || {}).screen, {entity: hit ? "hit" : "clear", at: now(), by: S.uid});
      await S.db.doc("prospects/" + id).update(hit ? {ops: Object.assign({}, p.ops, {screen}), status: "dnc", dncAt: now()} : {ops: Object.assign({}, p.ops, {screen})});
      audit("Operator sanctions screen", `${p.org} · ${hit ? "match found: do not use" : "no match"}`); toast(hit ? "Recorded: match found. Marked Do not use." : "Recorded: no match on the sanctions lists."); return; }
    if (a === "pUndoDnc") { if (!S.isOwner || p.status !== "dnc") return;
      await S.db.doc("prospects/" + id).update({status: "new", dncAt: null, assignedTo: null, history: [...(p.history || []), {t: now(), restart: true, reason: "Do not contact undone by the owner"}]});
      audit("Do not contact undone", p.org); toast("Back in the list as new. It is assigned at the next round."); loadStaffLeads(); return; }
  } catch(e){ toast("Could not save. Only the owner and operations can change prospects."); }
}

/* ---------- Routing knowledge: ICAO airport prefixes and registration prefixes ---------- */
const ICAO2 = {VT:"Thailand",WS:"Singapore",WM:"Malaysia",WB:"Malaysia",WA:"Indonesia",WI:"Indonesia",WR:"Indonesia",WQ:"Indonesia",RP:"Philippines",VV:"Vietnam",VD:"Cambodia",VL:"Laos",VY:"Myanmar",VH:"Hong Kong",VM:"Macau",RC:"Taiwan",RJ:"Japan",RO:"Japan",RK:"South Korea",VA:"India",VE:"India",VI:"India",VO:"India",VC:"Sri Lanka",VR:"Maldives",VN:"Nepal",OP:"Pakistan",OM:"United Arab Emirates",OE:"Saudi Arabia",OT:"Qatar",OB:"Bahrain",OK:"Kuwait",OO:"Oman",OJ:"Jordan",OL:"Lebanon",LL:"Israel",HE:"Egypt",LF:"France",LI:"Italy",LE:"Spain",LP:"Portugal",LS:"Switzerland",ED:"Germany",ET:"Germany",EG:"United Kingdom",EI:"Ireland",EH:"Netherlands",EB:"Belgium",EL:"Luxembourg",LO:"Austria",LG:"Greece",LT:"Turkey",LK:"Czech Republic",EP:"Poland",LH:"Hungary",LD:"Croatia",LJ:"Slovenia",LM:"Malta",LC:"Cyprus",EK:"Denmark",ES:"Sweden",EN:"Norway",EF:"Finland",NZ:"New Zealand",NF:"Fiji",MM:"Mexico",SB:"Brazil",SC:"Chile",SA:"Argentina",SK:"Colombia",SP:"Peru",FA:"South Africa",HK:"Kenya",DN:"Nigeria",GM:"Morocco",FM:"Madagascar",FI:"Mauritius",FS:"Seychelles",TN:"Netherlands Antilles",MY:"Bahamas",TJ:"Puerto Rico",ZK:"North Korea",ZM:"Mongolia",UA:"Kazakhstan",UT:"Uzbekistan"};
const ICAO1 = {K:"United States",C:"Canada",Y:"Australia",Z:"China",U:"Russia"};
function icaoCountry(code){ code=String(code||"").toUpperCase(); if(code.length!==4) return ""; return ICAO2[code.slice(0,2)] || ICAO1[code[0]] || ""; }
const REG = [["VP-C","Cayman Islands"],["VP-B","Bermuda"],["VQ-B","Bermuda"],["HB","Switzerland"],["9H","Malta"],["OE","Austria"],["D-","Germany"],["G-","United Kingdom"],["M-","Isle of Man"],["2-","Guernsey"],["N","United States"],["C-","Canada"],["VH","Australia"],["ZK","New Zealand"],["HS","Thailand"],["9V","Singapore"],["9M","Malaysia"],["PK","Indonesia"],["RP","Philippines"],["VN","Vietnam"],["B-","China, Hong Kong or Taiwan"],["JA","Japan"],["HL","South Korea"],["VT","India"],["A6","United Arab Emirates"],["HZ","Saudi Arabia"],["A7","Qatar"],["A9C","Bahrain"],["F-","France"],["I-","Italy"],["EC","Spain"],["CS","Portugal"],["LX","Luxembourg"],["OK","Czech Republic"],["SP","Poland"],["T7","San Marino"],["OO","Belgium"],["PH","Netherlands"],["EI","Ireland"],["SE","Sweden"],["OY","Denmark"],["LN","Norway"],["OH","Finland"],["TC","Turkey"],["SX","Greece"],["P4","Aruba"],["VP-","British Overseas Territory"]];
function regCountry(reg){ reg=String(reg||"").toUpperCase().trim(); if(!reg) return ""; for(const [p,c] of REG){ if(reg.startsWith(p)) return c; } return ""; }

const todayISO = () => { const d=new Date(); return new Date(d.getTime()-d.getTimezoneOffset()*6e4).toISOString().slice(0,10); };
const addDaysISO = (iso,n) => { const d=new Date(iso+"T00:00:00Z"); d.setUTCDate(d.getUTCDate()+n); return d.toISOString().slice(0,10); };
const newRef = (iso) => "AE-" + iso.slice(2,4)+iso.slice(5,7)+iso.slice(8,10) + "-" + String(Math.floor(Math.random()*900)+100);
const get = (o,path) => path.split(".").reduce((a,k)=>a==null?a:a[k], o);
const REQ=[["valid.date","Offer expiry date"],["adv.name","Advisor name"],["broker.name","Archē Executive legal entity name (Settings)"],["broker.address","Registered address (Settings)"],["broker.reg","Company registration UEN (Settings)"],["broker.email","Bookings email (Settings)"],["broker.phone","24/7 operations phone (Settings)"],["charterer.name","Charterer name"],["charterer.address","Charterer address"],["charterer.kyc","KYC reference"],["charterer.email","Charterer email"],["charterer.lead","Lead passenger"],["ac.type","Aircraft type"],["ac.reg","Registration"],["ac.yom","Year of manufacture"],["ac.seats","Passenger seats"],["op.name","Operator legal name"],["op.aoc","Operator AOC number"],["op.state","AOC state"],["price","Charter price"],["sign.oName","Archē Executive signatory (Settings)"],["sign.cName","Charterer signatory"],["opNet","Operator price"]];
const MON=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const fmtDate = iso => { if(!iso) return ""; const [y,m,d]=iso.split("-"); return `${+d} ${MON[+m-1]} ${y}`; };
const usd = n => "USD " + Math.round(n).toLocaleString("en-US");
const num = v => { const n=parseFloat(v); return isFinite(n)?n:0; };
const dayDiff = (a,b) => Math.round((new Date(b+"T00:00:00Z") - new Date(a+"T00:00:00Z"))/864e5);
const PRICING = {rate:0.07, unit:45000};
const xc = x => num(x.amount) ? Math.ceil(num(x.amount)/(1-PRICING.rate)) : 0; // fixed-price extras carry the margin like other supplier items

function calc(){
  const price = Math.max(0, num(S.price));
  const dates = S.legs.map(l=>l.date).filter(Boolean).sort();
  const first = dates[0] || "";
  const days = first && S.issueDate ? dayDiff(S.issueDate, first) : null;
  const full = days !== null && days < 7;
  const xs = [...(S.requests||[]), ...(S.extras||[])];
  const fixed = xs.filter(x=>x.basis==="fixed").reduce((a,x)=>a+xc(x),0);
  const atCost = xs.some(x=>x.basis==="cost");
  const total = price + fixed;
  const deposit = full ? total : Math.min(price, Math.ceil(Math.max(price*0.25, 2500))); // whole dollars, so deposit + balance = total
  const balance = total - deposit;
  const balanceDue = first && !full ? addDaysISO(first, -7) : "";
  const card = S.pay==="pn_card" ? total*num(S.cardPct)/100 : 0;
  const itemsUsed = ["flight","pos","tax","other"].some(k=>String(S.items[k]||"").trim()!=="");
  const itemsSum = ["flight","pos","tax","other"].reduce((a,k)=>a+num(S.items[k]),0);
  const opNet = num(S.opNet);
  const margin = opNet>0 ? price-opNet : null;
  const target = opNet>0 ? Math.ceil(opNet/(1-PRICING.rate)) : 0;
  return {price, first, days, full, deposit, balance, balanceDue, card, itemsUsed, itemsSum, opNet, margin, target, fixed, atCost, total};
}

function checks(cc){
  const err=[], warn=[], missing=[];
  REQ.forEach(([k,l])=>{ const v=get(S,k); if(v===undefined||v===null||String(v).trim()==="") missing.push(l); });
  const legs = S.legs;
  if (!legs.some(l=>l.date && l.from && l.to)) missing.push("At least one leg with date, from and to");
  legs.forEach((l,i)=>{ if((l.from||l.to)&&!l.date) missing.push(`Date on leg ${i+1}`); if(l.from && l.from.length!==4) warn.push(`Leg ${i+1}: "${l.from}" is not a 4-letter ICAO code.`); if(l.to && l.to.length!==4) warn.push(`Leg ${i+1}: "${l.to}" is not a 4-letter ICAO code.`); });
  for(let i=1;i<legs.length;i++){ const a=legs[i-1], b=legs[i]; if(a.date&&b.date&&b.date<a.date) err.push(`Leg ${i+1} is dated before leg ${i}.`); if(a.to&&b.from&&a.to!==b.from) warn.push(`Leg ${i+1} departs ${b.from}, but leg ${i} arrives ${a.to}. Add the positioning sector or check the routing.`); }
  const seats = num(S.ac.seats);
  if (seats) legs.forEach((l,i)=>{ if(num(l.pax)>seats) err.push(`Leg ${i+1}: ${l.pax} passengers but the aircraft has ${seats} seats.`); });
  legs.forEach((l,i)=>{ if(!l.pos && l.date && num(l.pax)===0) warn.push(`Leg ${i+1} carries no passengers. Tick positioning if it is an empty sector.`); });
  // cabotage
  const rc = regCountry(S.ac.reg);
  legs.forEach((l,i)=>{
    if(l.pos) return; const a=icaoCountry(l.from), b=icaoCountry(l.to);
    if(a && b && a===b){
      if(rc && rc===a) return;
      err.push(`Leg ${i+1} (${l.from}–${l.to}) is a domestic passenger sector in ${a}${rc?` on a ${rc}-registered aircraft`:""}. Not allowed for a foreign-registered aircraft unless it is part of one continuous international journey and the permit is granted. Confirm with the Operator before issuing (A5, B7).`);
    }
  });
  const paxLegs = legs.filter(l=>!l.pos && l.from);
  if (paxLegs.length>2) warn.push("Multi-stop trip: the full routing and manifest must be declared in every landing permit application (continuous journey).");
  if (cc.days !== null && cc.days < 0) err.push("The first departure is before the confirmation date.");
  if (S.valid.date && S.valid.date < todayISO()) warn.push("The offer expiry date has passed. Reconfirm the aircraft with the Operator.");
  if (S.valid.date && cc.first && S.valid.date > cc.first) err.push("The offer is valid until after the first departure.");
  if (S.opScale && !String(S.remarks||"").trim()) missing.push("The Operator's cancellation scale in remarks");
  if (S.pay==="pn_card" && !num(S.cardPct)) missing.push("Card cost percentage");
  if (cc.itemsUsed && Math.round(cc.itemsSum)!==Math.round(cc.price)) err.push(`The price breakdown adds up to ${usd(cc.itemsSum)}, not the charter price of ${usd(cc.price)}.`);
  const yom=num(S.ac.yom); if (yom && cc.first){ const age=+cc.first.slice(0,4)-yom; if(age>20) warn.push(`The aircraft will be ${age} years old at departure. Mention it to the client.`); }
  if (cc.margin!==null && cc.price){
    if (cc.price < cc.target) err.push(`Margin is ${(cc.margin/cc.price*100).toFixed(2)}%, below 7%. The 7% price is ${usd(cc.target)} (operator price ÷ 0.93). Below that needs director approval.`);
  }
  [...(S.requests||[]).map(x=>["Client request",x]), ...(S.extras||[]).map(x=>["Operational extra",x])].forEach(([k,x])=>{ if(x.basis==="fixed" && !num(x.amount)) missing.push(`${k} "${x.text}": supplier's written price in USD`); });
  if (cc.atCost) warn.push("Some items are charged at cost after the flight. Tell the client before signing, and invoice them with the supplier receipts through Paynode.");
  const ckLabels={never:"Never-sell list checked",risk:"Trip risk screen recorded, no red open",kyc:"KYC and sanctions screening",aoc:"Operator AOC on file",ins:"Operator insurance on file",audit:"Safety audit checked",route:"Routing and permits checked",terms:"Operator terms checked against A3 and A9",pay:"Paynode payment request created"};
  Object.keys(ckLabels).forEach(k=>{ if(!S.ck[k]) missing.push(ckLabels[k]); });
  return {err,warn,missing};
}

const v = (s,label) => String(s||"").trim() ? esc(s) : `<span class="gap">${esc(label)}</span>`;
function clauseHTML(c,cc){
  let h=`<p class="clause"><b>${c.n}. ${esc(c.t)}</b> ${c.p?esc(c.p):""}</p>`;
  if(c.items) h+="<ul>"+c.items.map(i=>`<li>${esc(i)}</li>`).join("")+"</ul>";

  if(c.after) h+=`<p class="clause">${esc(c.after)}</p>`;
  return h;
}

  const centres = hits.filter(h => h.a.city.toLowerCase().startsWith(q) && h.a.rank <= 2).map(h => h.a).slice(0, 4);
  if (centres.length) { const seen = new Set(hits.map(h => h.a.icao)); for (const a of APT.list) { if (seen.has(a.icao)) continue; for (const c of centres) { if (Math.abs(a.lat - c.lat) < 1 && km(a, c) < 75) { hits.push({a, s:30 + a.rank, near:c.city}); seen.add(a.icao); break; } } } }

  }));

    const m = tripMeta(f.bid, f.did), tag = m.ref || ("Enquiry " + (m.first || "undated"));
    const ext = f.type === "application/pdf" && !/\.pdf$/i.test(f.name || "") ? ".pdf" : "";

async function driveFolder(mcp, folders, parentId, key, title){

async function driveSync(manual){
  if (!S.isOwner || S.preview || S.driveBusy) return;
  const cfg = S.drive || {}; if (!cfg.folderFiles || !cfg.folderDb) { if (manual) toast("The Drive folders are not set up yet."); return; }
  const mcp = await claude.use("mcp"); if (!mcp) { S.driveNote = "Google Drive is not available in this view."; render(); return; }
  S.driveBusy = true; S.driveNote = "Backing up to Google Drive…"; render();
  const synced = {...(cfg.synced || {})}, pending = {...(cfg.pending || {})}, folders = {...(cfg.folders || {})}; let files = 0, err = null, dbDone = false;
  try {
    if (!folders.readme) try { const r = await mcp.callTool(DRIVE, "create_file", {title:"00 How this folder is organised.txt", parentId:cfg.folderRoot || cfg.folderFiles, textContent: DRIVE_README, contentMimeType:"text/plain", disableConversionToGoogleType:true}); folders.readme = ((r && r.payload) || r || {}).id || "created"; } catch(e){}

    }
    if (!err && (manual || !cfg.lastDb || Date.now() - Date.parse(cfg.lastDb) > DB_EVERY_MS)) {
      const out = await buildBackup(); const stamp = now().slice(0, 16).replace(/[:T]/g, "-");
      try { const sp = await driveFolder(mcp, folders, cfg.folderDb, "db/portal", "Portal snapshots"), y = stamp.slice(0, 4), ym = stamp.slice(0, 7);

/* single-series bar chart, SVG, values in text tokens, hover via <title> and focusable bars */

  </svg><div class="chartx" style="grid-template-columns:repeat(${n},1fr)">${rows.map(r => `<span><b>${esc(fmt(r.v))}</b><br>${esc(r.k)}</span>`).join("")}</div></figure>`;

function myTrips(bid){ return allTrips().filter(t => t.bid === bid); }
function tripStats(trips, month){
  const inM = iso => String(iso || "").slice(0, 7) === month;
  const s = {enq:0, quoted:0, sent:0, confirmed:0, flown:0, units:0, gp:0};
  trips.forEach(t => { const st = t.st || {}, d = t.d;
    if (inM(d.created)) { s.enq++; if (num(d.quote && d.quote.opPrice)) s.quoted++; }
    if (inM(d.submittedAt)) s.sent++;
    if (inM(st.issuedAt) && st.state !== "cancelled") { s.confirmed++; s.units += num(st.price) / S.terms.unit; }
    if (st.state === "flown" && inM(st.flownDate)) { s.flown++; s.gp += num(st.price) - num(st.opPrice) - num(st.direct) + num(st.xsClient) - num(st.xsCost); } });
  return s;
}
/* outstanding tasks for one person, most urgent first */
function tasksFor(bid, asOps){
  const out = [], day = 864e5, t0 = Date.now();
  const add = (sev, text, act) => out.push({sev, text, act});
  if (bid) {
    Object.entries(S.leads).forEach(([id, l]) => { const due = leadDue(l); if (!due) return;
      if (due < t0) add(0, `Overdue: contact ${l.org}. It moves to another broker at the next round.`, `data-view="leads" data-lead="${id}"`);
      else if (due - t0 < day) add(1, `Contact ${l.org} by ${fmtT(new Date(due).toISOString())}`, `data-view="leads" data-lead="${id}"`); });
    myTrips(bid).forEach(t => { const nmC = esc((t.d.client && (t.d.client.company || t.d.client.name)) || "Client"), upd = Date.parse(t.d.updated || t.d.created || 0), op = `data-open="${t.bid}|${t.did}" data-goto="trips"`;
      if (t.stage === "returned") add(0, `Returned by operations: ${nmC}. Fix and resend.`, op);
      if (t.stage === "enquiry" && t0 - upd > 2 * day) add(1, `Quote ${nmC}: enquiry open ${Math.floor((t0 - upd) / day)} days`, op);
      if (t.stage === "quoted" && !submitReady(t.d)) add(2, `Finish the checks for ${nmC} and send to operations`, op);
      if (t.stage === "quoted" && t0 - upd > 5 * day) add(2, `Follow up ${nmC}: quote sent ${Math.floor((t0 - upd) / day)} days ago`, op); });
    const st = myStats(); if (st.adds < st.min) add(3, `Add ${st.min - st.adds} more organisation${st.min - st.adds > 1 ? "s" : ""} this month (${st.adds} of ${st.min})`, `data-act="goAdd"`);
  }
  if (asOps) {
    allTrips().forEach(t => { if (ownTrip(t)) return; const st = t.st || {}, nmC = esc((t.d.client && (t.d.client.company || t.d.client.name)) || "Client"), op = `data-open="${t.bid}|${t.did}" data-goto="queue"`;
      if (t.stage === "review") add(0, `Check and confirm: ${nmC} (${esc(nm(t.bid))})`, op);
      if (t.stage === "issued" && st.confIssued && !st.signed) add(st.sigSentAt ? (t0 - Date.parse(st.sigSentAt) > 2 * day ? 0 : 2) : 1, st.sigSentAt ? `Get the signed contract back: ${nmC} (sent ${fmtD(st.sigSentAt)})` : `Send the confirmation for signature: ${nmC}`, op);
      if (t.stage === "issued" && t0 - Date.parse(st.issuedAt || 0) > 5 * day) add(1, `Chase payment: ${nmC}, confirmed ${fmtD(st.issuedAt)}`, op);
      const legs = (t.d.trip && t.d.trip.legs) || [], last = legs.length ? legs[legs.length - 1].date : "";
      if (t.stage === "clientPaid" && !st.operatorPaid) add(1, `Pay the operator through Paynode: ${nmC}`, op);
      if (t.stage === "clientPaid" && last && Date.parse(last) < t0 - day) add(1, `Record the flight: ${nmC} flew ${fmtD(last)}`, op); });
  }
  return out.sort((a, b) => a.sev - b.sev);
}

  s += arrow(R(2), ly(1), L(3), ly(1)) + arrow(R(3), ly(1), L(4), ly(1)) + arrow(R(4), ly(1), L(5), ly(1));
  s += arrow(M(5), ly(1) + bh / 2, M(5), ly(2) - bh / 2, "send", false, M(5) + 22, (ly(1) + ly(2)) / 2 + 4);
  s += path(`M ${L(5)} ${ly(2)} C ${L(5) - 60} ${ly(2)}, ${M(4)} ${ly(2) - 20}, ${M(4)} ${ly(1) + bh / 2 + 2}`, "returned", L(5) - 64, ly(2) + 4, true);
  s += arrow(R(5), ly(2), L(6), ly(2)) + arrow(M(6), ly(2) + bh / 2, M(6), ly(3) - bh / 2, "signs", false, M(6) + 24, (ly(2) + ly(3)) / 2 + 4);
  s += arrow(R(6), ly(3), L(7), ly(3)) + arrow(M(7), ly(3) - bh / 2, M(7), ly(2) + bh / 2, "flies", false, M(7) + 22, (ly(2) + ly(3)) / 2 + 4);
  s += path(`M ${M(7)} ${ly(2) - bh / 2} L ${M(7)} ${ly(1)} L ${R(6) + 2} ${ly(1)}`, "paid and flown", M(7) - 4, ly(1) - 10);
  s += `<text x="${W - 20}" y="${H - 10}" text-anchor="end" font-size="10.5" fill="currentColor" opacity=".7">Dashed: loops back. Highlighted: steps the portal controls.</text></svg>`;
  return s;
}

async function loadAllAsks(){
  if (HELP.loading) return; HELP.loading = true;
  const out = [];
  for (const uid of [...new Set([...Object.keys(S.roster), S.uid])]) { try { const q = await S.db.collection(`asks/${uid}/items`).get(); q.docs.forEach(d => out.push({uid, id:d.id, ...d.data()})); } catch(e){} }
  HELP.asksAll = out; HELP.loading = false; render();
  return out;
}
async function askQuestion(q){
  const id = "q" + Date.now().toString(36), ref = S.db.doc(`asks/${S.uid}/items/${id}`);
  const body = {q, t: now(), status: "open"};
  S.askBusy = true; render();
  try {
    await ref.set(body);
    await loadGuide();
    const sample = await claude.use("sample");
    if (sample) {
      const prompt = `${RULES_TEXT}\n\nYou answer questions from Archē Executive brokers and staff about the broker portal and the company's rules. Use only the portal guide and FAQ below and the rules above. Answer in plain English, under 150 words, with the steps to take. If the material does not cover it, or it needs a decision by the director, say so and that the question has been sent to the owner. Never invent figures. Reply with JSON only: {"answer": "...", "covered": true|false, "topic": "two or three words"}.\n\nPORTAL GUIDE\n${guideText()}\n\nFAQ\n${faqList().map(f => "Q: " + f.q + "\nA: " + f.a).join("\n")}\n\nQUESTION\n${q}`;
      const r = await sample.json(prompt);
      if (r && r.answer) Object.assign(body, {a: String(r.answer), at: now(), by: "ai", status: r.covered === false ? "open" : "answered", topic: String(r.topic || "")});
      await ref.set(body);
    }
    toast(body.a ? "Answered" : "Sent to the owner");
  } catch(e){ toast(e && e.code ? aiErr(e.code) : "Could not send. Try again."); }
  finally { S.askBusy = false; HELP.asksAll = null; render(); }
}
async function promoteFaq(manual){
  if (!S.isOwner || S.faqBusy) return;
  const sample = await claude.use("sample"); if (!sample) { if (manual) toast("The AI is not available in this view."); return; }
  S.faqBusy = true; render();
  try {
    const all = await loadAllAsks(); const pool = all.filter(a => !a.faqId && a.q);
    let added = 0;
    if (pool.length >= 3) {
      const prompt = `Group these questions from charter brokers about their company's portal and rules into topics. Return JSON only: an array of {"ids": [question ids], "q": "one clear FAQ question, general wording, no names, no client or company details", "a": "a correct answer under 120 words based on the guide, FAQ and rules below; if they do not cover it, use an empty string"}. Include only groups of 3 or more questions. Do not repeat a topic already in the FAQ.\n\n${RULES_TEXT}\n\nPORTAL GUIDE\n${guideText()}\n\nEXISTING FAQ\n${faqList().map(f => "- " + f.q).join("\n")}\n\nQUESTIONS\n${pool.map(a => a.id + " [" + a.uid + "]: " + a.q + (a.by === "owner" && a.a ? " (owner's answer: " + a.a + ")" : "")).join("\n")}`;
      const groups = await sample.json(prompt);
      for (const g of (Array.isArray(groups) ? groups : [])) {
        const items = pool.filter(a => (g.ids || []).includes(a.id)), askers = new Set(items.map(a => a.uid));
        if (items.length < 3 || askers.size < 2 || !g.q || !g.a) continue;
        const fid = "a" + Date.now().toString(36) + added;
        await S.db.doc("faq/" + fid).set({q: String(g.q), a: String(g.a), source: "ai", count: items.length, created: now(), order: 500});
        for (const it of items) { try { await S.db.doc(`asks/${it.uid}/items/${it.id}`).update({faqId: fid}); } catch(e){} }
        added++;
      }
    }
    await S.db.doc("intel/faq").set({lastRun: now(), added, pool: pool.length});
    if (manual) toast(added ? `${added} question${added > 1 ? "s" : ""} added to the FAQ` : "No new frequent questions yet");
  } catch(e){ if (manual) toast("Could not update the FAQ. Try again."); }
  finally { S.faqBusy = false; HELP.asksAll = null; render(); }
}
function autoFaq(){ if (!S.isOwner || S.preview) return; const last = S.faqRun && Date.parse(S.faqRun.lastRun || 0); if (!last || Date.now() - last > 864e5) promoteFaq(false); }

const PRIMARY = {owner:["today","trips","queue","prospects"], ops:["home","queue","trips","prospects"], broker:["home","trips","leads","commission"]};

function badges(){

      const ret = allTrips().filter(t => t.bid === S.uid && t.stage === "returned").length; if (ret) { b.trips = ret; b.home = (b.home || 0) + ret; }

async function assignProspect(id, bid, reason){

    const cur = await ref.get();

}

function trKm(legs){ let k = 0; for (const l of legs) { const a = APT.by[l.from], b = APT.by[l.to]; if (a && b) k += km(a, b); } return k; }
function trMakeOffers(r){
  const sc = trSc(r.sc), legs = r.enq.legs, dist = trKm(legs) || 1000;
  return sc.offers.map((o, i) => {
    const [rate, speed, range] = TR_RATE[o.cat]; let hrs = 0, fees = 0, notes = [];
    for (const l of legs) { const a = APT.by[l.from], b = APT.by[l.to], d = a && b ? km(a, b) : dist; hrs += d / speed + 0.4; fees += 1500; if (d > range) { const stops = Math.ceil(d / range) - 1; hrs += stops; fees += 2500 * stops; notes.push(`${stops} technical stop${stops > 1 ? "s" : ""} for fuel`); } }
    const pos = [0.6, 1.1, 0, 0.8][i % 4]; if (pos) { hrs += pos; notes.push(`includes ${pos.toFixed(1)} h positioning`); }
    const price = Math.ceil((hrs * rate + fees) * (o.k || 1) / 100) * 100;
    return {...o, price, hrs: Math.round(hrs * 10) / 10, notes: [o.note, ...notes].filter(Boolean).join(" · ")};
  });
}

/* scoring: the simulated operations desk */
function trReview(r){
  const sc = trSc(r.sc), crit = [], minor = [], ok = [];
  const o = r.pick != null ? r.offers[r.pick] : null;
  if (sc.decline) {
    if (r.decision === "decline" && r.declineWhy === "paynode") ok.push("Right call: Paynode cannot send or receive funds for Russia, so the trip cannot be paid. It stops here.");
    else if (r.decision === "decline") minor.push("Declining was right, but the reason is the payer: Paynode cannot serve Russia. Record the exact reason.");
    else crit.push("Red: the payer is registered in Russia. Paynode cannot send or receive funds there. Decline the trip and record why.");
    return {crit, minor, ok};
  }
  if (r.decision === "decline") crit.push("Nothing in this request is a reason to decline. Look again at the operators and the client's needs.");
  if (!o) crit.push("No operator chosen.");
  else if (o.trap) crit.push(TR_TRAPS[o.trap]); else ok.push(`${o.op}: valid choice.`);
  for (const n of sc.need) {
    const list = r[n.sec] || [], hit = list.find(x => x.cat === n.cat && String(x.text || "").trim());
    if (!hit) crit.push(`Missing ${n.sec === "extras" ? "operational extra" : "client request"}: ${n.cat}. ${n.why}`);
    else if (n.basis && hit.basis !== n.basis) minor.push(`${n.cat} should be charged ${n.basis === "cost" ? "at cost after the flight" : n.basis}. ${n.why}`);
    else ok.push(`${n.cat} recorded correctly.`);
  }
  const missing = BROKER_CHECKS.filter(([k]) => !(r.checks || {})[k]);
  if (missing.length) crit.push(`${missing.length} of the 7 checks not ticked: ${missing.map(m => m[1].split(" (")[0].split(";")[0]).join("; ")}.`);
  if (o && num(r.myPrice) !== priceOf(o.price, num(r.direct))) minor.push(`Your client price ${usd(num(r.myPrice))} is not the portal price ${usd(priceOf(o.price, num(r.direct)))}: (operator ${usd(o.price)} + direct costs ${usd(num(r.direct))}) ÷ 0.93, rounded up.`);
  return {crit, minor, ok};
}
function trScore(r){
  const sc = trSc(r.sc), s = {}, e = r.enq || {legs: []}, l0 = e.legs[0] || {};
  s.enquiry = (sc.from.includes(l0.from) ? 3 : 0) + (sc.to.includes((e.legs[e.legs.length - 1] || {}).to) ? 3 : 0) + (l0.date === r.expDate ? 3 : 0) + (+l0.pax === sc.pax ? 3 : 0) + (sc.cats.includes(e.cat) ? 3 : 0);
  const clean = (r.offers || []).filter(o => !o.trap), best = clean.length ? Math.min(...clean.map(o => o.price)) : 0, o = r.pick != null ? r.offers[r.pick] : null;
  s.operator = sc.decline ? (r.decision === "decline" ? 20 : 0) : o && !o.trap ? (o.price === best ? 20 : 15) : 0;
  s.requests = sc.decline ? 15 : sc.need.length ? Math.round(15 * sc.need.filter(n => (r[n.sec] || []).some(x => x.cat === n.cat && (!n.basis || x.basis === n.basis))).length / sc.need.length) : 15;
  s.price = sc.decline ? 10 : (o && num(r.myPrice) === priceOf(o.price, num(r.direct)) ? 10 : 0);
  s.checks = (BROKER_CHECKS.every(([k]) => (r.checks || {})[k]) ? 5 : 0) + ((sc.decline ? r.decision === "decline" : r.decision === "send") ? 10 : 0);
  s.paynode = sc.decline ? 15 : (r.pn ? (r.pn.depOk ? 6 : 0) + (r.pn.dateOk ? 4 : 0) + (r.pn.opOk ? 5 : 0) : 0);
  s.firstTime = (r.returns || 0) === 0 ? 10 : 0;
  s.total = Object.values(s).reduce((a, b) => a + b, 0); return s;
}

async function trLoadAll(){ if (S.trLoading) return; S.trLoading = true; const out = {};

async function trAct(a, el){

        const f = res($("tr_f" + i).value), t = res($("tr_t" + i).value); if (!f || !t) { toast("Pick both airports from the list."); return; }

      const rr = {...r, enq: {legs, cat: $("tr_cat").value}}; S.dirty.clear();

    if (a === "pick") { const p = document.querySelector('input[name="tr_pick"]:checked'); if (!p) { toast("Choose an operator."); return; }
      await trSave(r, {pick: +p.value, direct: num($("tr_dir").value), avinode: r.avinode || "TRN-AV-" + Math.floor(1e5 + Math.random() * 9e5), step: 3}); return; }
    if (a === "xadd") { const sec = el.dataset.x; trSyncX(r); await trSave(r, {requests: r.requests, extras: r.extras, [sec]: [...(r[sec] || []), {id: nid(), cat: sec === "requests" ? REQ_CATS[0] : EXTRA_CATS[0], text: "", basis: "included", amount: ""}]}); return; }

      toast(v === right ? "Correct." : `Not quite: the portal price is ${usd(right)}. It is used either way; the score notes it.`); S.dirty.clear(); await trSave(r, {myPrice: v, step: 5}); return; }
    if (a === "submit") { const checks = {}; BROKER_CHECKS.forEach(([k]) => checks[k] = !!($("trc_" + k) || {}).checked);
      const d = document.querySelector('input[name="tr_dec"]:checked'); if (!d) { toast("Choose send or decline."); return; }
      const rr = {...r, checks, decision: d.value, declineWhy: $("tr_why").value}; const review = trReview(rr);

/* ---------- Beta 20: flight following, aftercare and rating, post-trip debrief, roleplay lab, reference cards, operator scorecard (manual v3.8: 11.5, 14.4–14.6, Appendix J) ---------- */
const LEG_ST = [["","Scheduled"],["dep","Departed"],["land","Landed"],["delay","Delayed"],["div","Diverted"],["canc","Cancelled"]];
const AC_CH = ["Call","Message","Email","Meeting"];
const DB_M = [["m1","Pre-issue checks (A.1)"],["m2","Extras and changes explained to the client"],["m3","Client satisfaction"]];
const addH = (iso, h) => new Date(new Date(iso).getTime() + h * 3600000).toISOString();
const workDayAfter = iso => { const d = new Date(iso); do { d.setDate(d.getDate() + 1); } while ([0,6].includes(d.getDay())); return d.toISOString(); };
const isSup = bid => !!((S.roster[bid] || (bid === S.uid ? S.myRoster : null) || {}).supervised);
function legsOf(t){ return ((t.d.trip || {}).legs) || []; }
function legSt(t){ const st = t.st || {}; const ls = st.legStatus || []; return legsOf(t).map((l, i) => ls[i] || {}); }
function allLanded(t){ const ls = legSt(t); return ls.length > 0 && ls.every(x => x.s === "land" || x.s === "canc") && ls.some(x => x.s === "land"); }
function lastLanding(t){ const ls = legSt(t).filter(x => x.s === "land" && x.at); return ls.length ? ls.map(x => x.at).sort().slice(-1)[0] : null; }
function acStatus(t){
  const d = t.d, st = t.st || {}; if (t.stage !== "flown") return null;
  const base = lastLanding(t) || (st.flownDate ? st.flownDate + "T12:00:00Z" : null);
  const due = base ? addH(base, 24) : null;
  const r = d.rating || null, fu = d.followUp || null, rq = d.ratingReq || null;
  const low = r && num(r.overall) > 0 && num(r.overall) <= 3, rec = d.recovery || null;

  return {due, fu, rq, r, low, rec, sup, db, dbDone, paid, overdue: !fu && due && new Date(due) < new Date(), closed: paid && !!fu && !!rq && (!low || !!rec) && dbDone};
}
function rateMail(t){

  const legs = legsOf(t), route = legs.map(l => l.from).concat(legs.length ? [legs[legs.length - 1].to] : []).join("–"), date = legs[0] ? fmtD(legs[0].date) : "";

    `If anything was not right, please reply to this email${co.phone ? " or call " + co.phone : ""}; I will deal with it personally.`, "",

async function rpScore(){
  const s = S.rp; const sample = await claude.use("sample"); if (!sample) { toast("The AI is not available in this view."); return; }
  const tr = s.msgs.map(m => `${m.role === "assistant" ? "OTHER SIDE" : "BROKER"}: ${m.content}`).join("\n");
  const prompt = `You are the assessor for Archē Executive's live negotiation lab. Score only the BROKER's lines in this transcript against the scoring sheet. ${RP_RULES}
Scenario: ${s.title}. Counterpart: ${s.who}. Level: ${s.lv}.
Scoring sheet: calm (0-20) calm and courteous under pressure; rule (0-30) correct rule applied and explained in plain words; options (0-20) options offered instead of a flat no; promise (true if the broker promised anything the operator had not confirmed in writing, or a price, refund, time or exception the rules do not allow); escalation (0-15) escalates to the director when the rules require it, or correctly needs no escalation; followup (0-15) says the agreement will be confirmed in writing. ruleBroken is true if the broker agreed to anything the rules forbid or stated a wrong rule. total is the sum of the four scores and escalation and followup (0-100). pass is true only if total >= 70 and promise is false and ruleBroken is false.
Return JSON only: {"calm":n,"rule":n,"options":n,"promise":bool,"escalation":n,"followup":n,"ruleBroken":bool,"total":n,"pass":bool,"summary":"two sentences","moments":[{"quote":"exact broker words","issue":"what cost points"}],"model":"a model answer for the hardest moment, 2-4 sentences, in the broker's voice"}
Transcript:
${tr}`;
  s.busy = true; render();
  try {
    const j = await sample.json(prompt, {cache:false, modelTier:"default"});
    const cl = (v, m) => Math.max(0, Math.min(m, Math.round(num(v))));
    const sc = {calm: cl(j.calm, 20), rule: cl(j.rule, 30), options: cl(j.options, 20), escalation: cl(j.escalation, 15), followup: cl(j.followup, 15), promise: !!j.promise, ruleBroken: !!j.ruleBroken, summary: String(j.summary || "").slice(0, 600), model: String(j.model || "").slice(0, 900), moments: (Array.isArray(j.moments) ? j.moments : []).slice(0, 5).map(m => ({quote: String(m.quote || "").slice(0, 200), issue: String(m.issue || "").slice(0, 300)}))};
    sc.total = sc.calm + sc.rule + sc.options + sc.escalation + sc.followup; sc.pass = sc.total >= 70 && !sc.promise && !sc.ruleBroken;

    try { await S.db.doc(`train/${S.uid}/rp/${s.id}`).set({title: s.title, sc: s.sc, who: s.who, lv: s.lv, started: s.started, ended: s.ended, turns: s.msgs.length, msgs: s.msgs.slice(0, 40).map(m => ({role: m.role, content: String(m.content).slice(0, 1200)})), score: sc}); S.rpRuns = null; S.rpAll = null; S.rpAllLoading = false; } catch(e){ toast("Scored, but could not save to your record."); }
  } catch(e){ toast(e && e.code === "rate_limited" ? "The AI is busy. Try again in a minute." : "Could not score this session. Try again."); }
  s.busy = false; render();
}

  const balDue = dep && days >= 7 ? new Date(dep.getTime() - 7 * 864e5).toISOString().slice(0, 10) : null;

function apChecks(t){

/* ---------- Supplier quotes: request, compare and award quotes from service partners (Morten, 21 Oct 2026) ----------
   The first working piece of the AeroBridge idea, used by Archē as its first buyer. Kept as its own module with its own
   table (rfqs) and its own record shape, so it can later be lifted out into a separate, neutral company:
     request  {ref, airport, category, trip, neededBy, terms, scope, status, createdBy, createdAt}
     suppliers[{pid, org, eligible, reasons, sentAt, sentBy}]   eligibility is checked when the request is made
     quotes[{pid, org, usd, original, validUntil, deviations, receivedAt, by}]   all amounts in USD
     award {pid, org, usd, reason, by, at}   four-eyes: whoever made the request cannot award it (owner exempt)
     log[{t, by, note}]   append-only history
   Nothing is sent from the portal: a person copies the prepared message, sends it and marks it as sent.
   Staff only (owner and operations), enforced by the database rule in supabase/migrations/0006_rfqs.sql. */
const SQ_TERMS = ["IATA SGHA 2018, Annex B (one-off)", "IATA SGHA 2023, Annex B (one-off)", "Supplier's standard terms"];
const SQ_STATUS = {open: "Open", awarded: "Awarded", cancelled: "Cancelled"};
const SQ_SERVICES = {
  "FBO and ground handling": ["Ramp handling", "Passenger lounge", "Customs and immigration", "Crew transport", "Fuel arrangement", "Hangar", "Lavatory and water service", "Parking"],
  "Trip support": ["Landing permits", "Overflight permits", "Slots", "Flight planning", "Weather and NOTAM briefing"],
  "In-flight catering": ["Passenger catering", "Crew meals", "Special diets", "Bar and drinks", "Flowers and amenities"],
  "Crew hotels": ["Single rooms for crew", "Crew rate", "Day rooms", "Late check-out", "Quiet or blackout rooms", "24-hour reception", "Breakfast"]};
const sqStaff = () => isStaff() && acting() !== "broker";
const sqList = () => Object.entries(S.rfqs || {}).map(([id, r]) => ({id, ...r})).sort((a, b) => (b.createdAt || "").localeCompare(a.createdAt || ""));
async function sqSet(id, data){ await S.db.doc("rfqs/" + id).set(data); }
function sqLog(r, note){ return [...(r.log || []), {t: now(), by: S.uid, note: String(note).slice(0, 500)}]; }
function sqNextRef(){
  const ym = new Date().toISOString().slice(2, 7).replace("-", "");
  const n = sqList().filter(r => (r.ref || "").startsWith("RQ-" + ym)).length + 1;
  return `RQ-${ym}-${String(n).padStart(2, "0")}`;
}
/* compliance gate: who may be asked to quote */
function sqEligible(p, cat){
  const reasons = [], flags = [], sc = (p.screen || {}).auto;
  if (p.status === "dnc") reasons.push("asked not to be contacted");
  if (p.status === "duplicate") reasons.push("duplicate record");
  if (p.status === "review" || (sc && sc.result === "possible match")) reasons.push("possible sanctions match");
  if (!sc) reasons.push("sanctions check not run yet (runs every morning)");
  if (cat === "FBO and ground handling" && !p.isbah) flags.push("No IS-BAH found");
  if (cat === "Crew hotels" && !(p.hotel && (p.hotel.type === "agency" || (p.hotel.minutes > 0 && p.hotel.minutes <= 15 && p.hotel.shuttle)))) reasons.push("not shown to be within 15 minutes of the airport with a dedicated airport shuttle");
  if (!(p.avenues || []).length && !p.website) flags.push("No contact route on file");
  return {eligible: !reasons.length, reasons, flags};
}
function sqCandidates(airport, cat){
  return Object.entries(S.prospects || {}).map(([id, p]) => ({id, ...p}))
    .filter(p => p.kind === "service" && p.category === cat && (p.airports || []).includes(airport))
    .map(p => ({p, ...sqEligible(p, cat)}));
}
/* explainable score out of 100: the reasons are shown next to every number; a person decides */
function sqScore(q, r, quotes){
  const p = (S.prospects || {})[q.pid] || {}, low = Math.min(...quotes.map(x => num(x.usd)).filter(x => x > 0));
  const parts = [];
  const price = num(q.usd) > 0 && isFinite(low) ? Math.round(50 * low / num(q.usd)) : 0;
  parts.push([price, `Price ${price}/50 (${num(q.usd) === low ? "lowest" : Math.round((num(q.usd) / low - 1) * 100) + "% above lowest"})`]);
  const qual = r.category === "FBO and ground handling" ? (p.isbah ? 20 : 0) : ((p.evidence || []).length ? 20 : 0);
  parts.push([qual, r.category === "FBO and ground handling" ? (p.isbah ? "IS-BAH registered 20/20" : "No IS-BAH 0/20") : ((p.evidence || []).length ? "Quality evidence on file 20/20" : "No quality evidence 0/20")]);
  const terms = q.deviations ? 0 : 15; parts.push([terms, q.deviations ? "Changes to our terms 0/15" : `Accepts ${r.terms} 15/15`]);
  const valid = !q.validUntil || !r.neededBy || q.validUntil >= r.neededBy ? 15 : 0; parts.push([valid, valid ? "Valid until needed 15/15" : "Expires before it is needed 0/15"]);
  return {total: parts.reduce((s, x) => s + x[0], 0), parts: parts.map(x => x[1])};
}
function sqMessage(r, s){
  const sc = r.scope || {};
  return `Subject: Quote request ${r.ref}: ${r.category}, ${r.airport}, ${sc.date ? fmtD(sc.date) : "date to follow"}

Dear ${s.org} team,

Archē Executive would like a quote for ${r.category.toLowerCase()} at ${r.airport}.

Aircraft: ${sc.aircraft || "to follow"}
Arrival (UTC): ${sc.arr || "to follow"}
Departure (UTC): ${sc.dep || "to follow"}
${r.category === "Crew hotels" ? `Crew: ${sc.crew || "to follow"} · Rooms: ${sc.rooms || "to follow"} · Nights: ${sc.nights || "to follow"}` : `Passengers: ${sc.pax || "to follow"} · Crew: ${sc.crew || "to follow"}`}
Services: ${(sc.services || []).join(", ") || "as discussed"}
${sc.notes ? "Notes: " + sc.notes + "\n" : ""}${r.category === "Crew hotels" ? "Required: the hotel is at most 15 minutes by road from the airport and has its own dedicated airport shuttle for the crew, both ways. Please confirm both in your quote.\n" : ""}Terms: ${r.terms}
Please quote in USD, itemised, with how long the quote is valid, by ${r.neededBy ? fmtD(r.neededBy) : "return"}. Tell us if anything in the terms does not suit you.

We found your details on your organisation's published pages. If you would rather not receive requests from us, reply and we will remove you.

Kind regards,
Archē Executive operations`;

    F.score = F.qs.filter((q, i) => F.ans[i] === q.right).length; F.passed = F.score >= Math.ceil(F.qs.length * 0.8); F.marked = true;
    try { const d = crDoc(); await S.db.doc(`train/${S.uid}/runs/course`).set({...d, kind: "course", updated: now(), finalTries: (d.finalTries || 0) + 1,
      ...(F.passed ? {completedAt: d.completedAt || now(), finalScore: `${F.score}/${F.qs.length}`} : {})});
      if (F.passed && !d.completedAt) audit("Portal course completed", `${F.score}/${F.qs.length}`); } catch(err){ toast("Could not save the result. Try again."); }
    render(); return; }
  if (!f.dataset || !f.dataset.crquiz) return; e.preventDefault();
  const id = f.dataset.crquiz, quiz = crQuiz(id), ans = (S.crAns || {})[id] || {};
  if (quiz.some((q, i) => ans[i] === undefined)) { toast("Answer every question first."); return; }
  S.crShow = id;
  if (quiz.every((q, i) => ans[i] === q.right)) { try { await crMark(id); } catch(err){ toast("Could not save. Try again."); } }
  else toast("Not all right yet. Read the lesson again and try once more.");
  render();
});

/* ---------- Named business contacts on prospects (rule approved by Morten, 20 Oct 2026; see CLAUDE.md) ----------
   Business contacts only: a professional in a business role at an organisation, with work email or phone as published by
   the organisation itself or taken from a licensed professional database. Brokers see contacts only on their own leads.
   Opening the contacts on a shared prospect or lead is recorded in the access log. An opt-out deletes the person's details
   and stores only one-way codes (hashes), so they can never be added again by anyone. */
const CT_WEBMAIL = /@(gmail|googlemail|yahoo|ymail|hotmail|outlook|live|msn|icloud|me|mac|aol|proton|protonmail|gmx|mail|yandex|qq|163|126|naver|hanmail)\./i;
const CT_SOURCES = ["Organisation's own website", "Licensed professional database", "Business card or meeting"];
const ctNorm = s => String(s || "").toLowerCase().normalize("NFKD").replace(/[̀-ͯ]/g, "").replace(/[^a-z0-9]+/g, " ").trim();
const ctOrg = s => ctNorm(s).replace(/\b(ltd|limited|pte|llc|inc|co|company|group|the)\b/g, "").replace(/\s+/g, " ").trim();
async function ctSha(s){ const b = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(s)); return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2, "0")).join(""); }
async function ctHashes(c, org){ const h = []; if (c.email) h.push(await ctSha("e:" + String(c.email).toLowerCase().trim())); if (c.name) h.push(await ctSha("n:" + ctNorm(c.name) + "|" + ctOrg(org))); return h; }
function ctPath(where, id){ return where === "inv" ? "owner/" + id : where === "lead" ? `leads/${S.uid}/items/${id}` : "prospects/" + id; }
function ctRec(where, id){ return where === "inv" ? (S.inv || {})[id] : where === "lead" ? S.leads[id] : S.prospects[id]; }
function contactsHtml(rec, where, id){
  const list = rec.contacts || [], key = where + ":" + id;
  S.ctShown = S.ctShown || {};
  const shown = where === "inv" || S.ctShown[key];
  const rules = `<p class="small muted">Business contacts only: work details as published by the organisation or from a licensed database. In the first message, say where you found them and offer an opt-out. If someone opts out, press <b>Opted out</b>: their details are deleted from every list.</p>`;
  if (!shown) return `<div><h3>Business contacts</h3><p class="small">${list.length ? `${list.length} named contact${list.length > 1 ? "s" : ""} on file.` : "No named contacts yet."} <button class="btn small" type="button" data-ct="show" data-where="${where}" data-id="${esc(id)}">Show${list.length ? "" : " and add"} · opening is recorded</button></p>${rec.optedOutNote ? `<p class="small muted">${esc(rec.optedOutNote)}</p>` : ""}</div>`;
  return `<div><h3>Business contacts</h3>${rules}
    ${list.length ? `<ul class="avs">${list.map((c, i) => `<li><span class="avt">${esc(c.role || "Contact")}</span> <b>${esc(c.name)}</b>${c.email ? ` · <a href="mailto:${esc(c.email)}">${esc(c.email)}</a>` : ""}${c.phone ? ` · ${esc(c.phone)}` : ""}<br><span class="small muted">${c.source && /^https?:/.test(c.source) ? `<a href="${esc(c.source)}" target="_blank" rel="noopener">source</a>` : esc(c.source || "")}${c.sourceType ? " · " + esc(c.sourceType) : ""} · added ${fmtD(c.added)}${c.lastContact ? " · last contact " + fmtD(c.lastContact) : ""}</span>
      <span class="row" style="margin-top:4px"><button class="btn small" type="button" data-ct="touch" data-where="${where}" data-id="${esc(id)}" data-i="${i}">Contacted today</button><button class="btn small danger" type="button" data-ct="opt" data-where="${where}" data-id="${esc(id)}" data-i="${i}">Opted out</button></span></li>`).join("")}</ul>` : `<p class="small muted">No named contacts yet.</p>`}
    ${rec.optedOutNote ? `<p class="small muted">${esc(rec.optedOutNote)}</p>` : ""}
    <details class="small"><summary>Add a business contact</summary><form class="fgrid" data-ctform="${where}" data-id="${esc(id)}" style="margin-top:8px">
      <label class="f" for="ct_name">Name<input id="ct_name" required></label>
      <label class="f" for="ct_role">Role<input id="ct_role" required placeholder="Head of Travel"></label>
      <label class="f" for="ct_email">Work email<input id="ct_email" type="email" placeholder="name@company.com"></label>
      <label class="f" for="ct_phone">Work phone<input id="ct_phone"></label>
      <label class="f" for="ct_srct">Where it comes from<select id="ct_srct">${CT_SOURCES.map(s => `<option>${esc(s)}</option>`).join("")}</select></label>
      <label class="f" for="ct_src">Source (web page or database name)<input id="ct_src" required></label>
      <div class="row" style="align-self:end"><button class="btn primary" type="submit">Save contact</button></div></form></details></div>`;
}
async function ctSave(where, id, patch){
  const rec = ctRec(where, id); if (!rec) return;
  if (where === "inv") await S.db.doc(ctPath(where, id)).set({...rec, ...patch}); else await S.db.doc(ctPath(where, id)).update(patch);
}
document.addEventListener("click", async e => {
  const el = e.target.closest("[data-ct]"); if (!el) return;
  const where = el.dataset.where, id = el.dataset.id, rec = ctRec(where, id); if (!rec) return;
  if (where === "inv" && !(S.isOwner && !S.preview)) return;
  if (el.dataset.ct === "show") { S.ctShown = S.ctShown || {}; S.ctShown[where + ":" + id] = true; if (where !== "inv") audit("Business contacts viewed", rec.org || id); render(); return; }
  const i = +el.dataset.i, c = (rec.contacts || [])[i]; if (!c) return;
  if (el.dataset.ct === "touch") { const list = rec.contacts.slice(); list[i] = {...c, lastContact: now()}; await ctSave(where, id, {contacts: list}); toast("Marked as contacted today."); return; }
  if (el.dataset.ct === "opt") {
    if (!el.dataset.armed) { el.dataset.armed = "1"; el.textContent = "Click again: delete their details"; setTimeout(() => { if (el.isConnected) { delete el.dataset.armed; el.textContent = "Opted out"; } }, 6000); return; }
    try {
      for (const h of await ctHashes(c, rec.org)) await S.db.doc("optouts/" + h).set({at: now()});
      const list = rec.contacts.filter((_, j) => j !== i);
      await ctSave(where, id, {contacts: list, optedOutNote: `A contact opted out on ${fmtD(now())}. Their details were deleted.`});
      if (where !== "inv") audit("Business contact opted out", rec.org || id);
      toast("Deleted. They will not be added again, in any list.");
    } catch (err) { toast(err.code === "permission_denied" ? "Opt-outs are not set up yet (run 0005 in Supabase)." : "Could not save. Try again."); }
  }
});
document.addEventListener("submit", async e => {
  const f = e.target; if (!f.dataset || !f.dataset.ctform) return; e.preventDefault();
  const where = f.dataset.ctform, id = f.dataset.id, rec = ctRec(where, id); if (!rec) return;
  const c = {name: $("ct_name").value.trim(), role: $("ct_role").value.trim(), email: $("ct_email").value.trim().toLowerCase(), phone: $("ct_phone").value.trim(), sourceType: $("ct_srct").value, source: $("ct_src").value.trim(), added: now(), addedBy: S.uid};
  if (!c.name || !c.role || !c.source) { toast("Name, role and source are needed."); return; }
  if (/^(mr|mrs|ms|dr)\.?$/i.test(c.name)) { toast("Write the person's name."); return; }
  if (c.email && CT_WEBMAIL.test(c.email)) { toast("Work email only: personal addresses like Gmail are not allowed."); return; }
  if (!c.email && !c.phone) { toast("Add a work email or a work phone."); return; }
  const hs = await ctHashes(c, rec.org);
  if (hs.some(h => (S.optouts || {})[h])) { toast("This person has opted out. They cannot be added again."); return; }
  try { await ctSave(where, id, {contacts: [...(rec.contacts || []), c].slice(0, 10)}); toast("Contact saved."); render(); }
  catch (err) { toast("Could not save. Try again."); }
});
</script>
