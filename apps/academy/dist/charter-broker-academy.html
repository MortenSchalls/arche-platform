er.com/blog/planning-bizav-operations-to-thailand-part-1-permit-planning/"],["Thailand CAAT eAIP (open GEN 1.2)","https://aip.caat.or.th/"],["CAAS: foreign air operators","https://www.caas.gov.sg/operations-safety/air-operations/foreign-air-operators"],["IATA Timatic (travel documents)","https://www.iata.org/en/publications/timatic/"],["EASA Conflict Zone Information Bulletins","https://www.easa.europa.eu/en/domains/air-operations/czibs"],["FAA prohibitions, restrictions and notices","https://www.faa.gov/air_traffic/publications/us_restrictions"],["Safe Airspace (OPSGROUP)","https://safeairspace.net/"]]}]},{"h":"6.2 Choosing the airport","b":[{"fig":"airport"},{"list":["Many cities have a business-aviation airport closer to the destination than the airline hub; ask where the client is actually going.","Opening hours and night curfews.","Customs and immigration: international flights must use an airport where they are available, sometimes only on request.","Rescue and firefighting cover: each airport has a fire category, and larger aircraft need a higher one. The operator confirms the airport suits the aircraft.","Runway length for the aircraft and its load, especially at hot or high airports.","Slots, parking and an FBO or handler."]}]},{"h":"6.3 Long flights over water or remote areas","b":[{"p":"Twin-engine aircraft flying far from diversion airports, for example across oceans, can need specific approval (known as ETOPS or EDTO). It can lengthen the route or require a stop. The operator plans it and confirms the routing in writing."}]},{"h":"6.4 Weather basics for brokers","b":[{"list":["Pilots use a METAR (the current weather at an airport) and a TAF (the forecast). The crew and operator decide; we only watch for what may affect the client.","Fog and low cloud can delay or divert flights, often in the early morning.","Snow and ice mean de-icing, charged at cost after the flight.","Thunderstorms, strong winds and tropical storm seasons can delay or reroute flights.","From 48 hours before departure, check the forecast and warn the client early if delays are likely."]},{"photos":["deice"]},{"links":[["Aviation Weather Center (METAR and TAF)","https://aviationweather.gov/"]]}]},{"h":"6.5 Operational requirements and the rules behind them","b":[{"p":"The operator and the captain decide how each of these is handled. The rules below explain why they exist, so you ask the right questions early and tell the client what may be charged."},{"table":{"cols":["Requirement","The rule behind it","When it applies","What we do"],"rows":[["De-icing and anti-icing","No take-off with frost, ice or snow on the wings, control surfaces, engines or sensors: EU CAT.OP.MPA.250 and US 14 CFR 135.227. Ground procedures follow ICAO Doc 9640 and SAE AS6285.","Cold, wet weather: northern winter (about November to March), southern winter (about June to September), and high or cold airports at any time","List it as an operational need, charged at cost after the flight with the receipt. Allow extra time; never promise a departure time in icing conditions."],["Airport hours and night restrictions","Each airport publishes its hours and restrictions in its country's aeronautical information publication (AIP) and in NOTAMs. Many have night curfews or noise rules.","Late-night and early-morning departures or arrivals","Ask the operator whether the airport is open at that time. An out-of-hours opening may be possible at extra cost, or not at all: then change the time or the airport."],["Slots and prior permission (PPR)","Busy airports are slot-coordinated (in the EU under Regulation (EEC) No 95/93, elsewhere under national rules and the worldwide airport slot guidelines). Business aviation needs a slot there too. Some airports require prior permission for the flight or for parking.","Major hubs, big events and peak seasons","The operator or its trip support requests slots and PPR as soon as the trip is booked. Never promise a time before the slot is confirmed."],["Customs, immigration and private terminals","An international flight must land first at an airport with customs and immigration (Chicago Convention, Article 10). Authorities require passenger information in advance, for example eAPIS for the United States.","Every international arrival and departure","Check that customs is available at the planned time. A private terminal (FBO or VIP terminal) can cost extra. Passenger details reach the operator by its deadline."],["Crew duty and rest","Limits come from the operator's authority. Example: on US unscheduled Part 135 flights a two-pilot crew may fly up to 10 hours in 24 hours, within a duty period of up to 14 hours, with at least 10 hours of rest (14 CFR 135.267). In Europe, EU flight-time rules (ORO.FTL) apply to commercial operations, and national rules still apply to some business-jet air-taxi work.","Long sectors, several legs in a day, an early start after a late arrival","Ask the operator for the crew plan in writing: extra crew, a fresh crew or a night stop. The cost is in the quote or listed as an operational need."],["Crew hotel and allowances","Crew take their rest away from the aircraft.","The aircraft waits with the client overnight or for several days","Agree with the operator whether hotel and allowances are in the price or charged at cost."],["Parking and hangarage","Airports limit parking space, and some require prior permission to park. A hangar protects the aircraft from snow and ice.","Night stops and waiting days, especially at busy or winter airports","Confirm parking, or repositioning to another airport, before booking. A hangar in winter can avoid de-icing but costs extra."],["Technical stops and long sectors","Range falls with load, headwinds and hot or high airports. Long flights over water can need ETOPS or EDTO approval (Module 6.3).","Very long sectors and full cabins","Only the operator confirms non-stop for that load and season. A technical stop adds time, fees and sometimes permits."],["Permits","Non-scheduled flights need permission to land in, and often to fly over, other countries (Chicago Convention, Article 5, and national rules). Domestic legs on foreign aircraft are cabotage (Module 2).","Every international trip; strictest in the countries in Appendix G.5","Give the operator the full routing and passenger details at booking. Later changes need new permits and may be refused."],["Pets","Entry rules for animals differ by country (in the EU, Regulation (EU) No 576/2013). Some countries accept pets only on approved routes and at approved airports.","Any animal on board","Check the destination's rules and the operator's written acceptance before quoting. See Appendix G.4."],["Dangerous goods and weapons","Governed by ICAO Annex 18 and the ICAO Technical Instructions. Spare lithium batteries, oxygen, some medicines, firearms and ammunition are restricted.","Any unusual item in the luggage","Ask the client; the operator decides. Firearms and armed security need permits in every country involved: refer to your manager."],["Children and passengers needing help","Infants count as passengers on the manifest. Child seats must be acceptable to the operator. A passenger who needs medical care in flight needs an air ambulance.","Families, elderly passengers, reduced mobility","List child seats and assistance as client requests. Medical care on board is never a normal charter: refer through your manager."],["Catering and allergies","The caterer and the operator are responsible for food safety; they need allergies in writing.","Every flight: always ask about allergies","Write dietary needs and allergies on the order and get them confirmed back."]]}},{"p":"Anything that depends on the day (de-icing, extra parking, out-of-hours fees, crew nights after a change) is charged at cost after the flight, with receipts. Anything a supplier quotes in writing before booking can be a fixed price. Module 9.8 explains how each is priced."},{"p":"Booking systems can suggest operational needs from the trip itself: de-icing for winter dates, out-of-hours handling for night departures, crew hotel and parking when the aircraft waits between legs, or a private terminal and customs on international arrivals. A suggestion is a prompt to ask the operator, never a fact."},{"links":[["EU CAT.OP.MPA.250: ice and other contaminants, ground procedures","https://regulatorylibrary.caa.co.uk/air-operations-pre-30-october-2025/Content/Document%20Structure/04%20CAT/2%20Regs/07560_CATOPMPA250_Ice_and_other_contaminants_ground_procedures.htm"],["US 14 CFR 135.227: icing conditions","https://www.ecfr.gov/current/title-14/chapter-I/subchapter-G/part-135/subpart-D/section-135.227"],["ICAO Doc 9640: ground de-icing and anti-icing","https://store.icao.int/en/manual-of-aircraft-ground-de-icing-anti-icing-operations-doc-9640"],["US 14 CFR 135.267: flight time and rest, unscheduled crews","https://www.law.cornell.edu/cfr/text/14/135.267"]]}]}],"quiz":[{"q":"Avinode shows a range that covers the route. Can you promise non-stop?","o":["Yes","Only after the operator confirms for that load and season","Only in winter","Only for heavy jets"],"why":"Range depends on load, winds and season. Only the operator can confirm non-stop for this trip.","crit":false,"h":"12f5a2b9"},{"q":"Who decides whether a passenger may carry a spare lithium battery?","o":["The broker","The client","The operator","The FBO"],"why":"Dangerous goods such as spare lithium batteries are the operator's decision under its rules.","crit":false,"h":"91e57035"},{"q":"A client needs a nurse and stretcher on board. What do you do?","o":["Book a normal jet","Refer to an air-ambulance operator through your manager","Ask the client to bring equipment","Decline"],"why":"Patients needing care in flight need an air-ambulance operator. We refer through your manager.","crit":false,"h":"16794e90"},{"q":"A TAF at the destination forecasts fog at arrival time. Who decides whether to fly?","o":["The broker","The client","The crew and operator","The FBO"],"why":"The crew and operator decide on weather. We warn the client early and arrange what they need.","crit":false,"h":"63f45450"},{"q":"A client flies Geneva to London in January at 07:00 and snow is forecast. How is de-icing handled?","o":["Included free","Listed as an operational need, charged at cost after the flight with the receipt","Fixed at USD 2,000 in the quote","Jets never need it"],"why":"No take-off with ice or snow on the aircraft (EU CAT.OP.MPA.250, US 14 CFR 135.227). De-icing depends on the day, so it is charged at cost after the flight with the receipt.","crit":false,"h":"570baed8"},{"q":"A client wants to leave at 01:00 from an airport that closes at 23:00. What do you do?","o":["Promise the time","Ask the operator whether an out-of-hours opening is possible and at what cost; otherwise change the time or the airport","Ignore it","Tell the client to call the airport"],"why":"Airports publish their hours and night restrictions. Only the operator can say whether an out-of-hours opening is possible and what it costs.","crit":false,"h":"8f6bba74"},{"q":"Who sets a crew's duty and rest limits?","o":["The broker","The client","The operator's authority, applied by the operator","The FBO"],"why":"Duty and rest limits come from the operator's authority, for example 14 CFR 135.267 in the US. The operator plans the crew; we ask for the plan in writing.","crit":false,"h":"575ddb8d"}],"obj":["Ask the operator the right feasibility questions","Choose a suitable airport","Recognise long over-water routes and weather risks","Explain the rules behind de-icing, airport hours, slots, customs, crew duty and permits"],"take":["Every feasibility answer comes from the operator in writing.","The airport must suit the aircraft: hours, customs, fire cover, runway.","The crew decides on weather; we warn the client early.","De-icing, out-of-hours fees and crew nights depend on the day: ask before promising a time, and charge them at cost."],"min":16},"m7":{"intro":"","secs":[{"h":"7.1 Families to know","b":[{"p":"Clients choose by cabin, comfort and whether the jet can fly the trip without a stop. Learn the main families below from the manufacturers' own pages (Appendix D) and from each aircraft's listing on Avinode. Never quote a range, speed or seat number from memory: always use the specific aircraft's data and the operator's confirmation."},{"table":{"cols":["Manufacturer","Long-range and large-cabin families to know"],"rows":[["Bombardier (Canada)","Global Express, Global XRS, Global 5000, 5500, 6000, 6500, 7500 and 8000; Challenger 650 (large cabin, shorter range)"],["Gulfstream (United States)","G450, G550, G500, G600, G650 and G650ER, G700, G800"],["Dassault (France)","Falcon 900 series, 7X, 8X, 6X"],["Embraer (Brazil)","Lineage 1000 (converted airliner); Praetor 600 (super-midsize, long range for its class)"],["Boeing and Airbus","Boeing Business Jet and Airbus Corporate Jet: VIP-converted airliners"]]}},{"photos":["cat_ulr","fam_g650","fam_f8x"]},{"links":[["Gulfstream aircraft","https://www.gulfstream.com/en/aircraft/"],["Bombardier aircraft","https://businessaircraft.bombardier.com/"],["Dassault Falcon","https://www.dassaultfalcon.com/"]]}]},{"h":"7.2 How to compare aircraft for a client","b":[{"table":{"cols":["Point","What to look at"],"rows":[["Cabin","Height (can people stand), width, length, number of zones"],["Seats and beds","Number of seats, how many can be made into beds on a night flight"],["Range for this trip","Operator's confirmation for the actual load, not the brochure figure"],["Age and refurbishment","Year of manufacture and date of last cabin refurbishment"],["Connectivity","Type of Wi-Fi and whether it works on the route; any usage charge"],["Crew","Number of cabin attendants; crew rest area on long flights"],["Baggage","Hold size and whether it is reachable in flight; skis, golf bags"],["Lavatory and galley","Number of lavatories; galley for hot meals"]]}},{"photos":["cabin_lt","cabin_lg","cabin_ulr"]}]}],"quiz":[{"q":"A client asks the range of a Global 6000. Where do you get the answer?","o":["Memory","The aircraft's Avinode listing, the manufacturer's page and the operator's confirmation for the trip","A competitor's website","The client"],"why":"Specifications come from the aircraft's Avinode listing and the manufacturer, and the operator confirms them for the trip.","crit":false,"h":"dbe10247"},{"q":"For a 13-hour night flight, which points matter most?","o":["Paint colour","Beds, crew rest and confirmed non-stop range for the load","Aircraft name","Number of windows"],"why":"On a long night flight, beds, crew rest and confirmed non-stop range for the load matter most.","crit":false,"h":"dfe88c71"}],"obj":["Know the long-range aircraft families","Compare aircraft for a client using sourced data"],"take":["Never quote range, speed or seats from memory.","Compare cabins, beds, age and confirmed range for the actual load."],"min":5},"m8":{"intro":"","secs":[{"h":"8.1 Sourcing on Avinode","b":[{"olist":["Search the route and dates; filter by category, seats, year of manufacture and the features the client needs.","Send requests for quotes to several suitable operators at once, with the full trip details (RFQ text in Appendix B).","Compare quotes on the same basis: all-in price, inclusions and exclusions, positioning, aircraft age and cabin, operator safety credentials, quote expiry.","Choose; confirm availability and the final price with the operator in writing.","Quote the client from Avinode (Module 9); book and pay the operator through Avinode and our payment provider (Module 10)."]},{"p":"Direct contact with operators is good for relationships and off-market aircraft, but every booking is recorded and paid through Avinode and our payment provider."},{"links":[["Getting Started with Avinode Marketplace","https://help.avinodegroup.com/hc/en-us/articles/12043060610331-Getting-Started-with-Avinode-Marketplace"],["Avinode for brokers","https://avinode.com/broker/"]]}]},{"h":"8.2 Operator vetting standard","b":[{"fig":"vet"},{"table":{"cols":["Check","Standard","Evidence on file"],"rows":[["AOC","Valid commercial AOC; aircraft listed in the operations specifications","AOC and operations specifications"],["Insurance","Current certificate covering commercial passenger flights","Insurance certificate"],["Safety audit","ARGUS Gold Plus, Platinum or Platinum Elite, or Wyvern Wingman; ARGUS Gold only with manager approval","Rating shown on Avinode or the audit provider's site, with date"],["Safety management standard","IS-BAO registration is a strong plus","Certificate"],["Banned lists","Operator not on the EU Air Safety List or any similar national ban","Search result with date"],["Foreign permissions","The authorisations needed for the route (for example EASA TCO, US authority, CAAS operations permit)","Operator's written confirmation"],["History","No fatal accident, serious incident or regulatory sanction in the last 36 months without a satisfactory explanation","Public accident databases and operator statement"],["Sanctions","Operator and owner not sanctioned (Module 3)","Screening record"],["Terms","Operator terms can be matched back to back by our client terms","Operator contract"]]}},{"links":[["ARGUS audits and ratings","https://argus.aero/auditing-services"],["Wyvern","https://www.wyvern.aero/"],["IS-BAO (International Business Aviation Council)","https://www.ibac.org/is-bao"]]}]},{"h":"8.3 When the operator has no audit rating","b":[{"p":"Many good operators worldwide have no ARGUS or Wyvern rating. They may be used with your manager's approval if all of these are in place:"},{"list":["AOC and aircraft confirmed with the issuing authority or its public register where one exists","Insurance confirmed by the insurer or the operator's insurance broker, not only by a copy","IS-BAO registration, or a completed operator questionnaire on safety management, crew training and maintenance","No adverse history in public accident databases","Two references from brokers or clients who have flown with the operator"]},{"links":[["Air Charter Safety Foundation","https://www.acsf.aero/"],["ARGUS audits and ratings","https://argus.aero/auditing-services"]]}]},{"h":"8.4 Red flags","b":[{"list":["Price far below every other quote for the same trip","Aircraft registered privately, or not on the AOC","Reluctance to send AOC, insurance or contract","Payment requested to a personal account or a country unrelated to the operator","Last-minute change of operator or aircraft without explanation"]},{"links":[["EU Air Safety List","https://transport.ec.europa.eu/transport-themes/eu-air-safety-list_en"],["UK CAA: charters and air taxi flights","https://www.caa.co.uk/air-passengers/about-your-trip/charters-and-air-taxis-flights/"]]}]},{"h":"8.5 Crew and insurance","b":[{"list":["Ask the operator to confirm that the crew are type-rated and current on the aircraft; on long-range trips, ask about their experience on the type and route.","Insurance must cover commercial passenger flights. In the United States, liability cover of USD 50 to 100 million is typical for turbojets (NBAA, 2024); ask what the operator carries and record it.","Where possible, ask the operator to add the client, and your company, as additional insured on its policy.","Check the regulator's public records for enforcement action against the operator where they exist."]}]}],"quiz":[{"q":"Which audit standard is accepted without manager approval?","o":["ARGUS Gold","ARGUS Gold Plus","No rating","Any rating"],"why":"ARGUS Gold Plus, Platinum and Platinum Elite, or Wyvern Wingman, are accepted. ARGUS Gold or no rating needs manager approval.","crit":true,"h":"cdf99bf4"},{"q":"An operator is not rated. Which is required?","o":["Nothing","Manager approval plus AOC, insurance, history and references checked","Client approval only","A lower price"],"why":"An unrated operator needs manager approval, and its AOC, insurance, history and references are checked.","crit":true,"h":"1a3f198a"},{"q":"Before using an operator for a flight into Europe, which list do you check?","o":["The OFAC list only","The EU Air Safety List","The ATOL list","None"],"why":"Operators on the EU Air Safety List are banned or restricted in Europe.","crit":true,"h":"87c57f7d"},{"q":"What should you ask the operator about its insurance?","o":["Nothing","What liability cover it carries, and whether the client and your company can be added as additional insured","Only the premium","Who the insurer's director is"],"why":"Record the operator's liability cover and ask for the client and your company to be added as additional insured where possible.","crit":false,"h":"7d8297ed"}],"obj":["Source on Avinode and compare quotes like for like","Vet an operator against the course standard","Check crew and insurance"],"take":["Compare all-in quotes like for like.","ARGUS Gold Plus or higher, or Wyvern Wingman; otherwise manager approval.","Check the aircraft is on the AOC and the insurance covers commercial passengers."],"min":8},"m9":{"intro":"","secs":[{"h":"9.1 How we get the price","b":[{"p":"Every price comes from a written operator quote. We do not estimate operator costs and never quote an item we cannot show a source for."},{"olist":["Request an all-in quote through Avinode with the full trip details.","Ask the operator for its inclusions and exclusions in writing: positioning legs, crew overnight costs, landing, handling and parking, navigation fees, standard catering, fuel and any fuel surcharge, taxes, de-icing, Wi-Fi use, permits.","Note the quote currency and its expiry.","For items outside the operator quote that the client wants (special catering, ground transport, security), get a written quote from the supplier before including it."]},{"links":[["Creating a professional quote (Avinode)","https://help.avinodegroup.com/hc/en-us/articles/9957467128603-Creating-a-Professional-Quote"],["Trip Manager training videos (Avinode)","https://help.avinodegroup.com/hc/en-us/articles/16390512030491-Training-Videos"]]}]},{"h":"9.2 Costs that cannot be fixed before the flight","b":[{"p":"Some costs depend on the day: de-icing, extra parking or hangar time, extra crew nights after a schedule change, late catering, Wi-Fi data use, changing airport or passenger taxes, and permit fees for late changes. Treat them the same way every time:"},{"list":["Never put a number on them unless the operator or supplier has given it in writing.","List them in the quote and in the booking terms of the confirmation as \"at cost, invoiced after the flight with receipts\".","If the client asks how much, ask the operator for its best estimate in writing and pass it on as the operator's estimate, never as a fixed price.","After the flight, recharge only what the operator invoices, with receipts, with no margin unless the confirmation says otherwise."]}]},{"h":"9.3 The price formula","b":[{"p":"This course uses a margin of 9% of the price the client pays; your company sets its own rate. Because the margin is a share of the selling price, divide the cost by 0.91 for 9%; do not add 9% to the cost."},{"fig":"price"},{"box":{"t":"Price formula","l":["Broker cost = operator all-in price (including positioning legs) + supplier items the broker buys for the client, confirmed in writing","Client price = Broker cost ÷ 0.91     Broker margin = client price − Broker cost = 9% of the client price","Not included: items \"at cost, after the flight\" (9.2), and card payment costs, charged as set out in the confirmation"]}}]},{"h":"9.4 Worked examples","b":[{"table":{"cols":["Example","USD"],"rows":[["A. One-way: operator all-in 100,000","Client price 100,000 ÷ 0.91 = 109,890.11, rounded up to 109,891; margin 9,891"],["Wrong method: 100,000 + 9% = 109,000","Margin 9,000 = only 8.26% of the price"],["B. Multi-leg: three legs quoted by one operator, all-in 180,000 including positioning","Price on the total: 197,803; margin 17,803. Never price legs separately if the operator quotes the trip as one"],["C. Shared positioning: operator lowers its price from 100,000 to 92,000 because the empty return is sold","New client price 101,099 if the client is not yet contracted; if already contracted, the confirmation decides who benefits"],["D. Supplier item: ground transport quoted 1,200 in writing; operator all-in 60,000","Broker cost 61,200; client price 67,253; margin 6,053"],["E. Currency: operator quotes in EUR, client pays in USD","Convert the operator price with the payment provider exchange rate on the day of the quote; state the quote currency and that it is fixed only after payment"],["F. Post-flight: de-icing invoiced by the operator at 2,850 with receipt","Recharge 2,850 through a payment request within 7 days of the flight, with the receipt; no margin"]]}},{"p":"Margins below 9% need your manager's approval before the quote is sent. Round client prices up, never down."},{"fig":"ex"}]},{"h":"9.5 Empty legs","b":[{"p":"Empty legs are priced with the same formula on the operator's empty-leg conditions, which usually allow the operator to cancel or change the flight if the main charter changes. The client receives those conditions in writing; the your company confirmation prints them when the booking type is \"empty leg\"."}]},{"h":"9.6 Presenting the quote","b":[{"list":["Send the quote from Avinode, using the quote email template in Appendix B: aircraft type and year, seats, operator, schedule in local time, price, inclusions, \"at cost\" items and the expiry.","Say \"tail to be confirmed\" if the aircraft is not yet fixed, and confirm it before the contract.","Never show the operator's price or our margin to the client.","Quotes expire with the operator quote; re-confirm price and availability before sending the contract."]},{"links":[["Creating a professional quote (Avinode)","https://help.avinodegroup.com/hc/en-us/articles/9957467128603-Creating-a-Professional-Quote"]]}]},{"h":"9.7 Negotiating with operators","b":[{"list":["Ask for an all-in price and compare like for like (Module 8.1).","Use the client's flexibility: a different day, time or airport can save positioning or match an empty leg.","Ask how the operator prices waiting days, one-way versus return and shared positioning.","Never invent a competing quote, misstate the client's needs or press for savings on safety, crew or maintenance.","Good operators remember fair brokers: agree terms in writing and pay on time."]}]},{"h":"9.8 Pricing client requests and operational extras","b":[{"p":"Every client request and operational extra is charged in one of three ways. Agree which with the operator or the supplier in writing before the confirmation is issued."},{"table":{"cols":["How it is charged","When to use it","Price and payment"],"rows":[["Included in the charter price","The operator includes it in its all-in quote, for example standard catering or handling","Nothing extra: it is part of the operator price"],["Fixed price","A supplier or the operator quotes it in writing before booking, for example a car, flowers or a private terminal fee","Like any supplier item your company buys, it carries the 9% margin: supplier price ÷ 0.91, rounded up. It is its own line on the confirmation and is paid with the balance, or with the full price when departure is less than 7 days away"],["At cost after the flight","The amount depends on the day: de-icing, extra parking or hangarage, out-of-hours fees, crew nights after a change, Wi-Fi use","No number before the flight (Module 9.2). Invoiced within 7 days of the flight with the receipts, through a payment request; payable within 10 calendar days of the invoice (the booking terms, A7). No margin"]]}},{"p":"Worked example: an operator all-in price of USD 100,000 gives a charter price of 109,891. The client adds a car at arrival, quoted in writing at 1,200: the fixed line is 1,200 ÷ 0.91 = 1,318.68, rounded up to 1,319. Total payable: 111,210. The deposit stays at 25% of the charter price: 27,473. The balance of 83,737 is due 7 days before departure. Winter de-icing is listed at cost and invoiced after the flight."}]}],"quiz":[{"q":"The operator all-in price is USD 60,000. What is the client price at 9%?","o":["65,400","65,935","65,934","66,000"],"why":"Client price is the operator price divided by 0.91. 60,000 divided by 0.91 is 65,934.07, rounded up to 65,935. Never round down.","crit":true,"h":"ee2adb09"},{"q":"A client asks the de-icing cost before booking. You:","o":["Guess 2,000","Ask the operator for a written estimate and pass it on as its estimate","Add it to the fixed price","Refuse to answer"],"why":"Never guess a cost. Ask the operator for a written estimate and pass it on as the operator's estimate.","crit":false,"h":"7d680d90"},{"q":"Which items carry the 9% margin?","o":["Everything including post-flight extras","The operator price and confirmed supplier items the broker buys","Only the operator price","Only extras"],"why":"The 9% margin applies to the operator price and to confirmed supplier items the broker buys.","crit":false,"h":"1dbd05bb"},{"q":"Operator all-in 140,000 plus a written catering quote of 2,500 bought by the broker. Client price?","o":["156,594","155,325","150,000","156,000"],"why":"140,000 plus 2,500 is 142,500. Divided by 0.91 that is 156,593.41, rounded up to 156,594.","crit":true,"h":"2ebc327e"},{"q":"Which negotiation step is acceptable?","o":["Telling the operator you have a cheaper quote you do not have","Asking whether a different departure day saves positioning","Asking the crew to skip rest","Hiding the passenger count"],"why":"Using real flexibility to save positioning is fair negotiation. Fake quotes or pressure on safety never are.","crit":false,"h":"d392effa"},{"q":"A car at arrival is quoted in writing at USD 1,200 before booking. What does the client pay for it?","o":["1,200","1,308","1,319","1,330"],"why":"Fixed supplier items carry the 9% margin like any item your company buys: 1,200 ÷ 0.91 = 1,318.68, rounded up to 1,319.","crit":true,"h":"3c7b3b18"},{"q":"How is de-icing charged?","o":["As a fixed price with margin","At cost after the flight with the receipt, without margin","Always included","Never"],"why":"De-icing depends on the day: it is invoiced after the flight with the receipt, without margin (the booking terms, A7).","crit":false,"h":"aefd6360"}],"obj":["Get every price from a written source","Price with the 9% formula and round up","Handle costs that cannot be fixed","Negotiate fairly with operators","Price requests and extras: included, fixed or at cost"],"take":["Client price = Broker cost ÷ 0.91, rounded up.","Costs that depend on the day are charged at cost with receipts.","Negotiate with flexibility, never with fake quotes or pressure on safety.","Fixed extras: supplier price ÷ 0.91; extras at cost: receipts, no margin."],"min":15},"m10":{"intro":"","secs":[{"h":"10.1 The contract","b":[{"p":"The client signs your company's charter confirmation with its booking terms and standard conditions. It is issued only when the pre-issue checklist (Appendix A) is complete."},{"list":["Back to back: our cancellation, change and payment terms to the client are never more generous than the operator's terms to us. If the operator's terms are stricter than the booking terms, your manager decides before issue.","Payment and cancellation follow the booking terms of the confirmation. Learn them; never vary them.","No flight departs until the client has paid in full as agreed."]}]},{"h":"10.2 How money moves","b":[{"table":{"cols":["Step","What happens","Where"],"rows":[["1","Booking confirmed with the operator on Avinode","Avinode"],["2","Client receives a payment request from our payment provider and pays by bank transfer, card or instant payment","Payment provider"],["3","Client funds are held in the broker's client payment account","Payment provider"],["4","Operator is paid from the payment account on its payment terms","Payment provider"],["5","The broker's margin is transferred to the broker's own operating account","Broker's bank"]]}},{"p":"Only our margin enters the broker's own bank account. Operator money never passes through it."},{"fig":"money"}]},{"h":"10.3 Refunds, changes and disputes","b":[{"list":["Refunds go back the same way they came, to the same payer, from the payment account.","Schedule changes: get the operator's new price in writing; issue an amended confirmation; collect any difference before the flight.","Card chargebacks or disputes: escalate to your manager the same day with the file."]}]},{"h":"10.4 The booking file","b":[{"p":"Every booking keeps, in Avinode and the CRM: enquiry, KYC and sanctions records, operator quotes, AOC, operations specifications, insurance and audit evidence, the signed confirmation, payment records, the passenger list and post-flight invoices."}]},{"h":"10.5 Financial controls","b":[{"list":["No credit: every flight is paid in full as agreed before departure.","Check the payment account every day: payments received, payments to operators and refunds match the bookings.","Currency: the quote states its currency; a price in another currency is fixed only once paid.","Card payments can be disputed later: keep the signed confirmation and proof of the flight in the file.","Keep the booking file for the period set by your company's record-keeping rule.","Separate duties: the person who sold a trip never issues its confirmation or records its payments; a second person does."]}]},{"h":"10.6 When to book: the booking timeline","b":[{"table":{"cols":["When","What must happen","Where it is set"],"rows":[["When quoting","The quote and the confirmation state the offer expiry date, time and time zone. Once it has passed, re-confirm the aircraft and price with the operator before signing.","Module 9.6; the confirmation"],["On signature","Deposit of 25% of the charter price, at least USD 2,500. If departure is less than 7 days away, the full price on signature. The booking is held only once cleared funds arrive.","the booking terms, A3"],["Within 24 hours of the deposit","Names and passport copies for everyone travelling (with the signature if paid in full). Permit authorities may set an earlier date, which must be met.","the booking terms, A4"],["As soon as booked","The operator or its trip support requests permits, slots and prior permission, and orders the confirmed requests and extras. Never promise an approval.","Modules 0.6 and 6.5"],["7 days before the first departure","Balance due, including fixed-price requests and extras. Positioning legs are part of the trip.","the booking terms, A3"],["48 hours before","Check the weather (de-icing, delays), the crew plan, airport hours and the trip brief.","Modules 6.4 and 11.1"],["Day of flight","Passengers ready at the departure terminal 45 minutes before the scheduled time.","the booking terms, A6"],["After the flight","Items at cost invoiced within 7 days with receipts; the client pays within 10 calendar days of the invoice.","Module 9.8; the booking terms, A7"],["If the client cancels","Written notice; the charge follows the scale in the booking terms, A9, or the operator's stricter scale shown in the remarks.","the booking terms, A9"]]}},{"p":"Book as early as the client allows. Every day closer to departure means fewer aircraft to choose from, permits and slots that are harder to get, and payment due at once."}]}],"quiz":[{"q":"The operator's cancellation terms are stricter than the booking terms. What happens?","o":["Issue anyway","Manager decides before issue","Change the booking terms yourself","Ask the client"],"why":"If the operator's terms are stricter than the booking terms, your company carries the gap. Your manager decides before the confirmation is issued.","crit":false,"h":"6075a870"},{"q":"Which money enters the broker's own bank account?","o":["Full client payment","Only the broker's margin","Operator payment","Nothing"],"why":"Clients pay through a payment request and operators are paid from our payment account. Only the broker's margin reaches the broker's own account.","crit":true,"h":"0d780f09"},{"q":"A trip departs in 5 days. What does the client pay on signature?","o":["25% of the price","The full price","USD 2,500","Nothing until the flight"],"why":"the booking terms, A3: a booking made less than 7 days before departure is paid in full on signature.","crit":true,"h":"955e2928"},{"q":"When is the balance, including fixed-price extras, due?","o":["On the day of flight","7 days before the first scheduled departure","After the flight","30 days after signature"],"why":"the booking terms, A3: the balance, including fixed-price extras, is due 7 calendar days before the first scheduled departure.","crit":false,"h":"3eac828d"}],"obj":["Issue the confirmation back to back with the operator","Explain how money moves through our payment account","Keep financial controls and a complete booking file","Follow the booking timeline from quote to final invoice"],"take":["Our terms are never softer than the operator's.","Client money and operator money run through a payment request; only the broker's margin reaches its own account.","No flight departs until paid in full.","Deposit 25% (at least USD 2,500); balance 7 days before; under 7 days, pay in full on signature."],"min":11},"m11":{"intro":"","secs":[{"h":"11.1 Before the flight","b":[{"list":["Send passenger details to the operator as early as possible and by its deadline.","Confirm permits and slots are approved (operator or trip-support confirmation).","Confirm catering, ground transport and special requests in writing.","Confirm every client request and operational extra with the operator or supplier in writing, with how it is charged.","From 48 hours before: check the forecast for de-icing and delays, the airport's hours for the planned times, and the crew plan for long or late days.","Send the client the trip brief (Appendix B): aircraft, operator, FBO address, arrival time, document reminder and our 24-hour contact."]}]},{"h":"11.2 Day of flight","b":[{"p":"Track the flight from departure to arrival. Keep the client informed before they need to ask."},{"fig":"day"}]},{"h":"11.3 Disruption","b":[{"table":{"cols":["Event","First actions"],"rows":[["Aircraft unserviceable (AOG)","Ask the operator at once for a replacement of equal or higher category under its contract; if none, search Avinode and direct operators; extra cost needs your manager's approval before it is committed; tell the client what is happening and when you will update them."],["Weather or air-traffic delay","Get the new time from the operator; confirm crew duty limits still allow the flight or what the alternative is; arrange lounge or hotel through the handler if needed."],["Permit refused or late","Operator and trip support lead; explain the cause; offer an alternative routing if the operator confirms one."],["Passenger refused at the border","Follow the authority's decision; documents are the passenger's responsibility; inform your manager."],["Any safety concern","Never press an operator to fly; safety decisions belong to the crew and operator."]]}},{"links":[["EASA Conflict Zone Information Bulletins","https://www.easa.europa.eu/en/domains/air-operations/czibs"],["FAA prohibitions, restrictions and notices","https://www.faa.gov/air_traffic/publications/us_restrictions"],["Safe Airspace (OPSGROUP)","https://safeairspace.net/"]]}]},{"h":"11.4 The 24/7 desk","b":[{"list":["Until a 24-hour desk is in place, brokers share an on-call rota set by your manager; the on-call broker answers the client line and operator calls out of office hours.","Every shift ends with a written handover in the desk log (Appendix B): live trips, open issues, promised call-backs.","Any disruption that needs extra cost or a change of operator is escalated to your manager at any hour."]}]},{"h":"11.5 After the flight","b":[{"p":"A trip is not finished when the aircraft takes off. The broker who sold it follows it to the last landing and then follows up with the client. A file is closed only when every step below is done."},{"h3":"Follow the trip to the last leg"},{"list":["Watch every leg in your booking system or flight-tracking tool: departed, landed, delayed, diverted or cancelled, with the local time. The operator or its trip support gives the times; the 24/7 desk covers the hours you are off duty.","Tell the client at once about any delay, diversion or change, with what happens next (Module 11.3).","The trip counts as flown only when the last leg has landed and the passengers have left the aircraft. Operations then records the flight."]},{"h3":"Follow up with the client"},{"list":["Within 24 hours of the last landing, the broker calls or messages the client or the assistant personally: was everything as promised, and is anything still open. Log it in the trip file.","At the same time, send the client the rating request (template B.10). It asks for a score from 1 to 5 for the trip overall, the aircraft, the crew and the broker, and for any comment. The client answers by reply; nothing is required.","Record the answer in the trip file when it arrives. A score of 3 or less, or any complaint, starts service recovery: the broker calls the client within 1 working day, your manager is told the same day, and anything about the operator is recorded for the operator scorecard.","Ratings feed the broker's service score and the operator scorecard in Control, so we book the operators our clients rate highest. Never publish a client's rating or words without the client's written consent, and never write, offer a reward for or edit a review."]},{"h3":"Settle and close"},{"list":["Collect the operator's final invoice and receipts for items charged at cost.","Recharge the client within 7 days of the flight, with copies, through a payment request.","Close the file only when all payments are settled, the follow-up is logged and the rating request has been sent."]}]},{"h":"11.6 Meeting the client at the FBO","b":[{"list":["For first-time or very important clients, your manager may ask a broker or a local representative to meet the client at the FBO.","Arrive early; check with the handler that the crew, aircraft, catering and cars are ready.","Greet the client, introduce the crew, and stay in the background.","Never board the aircraft or interfere with the crew's work."]}]},{"h":"11.7 Sustainability questions","b":[{"list":["Clients may ask about emissions, sustainable aviation fuel (SAF) or carbon offsets.","Pass on only what the operator or a certified provider states in writing.","Never call a flight \"green\" or \"carbon neutral\" without a certificate for that flight."]}]}],"quiz":[{"q":"When may you close a trip file?","o":["When the aircraft takes off","When the client has paid","When all payments are settled, the follow-up is logged and the rating request has been sent","After 30 days"],"why":"A file closes only when payments are settled, the personal follow-up is logged and the rating request has gone out, plus service recovery for any low score.","crit":false,"h":"6e334dc3"},{"q":"A client rates the trip 2 out of 5. What happens?","o":["Nothing, it is optional","Service recovery: the broker calls within 1 working day and your manager is told the same day","The rating is deleted","The client is offered a discount on the next trip at once"],"why":"A score of 3 or less starts service recovery: the broker calls within 1 working day and your manager is told the same day.","crit":false,"h":"64d466a6"},{"q":"How soon after the last landing does the broker follow up personally?","o":["Within 24 hours","Within 7 days","Only if the client complains","Never; the operator does it"],"why":"The broker follows up personally within 24 hours of the last landing, while the trip is fresh and any problem can still be put right.","crit":false,"h":"afc394e0"},{"q":"An AOG means the replacement costs more. Who approves the extra cost?","o":["The broker","Your manager","The client's assistant","The operator"],"why":"Extra cost after an aircraft goes technical (AOG) is approved by your manager.","crit":false,"h":"ebae4818"},{"q":"The captain says the weather makes departure unsafe. You:","o":["Ask him to try anyway","Accept the decision and look after the client","Find another crew","Cancel without telling the client"],"why":"Safety decisions belong to the captain. Our job is to look after the client.","crit":false,"h":"abae26dd"},{"q":"What must every desk shift end with?","o":["A phone call to your manager","A written handover in the desk log","Nothing","An email to clients"],"why":"Every shift ends with a written handover in the desk log, so nothing is lost overnight.","crit":false,"h":"0f4e715c"}],"obj":["Prepare and run the day of flight","Handle disruption and the 24/7 desk","Answer sustainability questions honestly"],"take":["Keep the client informed before they need to ask.","Extra cost after an AOG needs your manager's approval.","Every desk shift ends with a written handover."],"min":12},"m12":{"intro":"","secs":[{"h":"12.1 The service standard","b":[{"list":["Answer every enquiry the same business day; urgent same-day trips at once.","Say what you will do and by when, then do it.","Write as you speak: short, clear, no jargon, no exaggeration.","Never criticise competitors or operators to a client.","Confirm everything important in writing."]},{"links":[["NBAA Aircraft Charter Consumer Guide","https://nbaa.org/flight-department-administration/aircraft-operating-ownership-options/aircraft-charter/aircraft-charter-consumer-guide/"]]}]},{"h":"12.2 Inbound calls","b":[{"p":"Use the inbound call script (Appendix B): listen first, capture the mission, qualify, agree the next step and when the client will hear from you. Do not quote prices on the first call unless you have a current written operator quote for the same trip."}]},{"h":"12.3 Common objections","b":[{"table":{"cols":["Client says","Answer along these lines"],"rows":[["\"Another broker is cheaper.\"","Compare the same aircraft, age, operator rating and inclusions; if like for like, ask your manager whether we can match."],["\"Why can't you fix the price for everything?\"","Some costs depend on the day; we list them and charge only what the operator invoices, with receipts."],["\"Can we pay later?\"","No flight departs until paid in full; our secure payment link makes paying quick."],["\"Just add two friends on the domestic leg.\"","Only if the operator confirms in writing that the law allows it."],["\"Why do you need my passport?\"","The law and the operator require it for every passenger; it is stored securely and used only for the flight."]]}}]},{"h":"12.4 Charter consultants (outbound)","b":[{"list":["Call only lists approved by your manager; never buy or scrape lists.","Check numbers against the national do-not-call register where one exists (for example Singapore's Do Not Call Registry) and record every opt-out at once.","Say who you are and why you call in the first sentence; use the outbound script (Appendix B).","Hand every live trip to a broker for sourcing and pricing until certified as a broker.","Log every call and outcome in the CRM."]}]},{"h":"12.5 Account management and growth","b":[{"fig":"funnel"},{"list":["Every enquiry moves through the CRM pipeline: new, qualified, quoted, won or lost, with the reason for a loss.","Follow up every quote before it expires.","For repeat clients, keep their preferences (catering, seating, cars) with their consent, and use them on the next trip.","Ask for feedback after every trip and act on it.","Ask satisfied clients for introductions; never pay for referrals without your manager's approval."]},{"table":{"cols":["What your manager tracks","Why"],"rows":[["Response time to new enquiries","Clients book with whoever answers well and first"],["Quote-to-booking conversion","Shows quality of qualification and quotes"],["Repeat clients","The best measure of service"],["Bookings without errors","The service standard"]]}}]},{"h":"12.6 Negotiating with clients","b":[{"list":["Sell value, not discounts: aircraft, operator safety, service and certainty.","Offer two or three options at different prices rather than cutting the margin.","Below 9% needs your manager's approval (Module 9)."]}]}],"quiz":[{"q":"Before calling a number from a new list, you must:","o":["Call at once","Check the national do-not-call register and record opt-outs","Send a message first","Ask the operator"],"why":"Check the national do-not-call register and record any opt-out before calling.","crit":false,"h":"63ac48dd"},{"q":"A client says another broker is cheaper. First step?","o":["Cut our margin","Compare like for like","Criticise the other broker","End the call"],"why":"First compare like for like: aircraft age, operator safety rating, inclusions and what is charged at cost.","crit":false,"h":"812103b8"},{"q":"A client says the price is too high. What is the best first answer?","o":["Cut the margin at once","Offer two or three aircraft options at different prices","Criticise the operator","End the call"],"why":"Offer options at different prices and sell the value, rather than cutting the margin.","crit":false,"h":"892c742d"}],"obj":["Meet the service standard on every call","Answer common objections","Manage accounts, follow-ups and negotiation with clients"],"take":["Answer the same business day and confirm everything in writing.","Compare like for like before discussing price.","Track every enquiry through the pipeline and follow up every quote."],"min":7},"m13":{"intro":"Work each case yourself first, then compare with the model answer.","secs":[{"h":"Case 1: A simple one-way in Europe","b":[{"p":"Work out how you would handle this trip before you open the model answer."},{"p":"An assistant asks for 6 passengers from London to Nice next Friday morning, returning on a separate trip later."},{"reveal":{"t":"Show the model answer","b":[{"olist":["Confirm: which London airport, departure time in local time, names and nationalities, luggage, payer. Start KYC.","Check Module 2.4: international flight, nothing restricted. Screen all names.","Avinode: request quotes for midsize and super-midsize jets from operators allowed to fly in the EU and UK; ask inclusions and exclusions.","Compare and vet (Module 8). Choose; confirm with the operator in writing.","Price: operator all-in ÷ 0.91. Quote from Avinode with expiry and \"at cost\" items.","Confirmation signed; payment request; operator paid from the payment account.","Trip brief to the assistant; flight tracked; post-flight extras recharged with receipts."]}]}}]},{"h":"Case 2: A US trip that touches a domestic leg","b":[{"p":"Work out how you would handle this trip before you open the model answer."},{"p":"A client in Hong Kong wants New York (Teterboro) – Miami – Nassau for 8 people on a European-registered jet she flew before."},{"reveal":{"t":"Show the model answer","b":[{"olist":["Teterboro – Miami is a US domestic leg: no foreign operator may carry it (Module 2.4).","Explain to the client early and plainly; offer the alternative your manager approves (for example a trip that starts in Miami for the international leg, or referral).","Never quote the European jet for the domestic leg."]}]}}]},{"h":"Case 3: Long range, Asia to Europe","b":[{"p":"Work out how you would handle this trip before you open the model answer."},{"p":"A family of 10 wants Singapore to London overnight, non-stop, with plenty of luggage."},{"reveal":{"t":"Show the model answer","b":[{"olist":["Shortlist ultra-long-range jets on Avinode; request quotes with the full passenger and luggage load.","Ask each operator in writing whether the flight is non-stop for that load and season, or needs a fuel stop; and how the crew will be planned (extra crew for duty limits).","Check slots and permits for both ends through the operator; Singapore requires a permit and slot (Module 2.5).","Compare beds, crew rest, Wi-Fi and age (Module 7). Present two options, each with the operator's confirmed routing.","Price, contract and payment as usual; trip brief states local times at both ends and the arrival date."]}]}}]},{"h":"Case 4: An empty leg","b":[{"p":"Work out how you would handle this trip before you open the model answer."},{"p":"An operator lists Geneva – Dubai empty in three days. A client wants it."},{"reveal":{"t":"Show the model answer","b":[{"olist":["Screen client and passengers; check nationality against the EU rules on Russian nationals and aircraft (Module 2.4).","Get the operator's empty-leg conditions in writing: it can cancel or change if the main charter changes.","Price with the formula on the empty-leg price; quote as \"empty leg\" with those conditions.","Confirmation prints the empty-leg conditions; the client confirms he accepts the risk; payment through a payment request."]}]}}]},{"h":"Case 5: Aircraft grounded on the day","b":[{"p":"Work out how you would handle this trip before you open the model answer."},{"p":"Nice – New York booked. Three hours before departure the operator reports a technical fault (AOG)."},{"reveal":{"t":"Show the model answer","b":[{"olist":["Ask the operator for a replacement aircraft of equal or higher category under its contract.","If none: search Avinode and direct operators at once; vet the replacement (Module 8).","Any extra cost: manager approval before commitment.","Tell the client what happened, what you are doing and when you will update; keep updating.","Record everything in the file and the desk log; agree any refund or credit under the confirmation."]}]}}]},{"h":"Case 6: A compliance stop","b":[{"p":"Work out how you would handle this trip before you open the model answer."},{"p":"A new client company asks for Dubai – Paris. The payer is a different company in a third country; one passenger shares a name with a listed person."},{"reveal":{"t":"Show the model answer","b":[{"olist":["Payer different from client: get the payer's identity and reason; manager approval needed (Module 3.1).","Possible sanctions match: stop; no payment; no explanation to the client; report to your manager with the screening record.","Do not continue sourcing until your manager decides."]}]}}]},{"h":"Case 7: A winter night departure with a long stay","b":[{"p":"Work out how you would handle this trip before you open the model answer."},{"p":"A family of eight wants Zurich to Bangkok on 22 January, leaving at 23:30, staying five nights, then flying home. They ask for halal catering, a car at arrival and a child seat for a two-year-old."},{"reveal":{"t":"Show the model answer","b":[{"olist":["Client requests: halal catering, a car at arrival and a child seat. Get the car as a written supplier quote (fixed price ÷ 0.91) or list it at cost; confirm the catering and the seat with the operator (Modules 5.5 and 9.8).","Operational needs: de-icing at Zurich in January (at cost after the flight); the airport's hours and night restrictions for 23:30 (ask the operator, change the time if needed); a private terminal and customs at Bangkok (Module 6.5).","The sector is about 9,000 km: ask the operator in writing whether it is non-stop for eight passengers and their luggage in January, or needs a technical stop, and how the crew is planned.","The aircraft waits five nights: agree crew hotel and allowances and parking at Bangkok, or positioning home and back, whichever the operator prices lower.","Thailand: permits and slot or parking approval at the Bangkok airport; no domestic legs on a foreign aircraft (Module 2).","Timeline: deposit on signature, names and passports within 24 hours, balance including fixed extras 7 days before departure; de-icing invoiced after the flight (Module 10.6)."]}]}}]},{"h":"Spot the problem","b":[{"p":"The twelve spot-the-problem trips are in the trip risk screen lab after Module 2. Go back to it any time to practise."}]}],"quiz":[],"obj":["Apply the whole manual to six real-world trips"],"take":["Work each case yourself before opening the model answer."],"min":9},"m14":{"intro":"","secs":[{"h":"The written exam","b":[{"p":"The written exam follows this module. It draws questions from every module check in your path. To pass you need 80% or more, and every question on a critical rule must be right."},{"p":"After the exam, your employer completes your practical training: Avinode and payment-platform training, shadowing on live trips, a practical exam and supervised bookings."}]},{"h":"14.2 Avinode and payment system training","b":[{"p":"Avinode publishes free onboarding videos and guides in its Help Center. They can be watched without logging in, so trainees can start before your company's account is live. Complete the starter course below in order during stage 3, then take the live sessions with Avinode's onboarding team."},{"h3":"Step 1: Before you start"},{"links":[["Getting Started with Avinode Marketplace","https://help.avinodegroup.com/hc/en-us/articles/12043060610331-Getting-Started-with-Avinode-Marketplace","Short videos for brokers: quick tools, aircraft search, trips buying, Trip Board, empty-leg search, response statistics"]]},{"h3":"Step 2: Starter broker training"},{"p":"Watch Avinode's starter broker videos in the Onboarding section of the Help Center (Appendix D.1)."},{"h3":"Step 3: Quoting and booking"},{"links":[["Trip Manager and Online Booking training video","https://help.avinodegroup.com/hc/en-us/articles/31913562254491-Trip-Manager-and-Online-Booking-training-video","From request to client quote, contract and payment in one flow"],["Trip Manager training videos","https://help.avinodegroup.com/hc/en-us/articles/16390512030491-Training-Videos","Six short videos: request and quote detail, quote PDF to client, trip sheet, invoice, default notes and documents"],["Creating a Professional Quote","https://help.avinodegroup.com/hc/en-us/articles/9957467128603-Creating-a-Professional-Quote","Quote layout in Trip Manager"],["Buying trips with the new booking flow","https://help.avinodegroup.com/hc/en-us/articles/23323694056859-Buying-trips-with-the-new-booking-flow","How a broker accepts an operator's quote, signs and pays"]]},{"h3":"Step 4: Taking and making payments"},{"p":"Our payment provider is still being chosen. Training on payment requests, card and bank payments, operator payouts and refunds is added here once it is agreed. Until then the rules in Module 10 apply: clients pay only through a payment request, and we never send or accept bank details by email or chat."},{"h3":"Step 5: What our payment provider cannot do"},{"p":"Every payment provider refuses some countries and activities. Appendix G.7 lists the countries we cannot take payments from or pay to; check it before you quote."},{"h3":"Step 6: Live sessions and practice"},{"list":["When your company joins Avinode, ask the onboarding team for a live broker session for every broker and consultant, using our own account and settings.","Ask our payment provider for a training session: payment requests, card and bank payments, currency accounts, operator payouts, refunds, user rights and fraud controls.","Ask whether Avinode offers a practice or test environment for trainees.","Exit check for stage 3: one practice quote and one practice payment request completed, reviewed by your manager."]},{"p":"The Help Center has more articles under Getting Started and Scheduling and Quoting. Settings articles (logo, notification lists, trip statuses, user permissions) are for your manager, who sets up the account."}]},{"h":"14.3 External courses","b":[{"p":"The Air Charter Association's Air Charter Essentials Certificate is a one-day introduction for new staff with limited or no aviation background: air charter roles, the commercial process, aviation geography, flight routing, time zones, airport operations and aircraft knowledge, with an assessment and a certificate for those who pass. It is open to non-members. As at October 2026 it runs in person at London Gatwick (next date 3 February 2027) and an online version is announced for January 2027. Published fees: USD 680 (GBP 495) for non-members; USD 405 (GBP 295) for staff of member companies and for people aged 18 to 25."},{"links":[["ACA: Air Charter Essentials Certificate","https://www.theaircharterassociation.aero/the-air-charter-essentials-certificate/","Dates, fees and booking"],["Air Charter Association: training","https://www.theaircharterassociation.aero/training/"]]},{"p":"The UK Air Charter Association runs a three-level Broker Qualification (Level 1 foundation knowledge, Level 2 operations and flight management, Level 3 advanced broker skills; Level 1 also online). It is open only to staff of member companies, so your company must join first. Published prices per level range from about USD 610 to USD 745, with member rates lower; check the current price before booking."},{"table":{"cols":["ACA level","Modules that prepare for it"],"rows":[["Level 1: foundation","Modules 0, 1, 2, 3, 4, 5"],["Level 2: operations and flight management","Modules 6, 7, 8, 11"],["Level 3: advanced broker skills","Modules 9, 10, 12, 13"]]}},{"p":"The mapping is this course's own guide to preparation; the ACA sets its own syllabus."}]},{"h":"14.4 Live negotiation and objection lab","b":[{"p":"Knowing the rules is not enough: UHNW clients and their assistants test a broker's calm and judgement under pressure. The lab practises this out loud. A senior broker or your manager plays the client, the assistant or the operator; the trainee does not see the script. Each session takes about 30 minutes and covers two or three scenarios."},{"list":["Stage 4 (shadowing): two practice sessions, recorded on the scoring sheet but not graded.","Stage 5 (practical exam): one scored session with your manager. Pass: 70 or more out of 100, and neither critical point broken.","Annual refresher: one session for every certified broker."]},{"h3":"Scenario bank"},{"table":{"cols":["Scenario","What a good answer does"],"rows":[["AOG: the booked aircraft is unserviceable 6 hours before departure","Calm, facts first; the operator's written replacement options; extra cost approved by your manager, never promised on the call (Module 11.3)"],["The assistant refuses the 25% deposit and wants to pay after the flight","Explain the booking terms (Module 10.6) and why the operator must be secured; offer card or bank payment options; no exceptions without your manager"],["The principal insists on a domestic leg on a foreign-registered aircraft","Explain cabotage in plain words; offer a local operator for that leg or a new routing; never sell it (Module 2.4)"],["\"Another broker quoted 15% less\"","Compare like for like (aircraft, year, operator, rating, inclusions); offer two or three options; margin below 9% only with manager approval (Module 12.6)"],["A passenger is added on the day","Names to the operator at once; permits, insurance and seats confirmed in writing before you agree"],["The client wants to bring a dog to a strict-entry country","Destination rules and the operator's written acceptance first; offer a route and airport that work (Appendix G.4)"],["De-icing delays departure and the client is angry about the charge","Safety is the crew's decision; the charge is at cost with the receipt, as the confirmation says (Module 9.2)"],["The client asks to pay into a personal account or sends new bank details by chat","Stop: payment request only; treat as fraud until proven otherwise (Module 3.5)"],["The client asks to leave a passenger's name off the manifest","Refuse politely; tell your manager (Module 2.4)"],["Screening shows a possible sanctions match on the payer","Pause without accusing; say you need a short internal check; tell your manager (Module 3.2)"],["The client demands a guaranteed departure time in winter","Promise only what the operator confirms in writing; explain de-icing and slots (Module 6.4)"],["Complaint after the flight about catering and a late car","Listen, apologise for the experience, agree what happens and by when, record it; service recovery steps in Module 11.5"]]}},{"h3":"Scoring sheet"},{"table":{"cols":["Criterion","Points","Critical"],"rows":[["Calm and courteous under pressure","20",""],["Correct rule, explained in plain words","30","Yes: a wrong rule fails the lab"],["Options offered instead of a flat no","20",""],["No promise the operator has not confirmed in writing","pass / fail","Yes: any such promise fails the lab"],["Escalates when the rules say so","15",""],["Written follow-up within 1 hour","15",""]]}},{"p":"Template B.11 is the printable scoring sheet. Your manager may add new scenarios at any time; they go into the bank and into the AI practice partner."}]},{"h":"14.5 AI practice partner","b":[{"p":"An AI roleplay tool can play any client, assistant, family-office manager or operator, at an easy, normal or hard level, for any scenario in the bank or one you describe yourself. You speak (where the browser supports it) or type. When you end the session, the AI scores it against the same sheet, quotes the moments that cost points and shows a model answer."},{"list":["Use it as often as you like before stages 4 and 5; at least five sessions are recommended before the practical exam.","It is a practice partner, not an examiner: the AI can misjudge. Certification is decided only by your manager's scored lab, the practical exam and the supervised bookings.","Keep a note of your sessions and scores for your manager.","Never enter real client names or details: invent them, as in all training."]}]},{"h":"14.6 Post-trip debrief","b":[{"p":"Every supervised booking (stage 6) ends with a short debrief between the trainee, the mentor and operations, within 3 working days of the last landing. It is recorded on template B.9. A supervised booking counts towards sign-off only when all three have completed their part."},{"table":{"cols":["Measure","Scored 1 to 5 on"],"rows":[["Pre-issue checks","How completely and how quickly the pre-issue checklist (Appendix A.1) was done, with evidence on file"],["Extras and changes","How clearly operational extras (de-icing, FBO and handling fees, parking) and any changes were explained to the client before and after the flight"],["Client satisfaction","The client's rating and comments from the follow-up (Module 11.5)"]]}},{"list":["Errors: list any critical or minor error found (critical errors are defined in How to use this manual).","What went well, what to do differently, and one action with an owner and a date.","The mentor and operations sign; the trainee confirms they have read the result."]}]}],"quiz":[{"q":"What does a trainee need to pass the live negotiation lab at stage 5?","o":["Any score","70 or more out of 100 with no critical point broken","A perfect score","The AI practice partner's approval"],"why":"The lab pass mark is 70 out of 100, and the critical points (the correct rule, no unconfirmed promise) must not be broken whatever the total.","crit":false,"h":"abfe20fb"},{"q":"Who decides certification?","o":["The AI practice partner","Your manager, through the scored lab, the practical exam and the supervised bookings","The client","The operator"],"why":"Your manager certifies, on the scored lab, the practical exam and the supervised bookings. The AI practice partner never decides.","crit":false,"h":"bf0990d5"},{"q":"When does a supervised booking count towards sign-off?","o":["When it is quoted","When the client pays","When the trainee, mentor and operations have completed the post-trip debrief","After 30 days"],"why":"A supervised booking counts only when trainee, mentor and operations have each completed their part of the post-trip debrief.","crit":false,"h":"d8c42a62"}],"obj":["Know how you are assessed and certified","Plan your Avinode, payment system and external training"],"take":["80% in the exam and every critical-rule question right.","Then systems training, shadowing with two site visits, the practical exam and 10 supervised bookings."],"min":14},"m15":{"intro":"For brokers who run, or plan to run, their own brokerage: what it takes to set up, stay legal, handle money safely, find clients and grow. The rules in Modules 2 and 3 apply to every brokerage, whatever its size.","obj":["Judge the economics of broking realistically","Set up a brokerage on a sound legal and financial footing","Choose the tools and insurance a brokerage needs","Find and keep clients within the advertising and data rules","Work with partners and grow with measurable standards"],"take":["Income depends on volume, margin and repeat clients; nobody can guarantee it.","Take local legal and tax advice before you trade, and have your terms drafted by aviation counsel.","Keep client money apart from your own, and carry professional liability insurance.","Pick a niche you understand and earn repeat business; advertise honestly.","Put every partner relationship in writing and measure what matters."],"secs":[{"h":"15.1 Is broking for you?","b":[{"p":"Brokers earn a margin or a commission on each charter. Income depends on how many trips you sell, your margin and how many clients come back. Some months bring several trips and some none."},{"list":["Be wary of courses and schemes that promise a fixed income or quick riches: no one can guarantee bookings.","Expect to build a client base over time, mostly through service, reputation and referrals.","Working for an established brokerage first is the fastest way to learn the trade with support."]}]},{"h":"15.2 Setting up the company","b":[{"list":["Register a company, open a business bank account and register for the taxes that apply where you trade.","Check the licensing rules in every country where you sell. In the United States, brokers must follow 14 CFR Part 295, and some states also have seller-of-travel laws.","Selling flights with hotels or other travel as one package can need a travel licence, such as ATOL in the United Kingdom, and brings EU package-travel rules into play.","Have your client terms and conditions and your charter confirmation drafted or reviewed by aviation counsel. Your terms to clients must be back to back with the operators' terms to you (Module 10).","Decide which broker model you use: agent of the client, agent of the operator, or principal (Module 1.6)."]},{"links":[["14 CFR Part 295, air charter brokers","https://www.ecfr.gov/current/title-14/chapter-II/subchapter-A/part-295"],["NBAA Best Practices for Air Charter Brokering (2024)","https://nbaa.org/wp-content/uploads/2024/07/NBAA-Best-Practices-for-Air-Charter-Brokering.pdf"],["UK CAA: ATOL protection","https://www.caa.co.uk/atol-protection/"]]}]},{"h":"15.3 Insurance","b":[{"list":["Professional liability (errors and omissions) insurance protects you if a mistake of yours causes a client loss, such as wrong airport or document advice. NBAA recommends it for every broker.","In the United States you must tell clients whether you hold liability insurance (Part 295).","Ask operators to name the client, and your company, as additional insured where possible (Module 8.5).","An insurance broker who knows aviation can set the right cover for the flights you sell."]},{"links":[["NBAA Best Practices for Air Charter Brokering (2024)","https://nbaa.org/wp-content/uploads/2024/07/NBAA-Best-Practices-for-Air-Charter-Brokering.pdf"]]}]},{"h":"15.4 Handling money safely","b":[{"list":["Keep client money separate from your own: a dedicated client account, or a secure charter payment platform, so that operator money never mixes with your operating funds.","Never send bank details by email or chat; use payment requests and verify any change of bank details by phone (Module 3.5).","Set up know-your-client and sanctions screening before your first booking (Module 3).","Understand card payments: card costs, and that a client can dispute a payment long after the flight.","Hold currency accounts if you buy and sell in different currencies, and state the quote currency."]}]},{"h":"15.5 Tools of the trade","b":[{"table":{"cols":["Tool","What it does"],"rows":[["Avinode membership","Search aircraft, request and compare quotes, book and pay operators"],["CRM","Every client, enquiry, quote and booking in one place, with the pipeline (Module 12.5)"],["Templates","Intake form, request for quote, quote email, charter confirmation, trip brief (Appendix B)"],["Secure document storage","Passports, KYC files and contracts, with access control"],["Phone and messaging with 24/7 cover","Clients and operators can reach you at any hour"],["Flight tracking","Follow flights on the day and update clients first"]]}},{"links":[["Avinode for brokers","https://avinode.com/broker/"],["Getting Started with Avinode Marketplace","https://help.avinodegroup.com/hc/en-us/articles/12043060610331-Getting-Started-with-Avinode-Marketplace"]]}]},{"h":"15.6 Finding clients","b":[{"list":["Choose a niche you understand: for example sports teams, event organisers, corporate travel managers, family offices, or a region you know well.","Build referral partners who meet wealthy travellers: concierge services, yacht and real-estate brokers, travel agencies, event organisers. Put referral terms in writing.","Your website and social media must follow the advertising rules: never claim a fleet, show full prices where required, and use testimonials only with consent (Module 2.11).","Respect do-not-call registers and every opt-out, and handle personal data under data-protection law (Module 3.7).","Repeat clients are the core of a brokerage: remember preferences, follow up after every trip, ask for feedback."]}]},{"h":"15.7 Working with partners","b":[{"list":["Sub-brokers and agents who bring you trips need a written agreement: who contracts with the client, commission, confidentiality and who carries out KYC.","Disclose to clients any relationship that could affect your advice, such as a commission from an operator.","Treat operators as long-term partners: complete trip details, fair negotiation and prompt payment win you better availability.","Never let a partner sell a flight in your name before an operator has confirmed it in writing."]}]},{"h":"15.8 Growing the business","b":[{"list":["Measure response time, quote-to-booking conversion, repeat clients, margin per booking and bookings without errors (Module 12.5).","Run the business on checklists, a written error log and regular reviews, so quality survives growth.","Train every new broker to this standard before they work alone, and repeat the exam each year.","Join the industry: associations such as the Air Charter Association, NBAA, EBAA or AsBAA offer guidance, events and networks."]},{"links":[["Air Charter Association: training","https://www.theaircharterassociation.aero/training/"]]}]}],"quiz":[{"q":"A course promises a guaranteed monthly income from charter broking. How do you treat it?","o":["As a fact","As marketing: income depends on volume, margin and repeat clients","As a legal promise","As an industry standard"],"why":"No one can guarantee bookings. Income depends on how many trips you sell, your margin and how many clients return.","crit":false,"h":"b8263689"},{"q":"Where should client money for a charter be held?","o":["In the broker's operating account","Separate from your own money, in a client account or a secure payment platform","In cash","With the client's assistant"],"why":"Keeping client money apart protects clients and operators and is the basis of safe payments.","crit":false,"h":"c229c726"},{"q":"What does professional liability (errors and omissions) insurance cover?","o":["The aircraft hull","Losses caused by the broker's own mistakes","Crew salaries","Fuel price rises"],"why":"It protects the brokerage when its own error, such as wrong document advice, causes a client loss.","crit":false,"h":"978159a9"},{"q":"You want to sell flights with hotels as one package to UK consumers. What do you check first?","o":["Nothing","Whether a travel licence such as ATOL and package-travel rules apply","Only the hotel price","The operator's paint scheme"],"why":"Selling packages can require a travel licence and brings package-travel rules into play.","crit":false,"h":"44c4e6a6"},{"q":"A new partner will send you trips for a commission. What comes first?","o":["Start at once","A written agreement covering who contracts, commission, confidentiality and KYC","A handshake","Pay them in advance"],"why":"Every partner relationship belongs in writing, including who contracts with the client and who runs KYC.","crit":false,"h":"d0ff5b60"}],"min":12}};
const REF = {"rhow":{"t":"Training path and rules","b":[{"p":"This course is a complete standard for charter brokers and charter consultants. It is written for people who have never worked in aviation. Start at Module 0 even if some of it seems simple: brokers who skip the basics make the expensive mistakes."},{"h3":"Two training paths"},{"table":{"cols":["Path","Modules","You may start"],"rows":[["Charter consultant","0, 1, 2, 3, 4, 5, 12 and the case studies in 13 for reading; Appendix B call scripts","Calling clients alone after the consultant exam and 2 weeks of supervised calls"],["Broker","All modules 0 to 14","Quoting and contracting alone after full certification (below)"]]}},{"h3":"Stages and exit criteria"},{"table":{"cols":["Stage","What you do","To pass"],"rows":[["1. Self-study","Read the modules for your path; answer every module check","All module checks done; questions you got wrong reviewed with your mentor"],["2. Written exam","Final exam from the question bank, set by your manager","80% or more; every critical-rule question correct"],["3. Systems","Avinode and payment system training (Module 14)","Avinode and payment system access live; one practice quote and one practice payment request completed"],["4. Shadowing","Follow a senior broker on live trips from enquiry to closed file, including the follow-up after the flight; visit one FBO or handler and one operator; two live negotiation lab sessions with a senior broker (Module 14.4); practise with the AI practice partner (Module 14.5)","8 complete trips shadowed; both visits done; two lab sessions recorded"],["5. Practical exam","Run a mock trip from enquiry to signed confirmation, with a role-played client and operator, and a scored live negotiation lab with your manager (Module 14.4)","No critical error; no more than 3 minor errors; lab score 70 or more with no rule broken"],["6. Supervised","Run your own bookings; your manager or a senior broker checks every quote and contract before it is sent;
