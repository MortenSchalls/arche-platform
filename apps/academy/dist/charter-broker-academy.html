<title>Charter Broker Academy</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700&family=Nunito+Sans:ital,opsz,wght@0,6..12,400;0,6..12,600;0,6..12,700;1,6..12,400&family=DM+Mono:wght@500&display=swap">
<script>(function(){var t="light";try{t=localStorage.getItem("arche.theme")||"light";}catch(e){}document.documentElement.setAttribute("data-theme",t);})();</script>
<style>
/* Layout: a training desk. Course map on the left like a flight plan, one lesson at a time on the right. Archē charcoal and steel, same faces as the charter confirmation form. */
:root{
  --ground:#f2f0eb; --panel:#fbfaf7; --ink:#1b1e23; --muted:#5f656d; --line:#dedad1; --field:#fffefb;
  --accent:#1f5fae; --accent-ink:#FFFFFF; --steel:#1f5fae; --steel-soft:#dde9fb;
  --ok:#147a3c; --ok-bg:#dcf2e3; --warn:#985a00; --warn-bg:#fdebc6; --err:#c0281d; --err-bg:#fddfdb;
  --green:#147a3c; --amber:#985a00; --red:#c0281d;
  --bar:#2c2f34; --bar-ink:#e9eef3; --bar-sub:#7fb0ff; --bar-line:#5A6170;
  --series-1:#2a78d6; --kpi-1:#2a78d6; --kpi-2:#eb6834; --kpi-3:#1baf7a; --kpi-4:#6250d6; --kpi-5:#e87ba4;
  --display:"Plus Jakarta Sans","Segoe UI",system-ui,sans-serif;
  --body:"Nunito Sans","Segoe UI",system-ui,-apple-system,sans-serif;
  --mono:"DM Mono",ui-monospace,Menlo,Consolas,monospace;
}
:root[data-theme="dark"]{
  --ground:#2c2f34; --panel:#34373d; --ink:#eef1f5; --muted:#a5abb2; --line:#474a50; --field:#2a2d32;
  --accent:#7fb0ff; --accent-ink:#10233d; --steel:#7fb0ff; --steel-soft:#25374f;
  --ok:#6fdc9e; --ok-bg:#243f33; --warn:#f5c35c; --warn-bg:#45391f; --err:#ff8f84; --err-bg:#4d2c29;
  --green:#6fdc9e; --amber:#f5c35c; --red:#ff8f84;
  --bar:#26292e; --bar-ink:#e9eef3; --bar-sub:#7fb0ff; --bar-line:#5A6170;
  --series-1:#3987e5; --kpi-1:#3987e5; --kpi-2:#d95926; --kpi-3:#199e70; --kpi-4:#9085e9; --kpi-5:#d55181; color-scheme:dark;
}
@media (prefers-color-scheme: dark){ :root[data-theme="system"]{
  --ground:#2c2f34; --panel:#34373d; --ink:#eef1f5; --muted:#a5abb2; --line:#474a50; --field:#2a2d32;
  --accent:#7fb0ff; --accent-ink:#10233d; --steel:#7fb0ff; --steel-soft:#25374f;
  --ok:#6fdc9e; --ok-bg:#243f33; --warn:#f5c35c; --warn-bg:#45391f; --err:#ff8f84; --err-bg:#4d2c29;
  --green:#6fdc9e; --amber:#f5c35c; --red:#ff8f84;
  --bar:#26292e; --bar-ink:#e9eef3; --bar-sub:#7fb0ff; --bar-line:#5A6170;
  --series-1:#3987e5; --kpi-1:#3987e5; --kpi-2:#d95926; --kpi-3:#199e70; --kpi-4:#9085e9; --kpi-5:#d55181; color-scheme:dark;
}}
*{box-sizing:border-box}
/* colour layer, shared with the broker portal */
.tiles > .tile{border-top:3px solid var(--kpi-1)}
.tiles > .tile:nth-child(5n+2){border-top-color:var(--kpi-2)}.tiles > .tile:nth-child(5n+3){border-top-color:var(--kpi-3)}.tiles > .tile:nth-child(5n+4){border-top-color:var(--kpi-4)}.tiles > .tile:nth-child(5n+5){border-top-color:var(--kpi-5)}
.card > h2:first-child::before,.card > .row:first-child > h2::before{content:"";display:inline-block;width:4px;height:.85em;background:var(--steel);margin-right:10px;border-radius:2px;vertical-align:-1px}
.btn.primary{box-shadow:0 2px 8px color-mix(in srgb,var(--accent) 30%,transparent)}
.bar .themesel{width:auto;max-width:150px;flex:none;background:transparent;color:var(--bar-ink);border:1px solid var(--bar-line);border-radius:6px;padding:4px 8px;font-size:13px;height:32px}
.themesel option{color:#1b1e23;background:#fff}

html,body{min-height:100%}
body{background:var(--ground);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.62}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bar)}
a{color:var(--steel);text-underline-offset:2px}
button{font:inherit;cursor:pointer;color:inherit}
:focus-visible{outline:2px solid var(--steel);outline-offset:2px}
h1,h2,h3{text-wrap:balance}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;background:var(--bar);color:var(--bar-ink);display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding-block:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.bar img{height:34px;width:auto;display:block}
.bar .sub{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--bar-sub);font-weight:600}
.bar .sp{flex:1}
.chip{font-size:12px;font-weight:600;padding:4px 10px;border-radius:999px;white-space:nowrap;border:1px solid transparent}
.chip.sync{background:var(--ok-bg);color:var(--ok)}
.chip.local{background:var(--warn-bg);color:var(--warn)}
.chip.none{background:transparent;color:var(--bar-sub);border-color:var(--bar-line)}
.barbtn{background:transparent;color:var(--bar-ink);border:1px solid var(--bar-line);border-radius:6px;padding:5px 11px;font-size:13px;font-weight:500}
.barbtn:hover{border-color:var(--bar-sub)}
.mapbtn{display:none}
.shell{display:grid;grid-template-columns:290px minmax(0,1fr);gap:0;max-width:1320px;margin:0 auto;align-items:start}
nav.map{position:sticky;top:calc(env(safe-area-inset-top,0px) + 52px);max-height:calc(100vh - 60px);overflow:auto;padding:18px 14px 24px max(16px,env(safe-area-inset-left,0px));border-right:1px solid var(--line)}
.who{font-size:13px;color:var(--muted);margin:0 6px 12px}
.who b{color:var(--ink);font-weight:600}
.prog{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin:6px 6px 16px}
.prog i{display:block;height:100%;background:var(--series-1);width:0}
.map ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.map li button{width:100%;display:grid;grid-template-columns:42px 1fr auto;align-items:center;gap:6px;text-align:left;background:none;border:none;border-radius:6px;padding:7px 6px;font-size:13.5px;color:var(--ink)}
.map li button:hover:not(:disabled){background:var(--steel-soft)}
.map li button[aria-current="true"]{background:var(--steel-soft);font-weight:600}
.map li button:disabled{color:var(--muted);cursor:default}
.code{font-family:var(--mono);font-size:11.5px;color:var(--muted)}
.st{font-size:11px;font-weight:600;padding:1px 7px;border-radius:999px;white-space:nowrap}
.st.done{background:var(--ok-bg);color:var(--ok)}
.st.open{background:var(--steel-soft);color:var(--steel)}
.st.soon{color:var(--muted)}
.map .group{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:600;margin:14px 6px 4px}
.map .extra{margin-top:14px;display:flex;flex-direction:column;gap:2px}
main{min-width:0;padding-block:24px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.page{max-width:820px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.eyebrow{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--steel);font-weight:600}
h1{font-family:var(--display);font-weight:700;font-size:clamp(25px,3.2vw,33px);letter-spacing:-.01em;line-height:1.2;margin:2px 0 0}
h2{font-family:var(--display);font-weight:700;font-size:20px;letter-spacing:-.005em;margin:0}
h3{font-size:15px;font-weight:700;margin:0}
p{margin:0}
.lede{color:var(--muted);font-size:16px;max-width:68ch}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:20px 22px;display:flex;flex-direction:column;gap:12px;min-width:0}
.card.flat{background:transparent;border-style:dashed}
.steps{display:flex;gap:4px;flex-wrap:wrap}
.steps span{height:5px;flex:1;min-width:14px;border-radius:3px;background:var(--line)}
.steps span.on{background:var(--steel)}
.steps span.cur{background:var(--accent)}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:8px}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th{text-align:left;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600;padding:8px 10px;background:var(--field);border-bottom:1px solid var(--line)}
td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:none}
td.mono{font-family:var(--mono);font-size:12.5px}
.rag td:nth-child(2){border-left:4px solid var(--amber)}
.rag td:nth-child(3){border-left:4px solid var(--red)}
ul.l,ol.l{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.links{display:flex;flex-direction:column;gap:6px;border-top:1px solid var(--line);padding-top:12px}
.links .lab{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:600}
.links a{font-size:14px;display:inline-flex;gap:6px;align-items:baseline}
.links a::after{content:"↗";font-size:12px;color:var(--muted)}
.box{background:var(--steel-soft);border-radius:8px;padding:12px 16px;display:flex;flex-direction:column;gap:4px}
.box b{font-weight:700}
.regions{display:flex;flex-direction:column;gap:8px}
.reg{border:1px solid var(--line);border-radius:8px;background:var(--panel)}
.reg summary{cursor:pointer;padding:10px 14px;font-weight:600;list-style:none;display:flex;justify-content:space-between;gap:10px}
.reg summary::after{content:"+";color:var(--muted);font-weight:500}
.reg[open] summary::after{content:"−"}
.reg .in{padding:0 14px 14px;display:grid;grid-template-columns:1fr 1fr;gap:12px}
.reg .in .k{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600;margin-bottom:3px}
.reg .in .lk{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:6px 16px;font-size:14px}
.try{border:1px solid var(--line);border-left:4px solid var(--steel);border-radius:8px;padding:14px 16px;display:flex;flex-direction:column;gap:10px;background:var(--panel)}
.try .tq{font-weight:600}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;gap:10px;align-items:flex-start;text-align:left;border:1px solid var(--line);background:var(--field);border-radius:8px;padding:10px 12px;font-size:14.5px;width:100%}
.opt:hover:not(:disabled){border-color:var(--steel)}
.opt .k{font-family:var(--mono);font-size:12px;color:var(--muted);padding-top:2px;min-width:14px}
.opt.right{border-color:var(--ok);background:var(--ok-bg)}
.opt.wrong{border-color:var(--err);background:var(--err-bg)}
.opt:disabled{cursor:default}
.fb{border-radius:8px;padding:10px 14px;font-size:14px}
.fb.ok{background:var(--ok-bg);color:var(--ok)}
.fb.no{background:var(--err-bg);color:var(--err)}
.fb b{font-weight:700}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:7px;padding:9px 16px;font-weight:600;font-size:14px}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.08)}
.btn:disabled{opacity:.5;cursor:default}
.sp{flex:1}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.tile{border:1px solid var(--line);border-radius:10px;padding:14px;background:var(--panel);display:flex;flex-direction:column;gap:6px;text-align:left;min-width:0}
button.tile:hover{border-color:var(--steel)}
.tile .code{font-size:12px}
.tile .tt{font-weight:600;font-size:14.5px;line-height:1.3}
.score{font-family:var(--mono);font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--muted);font-weight:500;min-width:0}
input,select{font:inherit;font-size:14.5px;color:var(--ink);background:var(--field);border:1px solid var(--line);border-radius:6px;padding:8px 10px;width:100%;min-width:0}
input[type=checkbox]{width:auto;accent-color:var(--steel)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px 12px}
.full{grid-column:1/-1}
.check{display:flex;gap:9px;align-items:flex-start;font-size:14px;color:var(--ink)}
.check input{margin-top:4px}
.labcard{display:flex;flex-direction:column;gap:10px}
.labcard .trip{font-weight:600;font-size:15px}
.rag3{display:flex;gap:6px;flex-wrap:wrap}
.ragb{border:1px solid var(--line);background:var(--field);border-radius:999px;padding:6px 14px;font-weight:600;font-size:13px;display:inline-flex;align-items:center;gap:7px}
.ragb i{width:10px;height:10px;border-radius:50%;display:inline-block}
.ragb[aria-pressed="true"]{border-color:var(--ink);background:var(--panel);box-shadow:inset 0 0 0 1px var(--ink)}
.dot-green{background:var(--green)} .dot-amber{background:var(--amber)} .dot-red{background:var(--red)}
.brief{display:flex;flex-direction:column;gap:10px}
.brief .doc{border:1px solid var(--line);background:var(--field);border-radius:8px;padding:12px 14px;display:flex;flex-direction:column;gap:4px}
.brief .doc .k{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600}
.leg{display:grid;grid-template-columns:1.3fr .9fr .9fr .9fr .7fr auto;gap:8px;align-items:end;border:1px solid var(--line);border-radius:8px;padding:10px;background:var(--field)}
.leg input{background:var(--panel)}
.leg .pos{flex-direction:row;align-items:center;gap:6px;padding-bottom:9px;white-space:nowrap}
.auto{display:flex;flex-direction:column;gap:6px}
.issue{font-size:13.5px;border-radius:6px;padding:8px 11px}
.issue.err{background:var(--err-bg);color:var(--err)}
.issue.warn{background:var(--warn-bg);color:var(--warn)}
.issue.okk{background:var(--ok-bg);color:var(--ok)}
.calc{display:grid;grid-template-columns:1fr auto;gap:4px 12px;font-size:14px;background:var(--field);border-radius:8px;padding:10px 12px;font-variant-numeric:tabular-nums}
.calc span:nth-child(even){text-align:right;font-weight:600}
.res{display:flex;flex-direction:column;gap:6px}
.res .it{display:grid;grid-template-columns:auto 1fr;gap:10px;font-size:14px;padding:8px 10px;border-radius:6px;background:var(--field)}
.res .it .m{font-weight:700;font-size:12px;padding-top:2px}
.res .it.pass .m{color:var(--ok)} .res .it.fail .m{color:var(--err)}
.tag{font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:1px 6px;border-radius:4px;background:var(--err-bg);color:var(--err);margin-left:6px}
.tag.min{background:var(--warn-bg);color:var(--warn)}
.cert{border:1px solid var(--line);border-radius:12px;background:var(--panel);padding:28px;display:flex;flex-direction:column;gap:14px;text-align:center;align-items:center}
.cert .nm{font-family:var(--display);font-size:26px;letter-spacing:.04em}
.codebox{font-family:var(--mono);font-size:12.5px;background:var(--field);border:1px solid var(--line);border-radius:8px;padding:10px 12px;word-break:break-all;text-align:left;width:100%;user-select:all}
.note{font-size:13px;color:var(--muted)}
.empty{color:var(--muted);font-size:14px;padding:12px 0}
.wmark{position:fixed;inset:0;pointer-events:none;z-index:4;background-repeat:repeat}
.legal{font-size:12px;color:var(--muted);border-top:1px solid var(--line);padding-top:12px;margin-top:8px}
.lrow{display:flex;flex-direction:column;gap:1px}
.lrow .why{font-size:12.5px;color:var(--muted)}
.reveal{border:1px dashed var(--line);border-radius:8px;padding:10px 14px;background:var(--field)}
.reveal summary{cursor:pointer;font-weight:600;color:var(--steel)}
.reveal .rv{display:flex;flex-direction:column;gap:10px;margin-top:10px}
.card h3{margin-top:6px}
.opt.picked{border-color:var(--steel);background:var(--steel-soft);box-shadow:inset 0 0 0 1px var(--steel)}
.fig{margin:0;display:flex;flex-direction:column;gap:6px;min-width:0}
.fig .cv{border:1px solid var(--line);border-radius:10px;background:var(--field);padding:14px;overflow-x:auto}
.fig svg{display:block;width:100%;height:auto}
.fig figcaption{font-size:13px;color:var(--muted);display:flex;flex-direction:column;gap:2px}
.fig .src{font-size:11.5px;font-style:italic}
.fig text{font-family:var(--body);fill:var(--ink);font-size:14px}
.fig .t-s{font-size:13px}.fig .t-b{font-weight:700}.fig .t-m{fill:var(--muted)}.fig .t-h{font-family:var(--display);font-size:22px;font-weight:600}
.fig .t-x{fill:var(--accent-ink);font-size:11px;font-weight:700}.fig .t-x2{fill:#fff;font-size:17px;font-weight:700;letter-spacing:1px}.fig .t-x3{font-size:12px;font-weight:700}.fig .t-inv{fill:var(--accent-ink)}
.fig .f-panel{fill:var(--panel)}.fig .f-soft{fill:var(--steel-soft)}.fig .f-acc{fill:var(--steel)}.fig .f-ink{fill:var(--accent)}
.fig .f-ok{fill:var(--green)}.fig .f-amb{fill:var(--amber)}.fig .f-red{fill:var(--red)}.fig .f-red-soft{fill:var(--err-bg)}
.fig .s-line{stroke:var(--line)}.fig .s-acc{stroke:var(--steel)}.fig .s-ink{stroke:var(--ink)}.fig .s-ok{stroke:var(--green)}.fig .s-amb{stroke:var(--amber)}.fig .s-red{stroke:var(--red)}
.hero{border-radius:12px;background:linear-gradient(135deg,var(--steel-soft),var(--field));padding:8px 14px}
.hero svg{display:block;width:100%;height:auto;max-height:140px}
.hero text{font-family:var(--body);fill:var(--ink)}.hero .t-h{font-family:var(--display);font-size:24px;font-weight:600}.hero .t-s{font-size:13px}.hero .t-m{fill:var(--muted)}.hero .f-acc{fill:var(--steel)}.hero .f-panel{fill:var(--panel)}.hero .f-soft{fill:var(--steel-soft)}.hero .s-line{stroke:var(--line)}
.meta{display:flex;flex-wrap:wrap;gap:8px}
.meta span{font-size:12.5px;font-weight:600;color:var(--steel);background:var(--steel-soft);border-radius:999px;padding:3px 10px}
.objs{counter-reset:o;list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:8px}
.objs li{display:grid;grid-template-columns:28px 1fr;gap:8px;align-items:start}
.objs li::before{counter-increment:o;content:counter(o);width:24px;height:24px;border-radius:50%;background:var(--steel);color:var(--accent-ink);font-size:12.5px;font-weight:700;display:grid;place-items:center}
.take li::before{content:"✓";background:var(--green)}
@media (max-width: 560px){ .fig .cv svg{min-width:560px} .fig .cv::after{content:"Swipe to see the whole figure";display:block;font-size:11.5px;color:var(--muted);margin-top:6px;position:sticky;left:0} }
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.gallery.one{grid-template-columns:minmax(0,1fr)}
.ph{margin:0;display:flex;flex-direction:column;gap:5px;min-width:0}
.ph img{width:100%;aspect-ratio:3/2;object-fit:cover;border-radius:8px;background:var(--field);display:block}
.gallery.one .ph img{aspect-ratio:16/7}
.ph figcaption{font-size:13px;font-weight:600;color:var(--ink)}
.ph .cr{font-size:11px;font-weight:400;color:var(--muted)}
.ph .cr a{color:var(--muted)}
@media (max-width: 560px){ .gallery{grid-template-columns:1fr 1fr;gap:10px} .gallery.one{grid-template-columns:minmax(0,1fr)} .ph figcaption{font-size:12px} }
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
/* audio */
.audiobtn[aria-pressed="true"]{background:var(--bar-ink);color:var(--bar);border-color:var(--bar-ink);font-weight:600}
.dock{position:fixed;left:0;right:0;bottom:0;z-index:8;background:var(--panel);border-top:1px solid var(--line);box-shadow:0 -6px 20px rgba(10,20,30,.10);padding-top:10px;padding-bottom:calc(10px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.dock .in{max-width:1100px;margin:0 auto;display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center}
.dock .ctl{display:flex;gap:6px}
.dock .ctl button{border:1px solid var(--line);background:var(--field);border-radius:999px;min-width:40px;height:40px;padding:0 12px;font-weight:600;font-size:14px}
.dock .ctl button.main{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);min-width:92px}
.dock .now{flex:1;min-width:160px;font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dock select{width:auto;max-width:220px;font-size:13px;padding:6px 8px}
.dock label.check{font-size:13px;color:var(--muted)}
.dock #aName{border:1px solid var(--line);background:var(--field);border-radius:999px;height:34px;padding:0 12px;font-size:13px;font-weight:600}
body.audio-on main{padding-bottom:150px}
.reading{outline:2px solid var(--steel);outline-offset:4px;border-radius:4px;background:var(--steel-soft)}
tr.reading{outline-offset:-2px}
@media (max-width: 900px){
  .shell{grid-template-columns:minmax(0,1fr)}
  nav.map{position:static;max-height:none;border-right:none;border-bottom:1px solid var(--line);padding:14px max(16px,env(safe-area-inset-right,0px)) 14px max(16px,env(safe-area-inset-left,0px))}
  nav.map.closed{display:none}
  .mapbtn{display:inline-block}
}
@media (max-width: 560px){
  .grid2,.reg .in{grid-template-columns:minmax(0,1fr)}
  .leg{grid-template-columns:1fr 1fr}
  .card{padding:16px}
  .bar img{height:28px}
  .dock .now{display:none}
  .dock .in{gap:8px}
  .dock select{max-width:150px;font-size:12.5px;padding:5px 6px}
  .dock label.f,.dock label.check{font-size:12px}
}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>

const MODS = {"m0":{"intro":"Everything a broker needs before talking to a client or an operator, in plain words. Start here even if some of it seems simple: brokers who skip the basics make the expensive mistakes.","secs":[{"h":"0.1 Who does what","b":[{"fig":"who"},{"table":{"cols":["Party","Role in a charter"],"rows":[["Client (charterer)","The person or company who hires the whole aircraft and pays for the trip."],["Broker","Finds the aircraft, checks the operator, prices, contracts and looks after the client. We do not fly or own aircraft."],["Operator","The airline company that flies the aircraft and is responsible for safety. It holds an Air Operator Certificate (AOC) from its national aviation authority."],["Aircraft owner","Often a private person or company that places its aircraft with an operator, which flies it commercially."],["Crew","Captain and first officer (the pilots) and, on larger jets, one or more cabin attendants. They work for the operator."],["Handler and FBO","At each airport, a handler arranges fuel, parking, catering and paperwork. An FBO (fixed-base operator) is the private terminal where passengers check in."],["Trip support","A company or the operator's own team that obtains permits, slots and flight plans."],["Aviation authority","Each country's regulator, for example the FAA (US), EASA and national authorities (Europe), the UK CAA, the GCAA (UAE), CAAS (Singapore). It licenses operators and approves foreign flights."],["Avinode","The online marketplace where operators list aircraft and brokers request and compare quotes. This course uses it as the standard sourcing tool."],["Payment request","A secure payment link from our payment provider. Clients pay and operators are paid through our payment account."]]}},{"links":[["Avinode for brokers","https://avinode.com/broker/"]]}]},{"h":"0.2 Aircraft categories","b":[{"p":"Private jets are grouped by cabin size and range. Avinode shows each aircraft's category, seats and range: always use the figures for the actual aircraft, not a general rule."},{"fig":"cats"},{"table":{"cols":["Category","In plain words","Typical use"],"rows":[["Turboprop","Propeller aircraft with jet engines driving the propellers; slower, can use short runways","Short regional trips, small airports"],["Very light and light jet","Small cabin, usually no standing room","Short trips with few passengers"],["Midsize and super-midsize jet","Standing or near-standing cabin, more seats and range","Medium trips, often across a region"],["Heavy or large-cabin jet","Tall, long cabin, lavatory and galley, often a cabin attendant and sleeping options","Long trips, larger groups, comfort"],["Ultra-long-range jet","Large-cabin jets built to cross oceans and continents without a stop; crew rest area","Intercontinental trips"],["VIP airliner","Converted airliners such as the Boeing Business Jet and Airbus Corporate Jet","Large groups, heads of state, sports teams"]]}},{"photos":["cat_tp","cat_light","cat_mid","cat_smid","cat_heavy","cat_ulr","cat_vip"]},{"links":[["Gulfstream aircraft","https://www.gulfstream.com/en/aircraft/"],["Bombardier aircraft","https://businessaircraft.bombardier.com/"],["Dassault Falcon","https://www.dassaultfalcon.com/"]]}]},{"h":"0.3 Airports and their codes","b":[{"p":"Every airport has two codes. Airlines and clients use the three-letter IATA code; operators, pilots and Avinode often use the four-letter ICAO code. Use both in quotes, and always check: many cities have several airports, and business aviation often uses a different airport from the airlines."},{"table":{"cols":["City","Airport","IATA","ICAO"],"rows":[["London","Luton","LTN","EGGW"],["New York","Teterboro","TEB","KTEB"],["Dubai","Dubai International","DXB","OMDB"],["Bangkok","Suvarnabhumi","BKK","VTBS"],["Singapore","Changi","SIN","WSSS"],["Geneva","Geneva","GVA","LSGG"]]},"mono":[2,3]},{"tryq":{"q":"A client asks for a jet \"from New York\". What do you do?","o":["Book JFK, it is the main airport","Ask which airport; Teterboro (TEB / KTEB) is a common business-aviation airport","Use Newark, it is always cheaper","Nothing, the operator will choose"],"why":"Many cities have several airports and business aviation often uses a different one from the airlines. Confirm the airport in writing.","h":"45cbc7ed"}}]},{"h":"0.4 Time","b":[{"fig":"utc"},{"list":["Aviation works in UTC (also called Zulu or Z), the same time everywhere. Clients think in local time.","Every quote and trip brief shows local times and says so. Check arrival dates on long flights: crossing time zones or the date line can change the arrival date.","When a client says \"tomorrow morning\", confirm the date, the time and the time zone in writing."]},{"tryq":{"q":"A client in Bangkok wants to leave at 09:00 local. The operator's schedule shows 02:00Z. Do they match?","o":["Yes. Bangkok is UTC+7, so 09:00 local is 02:00 UTC","No, they are 7 hours apart","No, Z means the operator's home time","It cannot be known"],"why":"Thailand is UTC+7 all year. Local time minus 7 hours gives UTC (Z).","h":"ff11ef9b"}}]},{"h":"0.5 Flight time, block time and positioning","b":[{"fig":"pos"},{"list":["Flight time runs from take-off to landing. Block time runs from when the aircraft moves off its stand to when it stops at the destination. Operators price on either; their quote says which.","A positioning leg (also called a ferry) is a flight without passengers to bring the aircraft to the client, or back to base. The client usually pays for it.","An empty leg is a positioning flight the operator sells cheaply. It can be cancelled or moved if the main trip changes.","A one-way trip can cost almost as much as a return if the aircraft must fly back empty."]},{"tryq":{"q":"A client books an empty leg Geneva to London. The operator's main charter is cancelled. What can happen?","o":["Nothing, the empty leg is a confirmed charter","The operator can cancel or move the empty leg","Your company must find a replacement at its own cost","The client is charged the full charter price"],"why":"An empty leg depends on the main trip. The client must accept this risk in writing (Module 9).","h":"07d1f1e9"}}]},{"h":"0.6 Permits, slots and border control","b":[{"list":["Permits: most countries require permission for a foreign commercial flight to land or fly over them.","Slots: busy airports allocate take-off and landing times. A permit may not be issued until a slot is confirmed.","PPR (prior permission required): some airports require advance approval for parking or for the flight.","Border control: passengers pass customs, immigration and health checks. Authorities may require passenger details in advance.","Lead times vary by country and airport, and change. The operator and its trip support know the current rules: we ask them every time."]},{"links":[["Thailand permit planning (Universal Weather)","https://www.universalweather.com/blog/planning-bizav-operations-to-thailand-part-1-permit-planning/"],["IATA Timatic (travel documents)","https://www.iata.org/en/publications/timatic/"]]}]},{"h":"0.7 Crew duty","b":[{"p":"Pilots and cabin crew may only work a limited number of hours in a duty period, set by their authority. A long flight, an early start after a late arrival, or several legs in one day can exceed those limits. The operator then adds a second crew, flies a fresh crew in, or plans a night stop. This changes the price and the schedule, so we ask early."},{"links":[["SKYbrary: aviation terms explained","https://skybrary.aero/"]]}]},{"h":"0.8 Weather, air traffic and safety culture","b":[{"p":"Fog, storms, snow, strong winds and air-traffic restrictions can delay or divert a flight. Decisions about safety belong to the captain and the operator alone. Our job is to keep the client informed and arrange what they need on the ground."},{"box":{"t":"Safety culture","l":["Speak up about anything unsafe or illegal.","Report your own mistakes at once. Honest reports are never punished; hiding a mistake is.","Your manager keeps a log of errors and near misses and reviews it with the team."]}}]},{"h":"0.9 Safety culture","b":[{"p":"Everyone in a brokerage is expected to speak up about anything unsafe or illegal, and to report their own mistakes at once. Honest reports are never punished; hiding a mistake is. Your manager keeps a log of errors and near misses and reviews it with the team so everyone learns."}]},{"h":"0.10 The market in numbers","b":[{"p":"Figures change every year. Use these only with their source and date, and never as a promise to a client."},{"fig":"market"},{"table":{"cols":["Figure","Source"],"rows":[["Global business jet flights in 2025: up 5% on 2024, the busiest year on record","WINGX, full-year 2025 (January 2026)"],["Share of global business jet flights in 2025: North America about 72%, Latin America about 6%, Asia about 3%, Middle East about 2%, Africa about 1%","WINGX, full-year 2025"],["Growth in 2025: Africa about 15%, Latin America 11%, Middle East 7%, Asia 4%, Europe about 1%","WINGX, full-year 2025"],["North American charter (Part 135) flights in December 2025: up 1.6% on December 2024; fractional up 8.4%","ARGUS TRAQPak, December 2025"],["People worth USD 30 million or more (UHNWIs): 713,626 in 2026, up from 551,435 in 2021","Knight Frank, The Wealth Report 2026"],["US charter demand seen on Avinode: up 27% over the past year","Avinode, reported by AIN, October 2026"]]}},{"p":"What it means for brokers: most flights happen in North America, but the fastest growth is in Africa, Latin America, the Middle East and Asia. Wealth keeps growing, and clients compare charter with other ways to fly (0.11)."},{"links":[["ARGUS and WINGX activity reports for the end of 2025 (GlobalAir)","https://www.globalair.com/articles/argus-wingx-release-aircraft-activity-reports-for-the-end-of-2025/11807"],["Knight Frank: The Wealth Report 2026","https://www.knightfrank.com/wealthreport"]]}]},{"h":"0.11 Ways to fly privately","b":[{"p":"Clients often compare charter with other products they own or have been offered. Know them so you can speak about them fairly."},{"table":{"cols":["Product","How it works","When a client chooses it"],"rows":[["On-demand charter","The client hires a whole aircraft for one trip at a price quoted for that trip","Flexible trips, no commitment; what charter brokers sell"],["Empty leg","A positioning flight sold at a lower price; it can be cancelled or moved if the main trip changes","Flexible clients who accept the risk; brokers sell these too (Module 9.5)"],["Jet card","The client pays in advance for hours or a fund with one provider, at agreed rates and service terms","Regular flyers who want fixed rates and guaranteed availability"],["Membership","An annual fee for access to a provider's fleet or prices","Frequent flyers loyal to one provider"],["Fractional ownership","The client buys a share of an aircraft and a set number of hours a year","Very frequent flyers who want ownership without running an aircraft"],["Whole ownership","The client owns the aircraft, usually managed by an operator","The heaviest users"]]}},{"p":"Never criticise another product. Compare on what matters to the client: flexibility, total trip cost, aircraft choice and how often they fly."}]},{"h":"0.12 The freedoms of the air","b":[{"p":"International agreements describe what an airline of one country may do in another country's airspace. They explain why some legs are allowed and others are not."},{"fig":"freedoms"},{"table":{"cols":["Freedom","What it allows"],"rows":[["1st","Fly over another country without landing"],["2nd","Land in another country for a technical reason, such as fuel, without picking up or setting down passengers"],["3rd","Carry passengers from your own country to another country"],["4th","Carry passengers from another country back to your own country"],["5th","Carry passengers between two foreign countries on a flight that starts or ends in your own country"],["6th","Carry passengers between two foreign countries via your own country"],["7th","Carry passengers between two foreign countries without touching your own country"],["8th","Carry passengers between two points inside a foreign country on a flight that starts or ends in your own country (cabotage)"],["9th","Carry passengers inside a foreign country on a stand-alone domestic flight (cabotage)"]]}},{"p":"The 8th and 9th freedoms are cabotage, which most countries refuse to foreign operators (Module 2.4). Which freedoms an operator may use depends on agreements between countries and on the permits for each flight, so the operator always confirms."},{"links":[["ICAO: Freedoms of the Air","https://www.icao.int/Pages/freedomsAir.aspx"]]}]}],"quiz":[{"q":"A client asks for a flight \"from New York tomorrow at 9\". What must you confirm?","o":["Only the aircraft size","Which New York airport, the date and the time zone","Only the price","Nothing, it is clear"],"why":"Several airports serve New York, and \"tomorrow at 9\" needs a date and a time zone. Confirm all three in writing.","crit":false,"h":"b231e652"},{"q":"Who decides whether it is safe to take off in bad weather?","o":["The client","The broker","The captain and the operator","The FBO"],"why":"Safety decisions belong to the captain and the operator alone.","crit":false,"h":"c75c8798"},{"q":"Why might a one-way trip cost almost as much as a return?","o":["Tax rules","The aircraft may have to fly back empty","Crew bonuses","It never does"],"why":"The client usually pays for positioning, including the empty flight back to base.","crit":false,"h":"3e98de6c"},{"q":"What is the ICAO code for London Luton?","o":["LTN","EGGW","LON","LUT"],"why":"LTN is the IATA code. ICAO codes have four letters; UK airports start with EG.","crit":false,"h":"ca5f3a99"},{"q":"Who holds the Air Operator Certificate (AOC) for a charter flight?","o":["The broker","The aircraft owner","The operator","The handler"],"why":"The operator holds the AOC and is responsible for the flight. Your company is the broker.","crit":false,"h":"2dbe32e0"},{"q":"An operator says a long trip needs a second crew. What is the effect?","o":["None for the client","Price and schedule may change, so ask early","The flight becomes illegal","The broker must supply the crew"],"why":"Crew duty limits drive extra crews, fresh crews or night stops, which change price and schedule.","crit":false,"h":"0ea1674a"},{"q":"A Swiss operator wants to carry passengers from Bangkok to Phuket only. Which freedom of the air would that be?","o":["3rd freedom","5th freedom","9th freedom (cabotage)","1st freedom"],"why":"A flight between two points inside a foreign country on its own is the 9th freedom, cabotage. Most countries refuse it to foreign operators.","crit":false,"h":"69248abe"},{"q":"A client already owns a jet card with another company. What do you do?","o":["Tell him jet cards are a bad deal","Compare fairly on flexibility, total trip cost and aircraft choice","Refuse to quote","Ask for his card number"],"why":"Never criticise another product. Compare on what matters to the client: flexibility, total trip cost and aircraft choice.","crit":false,"h":"29771012"}],"obj":["Name who does what on a charter flight","Read airport codes and convert local time to UTC","Explain positioning, empty legs, permits, slots and crew duty","Use the market figures and the ways people fly privately correctly","Explain the freedoms of the air and why cabotage matters"],"take":["The operator flies and is responsible for safety; your company finds, checks, prices, contracts and looks after the client.","Confirm airport, date and time zone in writing, always.","Positioning is usually paid by the client; empty legs can be cancelled.","Use market figures only with their source and date.","Cabotage is the 8th and 9th freedom, and most countries refuse it to foreign operators."],"min":21},"m2":{"intro":"Brokers who sell worldwide meet many sets of rules. This module gives the principles that apply everywhere, the flights we never sell, a map by region and the trip risk screen. The law changes: the operator, its trip support and the official sources linked here confirm what applies to each flight. When anything is unclear, your manager decides before a quote is sent.","secs":[{"h":"2.1 The broker's boundary","b":[{"p":"A broker arranges a flight; the operator performs it. Never describe your company as the airline, never put our name forward as the carrier, and never let a client believe we fly or own the aircraft."},{"links":[["NBAA Best Practices for Air Charter Brokering (2024)","https://nbaa.org/wp-content/uploads/2024/07/NBAA-Best-Practices-for-Air-Charter-Brokering.pdf"]]}]},{"h":"2.2 What every client is told, worldwide","b":[{"p":"We apply the strictest common standard to every client. Before the contract is signed, the client receives in writing:"},{"olist":["That your company acts as a charter broker and not as the operator.","The operator's full legal name as shown on its AOC, and any trading name it uses.","The aircraft type, registration and year of manufacture, or \"type or similar\" until the tail is fixed.","The total price, what it includes, and every item that may be charged after the flight and how.","The passenger insurance the operator carries, as confirmed by the operator, and whether your company itself holds liability insurance."]},{"links":[["14 CFR Part 295, air charter brokers","https://www.ecfr.gov/current/title-14/chapter-II/subchapter-A/part-295"],["NBAA Aircraft Charter Consumer Guide","https://nbaa.org/flight-department-administration/aircraft-operating-ownership-options/aircraft-charter/aircraft-charter-consumer-guide/"]]}]},{"h":"2.3 Our contract position","b":[{"p":"All bookings run through Avinode, and all client and operator payments run through our payment account, so that only your company's margin enters the broker's own account. Use only the approved your company's charter confirmation (booking terms and standard conditions), never your own wording, and never agree to change liability, cancellation or payment terms."}]},{"h":"2.4 Flights we never sell","b":[{"fig":"never"},{"table":{"cols":["Never sell","Why","What to do"],"rows":[["A flight by an operator without a commercial AOC, or on an aircraft not listed on its AOC","Illegal charter: uninsured and unsafe","Reject; report to your manager"],["A domestic leg (two airports in one country) on a foreign operator's aircraft, unless the operator confirms in writing that the country allows it","Cabotage: most countries reserve domestic flights for their own carriers","Use a local operator, or redesign the trip"],["US domestic flights (both airports in the US) on any non-US operator","US law allows only US-citizen carriers to fly passengers within the US","Never quote"],["Flights between two EU countries, or inside one, on a non-EU operator, unless the operator confirms the permission","EU traffic is reserved for EU carriers","Use an EU operator"],["Individual seats sold to different people on one flight","Selling seats needs public-charter or airline authority","Never sell per seat"],["Flights into, out of or over the EU for a Russian national (including dual nationals) or a company controlled by one, or on Russian-registered aircraft","EU sanctions deny landing, take-off and overflight to such aircraft, including chartered aircraft","Stop; report to your manager"],["Flights for sanctioned persons or companies, or to embargoed destinations without manager clearance","Sanctions law (Module 3)","Stop; report to your manager"],["Operators on the EU Air Safety List","Safety and EU law","Never use"],["Medical flights with patients needing care on board","Air ambulance needs specific approvals and equipment","Refer through your manager"],["Flights with accommodation or other travel sold as one package","Package-travel and travel-licence rules (for example ATOL in the UK)","Only with manager approval"],["Any flight where the client asks to hide passenger names from the operator or the authorities","Illegal and a sanctions and security risk","Refuse; report to your manager"]]}},{"links":[["UK CAA: charters and air taxi flights","https://www.caa.co.uk/air-passengers/about-your-trip/charters-and-air-taxis-flights/"],["14 CFR Part 295, air charter brokers","https://www.ecfr.gov/current/title-14/chapter-II/subchapter-A/part-295"],["EU Air Safety List","https://transport.ec.europa.eu/transport-themes/eu-air-safety-list_en"],["EU sanctions and business aviation (EBAA)","https://www.ebaa.org/app/uploads/2023/04/Impact-of-EU-Sanctions-against-Russia-and-Belarus-on-BizAv.pdf"],["Public charters and selling seats (NATA)","https://nata.aero/advocacy/initiatives-and-issues/public-charter-operations/public-charter-faqs/"],["UK CAA: ATOL protection","https://www.caa.co.uk/atol-protection/"]]}]},{"h":"2.5 The map by region","b":[{"regions":[["United States","Part 295 applies to anyone acting as an air charter broker: say we are a broker, name the operator, disclose our liability insurance or that we have none, give the full price with a good-faith estimate of known extra fees, never misrepresent aircraft, ratings or safety.","Only US-citizen carriers may fly passengers between US points. Foreign operators need US authority for international charters.",[["14 CFR Part 295, air charter brokers","https://www.ecfr.gov/current/title-14/chapter-II/subchapter-A/part-295"],["US final rule on charter brokers (2018)","https://www.federalregister.gov/documents/2018/09/17/2018-18345/increasing-charter-air-transportation-options"]]],["Canada and Latin America","Consumer law of the client's country.","Domestic flights are generally reserved for local carriers; foreign operators need permits per flight. Confirm with the operator.",[]],["EU, EEA and Switzerland","No broker licence; EU consumer and package-travel rules for consumer sales; EU sanctions.","Non-EU operators need an EASA TCO authorisation and each state's permits; whole aircraft only; no tickets to the public. Traffic inside the EU is reserved for EU carriers.",[["EASA third-country operators (TCO)","https://www.easa.europa.eu/en/domains/air-operations/third-country-operators"],["Charter flights by non-EU operators (Swedish Transport Agency)","https://www.transportstyrelsen.se/en/aviation/air-operators/traffic-permits/charter-flights-non-scheduled-air-service/"]]],["United Kingdom","The CAA treats flights for payment without an AOC as illegal. Package sales to UK consumers can fall under ATOL.","Foreign operators need UK permission; UK domestic legs are reserved for UK carriers unless permitted.",[["UK CAA: charters and air taxi flights","https://www.caa.co.uk/air-passengers/about-your-trip/charters-and-air-taxis-flights/"],["UK CAA: ATOL protection","https://www.caa.co.uk/atol-protection/"]]],["Middle East and Africa","No specific broker licence in most states.","Landing and overflight permits through the operator's handler; sponsor rules and lead times differ by state.",[]],["Singapore","Singapore company, tax and data-protection law apply to brokers established there.","Foreign operators need a CAAS Foreign Operator Operations Permit, an Air Transport Permit through flightSG for each non-scheduled flight, and a slot: Changi slot requests at least 72 hours before the flight.",[["CAAS: foreign air operators","https://www.caas.gov.sg/operations-safety/air-operations/foreign-air-operators"]]],["Thailand","Thai data-protection law for data handled in Thailand.","Overflight and landing permits from CAAT; slots and parking approval first at the main Bangkok airports and Phuket; full schedule, passenger and crew details; cabotage closely enforced.",[["Thailand CAAT eAIP (open GEN 1.2)","https://aip.caat.or.th/"],["Thailand permit planning (Universal Weather)","https://www.universalweather.com/blog/planning-bizav-operations-to-thailand-part-1-permit-planning/"]]],["Rest of Asia-Pacific","Consumer and data law of the client's country.","Domestic flights generally reserved for local carriers; permits and lead times vary widely. Confirm with the operator.",[]]]}]},{"h":"2.6 Cabotage: try it","b":[{"p":"Cabotage means a domestic flight inside one country. Decide each trip below before you read the answer. All are on a foreign-registered aircraft."},{"fig":"cabo"},{"tryq":{"q":"London – Paris – London","o":["International legs: normally fine with permits (and EU and UK permission for a non-EU operator)","Domestic leg: needs operator confirmation","Never on a non-US operator"],"why":"Each leg crosses a border. Permits still apply.","h":"6ef4dcdb"}},{"tryq":{"q":"Teterboro – Miami – Nassau, on a European operator","o":["Fine, the trip ends abroad","Teterboro – Miami is US domestic: never on a non-US operator","Only Nassau needs a permit"],"why":"Both airports are in the US. Use a US operator for the whole trip.","h":"58abdc62"}},{"tryq":{"q":"Dubai – Mumbai – Delhi – Dubai","o":["International legs only","Mumbai – Delhi is Indian domestic: only if the operator confirms in writing that it is permitted","Never possible"],"why":"Two Indian airports in a row make a domestic leg.","h":"cefc4239"}},{"tryq":{"q":"Bangkok – Phuket – Singapore with the same passengers","o":["Fine without checks","Bangkok – Phuket is domestic: only as one continuous international journey declared on the permit, confirmed by the operator","Never possible"],"why":"Thailand enforces cabotage closely. The whole routing and manifest go on the permit.","h":"eb09947b"}}]},{"h":"2.7 Spotting illegal charter","b":[{"list":["Get the operator's AOC and the operations specifications that list the aircraft, and check the aircraft is on them.","Get the insurance certificate and check it covers commercial passenger flights.","Watch for privately registered aircraft offered for payment, \"cost-sharing\", dry leases sold as charter, prices far below the market, and refusal to send documents.","Reject any aircraft offered without a commercial AOC and report it to your manager the same day."]},{"links":[["UK CAA: charters and air taxi flights","https://www.caa.co.uk/air-passengers/about-your-trip/charters-and-air-taxis-flights/"],["NBAA Aircraft Charter Consumer Guide","https://nbaa.org/flight-department-administration/aircraft-operating-ownership-options/aircraft-charter/aircraft-charter-consumer-guide/"],["ARGUS audits and ratings","https://argus.aero/auditing-services"]]}]},{"h":"2.8 Other rules that follow the trip","b":[{"p":"None of these is a reason to refuse a trip by itself; each is a reason to check before quoting. The watchlist (Appendix G) lists current places and topics."},{"table":{"cols":["Area","What to spot","Action"],"rows":[["Conflict zones and closed airspace","Routes over or near conflict areas; EASA bulletins and FAA notices; insurers may exclude war-risk areas","Operator confirms routing and insurance in writing; manager approves"],["Sanctions and embargoes","Broad sanctions, sector sanctions, US export rules for US-made aircraft","Stop; manager decides"],["Hidden domestic legs","Islands and territories that belong to another country (Hawaii, Puerto Rico, Canary Islands, Corsica)","Cabotage check with the operator"],["Taxes that follow the trip","US federal excise tax; EU VAT; UK Air Passenger Duty (higher rate for aircraft of 20 tonnes or more with fewer than 19 seats); Singapore GST","Operator states taxes in its quote; manager confirms our role with the accountant"],["Packages","EU package-travel rules and UK ATOL when sold with a hotel or other travel","Manager approval"],["Politically exposed persons","Heads of state, ministers, senior officials, state-company managers, their families and close associates","Enhanced KYC; manager approval"],["Bribery laws that reach abroad","US FCPA and UK Bribery Act; officials or handlers asking for cash to \"speed up\"","Refuse; report"],["Children","A child travelling without both parents may need a consent letter","Ask for consent documents; escalate any doubt"],["Animals","Rabies-free countries have strict import routes and approved arrival airports","Check the authority's rules before quoting"],["Weapons, cash, valuables","Firearms, large cash sums and precious metals need permits or declarations","Operator and authorities decide; manager informed"],["Airport restrictions","Night curfews, slot-controlled airports, temporary restrictions during major events","Operator confirms"],["Payment platform limits","Payment platforms cannot pay to or from some countries","A payer or operator there is red: stop and tell your manager"]]}},{"links":[["EASA Conflict Zone Information Bulletins","https://www.easa.europa.eu/en/domains/air-operations/czibs"],["FAA prohibitions, restrictions and notices","https://www.faa.gov/air_traffic/publications/us_restrictions"],["Safe Airspace (OPSGROUP)","https://safeairspace.net/"],["UN Security Council consolidated list","https://main.un.org/securitycouncil/en/content/un-sc-consolidated-list"],["US OFAC sanctions list search","https://sanctionssearch.ofac.treas.gov/"],["EU sanctions map","https://www.sanctionsmap.eu/"],["UK Sanctions List search","https://search-uk-sanctions-list.service.gov.uk"],["Singapore MAS targeted financial sanctions","https://www.mas.gov.sg/regulation/anti-money-laundering/targeted-financial-sanctions"],["IRS guide: air transportation excise tax","https://irs.gov/pub/irs-mssp/air_transportation.pdf"],["UK Air Passenger Duty rates","https://www.gov.uk/guidance/rates-and-allowances-for-air-passenger-duty"],["IATA Timatic (travel documents)","https://www.iata.org/en/publications/timatic/"]]}]},{"h":"2.9 The trip risk screen","b":[{"p":"Every enquiry passes this screen before sourcing, and the result goes on the intake form. Green means proceed. Amber means the operator or its trip support confirms in writing before we quote. Red means stop and escalate to your manager. Always check the current watchlist, never your memory."},{"fig":"rag"},{"table":{"cols":["Question","Amber","Red"],"rows":[["1. Who flies and pays?","PEP; child with one adult; payer differs from the client","Sanctions match; Russian national with an EU point; refuses KYC; payer or operator in a country your payment platform cannot serve"],["2. Where?","Domestic leg; conflict-zone routing; strict permit country","US domestic leg; embargoed destination"],["3. What aircraft and operator?","No safety rating; US-made aircraft to a sanctioned country","No AOC; banned operator"],["4. What is carried?","Pets, weapons, cash, medical equipment, dangerous goods","Patient needing care in flight"],["5. How is it sold?","Hotel or event added","Individual seats"],["6. When?","Short notice into a strict permit country","Lead time impossible to meet"]]},"rag":true},{"box":{"t":"Practise it","l":["After the module check, the trip risk screen lab gives you 12 real-world trips to screen."]}}]},{"h":"2.10 Passenger liability: the Montreal Convention","b":[{"p":"For international flights between countries that have joined it, the Montreal Convention of 1999 sets what the air carrier (the operator) owes passengers for death or injury, delay and baggage. The limits are in Special Drawing Rights (SDR), a currency unit of the International Monetary Fund, and are reviewed every five years."},{"fig":"montreal"},{"table":{"cols":["Claim","Limit from 28 December 2024"],"rows":[["Death or injury of a passenger","151,880 SDR per passenger without proof of fault; above that unless the carrier proves it was not at fault"],["Delay","6,303 SDR per passenger"],["Baggage","1,519 SDR per passenger, unless a higher value was declared"]]}},{"list":["Claims about the flight lie against the operator, not your company.","Clients carrying valuable items should declare them to the operator or insure them.","If a client raises EU passenger-rights rules (Regulation 261/2004) or any other passenger-rights claim, pass it to your manager."]},{"links":[["Revised Montreal Convention limits, 2024 (CAAT notice)","https://www.caat.or.th/wp-content/uploads/2024/11/Revision-of-Limits-of-Liability-under-the-Montreal-Convention-of-1999-Year-2024.pdf"]]}]},{"h":"2.11 Advertising and marketing","b":[{"list":["Never write \"our fleet\", \"our jets\" or \"our aircraft\". A disclaimer does not cure it. We arrange flights on aircraft operated by certified operators.","In the United States, an advertised price must be the full price the customer pays (14 CFR 399.84).","Claim a safety rating only for the operator and date we have checked.","Use client names, photos or testimonials only with written consent.","Social media, websites and brochures are approved by your manager before publication."]},{"links":[["US full-price advertising rule, 14 CFR 399.84","https://www.ecfr.gov/current/title-14/chapter-II/subchapter-F/part-399/subpart-G/section-399.84"]]}]}],"quiz":[{"q":"A client asks for Miami to San Juan, Puerto Rico, on a Canadian operator's jet. What is the issue?","o":["None, it is international","Puerto Rico is US territory, so this is a US domestic leg","Only a visa issue","Only a tax issue"],"why":"Puerto Rico is a US territory. Only US-citizen carriers may fly passengers between US points.","crit":true,"h":"08eb6371"},{"q":"Your trip risk screen shows one amber and no red. What happens next?","o":["Quote at once","The operator or its trip support confirms the amber point in writing before we quote","Your manager must refuse","Ignore it"],"why":"Amber means confirm in writing first, then quote.","crit":false,"h":"d15cf7df"},{"q":"A client wants Teterboro – Miami – Nassau on a European operator's jet. What is right?","o":["Fine, it ends abroad","The Teterboro – Miami leg cannot be flown by a non-US operator","Only Nassau needs a permit","Ask the client to sign a waiver"],"why":"Teterboro – Miami is US domestic.","crit":true,"h":"22727219"},{"q":"A client with Russian nationality wants Dubai – Nice on a chartered jet. What do you do?","o":["Quote normally","Stop and report to your manager","Use a non-Russian aircraft","Fly to Geneva instead without telling anyone"],"why":"EU sanctions deny landing to aircraft chartered by Russian nationals, including dual nationals.","crit":true,"h":"7c83e8d3"},{"q":"Which item is NOT part of the written disclosure to every client?","o":["Operator's legal name on the AOC","That we are a broker","The operator's purchase price for the aircraft","Total price and possible extra charges"],"why":"The disclosures are: broker status, operator legal name, aircraft details, full price and extras, insurance.","crit":true,"h":"c2131b96"},{"q":"A non-EU operator flying into Europe needs which EASA approval?","o":["Part-NCC","TCO authorisation","ATOL","Part 295"],"why":"Third-country operators need an EASA TCO authorisation.","crit":false,"h":"845757f5"},{"q":"An operator offers a jet that is not listed on its AOC operations specifications. What do you do?","o":["Use it if the price is good","Reject it and report to your manager","Ask the client to decide","Book it as a private flight"],"why":"An aircraft not on the AOC cannot fly commercially: that is illegal charter.","crit":true,"h":"e4d1311c"},{"q":"A client asks you to leave one passenger's name off the manifest sent to the operator. What do you do?","o":["Agree, privacy matters","Refuse and report to your manager","Use initials only","Send the name after the flight"],"why":"Hiding passenger names is illegal and a sanctions and security risk.","crit":true,"h":"bb658c1a"},{"q":"A passenger's bag is lost on a charter from Paris to Dubai. Who is the claim against?","o":["The broker","The operator, under the Montreal Convention","The FBO","Nobody"],"why":"Under the Montreal Convention, baggage claims on an international flight lie against the carrier, the operator.","crit":false,"h":"ff73541b"},{"q":"Which advertising line is acceptable?","o":["\"Fly on our fleet of Global jets\"","\"Your company arranges flights on aircraft run by certified operators\"","\"Our jets, your schedule\"","\"Our aircraft are ARGUS Platinum\""],"why":"We arrange flights on aircraft run by certified operators. Never write \"our fleet\" or claim a rating for aircraft we have not checked.","crit":false,"h":"40999ab1"}],"obj":["Give every client the required disclosures","Recognise the flights we never sell","Apply the rules by region and spot cabotage","Run the trip risk screen","Explain passenger liability and advertising rules"],"take":["Every client receives the five disclosures in writing before signing.","Never sell anything on the never-sell list, including US domestic legs on non-US operators.","Amber means confirm in writing first; red means stop and escalate.","Liability for the flight lies with the operator; never advertise \"our fleet\"."],"min":23},"m1":{"intro":"","secs":[{"h":"1.2 What we sell","b":[{"list":["Whole-aircraft charters for one client, on third-party aircraft of every size, with a focus on long-range and heavy jets.","Empty legs, on the conditions in Module 9.","Nothing on the \"never sell\" list in Module 2.4."]}]},{"h":"1.3 How brokers earn","b":[{"p":"A broker earns a margin or a commission on each charter. This course uses a margin of 9% of the client price as its example (Module 9); your company sets its own. Client and operator money should never pass through the broker's own bank account."}]},{"h":"1.4 Roles","b":[{"table":{"cols":["Role","Does"],"rows":[["Charter consultant","Builds the client base by phone and follow-up, captures and qualifies enquiries, hands live trips to a broker"],["Broker","Sources, vets, prices, contracts and runs trips; mentors consultants"],["Operations desk","Runs trips on the day and out of hours (Module 11)"],["Manager","Approves exceptions, compliance decisions and disputes; owns the company's procedures"]]}}]},{"h":"1.6 Three ways a broker can work","b":[{"table":{"cols":["Model","What it means","Main duties"],"rows":[["Agent of the client","The broker acts for the client and contracts with the operator on the client's behalf","Written agency agreement; disclose any relationship with the operator"],["Agent of the operator","The broker sells for one or more operators, usually for a commission","Use the operator's charter contract; cannot act for the client at the same time"],["Principal (in the US an \"indirect air carrier\")","The broker buys the flight from the operator and resells it to the client in its own name","Takes on responsibility to the client; client terms at least as strict as the operator's terms"]]}},{"p":"Know which model your company uses, and never describe your role in your own words: use the wording in your company's approved charter confirmation."},{"links":[["NBAA Best Practices for Air Charter Brokering (2024)","https://nbaa.org/wp-content/uploads/2024/07/NBAA-Best-Practices-for-Air-Charter-Brokering.pdf"]]}]},{"h":"1.7 Professional standards","b":[{"list":["Never sell a flight before an operator has confirmed the aircraft, schedule and price in writing.","Tell your manager about any personal or commercial relationship with an operator, handler or supplier.","Advertise honestly (Module 2.11).","Keep learning: repeat the written exam once a year and attend every refresher.","Help the people you train: senior brokers mentor new staff and model the standard."]}]}],"quiz":[{"q":"A client wants to buy four seats on someone else's flight. Which is right?","o":["We sell the seats","We sell whole-aircraft charters to one client only","We split the price four ways","We ask the operator to sell them"],"why":"Your company sells whole-aircraft charters to one client. Selling seats needs public-charter or airline authority.","crit":true,"h":"df4f3a87"},{"q":"A broker buys the flight from the operator and resells it in its own name. Which model is that?","o":["Agent of the client","Agent of the operator","Principal","None"],"why":"A principal buys the flight and resells it in its own name, and takes on responsibility to the client.","crit":false,"h":"4290db5b"}],"obj":["Describe what a charter broker sells and how it earns","Explain the three ways a broker can work","Apply the professional standards","Keep selling and confirming as separate duties"],"take":["Brokers sell whole-aircraft charters and empty legs, never individual seats.","Never sell a flight before an operator has confirmed it in writing."],"min":13},"m3":{"intro":"Private aviation moves wealthy people and large sums across borders. Banks, payment providers and regulators expect us to know who we deal with. Every booking passes this module before a quote becomes a contract.","secs":[{"h":"3.1 Know your client (KYC)","b":[{"table":{"cols":["Client type","What we collect","Check"],"rows":[["Private individual","Full name, date of birth, nationality, passport copy, residential address, contact details","Name matches passport; address plausible"],["Company","Registered name and number, country, registered address, directors, ultimate beneficial owners (25% or more, or control), authorised signatory and their ID","Company exists on its official register; signatory authorised"],["Agent, assistant or family office booking for a principal","Agent's identity and authority; principal's identity as above","Who pays and who flies are known"],["Payer different from client","Payer identity and the reason","Manager approval before acceptance"]]}},{"p":"Record the KYC reference on your company's charter confirmation. Repeat clients: refresh KYC at least once a year or when details change."},{"links":[["Singapore MAS targeted financial sanctions","https://www.mas.gov.sg/regulation/anti-money-laundering/targeted-financial-sanctions"]]}]},{"h":"3.2 Sanctions screening, step by step","b":[{"fig":"screen"},{"olist":["List every name to screen: client, payer, ultimate beneficial owners, every passenger, the operator and the aircraft owner if known.","Search each name on the official lists in Appendix D: United Nations consolidated list; Singapore (Monetary Authority of Singapore); United States (OFAC sanctions list search); European Union consolidated list; United Kingdom (UK Sanctions List, the single UK list since 28 January 2026).","Search with full name and date of birth; also try common alternative spellings.","Check nationality and the route against Module 2.4 (for example the EU rules on Russian nationals and aircraft) and against countries under embargo.","Record the result in the sanctions screening record (Appendix B), with date, lists searched and outcome.","Screen again if any name, passenger or the route changes."]},{"box":{"t":"A possible match","l":["Stop. Do not tell the client why. Do not take payment. Report to your manager the same day, with the screening record. Only your manager decides whether to proceed."]}},{"links":[["UN Security Council consolidated list","https://main.un.org/securitycouncil/en/content/un-sc-consolidated-list"],["US OFAC sanctions list search","https://sanctionssearch.ofac.treas.gov/"],["EU sanctions map","https://www.sanctionsmap.eu/"],["UK Sanctions List search","https://search-uk-sanctions-list.service.gov.uk"],["Singapore MAS targeted financial sanctions","https://www.mas.gov.sg/regulation/anti-money-laundering/targeted-financial-sanctions"]]}]},{"h":"3.3 Export controls","b":[{"p":"Many business jets are made in the US or contain US parts. Flights with such aircraft to some countries need US export authorisation or are prohibited, whoever owns the aircraft. Any flight to a country under sanctions or embargo goes to your manager before any quote; the operator confirms its own authorisation in writing."},{"links":[["US OFAC sanctions list search","https://sanctionssearch.ofac.treas.gov/"]]}]},{"h":"3.4 Money-laundering warning signs","b":[{"list":["Payment from a third party or a country unrelated to the client","Pressure to accept cash, crypto-assets or split payments","Overpayment followed by a refund request to a different account","Urgency together with reluctance to give identity documents","Routings or passenger lists that make no business or personal sense","Requests to keep passenger names from the operator"]},{"p":"Any of these: pause and escalate. Never accept cash."}]},{"h":"3.5 Payment fraud","b":[{"list":["Clients pay only through a payment request from our payment provider. We never send bank details by email or messaging apps.","If anyone, including an operator, asks to pay into or change to a new bank account, confirm it by telephone on a number you already hold, never one in the request.","Every confirmation carries the bank-detail fraud warning. Never remove it."]}]},{"h":"3.6 Gifts and bribery","b":[{"p":"Never offer, give or accept anything of value to win or keep business improperly. Bribery is a crime in Singapore and in most countries where our clients and operators are. Gifts and hospitality beyond small courtesies, from or to clients, operators, handlers or officials, need your manager's approval and are recorded. Never pay anyone to speed up a permit or a border check."}]},{"h":"3.7 Data protection","b":[{"p":"Passport copies, passenger lists and travel plans are personal data. Laws such as Singapore's Personal Data Protection Act, Thailand's Personal Data Protection Act, the EU and UK General Data Protection Regulation and US state laws can apply to clients and staff in those places. We follow the strictest common standard:"},{"list":["Collect only what the flight and the law need, and tell the client why.","Store client and passenger data only in Avinode and the company CRM. No personal phones, private email or messaging groups.","Share passenger data only with the operator and its handlers for the flight.","Delete or anonymise data when it is no longer needed under our retention rule.","Report any loss or wrong sending of data to your manager at once.","Outbound calls and messages: respect national do-not-call rules (for example Singapore's Do Not Call Registry) and every opt-out (Module 12)."]}]}],"quiz":[{"q":"A new client asks to pay through his cousin's company in another country. What do you do?","o":["Accept","Get the payer's identity and reason, and your manager's approval","Ask for cash instead","Send our bank details by email"],"why":"A third-party payer in another country is a money-laundering warning sign. Identify the payer, record the reason and get your manager's approval.","crit":true,"h":"527c7da7"},{"q":"A passenger's name is a close match on the OFAC list. First step?","o":["Tell the client","Stop, take no payment, report to your manager with the record","Ask the operator","Change the spelling"],"why":"A close match means stop. Take no payment, keep the screening record and let your manager decide.","crit":true,"h":"5c845e33"},{"q":"A handler offers to \"speed up\" a permit for a cash payment. You:","o":["Pay it","Refuse and report to your manager","Add it to the price","Ask the client to pay it"],"why":"Cash to speed up a permit is a bribe under laws such as the US FCPA and UK Bribery Act. Refuse and report.","crit":true,"h":"022a10b2"},{"q":"Where may passport copies be stored?","o":["WhatsApp group","Avinode and the company CRM","Personal email","Any cloud drive"],"why":"Passport copies are personal data. They stay in Avinode and the company CRM, never in email or chat apps.","crit":true,"h":"acbc120b"}],"obj":["Run KYC for each client type","Screen names against the official sanctions lists","Spot money-laundering, fraud and bribery risks","Handle personal data correctly"],"take":["KYC and sanctions screening come before any contract.","A possible match means stop, no payment, report to your manager.","Payments only through a payment request; bank details never by email or chat.","Personal data stays in Avinode and the CRM."],"min":10},"m4":{"intro":"","secs":[{"h":"4.1 Who they are","b":[{"p":"Our clients are mainly very wealthy individuals and their families, company leaders, and the assistants and family offices who book for them. They expect discretion, accuracy and speed, and they notice small mistakes."}]},{"h":"4.2 Working with assistants and family offices","b":[{"list":["Confirm in writing who may book, who may change a booking and who pays.","Send confirmations to the agreed people only.","Never contact the principal directly unless the assistant agrees."]}]},{"h":"4.3 Discretion","b":[{"list":["Never mention a client's name, trip or habits to anyone outside the booking, including other clients and operators on other trips.","Never post or share photographs, names or flight details on social media.","Use the client's preferred name and form of address."]}]},{"h":"4.4 Working across cultures","b":[{"p":"Our clients come from every region. Good practice that works everywhere: be formal until invited otherwise; confirm names and titles; respect religious holidays, prayer times and dietary rules when planning schedules and catering; ask rather than assume; keep the same standard of courtesy for clients, assistants, crew and handlers."}]},{"h":"4.5 Saying no","b":[{"p":"Sometimes the answer is no: the law, safety or our rules do not allow a request. Say so early, plainly and politely, give the reason in general terms, and offer an alternative where one exists (\"That leg must be flown by a local operator; I can arrange that for you\"). Never invent a reason and never blame the operator."}]}],"quiz":[{"q":"An assistant asks you to send the final itinerary also to the principal's private email, which you found online. You:","o":["Send it","Send only to the people agreed in writing","Post it to the client's social media","Ask the operator"],"why":"Discretion: send trip details only to the people the client agreed in writing.","crit":false,"h":"a591dc0e"},{"q":"How do you refuse a domestic leg the law does not allow?","o":["Blame the operator","Explain early and offer a legal alternative","Ignore the request","Book it anyway"],"why":"Say no early and clearly, and offer a legal alternative such as a local operator for the domestic leg.","crit":false,"h":"0cc175e1"}],"obj":["Work with principals, assistants and family offices","Keep discretion","Say no clearly and offer a legal alternative"],"take":["Discretion is part of the product.","Send details only to people agreed in writing.","Say no early, politely, with an alternative."],"min":5},"m5":{"intro":"","secs":[{"h":"5.1 The booking life cycle","b":[{"fig":"cycle"},{"table":{"cols":["Stage","What happens","Output"],"rows":[["1. Enquiry","Capture the mission (5.2) on the intake form","Enquiry in CRM"],["2. Qualification","Confirm the client is real, able to pay and serious; KYC started","Qualified or closed"],["3. Legal check","Check the trip against Module 2.4","Allowed, redesigned or refused"],["4. Feasibility","Airports, permits, cabotage, crew duty, documents (Module 6)","Route feasible"],["5. Sourcing","Request quotes on Avinode; vet operators (Module 8)","Shortlist"],["6. Quote","Price at 9%; send through Avinode (Module 9)","Quote with expiry"],["7. Contract and payment","KYC and sanctions done; confirmation signed; payment request (Module 10)","Confirmed booking"],["8. Operations","Passenger details, permits, catering, ground transport, monitoring (Module 11)","Flight operated"],["9. Close","Extras reconciled with receipts; feedback; file closed (Module 11)","Booking closed"]]}}]},{"h":"5.2 What to capture","b":[{"p":"Use the intake form in Appendix B. It covers: lead passenger, booker and payer; dates, local times and flexibility; airports (city and preferred airport, with codes); passengers including children and infants; nationalities; luggage and special items; pets; purpose where a permit needs it; catering, ground transport and special requests; budget and payment method; and how the client heard of us."}]},{"h":"5.3 Qualification","b":[{"p":"Ask early, politely and directly: who will fly, who will pay, and when the decision will be made. We do not hold aircraft or run long searches for enquiries that are not qualified. A qualified client has a real trip, a decision-maker we can reach, and no obstacle to KYC."}]},{"h":"5.4 Mission types","b":[{"table":{"cols":["Mission","What is different","Watch for"],"rows":[["Executive and family trips","One client, one to a few legs, privacy matters most","Exact local times, documents, catering preferences"],["Groups: sports teams, music tours, roadshows","Many legs in a few days, fixed event times, large baggage or equipment","Crew duty limits, slots, baggage weight and volume, back-up aircraft"],["Corporate shuttles","Repeated flights on a schedule for one company","A framework contract approved by your manager; changes and cancellations"],["Evacuation and repatriation","Urgent flights out of a crisis area","Manager approval, security, war-risk insurance, permits, sanctions"],["Medical flights","Patients needing care on board","Not a normal charter: refer through your manager"]]}}]},{"h":"5.5 Client requests and operational needs","b":[{"p":"Capture two separate lists at intake. They are handled and charged differently, and both can change the aircraft, the airport, the schedule or the price."},{"table":{"cols":["List","What belongs in it","Examples"],"rows":[["Client requests","What the client asks for","Special or dietary catering; a car or helicopter transfer; flowers or a celebration; child seats; pets; sports equipment or oversized luggage; a language on board; help for a passenger with reduced mobility"],["Operational needs","What the trip needs in order to operate, often charged to the client","Extra ground handling; de-icing; opening an airport outside its hours; crew hotel and allowances; aircraft parking or hangarage; a private terminal and customs; permits and slots; a technical stop or extra crew; Wi-Fi use"]]}},{"p":"Ask about both on the first call. Confirm every item with the operator or the supplier in writing, with how it is charged (Module 9.8). Medical care on board is never a request: it is a medical flight (Module 5.4)."}]}],"quiz":[{"q":"At which stage do you check the trip against the \"never sell\" list?","o":["After payment","Before sourcing","After the flight","Never"],"why":"The never-sell check and the trip risk screen come before sourcing, so we never spend time on a flight we cannot sell.","crit":false,"h":"0c72b9f4"},{"q":"When does a booking become confirmed?","o":["When the client says yes","When KYC and sanctions are done, the confirmation is signed and payment is received as agreed","When the operator quotes","At take-off"],"why":"A booking is confirmed only when KYC and sanctions are done, the confirmation is signed and payment is received as agreed.","crit":false,"h":"ac98f40d"},{"q":"A music tour needs six cities in five days with heavy equipment. What do you check first with the operator?","o":["Paint colour","Crew duty limits, slots and baggage weight and volume","Only the price","Nothing"],"why":"Groups with tight schedules strain crew duty limits and slots, and heavy equipment changes weight and volume.","crit":false,"h":"3ff2bdaa"},{"q":"A client asks for halal catering and a car at arrival. Where do they go?","o":["Operational needs","Client requests, each confirmed with its supplier and how it is charged","Nowhere: the crew handles it","Only in the trip notes"],"why":"Both are client requests: what the client asks for. Each is confirmed with its supplier in writing, with how it is charged.","crit":false,"h":"6d9c914a"}],"obj":["Follow the booking life cycle","Capture a complete enquiry and qualify it","Recognise mission types and what each needs","Separate client requests from operational needs"],"take":["Check the never-sell list and run the risk screen before sourcing.","Qualify early: who flies, who pays, who decides.","Match the planning to the mission type."],"min":8},"m6":{"intro":"The operator is responsible for the safe and legal conduct of the flight. Our job is to ask the right questions early. Every answer comes from the operator or its trip support in writing.","secs":[{"h":"6.1 What can stop or change a trip","b":[{"table":{"cols":["Topic","What can stop or change a trip","How we handle it"],"rows":[["Range and fuel stops","Range on paper falls with more passengers and luggage, headwinds and long runways at hot or high airports","Operator confirms in writing whether the trip is non-stop or needs a fuel stop, for that load and season"],["Runway and airport","Long-range jets need longer runways when heavy; some airports have limited hours, fire cover or parking","Operator confirms the airport suits the aircraft and the time"],["Crew duty","Long or multi-leg days can exceed crew limits","Operator confirms the crew plan; extra crew or night-stop costs are in the quote"],["Permits and slots","Approvals and lead times differ by country and airport","Operator or trip support obtains them; we give complete details early; never promise an approval"],["Cabotage","Domestic legs on foreign aircraft (Module 2)","Operator confirms in writing before quoting"],["Passenger documents","Passports, visas, health entry rules; advance passenger information","Each passenger is responsible for their own documents; we say so in writing; the handler confirms requirements using official sources such as IATA Timatic"],["Pets","Entry rules differ by country; some require permits and approved arrival airports","Check the destination authority's rules and the operator's acceptance before quoting"],["Dangerous goods","Spare lithium batteries, weapons, ammunition, oxygen and some medicines are restricted","Ask the client; the operator decides"],["Medical needs","Passengers needing care in flight","Not a normal charter: refer through your manager"],["Catering, ground and security","Special catering, cars, helicopters, security teams","Ordered through the operator or confirmed suppliers; cost confirmed in writing before it is included"]]}},{"links":[["Thailand permit planning (Universal Weather)","https://www.universalweath
