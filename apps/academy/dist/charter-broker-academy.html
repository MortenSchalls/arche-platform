 a post-trip debrief after every booking (Module 14.6)","10 bookings with no critical error; 10 debriefs signed by trainee, mentor and operations"],["7. Certified","Work alone on live bookings, building up to more complex trips","Manager signs the training record"]]}},{"box":{"t":"Critical errors (any one stops certification and is reviewed by your manager)","l":["1. Contract issued without KYC or sanctions screening.","2. Operator used without a checked AOC, insurance and safety standard (or manager approval).","3. Flight sold that we may not sell (Module 2.4), including any cabotage breach, or quoted without a trip risk screen (Module 2.9).","4. Wrong price: margin below 9% without approval, a number we cannot source, or a hidden fee.","5. Missing client disclosures (Module 2.2).","6. Payment taken outside the company's secure payment platform, or bank details sent by email or chat.","7. Personal data sent outside Avinode, the CRM or the operator."]}},{"h3":"Training records and refresher training"},{"p":"Your manager keeps a training record for each person: modules completed, exam scores, trips shadowed, practical exam result, supervised bookings and sign-off date. Records are kept for as long as the person works for your company and for the period our record-keeping rule sets after they leave. Everyone repeats the written exam once a year, and attends a refresher when a rule in this manual changes."},{"h3":"How long it takes"},{"p":"These are planning estimates for a full-time trainee with no aviation background. They depend on how many enquiries come in during shadowing and supervision, and are reviewed after the first trainees."},{"table":{"cols":["Stage","Broker","Consultant"],"rows":[["Self-study and written exam","2 to 3 weeks","1 to 2 weeks"],["Avinode and payment system training and practice","2 to 3 days","1 day"],["Shadowing","2 to 3 weeks","1 week"],["Practical exam","1 day","1 day"],["Supervised work","4 to 8 weeks","2 weeks"],["Total to work alone","about 10 to 14 weeks","about 4 to 6 weeks"],["Independent on complex long-range and multi-country trips","about 6 months",""]]}},{"box":{"t":"Three rules that apply to every module","l":["1. Never state a number, time or rule you cannot show a source for. If you do not know, say you will confirm, and confirm in writing.","2. Nothing is promised to a client until the operator has confirmed it in writing.","3. When in doubt, stop and escalate to your manager. A lost booking costs less than a wrong one."]}}]},"rchk":{"t":"Checklists","b":[{"h3":"A.1 Pre-issue checklist"},{"list":["☐ KYC complete and reference recorded","☐ Sanctions screening record complete and clear","☐ Trip checked against Module 2.4 (never-sell list, cabotage, US and EU rules)","☐ Trip risk screen recorded; every amber point confirmed in writing; no red open","☐ Operator AOC and operations specifications on file; aircraft listed","☐ Insurance certificate on file, commercial passengers covered","☐ Safety audit standard met, or manager approval for an unrated operator; operator not on a banned list","☐ Route feasible: range, runway, crew duty, permits, slots, cabotage confirmed by the operator","☐ Operator terms back to back with the booking terms","☐ Price at 9% (or manager approval); \"at cost\" items listed","☐ Client requests and operational extras listed, each with how it is charged; fixed prices from a written supplier quote","☐ Airport hours, de-icing, crew plan, parking and customs checked with the operator for the planned times","☐ Disclosures in Module 2.2 included","☐ Payment set up as a payment request"]},{"h3":"A.2 Operator vetting checklist"},{"list":["☐ AOC","☐ Operations specifications","☐ Insurance","☐ ARGUS / Wyvern / IS-BAO evidence, or the unrated-operator route","☐ EU Air Safety List and national bans","☐ Foreign permissions for the route","☐ Accident and enforcement history","☐ Sanctions screening","☐ Contract terms"]},{"h3":"A.3 Pre-flight checklist"},{"list":["☐ Passenger details sent to the operator","☐ Permits and slots confirmed","☐ Catering and ground transport confirmed","☐ Every client request and operational extra confirmed in writing","☐ De-icing, airport hours and crew plan rechecked against the forecast and final times","☐ Trip brief sent to the client","☐ 24-hour contact on duty; desk log updated"]},{"h3":"A.4 After-flight checklist"},{"list":["☐ Every leg followed to landing; changes told to the client at once","☐ Follow-up call or message within 24 hours of the last landing, logged","☐ Rating request sent (B.10); answer recorded when it arrives","☐ Score of 3 or less or a complaint: service recovery started, manager told","☐ Operator invoice and receipts collected; items at cost recharged within 7 days through a payment request","☐ Supervised booking: debrief (B.9) completed by trainee, mentor and operations","☐ All payments settled; file closed"]}]},"rtpl":{"t":"Templates","b":[{"h3":"B.1 Intake form"},{"table":{"cols":["Field","Entry"],"rows":[["Booker / lead passenger / payer (names, contacts)",""],["Dates and local times; flexibility",""],["From (city, airport, IATA / ICAO)",""],["To (city, airport, IATA / ICAO)",""],["Further legs",""],["Passengers (adults / children / infants)",""],["Nationalities",""],["Luggage and special items",""],["Pets",""],["Purpose of travel (if a permit needs it)",""],["Catering, ground transport, special requests",""],["Budget and payment method",""],["Source of enquiry",""],["KYC started (yes / no, reference)",""],["Trip risk screen (Module 2.9): colour for each of the six questions; manager decision if red",""]]}},{"h3":"B.2 Request for quote to operators (Avinode message)"},{"box":{"t":"Text","l":["Please quote an all-in price for the trip below. Please list what is included and excluded (positioning, crew overnights, landing, handling and parking, navigation, catering, fuel and surcharges, taxes, de-icing, Wi-Fi, permits), the aircraft registration and year, your safety audit status, and the quote expiry. Please also confirm whether the trip is non-stop for this load and season, and any crew-duty or permit constraints.","[Route, dates and local times, passengers, luggage, special items]"]}},{"h3":"B.3 Quote email to the client"},{"box":{"t":"Text","l":["Dear [name], thank you for your request. We are pleased to propose:","Aircraft: [type, year], [seats]; operated by [operator legal name as on its AOC].","Schedule (local times): [legs].","Price: USD [amount], including [inclusions]. The following are charged at cost after the flight, with receipts: [list].","This proposal is valid until [date and time]. [Company] acts as charter broker; the flight is operated by [operator].","To confirm, we will send our charter confirmation and a secure payment request. We never send bank details by email."]}},{"h3":"B.4 Trip brief"},{"box":{"t":"Contents","l":["Trip reference; aircraft and registration; operator; departure and arrival in local time with dates; FBO name and address; arrival time at the FBO; passenger list; document reminder; catering; ground transport; your company 24-hour contact."]}},{"h3":"B.5 KYC record and B.6 Sanctions screening record"},{"table":{"cols":["Record","Fields"],"rows":[["KYC","Client type; names; identity documents seen; company details and owners; payer; date; staff member; reference"],["Sanctions screening","Names screened; lists searched (UN, Singapore, US OFAC, EU, UK Sanctions List); date and time; result; match handling; staff member; manager decision if any"]]}},{"h3":"B.7 Call scripts"},{"box":{"t":"Inbound","l":["\"[Company], [name] speaking. How can I help?\" – listen – \"May I take a few details so I can find the right aircraft?\" – capture with the intake form – \"Who will be travelling and who will look after payment?\" – \"I will come back to you with options by [time].\""]}},{"box":{"t":"Outbound (consultants)","l":["\"Good morning, this is [name] from [Company], a private jet charter broker. I am calling because [reason]. Is this a convenient moment?\" – if no, ask when – if not interested, thank them and record the opt-out at once."]}},{"h3":"B.8 Desk handover log"},{"table":{"cols":["Field","Entry"],"rows":[["Shift and staff",""],["Live trips and status",""],["Open issues and owners",""],["Promised call-backs (who, when)",""],["Escalations to your manager",""]]}},{"h3":"B.9 Post-trip debrief form"},{"box":{"t":"Debrief (supervised bookings)","l":["Trip reference: [ref]   Last landing: [date]   Trainee: [name]   Mentor: [name]   Operations: [name]","1. Pre-issue checks (A.1): score 1–5 [ ]  Evidence on file: yes / no  Comment: [ ]","2. Extras and changes explained to the client: score 1–5 [ ]  Comment: [ ]","3. Client satisfaction: client rating [ ] / 5  Comment from the follow-up: [ ]","Errors found: critical [list or none]  minor [list or none]","What went well: [ ]   What to do differently: [ ]","Action: [what] by [who] by [date]","Signed: mentor [ ]  operations [ ]  trainee has read [ ]"]}},{"h3":"B.10 Follow-up message and rating request"},{"box":{"t":"Text","l":["Subject: Your flight [route], [date] – how did we do?","Dear [name], welcome back. Thank you for flying with your company. I hope everything was as you expected.","If anything was not right, please reply to this email or call me on [number]; I will deal with it personally.","Would you rate your trip? One click is enough: 5 Excellent · 4 Good · 3 Fair · 2 Poor · 1 Very poor. You may add a comment for the aircraft, the crew or me.","We use ratings only to improve our service and choose our operators. We never publish your rating or words without your written permission.","Kind regards, [broker name], your company"]}},{"h3":"B.11 Live negotiation lab scoring sheet"},{"box":{"t":"Scoring","l":["Trainee: [ ]   Assessor: [ ]   Date: [ ]   Scenarios: [ ]","Calm and courteous under pressure: [ ] / 20","Correct rule, explained in plain words: [ ] / 30   (wrong rule = fail)","Options offered instead of a flat no: [ ] / 20","No unconfirmed promise: pass / fail   (any = fail)","Escalates when the rules say so: [ ] / 15","Written follow-up within 1 hour: [ ] / 15","Total: [ ] / 100   Result: pass (70+, no critical) / not yet","Best moment: [ ]   To practise: [ ]"]}}]},"rlib":{"t":"Self-study library","b":[{"p":"Every link below was checked in October 2026 and is chosen for air charter brokers (people who sell flights), not aircraft sales brokers (people who sell aircraft). Links are checked again at every review of this manual; report a broken link to your manager."},{"h3":"D.1 Avinode and our payment provider"},{"links":[["Avinode for brokers","https://avinode.com/broker/","Search, TripManager quotes and contracts, empty legs; links to the Help Center"],["Avinode Help Center","https://help.avinodegroup.com/hc/en-us","Knowledge hub; free starter training videos (Module 14.2)"],["Avinode Help Center: Onboarding","https://help.avinodegroup.com/hc/en-us/sections/23935448207131-Onboarding","Starter broker videos, Trip Manager walkthroughs"]]},{"h3":"D.2 Charter broker training and best practice"},{"links":[["Air Charter Association: training","https://www.theaircharterassociation.aero/training/","Air Charter Essentials Certificate (one day, open to non-members) and Broker Qualification"],["Air Charter Association: Broker Qualification","https://www.theaircharterassociation.aero/the-broker-qualification/","Levels 1 to 3; member companies only"],["NBAA Best Practices for Air Charter Brokering (July 2024)","https://nbaa.org/wp-content/uploads/2024/07/NBAA-Best-Practices-for-Air-Charter-Brokering.pdf","Recommended broker practices and the US rules"],["NBAA Aircraft Charter Consumer Guide","https://nbaa.org/flight-department-administration/aircraft-operating-ownership-options/aircraft-charter/aircraft-charter-consumer-guide/","What informed clients are told to check"],["IABI Aircraft Charter Broker Course","https://www.iabi.aero/air-charter-broker-course","Commercial self-paced online course; optional, not a requirement of this course"]]},{"h3":"D.3 Aviation basics"},{"links":[["SKYbrary","https://skybrary.aero/","Plain explanations of aviation terms and safety topics"]]},{"h3":"D.4 Rules for brokers and charter flights"},{"links":[["US: 14 CFR Part 295, air charter brokers (eCFR)","https://www.ecfr.gov/current/title-14/chapter-II/subchapter-A/part-295"],["US: Increasing Charter Air Transportation Options, final rule (2018)","https://www.federalregister.gov/documents/2018/09/17/2018-18345/increasing-charter-air-transportation-options"],["US: public charters and selling seats (NATA)","https://nata.aero/advocacy/initiatives-and-issues/public-charter-operations/public-charter-faqs/"],["EU: EASA third-country operators (TCO)","https://www.easa.europa.eu/en/domains/air-operations/third-country-operators","Official site blocks automated checks; open in a browser"],["EU: charter flights by operators from outside the EU (Swedish Transport Agency)","https://www.transportstyrelsen.se/en/aviation/air-operators/traffic-permits/charter-flights-non-scheduled-air-service/"],["EU: Air Safety List (banned operators)","https://transport.ec.europa.eu/transport-themes/eu-air-safety-list_en"],["UK CAA: charters and air taxi flights","https://www.caa.co.uk/air-passengers/about-your-trip/charters-and-air-taxis-flights/","How to tell a legal charter"],["UK CAA: ATOL protection","https://www.caa.co.uk/atol-protection/","When packages need ATOL"],["Singapore: CAAS requirements for foreign air operators","https://www.caas.gov.sg/operations-safety/air-operations/foreign-air-operators"],["Thailand: CAAT eAIP (current edition)","https://aip.caat.or.th/","Open GEN 1.2 for entry, transit and departure"],["Thailand: permit planning (Universal Weather)","https://www.universalweather.com/blog/planning-bizav-operations-to-thailand-part-1-permit-planning/"],["EU sanctions and business aviation: Russia and Belarus (EBAA, 2023)","https://www.ebaa.org/app/uploads/2023/04/Impact-of-EU-Sanctions-against-Russia-and-Belarus-on-BizAv.pdf"]]},{"h3":"D.5 Operator safety and airspace"},{"links":[["ARGUS auditing services and ratings","https://argus.aero/auditing-services"],["Wyvern","https://www.wyvern.aero/","Wingman certification; site blocks automated checks, open in a browser"],["IS-BAO (International Business Aviation Council)","https://www.ibac.org/is-bao"],["Air Charter Safety Foundation","https://www.acsf.aero/","Industry Audit Standard"],["EASA Conflict Zone Information Bulletins","https://www.easa.europa.eu/en/domains/air-operations/czibs"],["FAA prohibitions, restrictions and notices","https://www.faa.gov/air_traffic/publications/us_restrictions"],["Safe Airspace conflict-zone database (OPSGROUP)","https://safeairspace.net/"]]},{"h3":"D.6 Sanctions lists"},{"links":[["United Nations Security Council consolidated list","https://main.un.org/securitycouncil/en/content/un-sc-consolidated-list"],["US OFAC sanctions list search","https://sanctionssearch.ofac.treas.gov/"],["EU sanctions map","https://www.sanctionsmap.eu/"],["UK Sanctions List search","https://search-uk-sanctions-list.service.gov.uk"],["UK: moving to a single sanctions list (28 January 2026)","https://www.gov.uk/guidance/moving-to-a-single-list-for-uk-sanctions-designations-28-january-2026"],["Singapore: MAS targeted financial sanctions","https://www.mas.gov.sg/regulation/anti-money-laundering/targeted-financial-sanctions"]]},{"h3":"D.7 Passengers and taxes"},{"links":[["IATA Timatic","https://www.iata.org/en/publications/timatic/","The travel-document database handlers and operators use"],["IRS audit guide: air transportation excise tax","https://irs.gov/pub/irs-mssp/air_transportation.pdf"],["UK Air Passenger Duty rates","https://www.gov.uk/guidance/rates-and-allowances-for-air-passenger-duty"]]},{"h3":"D.8 Aircraft manufacturers"},{"links":[["Bombardier aircraft","https://businessaircraft.bombardier.com/","Site blocks automated checks; open in a browser"],["Gulfstream aircraft","https://www.gulfstream.com/en/aircraft/"],["Dassault Falcon","https://www.dassaultfalcon.com/"]]},{"h3":"D.9 Operational rules"},{"links":[["EU CAT.OP.MPA.250: ice and other contaminants, ground procedures (UK CAA regulatory library)","https://regulatorylibrary.caa.co.uk/air-operations-pre-30-october-2025/Content/Document%20Structure/04%20CAT/2%20Regs/07560_CATOPMPA250_Ice_and_other_contaminants_ground_procedures.htm"],["US 14 CFR 135.227: icing conditions, operating limitations","https://www.ecfr.gov/current/title-14/chapter-I/subchapter-G/part-135/subpart-D/section-135.227"],["US 14 CFR 135.267: flight time limits and rest, unscheduled one- and two-pilot crews","https://www.law.cornell.edu/cfr/text/14/135.267"],["ICAO Doc 9640: Manual of Aircraft Ground De-icing/Anti-icing Operations","https://store.icao.int/en/manual-of-aircraft-ground-de-icing-anti-icing-operations-doc-9640"],["SAE AS6285: aircraft ground deicing/anti-icing processes","https://saemobilus.sae.org/content/as6285"]]}]},"rglo":{"t":"Glossary","b":[{"table":{"cols":["Term","Meaning"],"rows":[["AOC","Air Operator Certificate: an authority's approval for an operator to fly commercially"],["AOG","Aircraft on ground: the aircraft cannot fly because of a technical fault"],["ARGUS / Wyvern","Independent safety audit and rating providers for charter operators"],["Avinode","The marketplace your company uses to source, quote and book flights"],["Back to back","Our terms to the client mirror the operator's terms to us"],["Block time","From moving off the parking stand to stopping at the destination"],["Cabotage","Flights between two points in one country, reserved for that country's carriers"],["Empty leg","A flight without passengers, sold cheaply on special conditions"],["FBO","Fixed-base operator: the private terminal and handling service at an airport"],["Flight time","From take-off to landing"],["Handler","The company at an airport that arranges fuel, parking, catering and paperwork"],["IATA / ICAO code","Three-letter and four-letter airport codes"],["IS-BAO","International Standard for Business Aircraft Operations, a safety management standard"],["KYC","Know your client: confirming who the client and payer are"],["Operations specifications","The document with an AOC listing the aircraft and operations approved"],["Payment request","A secure payment link from our payment provider"],["Permit","A country's permission for a foreign flight to land or overfly"],["Positioning leg","A flight without passengers to bring the aircraft to the start or back to base"],["PPR","Prior permission required, for example for parking at a busy airport"],["PEP","Politically exposed person: a senior public official, or a family member or close associate"],["NOTAM","Notice to air missions: official notice of airspace or airport restrictions"],["CZIB","EASA Conflict Zone Information Bulletin"],["FET","US federal excise tax on air transportation"],["RFQ","Request for quote sent to operators"],["Slot","An approved take-off or landing time at a busy airport"],["TCO","EASA third-country operator authorisation for non-EU operators flying into the EU"],["UTC (Zulu)","The single world time used in aviation"]]}}]},"rwat":{"t":"Watchlist","b":[{"p":"This page lists places and topics that need extra checks. Your manager updates it at least monthly from the official sources below and whenever a source changes. Always use the current version in the your company document folder. A place on this list is not automatically refused: it tells you which check to run. A place not on the list is not automatically safe: the trip risk screen still applies."},{"table":{"cols":["Item","Detail"],"rows":[["Watchlist reviewed","October 2026, by your manager"],["Next review","November 2026"]]}},{"h3":"G.1 Territories where a leg may be domestic"},{"table":{"cols":["Country","Territories and islands to watch"],"rows":[["United States","Alaska, Hawaii, Puerto Rico, US Virgin Islands, Guam, Northern Mariana Islands, American Samoa"],["Spain","Canary Islands, Balearic Islands, Ceuta, Melilla"],["Portugal","Madeira, Azores"],["France","Corsica; overseas departments Guadeloupe, Martinique, French Guiana, Réunion, Mayotte"],["Italy","Sicily, Sardinia"],["China","Hong Kong and Macau are treated separately from mainland China; the operator confirms the regime for every flight between them"]]}},{"h3":"G.2 Sanctions and embargoes"},{"p":"Always screen against the official lists in Appendix D; the summary below only tells you where to look harder."},{"list":["Broad embargoes in force under one or more of the UN, US, EU or UK regimes include Iran and North Korea; the US also keeps a broad embargo on Cuba, which can affect flights with US-made aircraft.","Russia and Belarus: wide-ranging measures, including the EU ban on aircraft chartered or controlled by Russian nationals (Module 2.4); the Russian-occupied regions of Ukraine (Crimea, Donetsk, Luhansk) are under near-total restrictions.","Syria: sanctions programmes have changed; check the current status on each list before any quote.","Any other country with UN, US, EU, UK or Singapore measures: manager decision."]},{"h3":"G.3 Conflict zones and airspace notices"},{"p":"EASA publishes Conflict Zone Information Bulletins for European operators, and the FAA publishes prohibitions and security notices for US operators. As at October 2026 the FAA lists international security notices for: Afghanistan, Belarus, Central America, Colombia, Ecuador, Haiti, Iran, Iraq, North Korea, Libya, Mali, Mexico, the Pacific Ocean, Panama, the Persian Gulf and Gulf of Oman, the Russian Federation, Saudi Arabia, Somalia, Syria, Ukraine and Yemen. A notice can range from a full ban to advice for part of the airspace; it applies to the operator, not to the whole country. Any route touching these areas: amber at least; the operator confirms routing and insurance in writing."},{"h3":"G.4 Pets"},{"p":"Rabies-free countries with strict import routes and approved arrival airports, for example the United Kingdom, Ireland, Australia, New Zealand, Japan, Singapore and the US state of Hawaii: check the official authority's rules before quoting any pet travel."},{"h3":"G.5 Strict permit regimes for foreign operators"},{"p":"Examples where lead times and rules for foreign operators are known to be demanding: China, India and Russian airspace. Ask the operator for the lead time before quoting."},{"h3":"G.6 Taxes"},{"list":["United States: federal excise tax on air transportation; generally collected by the person who receives payment, and a broker acting as principal can be required to collect it.","European Union: VAT rules differ by country and by type of trip.","United Kingdom: Air Passenger Duty, with a higher rate for aircraft of 20 tonnes or more equipped for fewer than 19 passengers.","Singapore: GST, as advised by our accountant."]},{"h3":"G.7 Countries we cannot take payments from or pay to"},{"p":"We do not take payments from or make payments to these jurisdictions (sanctions and payment-provider rules, checked October 2026; the list can change): Belarus; Crimea, Donetsk, Kherson, Luhansk and Zaporizhzhia regions of Ukraine; Cuba; Iran; Kazakhstan; Libya; Myanmar; North Korea; Russia; South Sudan; Sudan; Syria; Venezuela. Payment providers also refuse some activities, including cryptocurrency services and weapons and military items. Where payments run through a payment request, a payer or operator in one of these places is a red answer on the trip risk screen: stop and tell your manager. Several are not under a broad sanctions embargo; the reason we stop is that we cannot take or make the payment."},{"h3":"G.8 Sources your manager checks"},{"links":[["EASA Conflict Zone Information Bulletins","https://www.easa.europa.eu/en/domains/air-operations/czibs"],["FAA prohibitions, restrictions and notices","https://www.faa.gov/air_traffic/publications/us_restrictions"],["EU Air Safety List","https://transport.ec.europa.eu/transport-themes/eu-air-safety-list_en"],["UN Security Council consolidated list","https://main.un.org/securitycouncil/en/content/un-sc-consolidated-list"],["US OFAC sanctions list search","https://sanctionssearch.ofac.treas.gov/"],["EU sanctions map","https://www.sanctionsmap.eu/"],["UK Sanctions List search","https://search-uk-sanctions-list.service.gov.uk"],["Singapore: MAS targeted financial sanctions","https://www.mas.gov.sg/regulation/anti-money-laundering/targeted-financial-sanctions"],["IRS audit guide: air transportation excise tax","https://irs.gov/pub/irs-mssp/air_transportation.pdf"]]}]},"rcred":{"t":"Photo credits","b":[{"p":"The photographs in this course are freely licensed from Wikimedia Commons. They were resized for the course. Each is used under the licence shown; follow the link for the original."},{"table":{"cols":["Photo","Photographer","Licence"],"rows":[["Pilatus PC-12NG","Acroterion","CC BY-SA 4.0"],["Embraer Phenom 300","Acroterion","CC BY-SA 4.0"],["Learjet 60","Lars Henseleit","Public domain"],["Bombardier Challenger 350","Acroterion","CC BY-SA 4.0"],["Dassault Falcon 900LX","Steve Lynes","CC BY 2.0"],["Bombardier Global 7500","Acroterion","CC BY-SA 4.0"],["Boeing Business Jet","Eddie Maloney","CC BY-SA 2.0"],["Gulfstream G650ER","Md Shaifuzzaman Ayon","CC BY-SA 4.0"],["Dassault Falcon 8X","Matti Blume","CC BY-SA 4.0"],["Hawker 4000 cabin","JetRequest.com","CC BY-SA 3.0"],["Embraer Phenom 300 cabin","Matti Blume","CC BY-SA 4.0"],["De-icing a wing","Nicholas Hartmann","CC BY-SA 4.0"],["Bombardier Global 7500 cabin","Matti Blume","CC BY-SA 4.0"]]}},{"links":[["Pilatus PC-12NG (original)","https://commons.wikimedia.org/wiki/File:Pilatus_PC-12NG_N834NG_FDK_MD2.jpg"],["Embraer Phenom 300 (original)","https://commons.wikimedia.org/wiki/File:Embraer_Phenom_300_N235EE_FDK_MD2.jpg"],["Learjet 60 (original)","https://commons.wikimedia.org/wiki/File:Learjet_60_D-CKKK.jpg"],["Bombardier Challenger 350 (original)","https://commons.wikimedia.org/wiki/File:Bombardier_Challenger_350_N1980Z.jpg"],["Dassault Falcon 900LX (original)","https://commons.wikimedia.org/wiki/File:EGLF_-_Dassault_Falcon_900LX_-_F-HDOR_(44058572331).jpg"],["Bombardier Global 7500 (original)","https://commons.wikimedia.org/wiki/File:Bombardier_Global_7500_CS-ESS_BWI_MD1.jpg"],["Boeing Business Jet (original)","https://commons.wikimedia.org/wiki/File:Boeing_Business_Jet_take_off_at_McCarran_Airport_2008_(3023202347).jpg"],["Gulfstream G650ER (original)","https://commons.wikimedia.org/wiki/File:Gulfstream_G650ER_-_N1895T_-_Serial_6346_-_VGHS.jpg"],["Dassault Falcon 8X (original)","https://commons.wikimedia.org/wiki/File:Dassault_Falcon_8X,_Paris_Air_Show_2019,_Le_Bourget_(SIAE8623).jpg"],["Hawker 4000 cabin (original)","https://commons.wikimedia.org/wiki/File:Hawker_4000_cabin_interior_facing_forward.jpg"],["Embraer Phenom 300 cabin (original)","https://commons.wikimedia.org/wiki/File:Embraer_Phenom_300_cabin,_EBACE_2019_(EB190435,_cropped).jpg"],["De-icing a wing (original)","https://commons.wikimedia.org/wiki/File:2008_wing_deicing_01.jpg"],["Bombardier Global 7500 cabin (original)","https://commons.wikimedia.org/wiki/File:Bombardier_Global_7500,_Paris_Air_Show_2019,_Le_Bourget_(SIAE8909).jpg"]]}]}};
const ISSUES = {"usdom":"US domestic leg on a non-US operator","spdom":"Domestic leg inside Spain on a non-EU operator","pep":"Politically exposed person","child":"Child travelling without parents","seats":"Individual seat sales","pkg":"Package sale (hotel and tickets)","guns":"Firearms on board","embargo":"Embargoed destination and US-made aircraft","pet":"Pet into a rabies-free country","curfew":"Night curfew at arrival airport","bribe":"Cash payment to an official or handler","hkcn":"Hong Kong and mainland China regime"};
const LAB = [{"t":"Los Angeles – Honolulu – Tokyo for a family of five on a Japanese-registered jet.","o":["curfew","pet","usdom","spdom"],"hc":"d128128d","hi":"684a71fc","why":"Hawaii is a US state, so Los Angeles – Honolulu is a US domestic leg: never on a non-US operator."},{"t":"Madrid – Tenerife – Madrid on a Swiss operator.","o":["pkg","embargo","spdom","usdom"],"hc":"aa0e6263","hi":"de375f1b","why":"Tenerife is in Spain (Canary Islands). Domestic Spanish legs on a non-EU operator need permission: the operator confirms, or use an EU operator."},{"t":"A minister's office books Geneva – Riyadh; the ministry pays.","o":["pep","seats","bribe","embargo"],"hc":"f6c1070a","hi":"ee376546","why":"A minister is a politically exposed person: enhanced KYC and manager approval."},{"t":"A 14-year-old flies London – New York with an aunt.","o":["pkg","child","pep","usdom"],"hc":"b55bb9b6","hi":"90f0ebbd","why":"A child without parents: ask for parental consent documents and escalate any doubt."},{"t":"Four friends each want to pay for one seat on a Paris – Ibiza flight with other strangers.","o":["spdom","seats","curfew","pkg"],"hc":"7428d69f","hi":"1f53a724","why":"We sell whole aircraft to one client. Never sell per seat."},{"t":"The client adds a hotel and Formula 1 tickets to the flight and wants one price.","o":["pkg","pep","seats","bribe"],"hc":"882bfbcd","hi":"b2418e82","why":"A package sale: manager approval under package-travel and ATOL rules."},{"t":"A hunting party flies Johannesburg – Windhoek with rifles.","o":["child","embargo","guns","pet"],"hc":"077f9da6","hi":"787b6c32","why":"Firearms: the operator and both authorities must approve; permits needed; manager informed."},{"t":"Dubai – Tehran on a Gulfstream for a business meeting.","o":["hkcn","pep","embargo","curfew"],"hc":"2ea68359","hi":"076444bd","why":"Iran is under embargo, and a US-made aircraft adds US export rules. Stop and escalate."},{"t":"A dog travels Bangkok – London in the cabin.","o":["child","pet","curfew","guns"],"hc":"b2ce704b","hi":"1a9b7cf3","why":"The UK has strict pet import rules and approved arrival routes. Check the authority's rules and the operator's acceptance before quoting."},{"t":"Arrival at a curfewed European airport planned for 01:30 local.","o":["spdom","curfew","pet","bribe"],"hc":"5db83148","hi":"baeb7473","why":"Night curfew: the operator confirms or the schedule changes."},{"t":"A handler asks for USD 500 in cash to \"speed up\" a landing permit.","o":["bribe","curfew","pep","pkg"],"hc":"7bbbecd1","hi":"9d82de66","why":"Bribery risk under laws such as the US FCPA and UK Bribery Act: refuse and report."},{"t":"Hong Kong – Shanghai – Hong Kong on a Hong Kong-registered jet.","o":["hkcn","spdom","usdom","embargo"],"hc":"9caf1620","hi":"5ad065bf","why":"Hong Kong and mainland China are treated separately: the operator confirms the permission and regime before quoting."}];

<script>
(() => {
"use strict";
const ED = "ext";                          // "int" = Archē internal academy, "ext" = edition sold to external brokers
let HIDDEN = [];                               // steps the course owner has deselected (external edition)
const KEY = ED === "ext" ? "charter-broker-academy-v1" : "arche-cbt-v1", SALT = "ARCHE-CBT-2026-10", PASS = 0.8, QK = "AX-7Q2-2026-10";
/* answer keys are not stored in the page; answers are matched against check values */
(function unseal(){
  const q1 = q => { if (q.a === undefined && q.h) q.a = q.o.findIndex((_,i) => fnv(QK + q.q + "|" + i) === q.h); };
  Object.values(MODS).forEach(m => { m.quiz.forEach(q1); m.secs.forEach(s => s.b.forEach(b => b.tryq && q1(b.tryq))); });
  LAB.forEach(x => { if (x.hc) { x.c = ["green","amber","red"].find(c => fnv(QK + x.t + "|c|" + c) === x.hc); x.i = x.o.find(i => fnv(QK + x.t + "|i|" + i) === x.hi); x.d = x.o.filter(i => i !== x.i); } });
})();
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const todayISO = () => { const d = new Date(); return new Date(d.getTime() - d.getTimezoneOffset()*6e4).toISOString().slice(0,10); };
const MON = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const fmtD = iso => { if(!iso) return ""; const [y,m,d] = String(iso).slice(0,10).split("-"); return `${+d} ${MON[+m-1]} ${y}`; };
const usd = n => "USD " + Math.round(n).toLocaleString("en-US");
const num = v => { const n = parseFloat(String(v).replace(/[, ]/g,"")); return isFinite(n) ? n : NaN; };

/* ---------- state ---------- */
let ST = null;
try { ST = JSON.parse(localStorage.getItem(KEY)); } catch(e) { ST = null; }
if (!ST || ST.v !== 1) ST = {v:1, name:"", role:"broker", started:"", mods:{}, updated:""};
const saveLocal = () => { try { localStorage.setItem(KEY, JSON.stringify(ST)); } catch(e) {} };

/* ---------- platform: tracking ---------- */
const P = {db:null, user:null, uid:null, owner:false, ref:null, mode:"none", chain:Promise.resolve()};
function setSync(mode){
  P.mode = mode; const el = $("sync");
  el.className = "chip " + (mode === "sync" ? "sync" : mode === "local" ? "local" : "none");
  el.textContent = mode === "sync" ? "Progress recorded" : mode === "local" ? "Saved on this device" : "Saved on this device";
  el.title = mode === "sync" ? "Your progress is saved to the course records." : "Progress is kept in this browser. When you finish, send your completion code to the course provider.";
}
function pushRemote(){
  if (!P.ref) return;
  const body = JSON.parse(JSON.stringify(ST)); body.updated = new Date().toISOString();
  P.chain = P.chain.then(() => P.ref.set(body)).then(() => setSync("sync")).catch(() => { P.ref = null; setSync("local"); });
}
function save(){ ST.updated = new Date().toISOString(); saveLocal(); pushRemote(); }
function mergeRemote(r){
  if (!r) return;
  if (r.resetAt && (!ST.resetSeen || ST.resetSeen < r.resetAt)) {      // the director reset this trainee
    ST = {v:1, name:r.name || ST.name, role:r.role || ST.role, started:new Date().toISOString(), mods:{}, updated:"", resetSeen:r.resetAt};
    return;
  }
  if (!ST.name && r.name) { ST.name = r.name; ST.role = r.role || ST.role; ST.started = r.started || ST.started; }
  Object.entries(r.mods || {}).forEach(([k,v]) => { const m = ST.mods[k]; if (!m || (v.passed && !m.passed) || (v.best||0) > (m.best||0)) ST.mods[k] = v; });
}
async function initPlatform(){
  const c = window.claude;
  if (!c || typeof c.use !== "function") { setSync("local"); return; }
  try {
    const [user, db] = await Promise.all([c.use("user"), c.use("db")]);
    P.user = user; P.db = db;
    if (user) { P.owner = await user.isOwner(); P.uid = await user.id(); }
    if (db && ED === "ext") { try { const c = await db.doc("config/course").get(); if (c.exists) HIDDEN = (c.data().hidden || []).filter(id => !["m0","m2","exam"].includes(id)); } catch(e) {} }
    if (db && P.uid) {
      P.ref = db.doc("progress/" + P.uid);
      try { const s = await P.ref.get(); if (s.exists) { mergeRemote(s.data()); saveLocal(); } setSync("sync"); if (ST.name) pushRemote(); }
      catch(e) { P.ref = null; setSync("local"); }
    } else setSync("local");
  } catch(e) { setSync("local"); }
  renderMap(); if (VIEW.id === "home" || VIEW.id === "start" || VIEW.id === "records") render();
}

/* ---------- helpers ---------- */
const PATH = () => (PATHS[ST.role] || PATHS.broker).filter(id => !HIDDEN.includes(id));
/* spaced review: questions answered wrongly come back as quick recall at the start of later modules */
const qKey = (m, q) => m + "|" + fnv(q.q);
function addReview(m, q){ ST.review = ST.review || []; const k = qKey(m, q); if (!ST.review.includes(k)) ST.review.push(k); }
function dropReview(k){ ST.review = (ST.review || []).filter(x => x !== k); }
function reviewItems(except, n){
  return (ST.review || []).map(k => { const [m, h] = k.split("|"), M = MODS[m]; const q = M && M.quiz.find(x => fnv(x.q) === h); return q && m !== except ? {k, m, q} : null; }).filter(Boolean).slice(0, n);
}
const inPath = id => PATH().includes(id);
const modState = id => ST.mods[id] || null;
const isDone = id => !!(ST.mods[id] && ST.mods[id].passed);
const courseItem = id => COURSE.find(c => c.id === id);
function unlocked(id){ const order = PATH(), i = order.indexOf(id); if (i < 0) return false; return i === 0 || isDone(order[i-1]); }
const nextInPath = id => { const o = PATH(); return o[o.indexOf(id) + 1]; };
function record(id, score, total, passed){
  const m = ST.mods[id] || {attempts:0, best:0};
  m.attempts = (m.attempts||0) + 1; m.score = score; m.total = total; m.pct = Math.round(score/total*100);
  m.best = Math.max(m.best||0, m.pct); m.passed = !!(m.passed || passed); m.at = new Date().toISOString();
  if (passed && !m.passedAt) m.passedAt = m.at;
  ST.mods[id] = m;
  if (PATH().every(isDone) && !ST.completedAt) ST.completedAt = new Date().toISOString();
  save(); renderMap();
}
function fnv(s){ let h = 0x811c9dc5; for (let i=0;i<s.length;i++){ h ^= s.charCodeAt(i); h = Math.imul(h, 0x01000193) >>> 0; } return h.toString(16).padStart(8,"0"); }
const b64e = s => btoa(unescape(encodeURIComponent(s))).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
const b64d = s => decodeURIComponent(escape(atob(s.replace(/-/g,"+").replace(/_/g,"/"))));
function makeCode(){
  const p = JSON.stringify([ST.name, ST.role, (ST.completedAt||"").slice(0,10), PATH().map(k => [k, (ST.mods[k]||{}).best||0])]);
  return "AE2." + b64e(p) + "." + fnv(p + SALT);
}
function readCode(code){
  const m = String(code).trim().replace(/\s+/g,"").match(/^AE2\.([A-Za-z0-9_-]+)\.([0-9a-f]{8})$/);
  if (!m) return {ok:false, msg:"This is not an Archē completion code. Ask the trainee to copy the whole code."};
  let p; try { p = b64d(m[1]); } catch(e) { return {ok:false, msg:"The code is damaged. Ask the trainee to copy it again."}; }
  if (fnv(p + SALT) !== m[2]) return {ok:false, msg:"The check digits do not match. The code was changed or copied incompletely."};
  const a = JSON.parse(p); return {ok:true, name:a[0], role:a[1], date:a[2], items:a[3] || []};
}
const roleName = r => r === "consultant" ? "Charter consultant" : "Broker";

/* ---------- figures: drawn diagrams and charts (theme-aware, spoken by the audio) ---------- */
const FIGS = (() => {
  const W = 640;
  const box = (x,y,w,h,t,sub,cls) => `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="10" class="${cls||"f-panel s-line"}" stroke-width="1.2"/><text x="${x+w/2}" y="${y+h/2 - (sub?6:-5)}" text-anchor="middle" class="t-b">${t}</text>${sub ? `<text x="${x+w/2}" y="${y+h/2+13}" text-anchor="middle" class="t-s t-m">${sub}</text>` : ""}`;
  const arrow = (x1,y1,x2,y2,cls,dash) => `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" class="${cls||"s-acc"}" stroke-width="2" ${dash?'stroke-dasharray="6 5"':""} marker-end="url(#ah)"/>`;
  const defs = `<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="f-acc"/></marker></defs>`;
  const svg = (h, body, label) => `<svg viewBox="0 0 ${W} ${h}" role="img" aria-label="${label}" xmlns="http://www.w3.org/2000/svg">${defs}${body}</svg>`;
  const jet = (x, y, s) => `<g transform="translate(${x} ${y}) scale(${s})"><path class="f-acc" d="M0,14 C6,6 20,4 44,4 L118,4 C128,4 136,8 140,12 L146,10 L152,0 L160,0 L156,14 C156,17 154,19 150,19 L20,20 C9,20 2,18 0,14 Z"/><path class="f-acc" opacity=".55" d="M58,15 L92,15 L104,30 L96,30 Z"/><circle cx="34" cy="9.5" r="1.8" class="f-panel"/><circle cx="42" cy="9.5" r="1.8" class="f-panel"/><circle cx="50" cy="9.5" r="1.8" class="f-panel"/><circle cx="58" cy="9.5" r="1.8" class="f-panel"/><circle cx="66" cy="9.5" r="1.8" class="f-panel"/><rect x="118" y="6" width="22" height="7" rx="3.5" class="f-soft"/></g>`;
  const F = {};

  F.hero = () => ({svg: svg(150, `<path d="M20,120 C200,70 420,60 620,30" class="s-line" stroke-width="1.2" fill="none" stroke-dasharray="3 7"/>${jet(380,20,1.45)}<text x="20" y="40" class="t-h">Charter Broker Academy</text><text x="20" y="62" class="t-s t-m">by Archē Executive</text>`, "A long-range business jet climbing"), say:""});

  F.who = () => ({svg: svg(250, `${box(10,40,140,64,"Client","the charterer")}${box(200,40,170,64,"Broker","your company")}${box(420,40,200,64,"Operator","holds the AOC, flies")}
    ${arrow(150,64,198,64)}${arrow(370,64,418,64)}
    <text x="174" y="32" text-anchor="middle" class="t-s t-m">enquiry, contract</text><text x="394" y="32" text-anchor="middle" class="t-s t-m">request, booking</text>
    ${box(200,150,170,54,"Avinode and our payment provider","quotes, bookings, payments","f-soft s-line")}
    ${arrow(285,104,285,148,"s-line",true)}
    ${box(420,150,200,54,"Crew and aircraft","work for the operator")}${arrow(520,104,520,148)}
    ${box(10,150,140,54,"FBO and handler","at each airport")}
    <text x="320" y="236" text-anchor="middle" class="t-s t-m">Safety and operational decisions belong to the operator and its crew.</text>`, "Who does what"),
    cap:"Who does what on a charter flight", say:"Diagram. The client sends the enquiry and signs the contract with the broker. The broker requests and books the flight with the operator, which holds the air operator certificate and flies the aircraft with its own crew. Quotes, bookings and payments run through Avinode and our payment provider. A handler and FBO look after the aircraft and passengers at each airport."});

  F.cats = () => {
    const c = [["Light jet",.55,"sit"],["Midsize",.7,"near standing"],["Super-midsize",.82,"standing"],["Heavy",1.0,"standing, galley"],["Ultra-long-range",1.2,"zones, crew rest"]];

function renderMap(){
  const path = PATH(), done = path.filter(isDone).length;
  const items = COURSE.map(c => {
    const ip = inPath(c.id);
    const st = !ip ? `<span class="st soon">Not in path</span>` : isDone(c.id) ? `<span class="st done">Passed</span>` : unlocked(c.id) ? `<span class="st open">Open</span>` : `<span class="st soon">Locked</span>`;
    return `<li><button type="button" data-go="${c.id}" ${ip && unlocked(c.id) ? "" : "disabled"} aria-current="${VIEW.id===c.id}"><span class="code">${esc(c.n)}</span><span>${esc(c.t)}</span>${st}</button></li>`;
  }).join("");
  const refs = Object.entries(REF).map(([id,r]) => `<li><button type="button" data-go="${id}" ${ST.name ? "" : "disabled"} aria-current="${VIEW.id===id}"><span class="code">REF</span><span>${esc(r.t)}</span><span></span></button></li>`).join("");
  $("map").innerHTML = `
    <p class="who">${ST.name ? `Trainee <b>${esc(ST.name)}</b> · ${roleName(ST.role)}` : "Not started"}</p>
    <div class="prog" role="progressbar" aria-valuemin="0" aria-valuemax="${path.length}" aria-valuenow="${done}" aria-label="Course progress"><i style="width:${done/path.length*100}%"></i></div>
    <div class="map-l"><button type="button" class="btn" data-go="home" style="width:100%;margin-bottom:10px">Overview</button></div>
    <p class="group">Course</p><ol>${items}</ol>
    <p class="group">Reference</p><ol>${refs}</ol>
    <div class="extra">
      ${ST.completedAt ? `<button type="button" class="btn" data-go="cert">My completion record</button>` : ""}
      ${P.owner ? `<button type="button" class="btn" data-go="records">Training records (course owner)</button>` : ""}
      ${P.owner && ED === "ext" ? `<button type="button" class="btn" data-go="settings">Course settings</button>` : ""}
      ${ED === "ext" ? `<button type="button" class="btn" data-go="verify">Verify a certificate</button>` : ""}
    </div>`;
}

function wireTries(root, blocks, cb){

function vModule(v, id){
  const M = MODS[id], C = courseItem(id), n = M.secs.length, hasQ = M.quiz.length > 0;
  const pages = ["intro", ...M.secs.map((_,i) => i), "take"].concat(hasQ ? ["check"] : []);
  const s = Math.min(VIEW.step, pages.length - 1), pg = pages[s], total = pages.length;
  const dots = Array.from({length:total}, (_,i) => `<span class="${i < s ? "on" : i === s ? "cur" : ""}"></span>`).join("");
  const head = (sub) => `<div><p class="eyebrow">Module ${esc(C.n)} · ${sub}</p><h1>${esc(C.t)}</h1></div><div class="steps" aria-hidden="true">${dots}</div>`;
  const nav = (label) => `<div class="row"><button class="btn" type="button" id="prev" ${s===0?"disabled":""}>Back</button><span class="sp"></span><button class="btn primary" type="button" id="next">${label}</button></div>`;
  const wire = () => {
    $("prev").onclick = () => { VIEW.step = s - 1; render(); window.scrollTo({top:0}); };
    $("next").onclick = () => {
      if (pg === "take" && !hasQ) { record(id, 1, 1, true); const nx = nextInPath(id); go(nx || "home"); return; }
      VIEW.step = s + 1; render(); window.scrollTo({top:0});

  };
  if (pg === "intro") {

    if (warm) blocks.push({tryq:{q:warm.q, o:warm.o, a:warm.a, why:"You will meet this in the module. " + warm.why}, warm:true});
    v.innerHTML = `${head(`1 of ${total}`)}

      ${M.obj.length ? `<section class="card"><h2>What you will be able to do</h2><ol class="objs">${M.obj.map(o => `<li><span>${esc(o)}</span></li>`).join("")}</ol></section>` : ""}
      ${rec.length ? `<section class="card"><h2>Quick recall</h2><p class="note">Questions you missed earlier. Answer them now: remembering is what makes it stick.</p>${blocks.filter(b => b.rk).map((b,i) => blockHTML(b, i)).join("")}</section>` : ""}
      ${warm ? `<section class="card"><h2>Warm-up</h2><p class="note">Take a guess before you start. Guessing first helps you notice the answer when you read it.</p>${blockHTML(blocks[blocks.length-1], blocks.length-1)}</section>` : ""}
      ${nav("Start")}`;
    wireTries(v, blocks, (b, ok) => { if (b.rk && ok) { dropReview(b.rk); save(); } });

      ${nav(hasQ ? "Go to module check" : "Mark module complete")}`;

    ${nav("Next")}`;

function runQuiz(root, Q, onDone, onBack, opt){
  const exam = !!(opt && opt.exam);
  let i = 0, got = 0, wrong = [], critMiss = 0, pick = -1;
  const step = () => {
    if (i >= Q.length) {
      const passed = onDone(got, Q.length, critMiss), pct = Math.round(got/Q.length*100);
      const nx = nextInPath(VIEW.id);
      root.innerHTML = `<div class="card"><h2>${passed ? (exam ? "Exam passed" : "Module passed") : "Not passed yet"}</h2>
        <p class="score">${got} of ${Q.length} correct · ${pct}% · pass mark 80%${exam ? ` · critical-rule questions missed: ${critMiss}` : ""}</p>
        ${exam && critMiss ? `<p class="fb no">Every question on a critical rule must be right. Review the rules below, then sit the exam again.</p>` : ""}
        ${wrong.length ? `<div class="res">${wrong.map(w => `<div class="it fail"><span class="m">Review</span><span><b>${esc(w.q)}</b>${w.crit && exam ? `<span class="tag">Critical rule</span>` : ""}<br>${esc(w.o[w.a])}. ${esc(w.why)}</span></div>`).join("")}</div>` : `<p>Every answer correct.</p>`}
        <p class="note">${passed ? "Go through anything you got wrong with your mentor." : exam ? "Read the modules again, then retake the exam. Each attempt draws a new set of questions." : "Read the module again, then retry the check."}</p>
        <div class="row"><button class="btn" type="button" id="again">${exam ? "Retake exam" : "Retry check"}</button>${exam ? "" : `<button class="btn" type="button" id="reread">Read module again</button>`}<span class="sp"></span>${passed ? `<button class="btn primary" type="button" data-go="${nx || (ST.completedAt ? "cert" : "home")}">${nx ? "Continue" : ST.completedAt ? "View completion record" : "Overview"}</button>` : ""}</div></div>`;
      AUDIO.screen();
      $("again").onclick = () => exam ? render() : runQuiz(root, Q, onDone, onBack, opt);
      if ($("reread")) $("reread").onclick = () => { VIEW.step = 0; render(); window.scrollTo({top:0}); };
      return;
    }
    const q = Q[i]; pick = -1;
    root.innerHTML = `<div class="card"><p class="eyebrow">Question ${i+1} of ${Q.length}${exam && q.mod ? ` · Module ${esc(q.mod)}` : ""}</p><p class="tq" style="font-weight:600;font-size:16px">${esc(q.q)}</p>
      <div class="opts">${q.o.map((o,j) => `<button type="button" class="opt" data-j="${j}" aria-pressed="false"><span class="k">${"abcd"[j]}</span><span>${esc(o)}</span></button>`).join("")}</div>
      <div id="qfb"></div>
      <div class="row">${i===0 && onBack ? `<button class="btn" type="button" id="qback">Back to module</button>` : ""}<span class="sp"></span><button class="btn primary" type="button" id="qnext" disabled>${i === Q.length-1 ? (exam ? "Finish exam" : "See result") : "Next question"}</button></div></div>`;
    if ($("qback")) $("qback").onclick = onBack;
    AUDIO.screen();
    root.querySelectorAll(".opt").forEach(b => b.onclick = () => {
      const j = +b.dataset.j;
      if (exam) { pick = j; root.querySelectorAll(".opt").forEach((x,k) => { x.classList.toggle("picked", k === j); x.setAttribute("aria-pressed", String(k === j)); }); $("qnext").disabled = false; return; }
      const ok = j === q.a; if (ok) got++; else { wrong.push(q); addReview(VIEW.id, q); saveLocal(); }
      root.querySelectorAll(".opt").forEach((x,k) => { x.disabled = true; if (k === q.a) x.classList.add("right"); else if (k === j) x.classList.add("wrong"); });
      $("qfb").innerHTML = `<div class="fb ${ok ? "ok" : "no"}"><b>${ok ? "Right." : "Not quite."}</b> ${esc(q.why)}</div>`;
      $("qnext").disabled = false; $("qnext").focus();
      AUDIO.focus($("qfb").firstElementChild);
    });
    $("qnext").onclick = () => {
      if (exam) { if (pick === q.a) got++; else { wrong.push(q); if (q.crit) critMiss++; if (q.mid) addReview(q.mid, q); } }
      i++; step();
    };
  };
  step();
}

/* ---------- written exam ---------- */
const EXAM_SIZE = 30;
function vExam(v){
  const bank = [];
  PATH().forEach(id => { const M = MODS[id]; if (M) M.quiz.forEach(q => bank.push(Object.assign({mod:courseItem(id).n, mid:id}, q))); });
  const crit = bank.filter(q => q.crit), rest = seeded(bank.filter(q => !q.crit), Date.now() % 233280);
  const set = seeded(crit.concat(rest).slice(0, Math.max(crit.length, Math.min(EXAM_SIZE, bank.length))), (Date.now() >> 3) % 233280);
  v.innerHTML = `
    <div><p class="eyebrow">Stage 2 · written exam</p><h1>Written exam</h1></div>
    <p class="lede">${set.length} questions from every module in your path, in random order. Answers are not shown until the end. To pass you need 80% or more, and every question on a critical rule must be right.</p>
    <div id="qz"><div class="card"><ul class="l"><li>Work alone and do not use the manual.</li><li>You can change an answer until you press Next.</li><li>If you do not pass, review the modules and retake the exam. Each attempt draws a new set of questions.</li></ul><div class="row"><span class="sp"></span><button class="btn primary" type="button" id="exStart">Start exam</button></div></div></div>`;
  $("exStart").onclick = () => runQuiz($("qz"), set, (sc, tot, cm) => { const passed = sc/tot >= PASS && cm === 0; record("exam", sc, tot, passed); return passed; }, null, {exam:true});
}

/* ---------- lab ---------- */
function seeded(arr, seed){ const a = arr.slice(); let s = seed; for (let i=a.length-1;i>0;i--){ s = (s*9301+49297)%233280; const j = Math.floor(s/233280*(i+1)); [a[i],a[j]] = [a[j],a[i]]; } return a; }
function vLab(v){
  const ans = VIEW.lab || (VIEW.lab = LAB.map(() => ({c:null, i:null, checked:false})));
  const cards = LAB.map((x,k) => {
    const a = ans[k], opts = x.o || seeded([x.i, ...x.d], k+3);
    const right = a.checked && a.c === x.c && a.i === x.i;
    return `<div class="card labcard" data-k="${k}">
      <p class="eyebrow">Trip ${k+1} of ${LAB.length}</p><p class="trip">${esc(x.t)}</p>
      <div><p class="note" style="margin-bottom:6px" data-say="Is this green, amber or red?">Screen result</p><div class="rag3" role="group" aria-label="Screen result">
        ${["green","amber","red"].map(c => `<button type="button" class="ragb" data-c="${c}" aria-pressed="${a.c===c}" ${a.checked?"disabled":""}><i class="dot-${c}"></i>${c[0].toUpperCase()+c.slice(1)}</button>`).join("")}</div></div>

function markBook(B){
  const R = []; const add = (ok, crit, t, why) => R.push({ok, crit, t, why});
  const norm = s => String(s||"").trim().toLowerCase().replace(/\s+/g," ");
  add(!!B.risk, true, "Trip risk screen recorded", "Quoting without a trip risk screen is a critical error.");
  if (B.risk) add(B.risk === "amber", false, "Trip risk screen colour", "Amber: Bangkok – Phuket is a domestic leg on a Swiss aircraft, so the operator must confirm in writing before we quote. It did.");
  add(norm(B.kyc) === "kyc-2026-0147" && B.ck.kyc, true, "KYC reference recorded and screening confirmed", "A contract without KYC and sanctions screening is a critical error. The reference is KYC-2026-0147.");
  add(norm(B.cName).includes("meridian family office"), false, "Charterer name", "Meridian Family Office Pte Ltd.");
  add(norm(B.lead).includes("daniel tan"), false, "Lead passenger", "Daniel Tan.");
  add(norm(B.opName) === "alpine jet services ag", true, "Operator legal name as on the AOC", "Disclose the legal name, Alpine Jet Services AG, not the trading name AlpineJets. Missing disclosures are a critical error.");
  add(B.ck.aoc && B.ck.ins && B.ck.audit && norm(B.aoc) === "ch.aoc.1042", true, "AOC, insurance and safety standard checked", "AOC CH.AOC.1042 with HB-JXA listed, insurance covering commercial passengers, ARGUS Platinum: all must be on file and ticked.");
  add(norm(B.aocState) === "switzerland", false, "AOC state", "Switzerland.");
  add(String(B.reg).trim().toUpperCase() === "HB-JXA" && /6000/.test(B.acType) && String(B.yom).trim() === "2014" && String(B.seats).trim() === "13", false, "Aircraft type, registration, year and seats", "Bombardier Global 6000, HB-JXA, 2014, 13 seats.");
  add(/platinum/i.test(B.audit), false, "Safety audit recorded", "ARGUS Platinum.");
  const legs = B.legs.filter(l => l.f || l.to || l.d);
  const want = [["2026-11-12","10:00","WSSS","VTBD"],["2026-11-14","11:00","VTBD","VTSP"],["2026-11-17","16:00","VTSP","WSSS"]];
  const legsOk = legs.length === 3 && want.every((w,i) => legs[i].d === w[0] && legs[i].t === w[1] && legs[i].f === w[2] && legs[i].to === w[3] && String(legs[i].p).trim() === "6");
  add(legsOk, false, "Itinerary", "WSSS–VTBD 12 Nov 10:00; VTBD–VTSP 14 Nov 11:00; VTSP–WSSS 17 Nov 16:00; 6 passengers on each leg. Positioning is inside the operator's all-in price.");
  add(B.ck.route, true, "Continuous journey confirmed for the domestic leg", "Bangkok – Phuket on a Swiss aircraft is allowed only as one continuous international journey, confirmed by the operator in writing. Without it this is a cabotage breach: a critical error.");
  const op = num(B.opNet), pr = num(B.price);
  add(op === 171000, false, "Operator price recorded", "USD 171,000 all-in.");
  const okPrice = isFinite(pr) && pr >= 187913;
  add(okPrice, true, "Margin at least 9%", "171,000 ÷ 0.91 = 187,912.09, so the client price is at least USD 187,913. Below that the margin is under 9%: a critical error without approval.");
  if (okPrice) add(pr <= 188000, false, "Price follows the 9% rule", "Quote USD 187,913 (or rounded up to USD 188,000). A higher price is a number we cannot justify.");
  const exp = B.vd && B.vt ? B.vd + "T" + B.vt : "";
  add(!!exp && exp <= "2026-10-20T18:00", false, "Offer expiry no later than the operator's quote", "The operator's quote expires 20 October, 18:00 Bangkok time; our offer must not outlive it.");
  add(B.pay === "request", true, "Payment by payment request", "The assistant asked for bank details by WhatsApp. We never send bank details by email or chat: the client pays through a payment request from our payment provider.");
  add(B.ck.terms, false, "Operator terms back to back", "Tick only once the operator's terms are checked against Part A.");
  add(B.ck.disc, true, "Client disclosures included", "Broker status, operator legal name, aircraft, full price and insurance go to every client in writing.");
  const crit = R.filter(r => !r.ok && r.crit).length, minor = R.filter(r => !r.ok && !r.crit).length;
  const passed = crit === 0 && minor <= 3, sc = R.filter(r => r.ok).length;
  record("book", sc, R.length, passed);
  $("bres").innerHTML = `<div class="card" id="bresc"><h2>${passed ? "Practical passed" : "Not passed yet"}</h2>
    <p class="score">${crit} critical error${crit===1?"":"s"} · ${minor} minor error${minor===1?"":"s"} · pass: no critical and at most 3 minor</p>
    <div class="res">${R.map(r => `<div class="it ${r.ok ? "pass" : "fail"}"><span class="m">${r.ok ? "OK" : "Fix"}</span><span><b>${esc(r.t)}</b>${r.ok ? "" : `<span class="tag ${r.crit ? "" : "min"}">${r.crit ? "Critical" : "Minor"}</span><br>${esc(r.why)}`}</span></div>`).join("")}</div>
    <div class="row"><span class="sp"></span>${passed ? `<button class="btn primary" type="button" data-go="${nextInPath("book") || "home"}">Continue</button>` : `<span class="note">Correct the form and submit again.</span>`}</div></div>`;
  $("bresc").scrollIntoView({behavior:"smooth", block:"start"});
  AUDIO.screen($("bresc"));
}

  $("aPrev").onclick = () => { if (!items.length) items = collect(); speakFrom(Math.max(0, idx - 1), false); };
  $("aRate").onchange = e => { cfg.rate = +e.target.value; keep(); if (playing) speakFrom(idx); };
  $("aVoice").onchange = e => { cfg.voice = e.target.value; keep(); if (playing) speakFrom(idx); };
  $("aName").onclick = () => { if (!can) return; stop(); const u = new SpeechSynthesisUtterance(speakable("Archē Executive. Archē is said ar-KAY.")); const v = pickVoice(); if (v) { u.voice = v; u.lang = v.lang; } else u.lang = "en-GB"; u.rate = +cfg.rate || 1; synth.speak(u); };
  $("aAuto").onchange = e => { cfg.auto = e.target.checked; keep(); };
  document.addEventListener("visibilitychange", () => { if (document.hidden && playing) stop(); });
  setUI();
  return {screen, focus, speakable};
})();

/* ---------- boot ---------- */
setSync("local");
renderMap(); route();
initPlatform();
})();
</script>
