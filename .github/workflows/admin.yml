# Owner-requested admin actions (Morten, 28 Oct 2026). Started by Claude from the chat when Morten asks, or by Morten from the
# Actions tab. Only the actions listed in jobs/admin.mjs exist. Uses the same repository secrets as "Portal jobs".
name: Admin actions
on:
  workflow_dispatch:
    inputs:
      action:
        description: "What to do"
        type: choice
        options: [person-status, owner-to-joining, reset-joining, reset-next-login, cancel-reset-next, set-name, leads-status, alerts-status, trim-leads, people-status, remove-test-trip, close-test-enquiries]
        default: person-status
      email:
        description: "The person's login email (or leave empty and give the name)"
        type: string
        required: false
      name:
        description: "The person's name, if no email is given (remove-test-trip: the trip id; close-test-enquiries: the cut-off date YYYY-MM-DD)"
        type: string
        required: false
      new_name:
        description: "set-name only: the corrected first and last name"
        type: string
        required: false
permissions:
  contents: read
concurrency:
  group: admin-actions
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Hide the email in the log
        run: '[ -z "${{ inputs.email }}" ] || echo "::add-mask::${{ inputs.email }}"' 
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: "22" }
      - name: Install
        working-directory: jobs
        run: npm install --no-audit --no-fund
      - name: Run ${{ inputs.action }}
        working-directory: jobs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          ACTION: ${{ inputs.action }}
          EMAIL: ${{ inputs.email }}
          NAME: ${{ inputs.name }}
          NEW_NAME: ${{ inputs.new_name }}
        run: node admin.mjs
