# Scheduled jobs for the Archē portal (times in UTC; Bangkok = UTC+7).
# Secrets (GitHub → repository → Settings → Secrets and variables → Actions):
#   SUPABASE_URL, SUPABASE_SECRET_KEY, ANTHROPIC_API_KEY, BACKUP_PASSPHRASE
name: Portal jobs
on:
  schedule:
    - cron: "11 */3 * * *"   # prospect rotation, every 3 hours
    # prospect research: no AI job here. The Claude scheduled task "Daily Archē prospect research" asks agent-plan and
    # hands its findings to agent-import, which checks every one (jobs/prospectagent.mjs; Morten, 8 Nov 2026).
    - cron: "17 19 * * *"    # daily backup, 02:17 Bangkok
    - cron: "23 1 * * 1"     # sanctions programmes watch, Mondays 08:23 Bangkok
    - cron: "41 23 * * *"    # daily sanctions screen, 06:41 Bangkok
    - cron: "53 23 * * *"    # daily audit check (registries and programme pages), 06:53 Bangkok
  workflow_dispatch:
    inputs:
      job:
        description: "Job to run now"
        type: choice
        options: [rotation, agent-plan, agent-import, investors, investor-profiles, services, crew-hotels, backup, regimes, screen, audits]
        default: rotation
      batch:
        description: "agent-import only: the research batch (gzip + base64 JSON), sent by the scheduled task"
        type: string
        default: ""
      dry:
        description: "agent-import only: 1 = check and report, write nothing"
        type: string
        default: "0"
      budget:
        description: "Most this run may spend on AI, in USD (the month's limit still applies)"
        type: string
        default: "3"
permissions:
  contents: read
concurrency:
  group: portal-jobs
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      # AI spend limits (Morten, 21 Oct 2026): USD 1.50 per scheduled run, USD 40 a month in total
      AI_RUN_BUDGET_USD: ${{ github.event_name == 'workflow_dispatch' && inputs.budget || '1.5' }}
      AI_MONTH_BUDGET_USD: "40"
      BATCH: ${{ inputs.batch }}
      DRY: ${{ inputs.dry }}
      JOB: ${{ github.event_name == 'workflow_dispatch' && inputs.job || (github.event.schedule == '17 19 * * *' && 'backup') || (github.event.schedule == '23 1 * * 1' && 'regimes') || (github.event.schedule == '41 23 * * *' && 'screen') || (github.event.schedule == '53 23 * * *' && 'audits') || 'rotation' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: "22" }
      - name: Install
        working-directory: jobs
        run: npm install --no-audit --no-fund
      - name: Browser for the audit registries
        if: env.JOB == 'audits'
        working-directory: jobs
        run: npm install --no-save --no-audit --no-fund playwright@1.56.0 && npx playwright install --with-deps chromium
      - name: PDF reader for the Singapore TSOFA list
        if: env.JOB == 'screen'
        run: which pdftotext || (sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils)
      - name: Run ${{ env.JOB }}
        working-directory: jobs
        run: |
          if [ "$JOB" = "rotation" ] && [ "${{ github.event_name }}" = "workflow_dispatch" ]; then export FORCE=1; fi
          if [ "$JOB" = "agent-plan" ]; then node prospectagent.mjs plan; elif [ "$JOB" = "agent-import" ]; then node prospectagent.mjs import; elif [ "$JOB" = "investor-profiles" ]; then INVESTOR_AREAS=0 node investors.mjs; elif [ "$JOB" = "crew-hotels" ]; then SERVICE_SET=hotels node services.mjs; else node "$JOB.mjs"; fi
      - name: Encrypt backup
        if: env.JOB == 'backup'
        working-directory: jobs
        env:
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          test -n "$BACKUP_PASSPHRASE" || { echo "BACKUP_PASSPHRASE secret missing"; exit 1; }
          openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt -in backup.json -out backup.json.enc -pass env:BACKUP_PASSPHRASE
          rm backup.json
      - name: Keep backup for 90 days
        if: env.JOB == 'backup'
        uses: actions/upload-artifact@v5
        with:
          name: portal-backup-${{ github.run_id }}
          path: jobs/backup.json.enc
          retention-days: 90
